# ---------------------------------------------------------------------------
# E-ELEC 2026-01-01 rate-plan JSON-LD — derived from URPX-team-authored
# work. Flux Tailor LLC originated the upstream fixture; Clark
# Communications Corporation built on it here. Both copyrights asserted
# via array form.
# ---------------------------------------------------------------------------
[[annotations]]
path = "us/ca/pge/electricity/e-elec/versions/2026-01-01/rate-plan_pge_e-elec_2026-01-01.jsonld"
precedence = "override"
SPDX-FileCopyrightText = ["Flux Tailor LLC", "2026 Clark Communications Corporation"]
SPDX-License-Identifier = "CDLA-Permissive-2.0"

# ---------------------------------------------------------------------------
