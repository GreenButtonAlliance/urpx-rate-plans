# A filing, the emitted document or its generator, the SHACL engine, or the
# shape exceptions.
[[gate]]
note = "Scenario cost models: SHACL"
modes = ["fast", "full"]
scope = "corpus"
triggers = [
    '^us/',
    '^reports/scenario-cost-models\.jsonld$',
    '^dev/scenario_cost_models\.py$',
    '^dev/shacl_gate\.clj$',
    '^dev/shape-exceptions\.json$',
]

