# Filing JSON-LD, the emitted document, what decides currency and withholding,
# the corpus walkers, the enumerator, the cross-check, or deps.edn (the
# clj-urpx pin).
[[gate]]
note = "Scenario cost models: clj-urpx cross-check"
modes = ["fast", "full", "changed"]
scope = "corpus"
triggers = [
    '^us/.*\.jsonld$',
    '^reports/scenario-cost-models\.jsonld$',
    '^dev/currency-instant\.json$',
    '^dev/withheld-filings\.json$',
    '^dev/withheld_filings\.py$',
    '^dev/scenario_cost_models\.py$',
    '^dev/cross_check_scenario_cost_models\.(py|clj)$',
    '^dev/corpus\.py$',
    '^dev/urpx_rate_plans\.clj$',
    '^corpus\.json$',
    '^deps\.edn$',
]

# A filing, the emitted document or its generator, the SHACL engine and its
# runners, the shape exceptions, the corpus walkers, or deps.edn.
[[gate]]
note = "Scenario cost models: SHACL"
modes = ["fast", "full", "changed"]
scope = "corpus"
triggers = [
    '^us/',
    '^reports/scenario-cost-models\.jsonld$',
    '^dev/scenario_cost_models\.py$',
    '^dev/shacl_gate\.clj$',
    '^dev/shape-exceptions\.json$',
    '^dev/shacl\.sh$',
    '^dev/shacl_nrepl\.py$',
    '^dev/corpus\.py$',
    '^dev/urpx_rate_plans\.clj$',
    '^corpus\.json$',
    '^deps\.edn$',
]

[[gate]]
note = "Corpus walkers agree"
modes = ["fast", "full", "changed"]
scope = "corpus"

[[gate]]
note = "Generated from source"
