#
# Which gate steps a change runs. Read by dev/gate_steps.py; dev/gate.sh --fast
# consults it against the staged diff, and --changed against the branch's
# committed changes since its merge-base. dev/test_gate_steps.py requires every
# `note` step in dev/gate.sh and every STEPS entry in dev/check_all.py to appear
# here, and every entry here to name one of them.
#
# [[gate]] entries are keyed by the first argument of `note` in dev/gate.sh.
#   modes     the gate modes whose branch runs the step.
#   scope     "corpus": one run covers the whole corpus.
#             "per-utility": one run per touched utility; a trigger's
#             {utility} stands for each utility slug in the corpus.
#   triggers  Python regular expressions searched in each changed path. A step
#             runs in --fast and --changed when any changed path matches one. A
#             step with no triggers always runs. For a per-utility step, a
#             trigger without {utility} selects every utility.
#
# A change to the gate itself (dev/gate.sh, this table, dev/gate_steps.py) runs
# every step for every utility.
#
# [[check_all]] entries are keyed by name in dev/check_all.py STEPS. Every one
# runs from the pre-commit hook (--generators-only) and in --full; --changed
# runs those its triggers select. A step's triggers cover every repository path
# it was traced reading, under an audit hook over a full run and in the string
# literals of the modules it loads, widened to the directory: us/, dev/ and
# src/ whole, or only us/ JSON-LD for a step that reads no other corpus file. A
# generator's triggers include its own outputs, so a hand edit to one is
# regenerated and caught by the drift check. A step that reads files outside
# those directories (every tracked file, or the top-level prose) has none.

[[gate]]
note = "Clojure consumer path"
modes = ["fast", "full", "changed"]
scope = "corpus"

[[gate]]
note = "Resolution coverage"
modes = ["fast", "full", "changed"]
scope = "corpus"

[[gate]]
note = "Marginal-rate baseline"
modes = ["fast", "full", "changed"]
scope = "corpus"

# An NBT filing, a base plan an NBT modifier composes with, any modifier
# filing (the check refuses an undeclared NBT-shaped modifier), the check, the
# remodel script, the corpus walker, or deps.edn (the clj-urpx pin).
[[gate]]
note = "NBT export cells"
modes = ["fast", "full", "changed"]
scope = "corpus"
triggers = [
    '/nbt/',
    '/e-elec/',
    '/tou-d-prime/',
    '/ev-tou-5/',
    'rate-plan-modifier_[^/]*\.jsonld$',
    '^dev/check_nbt_export\.clj$',
    '^dev/remodel_nbt\.py$',
    '^deps\.edn$',
    '^corpus\.json$',
    '^dev/urpx_rate_plans\.clj$',
]

