scope = "corpus"

[[gate]]
note = "Corpus catalog"
modes = ["fast"]
scope = "corpus"

[[gate]]
note = "clj-kondo"
modes = ["fast", "full", "changed"]
scope = "corpus"

# Any changed path under a utility's directory; for every utility, the recorded
# baseline, the SHACL engine and its runners, the shape exceptions, the corpus
# walkers, or deps.edn (the clj-shacl pin).
[[gate]]
note = "Baseline"
modes = ["fast", "changed"]
scope = "per-utility"
triggers = [
    '/{utility}/',
    '^dev/baseline/corpus\.json$',
    '^dev/shacl_gate\.clj$',
    '^dev/shape-exceptions\.json$',
    '^dev/shacl\.sh$',
    '^dev/shacl_nrepl\.py$',
    '^dev/corpus\.py$',
    '^dev/urpx_rate_plans\.clj$',
    '^corpus\.json$',
    '^deps\.edn$',
]

[[gate]]
note = "Generators, schema, drift"
modes = ["full", "changed"]
scope = "corpus"

[[gate]]
note = "Baseline: every merged mode"
modes = ["full", "changed"]
scope = "corpus"

# Filing JSON-LD, the SHACL engine and its runners, the shape exceptions, the
# corpus walkers, or deps.edn.
[[gate]]
note = "Per-file diagnostic (informational)"
modes = ["full", "changed"]
scope = "corpus"
triggers = [
    '^us/.*\.jsonld$',
    '^dev/shacl_gate\.clj$',
    '^dev/shape-exceptions\.json$',
    '^dev/shacl\.sh$',
    '^dev/shacl_nrepl\.py$',
    '^dev/corpus\.py$',
    '^dev/urpx_rate_plans\.clj$',
    '^corpus\.json$',
    '^deps\.edn$',
]

[[gate]]
note = "Cross-check namespace negative fixtures"
modes = ["full", "changed"]
scope = "corpus"

# The same command as the test_shacl_gate check_all step, with its triggers.
[[gate]]
note = "Version-dispatch and shape-exception negative fixtures"
modes = ["full", "changed"]
scope = "corpus"
triggers = [
    '^dev/',
    '^deps\.edn$',
]

# A manifest, where [[sandbox]] records live, or the check.
