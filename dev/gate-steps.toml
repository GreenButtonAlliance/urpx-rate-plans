#
# Which gate steps a change runs. Read by dev/gate_steps.py; dev/gate.sh --fast
# consults it against the staged diff. dev/test_gate_steps.py requires every
# `note` step in dev/gate.sh and every STEPS entry in dev/check_all.py to appear
# here, and every entry here to name one of them.
#
# [[gate]] entries are keyed by the first argument of `note` in dev/gate.sh.
#   modes     the gate modes whose branch runs the step.
#   scope     "corpus": one run covers the whole corpus.
#             "per-utility": one run per touched utility; a trigger's
#             {utility} stands for each utility slug in the corpus.
#   triggers  Python regular expressions searched in each changed path. A step
#             runs in --fast when any changed path matches one. A step with no
#             triggers always runs.
#
# [[check_all]] entries are keyed by name in dev/check_all.py STEPS. Every one
# runs from the pre-commit hook (--generators-only) and in --full.

[[gate]]
note = "Clojure consumer path"
modes = ["fast", "full"]
scope = "corpus"

[[gate]]
note = "Resolution coverage"
modes = ["fast", "full"]
scope = "corpus"

[[gate]]
note = "Marginal-rate baseline"
modes = ["fast", "full"]
scope = "corpus"

# An NBT filing, a base plan an NBT modifier composes with, the check, the
# remodel script, or deps.edn (the clj-urpx pin).
[[gate]]
note = "NBT export cells"
modes = ["fast", "full"]
scope = "corpus"
triggers = [
    '/nbt/',
    '/e-elec/',
    '/tou-d-prime/',
    '/ev-tou-5/',
    '^dev/check_nbt_export\.clj$',
    '^dev/remodel_nbt\.py$',
    '^deps\.edn$',
]

