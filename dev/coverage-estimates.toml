# Residential customer-count estimates per utility and tariff.
#
# Used by dev/coverage.py to compute corpus coverage: what fraction of each
# state's residential utility customers have their rate modeled in this repo.
# Every [utility.<u>] names its `state`, the <subdivision> directory its
# filings sit under, and every state named has a [state.<code>] table.
#
# Two distinct metrics matter for IOUs (where Community Choice Aggregators
# split delivery from generation):
#   total_residential     — all residential customers on the utility's grid,
#                           including CCA-served customers (the utility's
#                           tariff still governs delivery)
#   bundled_residential   — customers buying both energy and delivery from
#                           the IOU; excludes CCA-served (matches EIA-861's
#                           "bundled retail" table)
# For POUs the two are identical.
#
# Coverage uses total_residential because the IOU tariff governs the full
# bill structure (delivery rates apply to CCA customers; generation rates
# apply to bundled customers). The price-server consuming this corpus needs
# to answer "what is *this* customer's current price?" — and the answer
# depends on the IOU tariff regardless of CCA enrollment.
#
# Per-tariff [utility.<u>.tariffs.<t>] entries record the estimated number
# of residential customers on that specific schedule. Shares within a
# utility should sum approximately to total_residential. Where exact
# enrollment numbers aren't published, the entry uses share_of_residential
# (fraction in [0, 1]) instead, and coverage.py will multiply by the
# utility's total. Mark `estimate_quality = "rough" | "firm"` to signal
# how much to trust the figure.

[meta]
schema_version = 1
last_updated = "2026-04-29"
notes = """
First-pass estimates seeded from EIA Form 861 2024 ('table_6.pdf' linked
in source_url fields below) and approximate CPUC general-order knowledge.
Refine over time. The price-server target is residential users; commercial
schedules are not counted toward residential coverage but may be tracked
separately for future commercial coverage work.
"""

[state.ca]
name = "California"

[state.wa]
name = "Washington"

# ---------------------------------------------------------------------------
# IOUs — CPUC-regulated investor-owned utilities. Tariff governs delivery
# for all customers; generation only for bundled (non-CCA) customers.
# ---------------------------------------------------------------------------

[utility.pge]
name = "Pacific Gas and Electric Company"
state = "ca"
class = "iou"
total_residential = 5500000
bundled_residential = 1856780
source_url = "https://www.eia.gov/electricity/sales_revenue_price/pdf/table_6.pdf"
source_notes = "EIA-861 2024 bundled count = 1,856,780; total residential ~5.5M includes CCA-served (MCE, EBCE, SVCE, SJCE, etc.) which buy generation from CCA but delivery from PG&E."
as_of = "2024"

[utility.pge.tariffs.e-1]
share_of_residential = 0.15
estimate_quality = "rough"
notes = "Legacy tiered rate. Default until 2021 E-TOU-C migration; remaining enrollment is mostly customers who opted out or were excluded. Declining."

[utility.pge.tariffs.e-tou-c]
share_of_residential = 0.78
estimate_quality = "rough"
notes = "Default residential TOU rate since the 2021 mass-migration (CPUC D.18-04-024). Captures vast majority of PG&E residential."

[utility.pge.tariffs.e-tou-d]
share_of_residential = 0.02
estimate_quality = "rough"
notes = "Opt-in TOU with no baseline credit; smaller enrollment."

[utility.pge.tariffs.ev2]
share_of_residential = 0.04
estimate_quality = "rough"
notes = "EV2-A whole-house EV rate. Growing with EV adoption."

[utility.pge.tariffs.e-elec]
share_of_residential = 0.01
estimate_quality = "rough"
notes = "Opt-in all-electric rate (heat pump + induction + EV). Small but growing."

