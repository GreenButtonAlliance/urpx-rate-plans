[utility.sce]
name = "Southern California Edison"
state = "ca"
class = "iou"
total_residential = 5000000
bundled_residential = 3219520
source_url = "https://www.eia.gov/electricity/sales_revenue_price/pdf/table_6.pdf"
source_notes = "EIA-861 2024 bundled = 3,219,520; total residential ~5.0M includes CCA-served (CPA, OC Power Authority, SBCE, etc.). SCE serves 15M people."
tariff_book_url = "https://www.sce.com/sites/default/files/custom-files/PDF_Files/2025_Summary_of_Available_Residential_and_Nonresidential_Rates.pdf"
as_of = "2024"

# Residential schedules per SCE's August 2025 rate-options summary:
#   D                — Domestic tiered (legacy; opt-out destination)
#   TOU-D-4-9PM      — Time-of-Use Domestic, on-peak 4-9pm (CPUC mass-migration default)
#   TOU-D-5-8PM      — Time-of-Use Domestic, on-peak 5-8pm (alternate default by climate zone)
#   TOU-D-PRIME      — Preferred TOU for high-usage customers with EV/storage/heat-pump;
#                      MANDATORY for new solar customers under NBT
#   TOU-D-4-9PM-CPP  — 4-9pm option with Critical Peak Pricing
#   TOU-D-5-8PM-CPP  — 5-8pm option with CPP
#   TOU-D-PRIME-CPP  — PRIME with CPP
#   D-SDP            — Domestic Summer Discount Plan (load control)
#   DM, DMS-1/2/3    — Multifamily / submetered residential
#   ESC-OO           — SmartConnect opt-out (variant on D, not a distinct rate)

[utility.sce.tariffs.tou-d-4-9pm]
share_of_residential = 0.50
estimate_quality = "rough"
notes = "Likely the larger of the two CPUC-mass-migration TOU defaults (October 2020 transition). Population-weighted, more SCE territory falls in the 4-9pm climate zone. Refine from CPUC enrollment reports."

[utility.sce.tariffs.tou-d-5-8pm]
share_of_residential = 0.20
estimate_quality = "rough"
notes = "The other CPUC-mass-migration TOU default; assigned in inland climate zones. Refine from CPUC enrollment reports."

[utility.sce.tariffs.d]
share_of_residential = 0.20
estimate_quality = "rough"
notes = "Legacy tiered Schedule D. Captures customers who opted out of TOU during the 2020-2022 mass migration. Declining over time."

[utility.sce.tariffs.tou-d-prime]
share_of_residential = 0.05
estimate_quality = "rough"
notes = "Mandatory for new solar customers under Net Billing Tariff (NBT) since 2023. Growing rapidly with solar adoption."

[utility.sce.tariffs.dms]
share_of_residential = 0.04
estimate_quality = "rough"
notes = "Multifamily submetered (DM, DMS-1, DMS-2, DMS-3). One landlord-billed meter, multiple tenants. Small but distinct customer base."

[utility.sce.tariffs.tou-d-cpp]
share_of_residential = 0.01
estimate_quality = "rough"
notes = "CPP variants of TOU-D-4-9PM, TOU-D-5-8PM, and TOU-D-PRIME (combined). Small enrollment due to opt-in nature."

