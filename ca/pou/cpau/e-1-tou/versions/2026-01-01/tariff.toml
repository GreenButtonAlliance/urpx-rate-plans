notes         = "City of Palo Alto Utilities (CPAU) E-1 TOU Residential Time-Of-Use Electric Service. DCJ-authored rate plan; original v0.1.x conversion contributed to urpx-org/urpx test-cases via PR #7 (urpx-org/urpx#7). Migrated to URPX v0.2.0 on 2026-04-28 from urpx-org/urpx PR head e8ed4f0 using shadow-repo/scripts/migrate-cpau-v020.py. Substantive changes vs. the v0.1.x source: ConditionExpression rewrite of the EligibilityRule (residential single-family separately-metered + AMI-meter required), BillingModel-owned PriceDefinitions with referencesLedger, ratePlanIdentifier → ratePlanUniqueIdentifier rename, ServiceTier description + hasCalculationMethod stripped where applicable, profileMetricProperty numberOfMeters → meterCount where applicable, IRI prefix urpx:cpau-* → cpau:* per repo convention. Voluntary residential TOU schedule with 3 periods (peak 4-9pm / off-peak / super off-peak) × 2 seasons. Only commodity rate varies by TOU; distribution and public benefits are flat. Two CPAU RatePlanModifiers (E-HRA, E-NSE-1) apply to this RatePlan but are not yet incorporated — packaging decision pending."
