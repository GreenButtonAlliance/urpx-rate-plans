notes         = "CPAU Schedule E-HRA — standalone urpx:RatePlanModifier filing applicable to all CPAU electric customers. Electric Hydro Rate Adjuster — surcharge or discount applied to all CPAU electric rate schedules based on the Hydro Stabilization Reserve level and projected hydro generation. Set annually in May (or when conditions warrant) by Council via a 4×4 matrix; range from $-0.066 credit to $+0.048 surcharge per kWh. Currently noted on the canonical landing page as 'Inactive as of 7/1/2023' — produces zero adjustment until reactivated. Originally DCJ-authored, contributed to urpx-org/urpx/test-cases/ via PR #7 (cpau-rate-plans branch); brought into urpx-tariffs as part of URPXT-tdk on 2026-04-30 by shadow-repo/scripts/extract-cpau-modifiers-tdk.py — carves the modifier subtree out of the existing CPAU E-1 2025-09-01 multi-source filing's @graph into a standalone @graph. Has urpx:applicableToRatePlan and urpx:applicableToRatePlanVersion stripped per the standalone-modifier cross-graph identity workaround for urpx-org/urpx#23 (same shape as the green-power filings E-2-G / E-4-G / E-7-G). DataSourceReference updated to the canonical paloalto.gov URL (vs the placeholder file:// URI inherited from the URPX-team-authored source). pyshacl + clj-urpx end-to-end validate clean (resolve N/A — modifier requires base+modifier composition; awaits urpx-org/urpx#23)."
