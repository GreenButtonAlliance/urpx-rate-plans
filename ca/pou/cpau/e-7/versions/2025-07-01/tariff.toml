notes         = "CPAU Schedule E-7 (Large Non-Residential Electric Service) — large-commercial sibling of CPAU E-4 (medium non-residential demand-metered, no TOU). Demand-metered service for customers with maximum demand at least 1000 kW per site, sustained 3+ consecutive months in the most recent 12-month period (eligibility: metering = 'Demand metered' AND monthlyMaxDemand_kW >= 1000 AND demandSustainedConsecutiveMonths = 3). Two-period seasonal rate (Summer May–Oct, Winter Nov–Apr); no TOU within periods. Three-component unbundled energy ($/kWh: commodity / distribution / public-benefits) plus a two-component demand charge ($/kW: commodity / distribution) plus $578.08/month customer charge (vs $126.24 for E-4 — much larger customers). 11 PriceDefinitions: 6 energy (3 components × 2 seasons) + 4 demand (2 components × 2 seasons) + 1 customer charge. Demand calculated as the max kW in any 15-minute interval over the billing month (urpx:CalculationMethod with aggregationMethod=urpx:maximum). Section D.3 site-aggregation feature (qualifying customers may request service for multiple Accounts on contiguous parcels with a common billing address) is noted but not modeled — URPX has no native vocabulary for site-level account aggregation. NOT modeled in v1: Section D.6 Primary Voltage Discount (2.8% for >2 kV — note rate differs from E-4's 2.5%; URPXT-34j); Section D.7 Standby Charge (rates differ from E-4: $40.79 summer / $27.75 winter; URPXT-hii); Section D.4 TES carve-out (same shape as E-4; existing follow-up issue). Generated by shadow-repo/scripts/build-cpau-e-7-2025-07-01.py. pyshacl + clj-urpx end-to-end validate clean (summer energy marginal at probe instant = 0.13792 = 0.12786 + 0.00402 + 0.00604, matching Section C of the PDF; demand and service ledgers correctly excluded from kWh marginal sum)."
