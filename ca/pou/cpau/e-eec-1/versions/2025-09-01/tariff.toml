notes         = "CPAU Schedule E-EEC-1 — standalone urpx:RatePlanModifier filing applicable to small commercial NEM 2. Solar NEM 2 Export Electricity Compensation — provides compensation for electricity exported to the grid by Customer-Generators on the NEM 2 successor program (or NEM 1 customers electing this rate). Reverse-flow per-kWh credit; not applicable with TOU schedules. Requires a bidirectional meter. Originally DCJ-authored, contributed to urpx-org/urpx/test-cases/ via PR #7 (cpau-rate-plans branch); brought into urpx-tariffs on 2026-04-30 by shadow-repo/scripts/extract-cpau-modifiers-tdk.py — carves the modifier subtree out of the existing CPAU E-1 2025-09-01 multi-source filing's @graph into a standalone @graph. Has urpx:applicableToRatePlan and urpx:applicableToRatePlanVersion stripped per the standalone-modifier cross-graph identity workaround for urpx-org/urpx#23 (same shape as the green-power filings E-2-G / E-4-G / E-7-G). DataSourceReference updated to the canonical paloalto.gov URL (vs the placeholder file:// URI inherited from the URPX-team-authored source). pyshacl + clj-urpx end-to-end validate clean (resolve N/A — modifier requires base+modifier composition; awaits urpx-org/urpx#23)."
