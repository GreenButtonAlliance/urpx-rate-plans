# Extraction ------------------------------------------------------------------
[extraction]
tool          = "manual"
extracted_on  = "2026-05-04"
notes         = """
URPXT-b5j.4 — first filing of SMUD's Optional Critical Peak Pricing
Rate (regulatory rate category RTC1). Sister modifier to the default
Time-of-Day (5-8 p.m.) Rate (RT02 — smud:tod-5-8pm) and Time-of-Day
Low Use Rate (RTL1 — smud:tod-low-use) under the shared Rate
Schedule R-TOD umbrella.

Modeled as a urpx:RatePlanModifier (not a separate base RatePlan)
because Sec II.C.1 explicitly states: 'The CPP Rate base prices per
time-of-day period are the same as the prices per time-of-day period
for TOD (5-8 p.m.).' RTC1 doesn't have its own base rate trajectory
— it's an overlay (discount + Event Charge) on top of either RT02 or
RTL1.

Pattern reference: ca/iou/sce/tou-d-prime-cpp/versions/2026-03-20/
(SCE PRIME-CPP — also modeled as a RatePlanModifier with per-Price
ApplicabilityRule on 'Is CPP Event Today' CustomOperandNode).

## Source split: PDF vs HTML page

The R-TOD source PDF (Sec II.C, III.C) carries the regulatory
framework — eligibility (Sec I.C), enrollment cap (30,000), event
window rules (1-4 hours, max 1/day, summer only, day-ahead announce,
50 hr/summer cap, system-emergency same-day exception), discount
applicability (Mid-Peak + Off-Peak summer months only), and Event
Charge applicability (energy charged + Event Price during Events;
exports compensated at Event Price).

The PDF does NOT carry the actual Event Price or Discount values:
'The CPP Rate Event Price and discount will be updated annually at
SMUD's discretion and posted on www.smud.org' (Sec III.C.5).

Current values (per SMUD residential rates HTML page, retrieved
2026-05-04):
  CPP Event Price:               +$0.5000/kWh (during Events)
  Summer Mid-Peak Discount:      -$0.0200/kWh ($0.2139 → $0.1939)
  Summer Off-Peak Discount:      -$0.0200/kWh ($0.1550 → $0.1350)
  Summer Peak rate:              unchanged at $0.3765/kWh
  Non-summer pricing:            same as RT02 (no CPP modification)

The HTML page is cited as the modifier's authoritative price source
(landing_page in [source]); the PDF carries the regulatory framework
but is not the dollar-value source.

## Modeling shape

3 PriceDefinitions on 3 separate Ledgers:

  1. CPP Event Charge — chargeType=adjustmentPowerCost, $+0.5000/kWh
     ApplicabilityRule: month=summer (Jun-Sept) AND
                        'Is CPP Event Today' = true
     (CustomOperandNode pattern matching SCE PRIME-CPP convention)

  2. Summer Mid-Peak Discount — chargeType=creditEnergy, $-0.0200/kWh
     touPeriodNumber=2 (matches base RT02 / RTL1 Summer Mid-Peak)
     No ApplicabilityRule on the Price (gating is via touPeriodNumber).

  3. Summer Off-Peak Discount — chargeType=creditEnergy, $-0.0200/kWh
     touPeriodNumber=3 (matches base RT02 / RTL1 Summer Off-Peak)
     No ApplicabilityRule on the Price (gating is via touPeriodNumber).

The discount touPeriodNumbers are DELIBERATELY chosen to match the
base RatePlan's Summer Mid-Peak and Off-Peak period numbers (RT02
and RTL1 share the same touPeriodNumber assignments since RTL1 was
script-derived from RT02). This is the same cross-RatePlan
touPeriodNumber convention used by smud:pev-credit (which uses
touPeriodNumber=1 for the midnight-6am window — see pev-credit
description for the convention discussion).

## Resolver behavior at the validator probe instant

The clj-urpx validate_v020.clj script probes at 2026-07-15 17:00
PDT (Tuesday Summer Peak hour). With this modifier composed against
smud:tod-5-8pm under clj-urpx 0.6.0 (which gates modifier PDs by
their own hasTOUSchedule or the base's TOU period when the modifier
rides the base — fix landed in clj-urpx#4):

  marginal = $0.8765/kWh
           = $0.3765 (RT02 Summer Peak)
           + $0.5000 (CPP Event Charge — fires because resolver
                       treats unevaluated CustomOperandNode as
                       passing; consumer must check 'Is CPP Event
                       Today' at billing time)

The Summer Mid-Peak and Off-Peak Discounts (touPeriodNumber=2 and
=3) correctly do NOT fire at 17:00 because the base RT02 is in
period 1 (Summer Peak) at that time. They will fire at appropriate
Mid-Peak / Off-Peak hours during summer months.

The Event Charge fires regardless because its CustomOperandNode
('Is CPP Event Today') is consumer-opaque to the resolver — the
resolver treats unevaluated CustomOperandNodes as passing. Consumer
(price-server) is responsible for checking the actual event status
at billing time. This is the only remaining gating concern; the
touPeriodNumber gap that previously made marginal an upper-bound
($0.8365 in pre-0.6.0 clj-urpx) is now resolved.

## What this modifier does NOT capture (deferred)

  1. **CPP Event Charge applicability inside the Event window** —
     'Is CPP Event Today' is a per-day flag; within an Event day
     the charge applies only during the called window (1-4 hours).
     Modeled here as month + day-flag; intra-day window not
     captured. Consumer must additionally filter to the actual
     event window.

  2. **30,000-customer enrollment cap** — modeled in
     EligibilityRule description prose only.

  3. **Storage-incentive mandatory-enrollment** — the SSR
     storage-incentive-recipient mandatory-CPP-enrollment chain
     (Sec I.C.1) is documented in description prose but not
     encoded as a structured cross-modifier dependency.

  4. **Energy-export-during-Events compensation** — the +$0.5000/kWh
     applies bidirectionally (consumed energy charged, exported
     energy compensated at the same value during Events). Modeled
     here as a forward-only Energy charge; the export-compensation
     symmetry is documented in description prose but not encoded
     as a separate flowDirection-aware Price.

  5. **Annual price update cadence** — the Event Price and Discount
     values 'will be updated annually at SMUD's discretion'. Each
     annual update should be a new RatePlanModifierVersion;
     captured here only for the 2026-01-01 baseline.
"""

