[review]
status        = "draft"
notes         = "URPXT-b5j.4 — first filing of SMUD RTC1 (Optional Critical Peak Pricing Rate). Same source PDF + Board Resolution as RT02 + RTL1; modeled as RatePlanModifier (RTC1 has no own base rate trajectory per Sec II.C.1). 3 PriceDefinitions: Event Charge ($+0.5000/kWh, CustomOperandNode 'Is CPP Event Today' + month=summer); Mid-Peak Discount ($-0.0200/kWh, touPeriodNumber=2 matching RT02/RTL1 Summer Mid-Peak); Off-Peak Discount ($-0.0200/kWh, touPeriodNumber=3 matching RT02/RTL1 Summer Off-Peak). Source PDF carries regulatory framework only; Event Price + Discount values from SMUD residential rates HTML page (cited as landing_page) — same shared-source split-page pattern as LADWP EZ-Save and Lifeline. applicableToRatePlan: 2 R-TOD bases (tod-5-8pm, tod-low-use). compose ✓ × 2 (smud:tod-5-8pm → 2 ledgers, marginal=0.8765 = base $0.3765 + Event $0.5000) under clj-urpx 0.6.0 — touPeriodNumber gating now correctly excludes Mid-Peak/Off-Peak discounts at Peak hours (clj-urpx#4 fixed)."
