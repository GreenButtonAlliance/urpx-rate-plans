# Modeling -------------------------------------------------------------------
[modeling]
complete  = false
deferrals = [
  "CPP Event Charge intra-day window — modeled as month + day-flag; intra-day Event window (1-4 hr) not captured.",
  "30,000-customer enrollment cap — documented in EligibilityRule description prose only.",
  "Storage-incentive mandatory-CPP-enrollment cross-modifier dependency (SSR → CPP) — documented in prose only.",
  "Energy-export-during-Events compensation symmetry — modeled as forward charge; export-compensation symmetry documented in prose only.",
  "Annual price update cadence — captured here only for 2026-01-01 baseline; future annual updates require new RatePlanModifierVersions.",
]

