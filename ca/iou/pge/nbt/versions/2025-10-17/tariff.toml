# Extraction ------------------------------------------------------------------
[extraction]
tool          = "manual"
extracted_on  = "2026-05-29"
notes         = """
First NBT (Net Billing Tariff) filing in this corpus (URPXT-7kr.1).
First export-compensation modeling overall — establishes the
RatePlanModifier-with-flowDirection-reverse pattern that SCE NBT
(URPXT-7kr.2) and SDG&E NBT (URPXT-7kr.3) will reuse.

PG&E Schedule designation is just "NBT" (filed) — colloquially called
"NEM-3" or "Solar Billing Plan" but the tariff-book filed name is NBT.
Source PDF is 48 sheets, composite of advice letters layered over time;
most recent per-sheet effective date is 2025-10-17 (Advice 7730-E), which
drives this filing's effective_date per the SCE convention noted in
ca/iou/sce/utility.toml (date filings to most recent per-sheet effective).

## Modifier shape

Modeled as urpx:RatePlanModifier overlaying pge:e-elec (the mandatory
residential base RatePlan per Sheet 9 §A: "Residential customers taking
service on the NBT tariff must take service on the E-ELEC rate as their
OAS"). Single-base binding — mirrors the SCE TOU-D-PRIME-CPP precedent
(ca/iou/sce/tou-d-prime-cpp/versions/2026-03-20/) exactly. The five-base-
binding hypothesis in the original URPXT-7kr.1 description was incorrect.

Non-residential customers can take NBT on any applicable TOU rate; this
filing scopes to residential NBT-S (canonical small-customer ≤30 kW
solar/wind, per Sheet 13 sub-schedule list). Sibling sub-schedule filings
(NBT-EXP, NBT-EXP-OTR, NBT-MT, NBT-PS, NBTA) deferred.

## Export-side direction modeling (Q2 of URPXT-7kr)

MetricSpecification carries urpx:flowDirection urpx:reverse — defined in
URPX v0.2.0 ontology as "Reverse energy flow - generation/export to grid"
with rdfs:domain MetricSpecification, range FlowDirectionValue.
MetricSpecificationShape is sh:closed=true but explicitly lists
urpx:flowDirection in its sh:path — closed shape admits the property.
Confirmed via SPARQL against ../urpx/ontology + ../urpx/shacl during
URPXT-7kr.1 sourcing 2026-05-29. SCE TOU-D-PRIME-CPP DEFERRED direction-
distinction because it didn't need it (credit applies to consumption);
NBT needs it and the vocabulary is already there.

## ACC Plus / Glide Path Adder modeling (Q3 of URPXT-7kr)

ACC Plus (Sheet 11 §D, customer-facing: "Energy Export Bonus Credit") is
a per-kWh adder layered on top of the base Export Compensation Rate.
Two tiers (Residential / Residential Low Income), per-vintage table
declining 20% annually:

  Vintage  Residential  Low Income
  2023     $0.02200     $0.09000
  2024     $0.01760     $0.07200
  2025     $0.01320     $0.05400
  2026     $0.00880     $0.03600
  2027     $0.00440     $0.01800

Adder locked for 9 years from customer's PTO date. Low-income definition
per Sheet 5: CARE/FERA OR disadvantaged-community single-family
resident-owners OR California Indian Country residents (D.18-06-027 /
D.20-12-003). Modeled as two separate PriceDefinitions on separate
Ledgers (Residential ACC Plus + Low-Income ACC Plus), each with an
ApplicabilityRule gated on customer-attribute predicates (analogous to
PRIME-CPP's Grandfathered-D-SDP-Dual-Participation pattern).

Multi-vintage matrix deferred — initial filing models the 2025 vintage
applicable to customers with interconnection applications submitted
2025-01-01 through 2025-12-31. Each vintage requires a separate Price
entity with its own ApplicabilityRule.

## Export Compensation Rate cardinality (Q1 of URPXT-7kr)

Sheet 6 / Sheet 10 confirm: Export Compensation Rate varies by
month-and-hour and is differentiated by weekdays vs weekends/holidays.
So 12 months × 24 hours × 2 day-types = 576 cells per vintage, each cell
carrying TWO components (Generation + Delivery). Both components are
published as SYSTEM-AVERAGED values at pge.com/energyexportcredit — the
tariff Sheet 10 methodology step 2 averages the climate-zone-specific
Delivery values into a single set of customer-facing prices. So the
per-zone variability is upstream of publication; the customer-facing
data is one set per vintage, not per-zone.

FULL FILING SCOPE: this version carries the modifier structure +
per-cell prices. 4,608 Prices for the Export Compensation Rate (576
unique cells per vintage × 2 components × 4 published vintages 2023-2026),
plus 2 ACC Plus Prices (Residential + Low-Income, 2025 vintage), plus
48 shared TOUPeriod entities (24 hours × 2 day-types) and 48 shared
ApplicabilityRule entities (12 months × 4 vintages, each with vintage-
gating ConditionExpression). Total 4,610 urpx:Price entries on the
RatePlanModifier — the largest single filing in the corpus by Price
count to date.

Per-cell Prices loaded by URPXT-7kr.1.1 via the two-stage shadow-repo
script pipeline:
  1. shadow-repo/scripts/extract-nbt-eec-values.py — extracts the 4 per-
     vintage PDFs from pge.com/energyexportcredit's PGE-EEC-Price-Sheets.zip
     (pdfplumber + pypdf multi-extractor fallback handles per-vintage PDF
     styling quirks)
  2. shadow-repo/scripts/build-pge-nbt-prices-2025-10-17.py — emits 4,608
     Price entities into urpx:hasPrice[] with first-use inline TOUPeriods
     and ApplicabilityRules, then deduplicated @id references

To refresh when PG&E publishes new vintage values: re-download the ZIP,
re-run extract + build, re-validate. Idempotent — preserves the ACC Plus
prices and replaces the per-cell layer.

## Binding mechanism (Q4 of URPXT-7kr)

urpx:applicableToRatePlan pge:e-elec — single-base modifier overlay,
same shape as SCE TOU-D-PRIME-CPP applying to sce:tou-d-prime. The
"modifier on multiple base RatePlans" concern from URPXT-7kr's original
framing is moot for residential NBT — Sheet 9 mandates E-ELEC as the
sole residential OAS.

## Eligibility encoding

Customer must (a) have a Renewable Electrical Generating Facility (REGF
— solar, wind, biomass, geothermal, fuel cell, small hydro, biogas, etc.
per Sheet 5 a-m), (b) have submitted interconnection application on or
after 2023-04-15 (NBT effective date; NEM2 closed for new interconnections
after that date), AND (c) be a residential customer. Encoded as
CustomOperandNode predicates analogous to PRIME-CPP's "CPP Election"
predicate.

NEMA/NEM2A transition mechanics (legacy customers transitioning to NBT
upon expiry of 9-year NEM2 period, voluntary transitions, change-of-party)
documented in description prose only — too process-heavy for billing-time
evaluation.

## Settlement deferrals (per PRIME-CPP precedent)

Per the PRIME-CPP Bill Protection deferral pattern, year-long-window
settlement logic isn't modeled at the modifier level:

  - Annual true-up at end of customer's Relevant Period (12 cycles from
    PTO anniversary)
  - Net Surplus Compensation (NSC) — end-of-year DLAP-based rate paid on
    Net Surplus Electricity (exports > imports over Relevant Period).
    Separate from per-hour Export Credit; computed at true-up using a
    12-month rolling DLAP average 7am-5pm.
  - NSC Renewable Attribute Adder (RAA) — WECC-based renewable premium
    if customer transfers WREGIS Certificates to PG&E.
  - Excess credit carry-forward / forfeiture mechanics

These are consumer-side (price-server / billing engine) responsibilities.

## Non-Bypassable Charges (NBCs)

Sheet 17 §2.f lists four NBCs that base Export Credits CANNOT reduce:
Public Purpose Program, Nuclear Decommissioning Charge, Competition
Transition Charge, Wildfire Fund Charge. (ACC Plus credits CAN offset
NBCs.) Modeled as a description-prose note; the import-side NBCs live
on the E-ELEC base RatePlan and the offset-rule is a consumer-side
billing concern, not a modifier-level price.
"""

