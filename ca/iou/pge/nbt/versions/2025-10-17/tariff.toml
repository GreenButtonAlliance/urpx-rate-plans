[validation]
shacl_passed   = true
validator      = "pyshacl"
validated_on   = "2026-05-29"

# MIDAS RIN cross-reference (added by URPXT-7kr.4 — see notes) -------------
# Each Delivery Component Price carries its CEC MIDAS Rate Identification
# Number in urpx:name (2,304 Delivery Prices tagged). PG&E E-ELEC NBT RINs:
#   USCA-PGXX-3500-0000   E-ELEC + NBT23-CCA (Delivery)
#   USCA-PGXX-3600-0000   E-ELEC + NBT24-CCA (Delivery)
#   USCA-PGXX-3900-0000   E-ELEC + NBT25-CCA (Delivery)
#   USCA-PGXX-4000-0000   E-ELEC + NBT26-CCA (Delivery)
# CCA-flavored AltRateName1 is a labeling artifact — Delivery values are
# system-wide and apply identically to Bundled and CCA customers.
# Generation Component Prices (2,304 of them) are NOT RIN-tagged — PG&E
# doesn't publish Generation EEC via MIDAS (USCA-XXPG family contains only
# SGIP and Flex entries). Same pattern as SCE.
# Tagging tool: shadow-repo/scripts/tag-pge-nbt-prices-with-midas-rins.py
# (idempotent — re-running detects and skips already-tagged Prices)

# Modeling -------------------------------------------------------------------
[modeling]
complete  = false
deferrals = [
  "Multi-vintage ACC Plus values — initial filing models the 2025-vintage row; full per-vintage matrix (2023-2027 in table; plus 2028+ rolling) is a follow-up",
  "Annual true-up + Relevant Period settlement — year-long calculation doesn't fit per-bill modifier shape (same deferral pattern as SCE TOU-D-PRIME-CPP Bill Protection)",
  "Net Surplus Compensation (NSC) — end-of-year DLAP-based rate paid on Net Surplus Electricity; separate from per-hour Export Credit",
  "Net Surplus Compensation Renewable Attribute Adder (RAA) — out of scope; year-end WREGIS-transfer-contingent",
  "Sub-schedule variants (NBT-EXP, NBT-EXP-OTR, NBT-MT, NBT-PS, NBTA) — sibling filings to be filed separately; this filing scopes to canonical residential NBT-S",
  "Multiple Tariff Facilities (SC 4) — non-residential, out of scope here",
  "Load Aggregation NBTA (SC 6) — non-residential / multi-parcel arrangements, out of scope here",
  "NBT Paired Storage NBT-PS (SC 8) — sibling filing planned",
  "Legacy NEM/NEM2 transition mechanics — modeled as eligibility-rule conditions only; full transition state machine is a process concern, not a billing-time concern",
  "Prevailing Wage requirements (SC 10) — pre-PTO project eligibility, not a billing/rate concept",
  "Natural or Human-Made Disasters provisions (SC 9) — interconnection-process concern, not a billing-time concern",
]

