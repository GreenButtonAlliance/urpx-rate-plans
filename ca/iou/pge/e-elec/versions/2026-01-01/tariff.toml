[review]
status        = "draft"
notes         = "PG&E E-ELEC (Residential Time-Of-Use, Electric Home) — schedule for residential customers with qualifying electric technologies (BEV/PHEV charging, energy storage, electric heat pump, or NBT enrollment). Brought into urpx-tariffs from the urpx-org/urpx v0.2.0 test-case at test-cases/pge-e-elec-2026-01-01/ (URPX-team-authored — original v0.1.1 pre-draft contributed by Flux Tailor / Una Smith-Simon, with subsequent updates by Una and Klaartje De Schepper); in this corpus we migrated it from intermediate v0.2.0 vocabulary — ConditionLogic/ObjectTerminalNode/CustomTerminalNode — to the final v0.2.0 ConditionExpression/ObjectOperandNode/CustomOperandNode form per Decisions #097/098. Substantive transforms: split EligibilityRule into 2 (residential customer-kind + qualifying technology with 4-way OR), ratePlanIdentifier→ratePlanUniqueIdentifier, removed hasCustomerProfile from EligibilityRule, wrapped top-level RatePlan in @graph for self-containment. The 4 qualifying-technology conditions: storage→urpx:derType=urpx:storageDER; EVCharging→urpx:derType=urpx:evChargingDER (covers BEV+PHEV per URPX vocabulary); heatpump→urpx:hasHVAC=urpx:airSourceHeatPump (URPX-native vs. the source's CustomTerminalNode 'Has Heat Pump' boolean — semantically richer); NBT→CustomOperandNode 'Program Enrollment'='Net Billing Tariff (NBT)' (URPX has no NBT-specific vocabulary). The published rate table on Sheet 4 of the PDF includes the 18-vintage PCIA table; the URPX-team-authored fixture does NOT include a vintage-PCIA RatePlanModifier; we follow that for now (could be added as a follow-up to match our other PG&E filings' pattern). pyshacl + clj-urpx end-to-end validate clean."
