  "N_SmartDays bill-period multiplier on the two Credits — consumer-side billing-engine evaluates the count; modifier-level unitPrice carries per-event rate ($-0.00636 / $-0.00167)",
  "Daily SmartDay activation trigger (temperature forecast / CAISO Flex Alert) — captured in PriceUpdateRule description prose, not structurally evaluable",
  "Grandfathered SmartAC dual-enrollment exception — pre-2018-10-26 SmartAC dual-enrollees keep both per D.18-11-029, restricted from DR energy payment during High-Price Period; edge-case customer state",
  "Customer-onboarding mechanics (5-business-day request lag, next-billing-cycle activation) — enrollment process, not billing-time",
