# Extraction ------------------------------------------------------------------
[extraction]
tool          = "manual"
extracted_on  = "2026-05-29"
notes         = """
First filing of PG&E Schedule E-RSMART (Residential SmartRate Program) in
this corpus (URPXT-zvd). Filed designation is E-RSMART; the URPXT issue's
original title carried "E-CPP" which is incorrect.

Customer-facing name "SmartRate". The PG&E residential analog of SCE's
TOU-D-PRIME-CPP. Voluntary CPP overlay paying a small per-kWh credit on
non-event-window kWh in exchange for accepting +$0.60/kWh on the 4-9pm
window during 9-15 SmartDay event days per calendar year.

## Modifier shape

Modeled as urpx:RatePlanModifier overlaying FIVE base RatePlans (Sheet 1
APPLICABILITY): pge:e-1, pge:e-elec, pge:e-tou-c, pge:e-tou-d, pge:ev2.
This is the first multi-base modifier in the corpus — SHACL-confirmed
that applicableToRatePlan has max=None (unbounded), supporting the
multi-base binding.

The 5-base binding includes both tiered (E-1) and TOU (E-TOU-C/D, EV2,
E-ELEC) bases. SmartRate adds a 4-9pm High-Price window that may or
may not coincide with the base's TOU peak — for E-TOU-C, E-ELEC, EV2
the SmartRate window matches the base's 4-9pm peak; for E-TOU-D it
shifts (base is 5-8pm); for E-1 the base has no TOU at all. The
SmartRate window is independent of the base's TOU structure.

Customers on NBT are explicitly eligible (Sheet 1) — SmartRate stacks
on top of E-ELEC+NBT for solar+battery+EMS customers. Bundled-service
only (DA/CCA ineligible). Single-family residential only.

## Modeling pattern (PRIME-CPP precedent)

Follows the SCE TOU-D-PRIME-CPP modeling pattern at
ca/iou/sce/tou-d-prime-cpp/versions/2026-03-20/ closely:

3 PriceDefinitions on 3 separate Ledgers (Sheet 2 rate table):

  SmartDay High-Price Period Charge   $+0.60000/kWh
    Applies during 4-9pm on SmartDay Event Days. SmartDays are called
    by PG&E day-ahead by 4pm; 9-15 events per calendar year. Trigger
    is the day-ahead average max-temperature forecast for San Jose +
    Concord + Red Bluff + Sacramento + Fresno: ≥98°F on non-holiday
    weekdays, ≥105°F on holidays/weekends (May 1 onwards), adjustable
    ≤2x/month; also CAISO Flex Alerts, high spot market prices, annual
    minimum-hit, or testing. PG&E retains sole discretion not to call
    an event even if criteria met (Sheet 4).

  SmartRate Non-High-Price Period Credit   $-0.00636/kWh × N_SmartDays
    Per-kWh credit MULTIPLIED by the number of SmartDays in the bill
    period. Applies to non-High-Price-Period kWh on SmartDays AND all
    kWh on non-SmartDays within a bill period that contains at least
    one SmartDay (Sheet 2). Bill-period-aggregation semantics don't
    fit per-hour resolution — the N_SmartDays multiplier is consumer-
    side-evaluable; modifier-level unitPrice carries the per-event
    rate ($-0.00636).

  SmartRate Participation Credit   $-0.00167/kWh × N_SmartDays
    Same applicability semantics as the Non-High-Price Period Credit,
    different per-event rate. Encodes the residential customer's
    incentive for choosing the program.

Event-day gating: SmartDay High-Price Period Charge uses
urpx:hasDynamicPricing with dynamicPricingType=urpx:criticalPeakPricing
+ priceSource=urpx:wholesaleMarketSource + updateFrequency=
urpx:eventTriggeredUpdates + a urpx:PriceUpdateRule whose description
carries the PG&E-specific SmartDay trigger semantics (temperature
forecast, CAISO Flex Alerts, etc.). This is the canonical URPX v0.2.0
pattern for event-driven pricing — same pattern PRIME-CPP refactored
to from a self-invented "Is CPP Event Today" predicate.

Both Credits retain ApplicabilityRule + CustomOperandNode predicates
because their bill-period-aggregation semantics (multiplied by
N_SmartDays in bill period) don't map cleanly to DynamicPricing —
DynamicPricing's semantic is "this Price is event-driven", not
"this Price's value is the per-event-rate, to be multiplied by event
count at billing time". Bill-period aggregation is consumer-side
billing-engine responsibility.

## 4-9pm window encoding

The High-Price Period 4-9pm window is conveyed via prose in the
SmartDay High-Price Period Charge Price's hasDynamicPricing
PriceUpdateRule description, NOT structurally as a TOUPeriod
referenced from the Price. Reasoning: PRIME-CPP precedent (same
choice — relies on description prose); the urpx:hasDynamicPricing +
criticalPeakPricing pattern is the canonical event-driven shape;
adding a TOUPeriod cell for the 4-9pm window would duplicate
information already conveyed by the event-driven semantics.

If a downstream consumer (price-server) needs to evaluate "is the
current instant in the SmartDay High-Price window during a called
SmartDay event?", that evaluation is responsibility of the resolver
plus an external event-day calendar — not structural URPX vocabulary.

## Eligibility encoding

One EligibilityRule: customer has elected SmartRate (CustomOperandNode
"SmartRate Election" = "true"). This mirrors PRIME-CPP's single-
predicate "CPP Election" eligibility. The other constraints
(bundled-service, single-family residential, SmartMeter installed, NOT
master-metered, NOT NEM-1/NEM-2, NOT standby, NOT DA/CCA, NOT Rule-22.1
TBS, NOT dual-enrolled in other DR per D.18-11-029) are baked into
PG&E's enrollment-side validation and not encoded as separate
EligibilityRule entities — the customer-side state of "SmartRate
Election = true" implies the customer passed all of these gates at
enrollment time. NBT-compatibility is preserved (Sheet 1 explicit:
NBT customers ARE eligible for SmartRate).

## Modeling deferrals

  1. Bill Protection (Sheet 5) — first-full-Summer-Season comparison
     against the customer's OAS; year-long calculation that doesn't
     fit per-bill modifier shape. Same deferral pattern as PRIME-CPP
     Bill Protection. Not modeled.

  2. N_SmartDays bill-period multiplier on the two Credits — consumer-
     side billing-engine responsibility. Modifier-level unitPrice
     carries the per-event rate; downstream multiplies.

  3. Daily SmartDay activation logic (temperature forecast trigger,
     CAISO Flex Alerts) — modeled as prose in the PriceUpdateRule
     description; not a structural URPX gate.

  4. Grandfathered SmartAC dual-enrollment (pre-2018-10-26 only;
     restricted from DR energy payment during High-Price Period) —
     edge-case customer state, not modeled.

  5. Customer-onboarding mechanics (request → 5-business-day lag,
     next-billing-cycle activation) — enrollment process, not a
     billing-time concern.
"""

