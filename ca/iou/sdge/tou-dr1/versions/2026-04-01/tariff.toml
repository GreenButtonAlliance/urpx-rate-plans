notes         = "First SDG&E schedule modeled. Pattern reference: ca/iou/sce/tou-d-4-9pm/versions/2025-11-15/ for TOU structure (3 TOU tiers, 6 periods); ca/iou/pge/e-tou-c/versions/2026-03-01/ for component-level UDC decomposition. 17 PriceDefinitions: 6 EECC (TOU-varying generation) + 8 UDC sub-components (flat across periods/seasons) + DWR-BC + WF-NBC + Baseline Credit + BSC. 17 Prices total. Unique to SDG&E vs SCE/PG&E: (1) summer is 5 months (Jun-Oct, not Jun-Sep), (2) on-peak is all-days at 4-9pm (no weekday/weekend distinction unlike SCE TOU-D-4-9PM), (3) Super Off-Peak windows differ between weekdays (split midnight-6am + 10am-2pm) and weekends (continuous midnight-2pm), (4) UDC delivery cost is FLAT across all periods (not per-period like SCE/PG&E), (5) baseline credit applies to 130% of baseline (not 100% like SCE / 400% like PG&E)."
