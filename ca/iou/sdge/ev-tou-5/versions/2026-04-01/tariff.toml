notes         = """
Source pattern shared with TOU-DR1 / DR / TOU-DR2 — see
ca/iou/sdge/utility.toml for the SDG&E tariff-portal URL convention.

Filing details (6-page PDF):
  Sheet 1 (APPLICABILITY + RATES standard) — AL 4791-E-A, Sheet 64667-E
  Sheet 2 (RATES — CARE + MB variants) — AL 4791-E-A, Sheet 64668-E
  Sheet 3 (UDC sub-component breakdown) — AL 4791-E
  Sheet 4 (Special Conditions, Time Periods table) — AL 4791-E
  Sheets 5-6 — Special Conditions continued

## TOU period definitions (Sheet 4)

Same TOU windows as TOU-DR1:
  TOU Period      Weekday Summer/Winter         Weekend/Holiday Summer/Winter
  ───────────     ───────────────────────       ──────────────────────────────
  On-Peak         4 PM - 9 PM                   4 PM - 9 PM
  Off-Peak        all other hours               all other hours
  Super Off-Peak  Midnight - 6 AM AND 10 AM - 2 PM   Midnight - 2 PM

Seasons: Summer Jun 1 - Oct 31 (5 months); Winter Nov 1 - May 31.

## Modeling structure

Bill = UDC + (DWR-BC + WF-NBC) + EECC. Distinguishing structural
features vs TOU-DR1:

  - UDC Transmission and Distribution components are TOU-VARYING
    (designed to incentivize overnight EV charging):
      Transmission: $0.10067 on-peak/off-peak; $0.00000 super-off-peak
      Distribution: $0.21102 on-peak/off-peak; $0.02601 super-off-peak
    Each modeled as a single PriceDefinition with 6 Prices keyed by
    touPeriodNumber 1-6 — same pattern as TOU-DR2's TRAC.
  - UDC TRAC is ZERO across all periods on EV-TOU-5 (vs $0.06762 flat
    in TOU-DR1, $0.06564-$0.07211 TOU-varying in TOU-DR2).
  - 5 other UDC sub-components (PPP, ND, CTC, LGC, RS) are flat with
    values identical to TOU-DR1.
  - EECC values are HIGHER on-peak (Summer On-Peak $0.47019 vs
    TOU-DR1's $0.34920 — reflects cost-based pricing for high-load
    EV households) but lower super-off-peak.
  - NO Baseline Adjustment Credit (vs $-0.10892 in TOU-DR1).
  - Same Base Services Charge $0.79343/day for standard customers.
  - Same DWR-BC + WF-NBC: $0.00000 + $0.00591 = $0.00591/kWh.

## Eligibility

Per Sheet 1, EV-TOU-5 is restricted to one of:
  1. Customers with a registered BEV (battery-electric vehicle) or
     PHEV (plug-in hybrid), recharged via a recharging outlet at the
     customer's premises. Both map to urpx:evChargingDER.
  2. Customers with a natural-gas vehicle (NGV) refueled via a home
     refueling appliance (HRA). Modeled as a CustomOperandNode since
     URPX has no NGV-specific vocabulary.
  3. Customers enrolled on Schedule NBT (Net Billing Tariff) for whom
     EV-TOU-5 is the otherwise-applicable schedule (OAS). MANDATORY
     for new solar customers since 2023 — primary growth path.

Conventional HEVs (charge-sustaining hybrids without grid charging)
are explicitly excluded.

3-way OR EligibilityRule modeled (vs SCE TOU-D-PRIME's 4-way OR which
also includes battery-storage and heat-pump as qualifying technologies
— EV-TOU-5 is narrower in that respect, EV/NGV/NBT only).

## Modeling deferrals

Same as TOU-DR1:
  - PCIA (Special Condition 11) for CCA-served customers.
  - Franchise Fee Differential 5.78% within City of San Diego.
  - CARE / Medical Baseline / FERA / DRAH RatePlanModifiers
    (grid-coordination/urpx-tariffs#13 secondary epic).
  - EV-TOU-5-P (Critical Peak Pricing variant; grid-coordination/urpx-tariffs#13).
"""

