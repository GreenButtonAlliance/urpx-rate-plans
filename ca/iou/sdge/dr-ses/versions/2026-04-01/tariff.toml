[review]
status        = "draft"
notes         = "Third SDG&E electrification-targeted schedule modeled (after EV-TOU-5 and TOU-ELEC). Pattern reference: ca/iou/sdge/tou-elec/versions/2026-04-01/ for the flat-UDC + 6 EECC + no-Baseline-Credit structure. 15 PriceDefinitions (TOU-ELEC has 16): 6 EECC (TOU-varying generation) + 7 UDC sub-components (flat across periods/seasons; TRAC excluded by Special Condition vs included with $0 in TOU-ELEC) + DWR-BC + WF-NBC + BSC. 15 Prices total. Eligibility is the simplest in the SDG&E electrification family — single OR-leaf urpx:solarDER (vs EV-TOU-5's 3-way OR / TOU-ELEC's 4-way OR). EECC values match EV-TOU-5 exactly (DR-SES inherits the cost-based residential-TOU EECC schedule). Smallest electrification target by customer count (~5K, vs TOU-ELEC ~70K and EV-TOU-5 ~140K) but high-signal: every DR-SES customer is a confirmed solar adopter."
