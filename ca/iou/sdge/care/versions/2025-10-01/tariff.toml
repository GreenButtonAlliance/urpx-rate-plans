notes         = """
First filing of SDG&E Schedule E-CARE in this corpus (URPXT-65v.1).
Sourced via the SDG&E Azure FDoor tariff API (recipe documented in
ca/iou/sdge/utility.toml [scrape_notes]).

Per the SDG&E convention (most-recent per-sheet date in source PDF),
this filing is dated to 2025-10-01 — Sheet 1's effective date under
AL 4701-E. Most other sheets are older (Jun 1, 2025; Sep 1, 2015)
and unchanged in this revision.

Per-sheet effective dates:
  Sheet 1 (Applicability + Discount summary) — 2025-10-01 (AL 4701-E,
    63266-E)  *** newest, drives filing date ***
  Sheet 2 (Discount continued + CARE Surcharge per-class table) —
    2026-03-02 issue (AL 4791-E, but eff date pending — this sheet
    appears to be in a transitional state on the issued date with
    "Effective" blank in the source PDF stamp)
  Sheet 3 (Special Conditions 1-5: eligibility + recertification) —
    2025-06-01 (AL 4648-E)
  Sheet 4 (older eligibility detail) — 2015-09-01 (AL 2783-E)
  Sheet 5+ (additional conditions) — 2025-06-01 (AL 4648-E)

## Modifier shape

Modeled as urpx:RatePlanModifier (sibling pattern to SCE CARE in
URPXT-cah.6, with the same line-item exemption + percentage-discount
deferral structure). Eligibility predicate: customer's
'Program Enrollment' = 'California Alternate Rates for Energy (CARE)'
(CustomOperandNode), matching the SCE/cross-utility naming.

Residential CARE customer benefits per Sheet 1 'Discount' section:
  (a) 35% line-item bill discount (D.24-05-028)
  (b) Exemption from CARE Surcharge
  (c) Exemption from Department of Water Resources Bond Charge (DWR-BC)
  (d) Exemption from California Wildfire Fund Charge (WF-NBC)
  (e) 50% minimum bill OR reduced Base Services Charge (relative to
      Non-CARE)

## What this modifier captures

Line-item credits (overlay onto any SDG&E residential base RatePlan
when customer is enrolled in CARE):

  WF-NBC Exemption:           -$0.00591/kWh   (cancels base WF-NBC)
  DWR-BC Exemption:           -$0.00000/kWh   (currently zero;
                                                 tracked for future use)
  CARE Surcharge Exemption:   -$0.00864/kWh   (All Other Residential
                                                 CARE Schedules rate;
                                                 different rate for
                                                 DM/EV-TOU not modeled
                                                 in this corpus)
  BSC Adjustment:             -$0.59630/day   (Standard $0.79343 →
                                                 CARE $0.19713;
                                                 ~75% reduction)

  Source for BSC values: SDG&E TOU-DR1 base rate sheet (Sheet 1
  'Total Rates' table). Same numerical values appear consistently
  across the SDG&E residential bases.

## What this modifier does NOT capture (deferred)

  1. **35% line-item bill discount** — URPX has no percentage-of-bill
     primitive (urpx:Price.unitPrice is xsd:decimal in $-per-unit).
     Same upstream-vocabulary gap as SCE CARE (URPXT-cah.6) and
     PG&E CARE — tracked at urpx-org/urpx#24 (OPEN). The 35%
     discount is the bulk of the customer's CARE benefit; the
     line-item exemptions modeled here cover the remainder.

  2. **CARE Medical Baseline customer co-benefits** — Sheet 1 prose:
     'CARE Medical Baseline customers taking electric service will
     also receive applicable benefits associated with Medical
     Baseline Program participation pursuant to D.25-09-006.' Those
     benefits live in Schedule E-MEDICAL (which is itself blocked on
     the same upstream allocation-extension question as SCE HPWH /
     PG&E Code M/S — urpx-org/urpx#32, OPEN). Not modeled here.

  3. **Non-Residential CARE** — Sheet 1 lists separate eligibility
     and exemption structure (e.g., DWR-BC + WF-NBC exemptions are
     explicit there). Not in scope for this residential-focused
     filing; would be modeled in a separate non-residential CARE
     filing if ever needed.

  4. **CARE Surcharge value variance** — Sheet 2 distinguishes two
     CARE Surcharge rates: $0.00864/kWh for "All Other Residential
     CARE Schedules" (DR, DS, DT, DT-RV, DR-SES, TOU-DR, EV-TOU-2,
     EV-TOU-5, TOU-DR1, TOU-DR2, TOU-ELEC) and $0.01062/kWh for
     "DM & EV-TOU CARE Schedules". DM and EV-TOU aren't currently
     in our corpus's modeled residential bases, so only the
     $0.00864 value is captured here. If those bases get modeled,
     a separate per-base CARE filing or a richer subgroup
     EligibilityRule would be needed.

## Cross-utility consistency

CARE is a CPUC-mandated program implemented by all three CA IOUs.
SCE CARE modeled at ca/iou/sce/care/2026-03-20/ — same shape (4
line-item exemptions + deferred percentage discount). PG&E CARE
not yet modeled.
"""

