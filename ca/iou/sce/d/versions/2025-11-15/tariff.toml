# Modeling -------------------------------------------------------------------
[modeling]
complete  = true
deferrals = []
applicable_modifiers = [
  "care",
  "cca-crs",
  "da-crs",
  "deed-restricted",
  "fera",
  "medical-baseline",
]

# Review ----------------------------------------------------------------------
[review]
status        = "draft"
notes         = "Third SCE schedule modeled. Structurally distinct from TOU-D options: no TOU schedule (flat all-day rates), 2 ServiceTiers (baseline / nonbaseline) implemented via tier-varying CIA charge (-$0.03845/kWh credit baseline, +$0.06604/kWh charge nonbaseline; the 10.449¢ swing matches the Baseline Credit modeled in SCE TOU-D). Generation, distribution, and other surcharges are flat across tiers and seasons. Pattern reference: PG&E E-1 (also tiered, also uses urpx:hasServiceTiers + serviceTierNumber on per-tier Price entries). 13 PriceDefinitions: 1 generation, 1 distribution, 6 flat delivery surcharges (Trans/NSGC/NDC/PPPC/WFC/PUCRF), 1 tier-varying CIA, 2 bundled adjustments (FRC/MCAM), 1 BSC, 1 climate credit. 14 Prices (CIA has 2 — one per tier)."
