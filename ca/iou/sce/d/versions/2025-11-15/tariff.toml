# Regulatory ------------------------------------------------------------------
[regulator]
authority     = "puc"
docket        = "Decision 24-05-028 / Resolution E-5356"

# Extraction ------------------------------------------------------------------
[extraction]
tool          = "manual"
extracted_on  = "2026-04-30"
notes         = """
Source PDF is SCE's consolidated Schedule D tariff book — 15 pages bundling
per-sheet revisions across 2025. Per the SCE convention documented in
ca/iou/sce/utility.toml, this filing is dated to the most recent per-sheet
effective date (2025-11-15).

Per-sheet effective dates within the source PDF (most recent revision per
sheet):
  Sheet 2 (headline rates) — 2025-11-15 (AL 5654-E, leaf 90634-E)
  Sheet 3 (Delivery Service breakdown) — 2025-11-15 (AL 5654-E, leaf 90635-E)
  Sheet 7 (Special Conditions 4-6: Billing Calculation w/ CARE+FERA,
    Climate Credit, Change of Rate Schedule) — 2025-11-15 (AL 5654-E,
    leaf 90639-E)

Sheets 4-6 (Special Conditions 1-3) are not in this consolidated PDF —
same gap pattern as TOU-D. Special Conditions content needed
for billing calculation specifics, baseline allocation tables, and
DA/CCA delivery clauses.

The fetch path is documented in ca/iou/sce/utility.toml — canonical
PDFs live in the SCE library.sce.com CDN at the URL listed in [source.url],
discovered by browsing the historical-rates portal page through to the
'Residential Rates' SharePoint folder. fetch-sce-tariffs.py (in the
shadow repo) automates the SharePoint enumeration + download.

Modeling deferrals (shared with TOU-D filings, tracked separately):
  - CARE/FERA discount RatePlanModifiers (Special Condition 4 on Sheet 7
    — 32.5% / 18% discounts plus BSC surcharge exemption + BSC
    discount adjustments + CARE Surcharge / WFC / FRC exemptions).
    Modeled at ca/iou/sce/care/ and ca/iou/sce/fera/.
  - Deed-Restricted BSC discount ($-0.334/meter/day) — described in
    plan prose, not yet modeled as an EligibilityRule or modifier.
    Tracked at grid-coordination/urpx-tariffs#14.
  - Vintage PCIA / DA-CRS / CCA-CRS RatePlanModifiers — delivery-service
    Total varies for Direct Access / CCA customers (subject to DWRBC
    adjustments via Schedule DA-CRS / CCA-CRS). Not yet captured.
"""

# Validation ------------------------------------------------------------------
[validation]
shacl_passed   = true
validator      = "pyshacl + clj-urpx"
