# Extraction ------------------------------------------------------------------
[extraction]
tool          = "manual"
extracted_on  = "2026-05-29"
notes         = """
First SCE NBT filing in this corpus (URPXT-7kr.2). Sibling of PG&E NBT
(ca/iou/pge/nbt/versions/2025-10-17/) — SECOND export-direction modifier
in the corpus. Modeling pattern derived directly from PG&E NBT with
utility-specific substitutions.

SCE Schedule designation is "Schedule NBT" (same as PG&E). Customer-
facing names include "Solar Billing Plan" (SBP) and the vintage labels
NBT23 / NBT24 / NBT25 / NBT26 / NBT00.

Composite PDF is 42 sheets; most recent per-sheet effective date is
2025-04-23 (Advice 5533-E) on Sheets 2 and 7, which drives this filing's
effective_date per the SCE convention noted in ca/iou/sce/utility.toml.

## Modifier shape

Modeled as urpx:RatePlanModifier overlaying sce:tou-d-prime (the
mandatory residential base RatePlan per Sheet 2 §1.a: "Residential
Customers taking service under this Schedule must be on the Prime Option
of Schedule TOU-D"). Single-base binding — same shape as the PG&E NBT
filing (which mandates E-ELEC).

Non-Residential NBT customers may take any open TOU schedule; this
filing scopes to canonical residential NBT (PRIME-required). Sibling
sub-schedule filings (NBT-A Aggregation, NBT-PS Paired Storage, NBT-MT
Multiple Tariff) deferred.

## Export-side direction modeling

MetricSpecification carries urpx:flowDirection urpx:reverse — same
vocabulary as PG&E NBT. URPX v0.2.0 vocabulary supports the export-side
direction natively; SHACL-confirmed during PG&E NBT authoring that
MetricSpecificationShape (closed) admits urpx:flowDirection.

## ACC Plus Adder modeling

Sheet 7 ACC Plus table (Avoided Cost Calculator Plus Adder):

  Vintage   Non-Equity      Equity         Non-Residential
  2023      $0.040/kWh      $0.093/kWh     $0.00/kWh (Not Eligible)
  2024      $0.032/kWh      $0.074/kWh     $0.00/kWh
  2025      $0.024/kWh      $0.056/kWh     $0.00/kWh
  2026      $0.016/kWh      $0.037/kWh     $0.00/kWh
  2027      $0.008/kWh      $0.019/kWh     $0.00/kWh
  2028+     $0.000/kWh      $0.000/kWh     $0.00/kWh

SCE terminology differs from PG&E: "Non-Equity Customer" vs PG&E's
"Residential", "Equity Customer" vs PG&E's "Low Income". Equity Customer
definition (Sheet 17): CARE/FERA OR resident-owners of single-family
homes in disadvantaged communities (D.18-06-027) OR Residential
Customers in California Indian Country (D.20-12-003). Same eligibility
basis as PG&E's Low-Income classification.

Notable: SCE Non-Equity values are roughly 2x PG&E Residential values
across all vintages (e.g. 2023: SCE $0.040 vs PG&E $0.022). Equity values
are very close (2023: SCE $0.093 vs PG&E $0.090).

Modeled as two separate PriceDefinitions + Ledgers (ACC Plus Non-Equity
+ ACC Plus Equity). Initial filing carries the 2025-vintage Price values
only; multi-vintage matrix deferred.

## Export Compensation Rate cardinality

Sheet 5 confirms the SCE EEC structure: hourly EEC Price differentiated
by hour (24) and by weekday/weekend-holiday (2), per month (12) per
vintage. Same 576-cells-per-vintage × 2-components × 4-vintages = 4,608
shape as PG&E. SCE customer-facing "Understanding Solar Export Pricing"
page describes the file format (Delivery: USCA-SCXX, Generation: USCA-
XXSC, vintage-labeled NBT23-26) and includes UTC time columns alongside
PST.

INITIAL FILING SCOPE: structural shell (modifier + MetricSpecification
with flowDirection=reverse + 4 PriceDefinitions/Ledgers + eligibility +
2 ACC Plus Prices). Per-cell Export Compensation Rate Prices deferred
to URPXT-7kr.2.1 — the SCE data-file URL was not surfaced during 2026-
05-29 sourcing (sce.com/customer-service-center/help-center/solar/
solar-billing-plan/understanding-export-pricing references the file but
its download URL is not exposed in the rendered page). Follow-up will
locate the URL and run the equivalent of the PG&E extract+build pipeline
on the SCE data.

## Binding mechanism

urpx:applicableToRatePlan sce:tou-d-prime — single-base modifier overlay,
same shape as the PG&E NBT filing's pge:e-elec binding and the SCE
TOU-D-PRIME-CPP overlay precedent. The "modifier on multiple base
RatePlans" question from URPXT-7kr's original framing is moot for
residential NBT in both utilities.

## Eligibility encoding

Two EligibilityRules (same as PG&E NBT pattern):
  1. Customer has Eligible Renewable Electrical Generating Facility
     (REGF — biomass, solar thermal, PV, wind, geothermal, fuel cells,
     small hydro, biogas, etc. per Sheet 11)
  2. Interconnection application submitted on or after 2023-04-15
     (NEM-ST closed for new interconnections after 2023-04-14)

Transition customer state, NBT-A / NBT-PS / NBT-MT sub-cases handled
in description prose, not encoded as separate EligibilityRule entities.

## Settlement deferrals (per PRIME-CPP / PG&E NBT precedent)

  - Annual true-up at end of customer's Relevant Period (12 cycles from
    PTO anniversary). Year-long calculation, doesn't fit per-bill
    modifier shape.
  - Net Surplus Compensation (NSC) — end-of-year DLAP-based settlement.
    NSCR = rolling 12-month avg of SCE hourly DLAP prices Hour Ending
    08 through Hour Ending 17 (7am-5pm). Separate from per-hour Export
    Credit; computed at true-up.
  - NSC Renewable Attribute Adder (RAA) — WECC-based renewable premium
    if customer transfers WREGIS Certificates to SCE.
  - Excess credit carry-forward / forfeiture mechanics

Consumer-side responsibilities (price-server / billing engine).

## Non-Bypassable Charges (NBCs)

Sheet 3 lists 4 NBCs: PPPC (Public Purpose Programs), NDC (Nuclear
Decommissioning), CTC (Competition Transition), WFC (Wildfire Fund).
CARE customers and Medical Baseline Exemption customers are exempt
from WFC under this Schedule (WFC = $0.00/kWh). NBC modeling lives on
the base TOU-D-PRIME RatePlan; this modifier just notes that base EEC
credits cannot offset NBCs while ACC Plus Adder credits can (Sheet 8 /
Sheet 22).

## Sub-schedule mapping

SCE has 3 NBT sub-cases: NBT-A (Aggregation, multi-meter parcels),
NBT-PS (Paired Storage), NBT-MT (Multiple Tariff Facility). PG&E has 6
(NBT-S small ≤30kW, NBT-EXP, NBT-EXP-OTR commercial, NBT-MT, NBT-PS,
NBTA). The PG&E "S / EXP / EXP-OTR" split by size and customer class
is folded into SCE's Eligible Rates section (Sheet 2) rather than
sub-schedules. Sibling filings for SCE NBT-A and NBT-PS deferred.
"""

