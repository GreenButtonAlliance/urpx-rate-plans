# MIDAS RIN cross-reference (added by URPXT-7kr.2.1) ------------------------
# Each per-cell Delivery Price carries its CEC MIDAS Rate Identification
# Number (RIN) in urpx:name for cross-reference. SCE uses per-base-RatePlan
# RIN families; for residential TOU-D-PRIME-NBT:
#   USCA-SCXX-0602-0000   TOU-D-PRIME-NBT NON-VINTAGED
#   USCA-SCXX-0603-0000   TOU-D-PRIME-NBT 2023 VINTAGE
#   USCA-SCXX-0604-0000   TOU-D-PRIME-NBT 2024 VINTAGE
#   USCA-SCXX-0605-0000   TOU-D-PRIME-NBT 2025 VINTAGE
#   USCA-SCXX-0606-0000   TOU-D-PRIME-NBT 2026 VINTAGE
# Generation EEC IS derivable from MIDAS — discovered 2026-05-29 via
# SCSC-SCXX subtraction:
#   USCA-SCSC-{code}-0000   bundled-service rate, carries COMBINED EEC
#   USCA-SCXX-{code}-0000   CCA-service rate,     carries DELIVERY-ONLY EEC
#   Generation EEC = SCSC combined "Energy Export Credit"
#                  − SCXX "Energy Export Credit Delivery"
# Empirically verified constant across multiple weeks within each vintage's
# lock-in period. Implemented in shadow-repo/scripts/
# augment-sce-nbt-with-generation-eec.py. Generation Price names carry
# both source RINs (e.g. "MIDAS RIN: USCA-SCSC-0605-0000 − USCA-SCXX-0605-0000").

# Modeling -------------------------------------------------------------------
[modeling]
complete  = false
deferrals = [
  "NBT 2026 vintage per-cell Prices (Jun-Dec) — MIDAS publishes only partial-year 2026 data as of extraction; 672 cells (336 Delivery + 336 Generation) deferred until MIDAS publication catches up",
  "NBT 2023 vintage values loaded via query of MIDAS 2025 data (the customer's locked-in rate is constant within their 9-year window, so any year in the published range gives the same per-cell values)",
  "Multi-vintage ACC Plus values — initial filing models the 2025-vintage row; full per-vintage matrix (2023-2027 in table) is a follow-up",
  "Annual true-up + Relevant Period settlement — year-long calculation doesn't fit per-bill modifier shape (same deferral pattern as PG&E NBT)",
  "Net Surplus Compensation (NSC) — end-of-year DLAP-based settlement using rolling 12-month avg of SCE hourly DLAP prices Hour Ending 08 through 17",
  "Net Surplus Compensation Renewable Attribute Adder (RAA) — out of scope; year-end WREGIS-transfer-contingent",
  "Sub-schedule variants — NBT-A (Aggregation, Sheet 10 + Special Condition 10), NBT-PS (Paired Storage, Special Condition 5), NBT-MT (Multiple Tariff, Special Condition 6) — sibling filings deferred",
  "California Climate Credit cash-out provision (Sheet 26) — Residential semi-annual credit handling at end of Relevant Period; consumer-side",
  "Legacy NEM/NEM-ST transition mechanics — modeled as eligibility-rule conditions only; full transition state machine is a process concern",
  "Prevailing Wage requirements (Special Condition 9) — pre-PTO project eligibility, not a billing/rate concept",
  "Natural Disaster provisions (Special Condition 8) — interconnection-process concern, not a billing-time concern",
  "Energy Export Credit Adjustment Pricing (separate concern, posted at sce.com/EEC-adjustment-pricing) — addresses duplicate-EEC corrections at Relevant Period close",
  "NBT-A Billing Service Charges (Sheet 10 — Setup $25/$16, Monthly $20/$2.70) — out of scope for residential NBT (NBT-A is multi-account-aggregation overlay)",
]

