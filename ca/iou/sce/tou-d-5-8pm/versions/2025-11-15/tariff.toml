  2. SCE 2025 Summary of Available Residential and Nonresidential Rates PDF
     (referenced in ca/iou/sce/utility.toml) — confirms 4-9 PM on-peak.

The customer-facing schedule graphics are authoritative for the TOU windows
modeled here; the omitted regulatory Sheets 12-17 govern edge cases (holiday
treatment specifics, baseline allocation tables, CCA/DA clauses) that are
not yet captured.

Modeling deferrals (filed as separate beads issues to track):
