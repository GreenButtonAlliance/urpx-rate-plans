# Extraction ------------------------------------------------------------------
[extraction]
tool          = "manual"
extracted_on  = "2026-05-04"
notes         = """
First filing of Option PRIME-CPP variant in this corpus (URPXT-cah.10).
Modeled as a urpx:RatePlanModifier overlaying the base PRIME RatePlan
(sce:tou-d-prime). Customer-state-driven sub-option that adds CPP
event-window charges and non-event-window credits to a PRIME customer's
bill. Sourced from the live TOU-D PDF — Sheet 6 carries the PRIME-CPP
rate values (alongside PRIME headline rates), Sheets 12 and 15-16
document the CPP framework.

Per the SCE convention documented in ca/iou/sce/utility.toml, this
filing is dated to the most recent per-sheet effective date in the
source PDF (2026-03-20).

Per-sheet effective dates relevant to the PRIME-CPP filing:
  Sheet 6 (Option PRIME-CPP rate values: Event Charge, Non-Event
    Credit, Maximum Available Credit) — 2026-01-01 (AL 5725-E)
  Sheet 12 (Special Condition 1: TOU period definitions including
    CPP Event Period and CPP Non-Event Credit Period windows) —
    2022-06-01 (AL 4765-E)
  Sheet 15 (Special Condition 4: Critical Peak Pricing — event
    framework, 12-15 events/year, day-before notification) —
    2022-06-01
  Sheet 16 (Special Condition 4 continued: CPP participation rules,
    Maximum Available Credit cap, Bill Protection) — 2019-03-01
  Sheet 21 — 2026-03-20 (newest sheet in the document, drives the
    filing date)

## Modifier shape

Architecture choice: modeled as urpx:RatePlanModifier (sibling pattern
to DA-CRS / CCA-CRS in URPXT-cah.9), NOT as a separate urpx:RatePlan.
Reasoning: PRIME-CPP customers pay the FULL base PRIME rate structure
PLUS CPP-window adjustments. A modifier overlay is more lightweight
than cloning the entire 25-PriceDefinition PRIME structure. The
issue-original framing offered both 'fifth OR-path on PRIME' and
'separate RatePlan' options; the modifier path is structurally
cleaner and consistent with how DA-CRS and CCA-CRS overlay on the
same residential bases.

3 PriceDefinitions (Sheet 6 of source PDF):

  CPP Event Energy Charge          $+0.80000/kWh
    Applies during the CPP Event Period (4 p.m.-9 p.m. summer or
    winter days, ON CPP Event days only — SCE may call any day a
    CPP Event; 12-15 events per calendar year, day-before notice).

  CPP Non-Event On-Peak Energy Credit  $-0.15170/kWh
    Applies during the CPP Non-Event Credit Period (4 p.m.-9 p.m.
    Summer Season days, ON non-CPP-Event days only). No credit
    provided on exported generation (i.e. behind-the-meter solar
    output during 4 p.m.-9 p.m. doesn't earn the credit).

  Maximum Available Credit          $-0.58794/kWh (Summer Season cap)
    Caps the total credit a CPP customer can earn when dually
    participating in another DR program. Only applies to customers
    grandfathered to dual participation with Schedule D-SDP under
    Option A-CPP / B-CPP terms (NOT directly applicable to PRIME-CPP
    customers per Sheet 16, but listed on Sheet 6 as a reference cap
    for the dual-participation grandfather; modeled here for
    completeness and forward use).

## Eligibility encoding

Customer must be enrolled in PRIME (the base RatePlan eligibility
applies — qualifying technology: storage / EV / heat-pump / NBT) AND
must have elected the CPP variant. The CPP election is encoded as a
CustomOperandNode predicate "CPP Election" = "PRIME-CPP". Bundled-
service-only constraint per Sheet 16 SC 4.d (DA / CCA customers
ineligible) is partly redundant with PRIME's existing service-role
constraint and partly captured by the upstream OAT eligibility.

## ApplicabilityRule + resolver evaluation

Each per-window Price carries urpx:hasApplicabilityRule with a
ConditionExpression gating on the customer's "Is CPP Event Today"
CustomOperandNode property. As with the URPXT-cah.9 PCIA-vintage
modifiers, the current urpx.price resolver does NOT enforce
ConditionExpression-based ApplicabilityRules at marginal-rate
computation time — this is a documented future enhancement. The
current resolver picks the FIRST applicable Price as a fallback when
no event-day context is provided (which means the resolved marginal
will include the CPP Event Charge by default — INFLATED). The
modeling is forward-compatible: when the resolver gains
ConditionExpression evaluation, the ApplicabilityRules will start
filtering correctly.

The TIME-of-day discrimination (4-9pm window) IS handled by URPX's
TOUSchedule + TimeBracket primitives, which the resolver evaluates
correctly. The remaining gating is the dynamic event-day vs
non-event-day discriminator.

## Modeling deferrals

  1. **Bill Protection**: First 12 months of CPP enrollment, customer
     is guaranteed not to pay more than they would have under the
     equivalent non-CPP PRIME option. This is a year-long bill
     calculation that doesn't fit a per-bill RatePlan/Modifier shape.
     Not modeled.

  2. **Dynamic event-day gating** not enforced by current resolver
     (see above). Modeling is forward-compatible.

  3. **No-export-credit rule**: CPP Non-Event Credit excludes kWh
     exported by behind-the-meter generation during 4 p.m.-9 p.m.
     Requires distinguishing import vs export kWh on the energy
     metric input. Not modeled.

  4. **Sibling 4-9 PM-CPP and 5-8 PM-CPP variants**: Same modifier
     pattern would apply to TOU-D-4-9 PM and TOU-D-5-8 PM bases.
     Tracked in those bases' tariff.toml deferrals; can be modeled
     in a follow-up issue.
"""

