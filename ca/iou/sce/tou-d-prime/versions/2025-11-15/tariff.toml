[review]
status        = "draft"
notes         = "Fourth SCE schedule, scaffolded from ca/iou/sce/tou-d-4-9pm/versions/2025-11-15/. Same TOU windows as 4-9PM (4pm-9pm) but with structural differences: NO Baseline Credit (PRIME targets higher-usage customers with electric technologies); 2 NEW per-meter-per-day credits added (EV Meter Credit $-0.446 for Separately Metered EV Option, EV Submeter Credit $-0.152); 4-way OR EligibilityRule for qualifying technology (storage / EV / heat-pump / NBT enrollment) borrowed from PG&E E-ELEC's pattern. Sheet 6/7 of source PDF (leaves 90673-E and 90674-E). Generation rates differ markedly from 4-9PM (PRIME Summer On-Peak Gen UG 0.33489 vs 4-9PM 0.27519). Winter Off-Peak and Super-Off-Peak have IDENTICAL rates on PRIME (functionally collapsed). 25 PriceDefinitions (vs 24 for 4-9PM: -1 baseline-credit, +2 EV credits)."
