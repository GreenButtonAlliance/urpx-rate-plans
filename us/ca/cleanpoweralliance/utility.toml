scrape_notes = """
NOT YET MODELED. This manifest records who publishes and where to look. No
filing exists under this utility.

MIDAS party segment XXCP, 8,969 rate identifiers as of 2026-09-23.
Clean Power Alliance of Southern California sells generation over SCE's distribution network, so a customer's bill is a Clean Power Alliance of Southern California generation rate composed with SCE delivery. The SCE half is modeled here under us/ca/sce.

No per-schedule tariff document link is published: every identifier carries a null RatePlan_Url, so there is nothing to fetch from the feed and a scraper will have to find the rate sheets on the organization's own site.

Per identifier the feed carries RateName, AltRateName1 naming the composition,
RateType, Sector and EndUse. Mined metadata is in data/midas/ and every party
is catalogued in reports/midas-catalog.md and reports/california-parties.md.
"""
