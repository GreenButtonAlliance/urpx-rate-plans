notes = "re-sourced from live tariff-book TOU-D PDF. 24 of 24 existing prices refreshed to AL 5725-E values (effective 2026-01-01); see [extraction.notes] for per-component deltas. Adds 2 new PriceDefinitions (Generation→DWREC, Delivery→DWRA) for explicit columns on Sheets 2/3. Sheet 12 (TOU period definitions) is now in the source PDF — TOU windows are now sourced from the regulatory Sheet 12 instead of the customer-facing rate-plans page (modeled values unchanged). Per-version IRIs (Prices, PriceSets, EligibilityRule subtree, BSC PriceDefinition with its blank-node CalculationMethod) date-suffixed per the pattern so the validator can load both 2025-11-15 and 2026-03-20 simultaneously via urpx:supersedes without SHACL maxCount collisions. RatePlanVersion @id sce:tou-d-4-9pm-2026-03-20 supersedes sce:tou-d-4-9pm-2025-11-15. Adds the Schedule TOU-D holiday calendar: the eight holidays named on Sheet 13, with urpx:includeHolidays / urpx:includeNonHolidays on the summer peak window so a holiday falling on a summer weekday resolves to Mid-Peak. Labor Day now prices as a Saturday. Winter is unaffected because Sheet 12's winter weekday and weekend/holiday columns are identical."
