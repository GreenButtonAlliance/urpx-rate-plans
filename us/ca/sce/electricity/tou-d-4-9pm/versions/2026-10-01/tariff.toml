# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Preliminary Statement Part H, paragraph 3: \"The total billable baseline quantity is determined based upon the total number of winter days and total number of summer days during the billing period. Total billable baseline is then proportionately billed to winter and summer periods based upon the percentage of customer-consumption registered during the winter and summer seasons.\" The Tier 1 and Tier 2 brackets carry the Sheet 2 and Sheet 3 quantities as kWh-per-day bounds on a kWh MetricInput, qualified by season, as pge:e-tou-c does. Nothing in the filing states the daily basis, the multiplication by the days of each season in a billing period, or the proration by consumption, so a consumer must scale the bounds to the billing period itself.",
 "Preliminary Statement Part H, paragraph 4: \"The standard Medical Baseline Allocation will be 16.5 kWh per day\", provided \"in addition to the applicable Baseline Allocation set forth in Paragraph 3\". Not modeled: the Tier 1 and Tier 2 bounds here carry the paragraph 3 allocation only, and sce:medical-baseline carries the Schedule MB-E Wildfire Fund exemption and no allocation. An adjusting-bracket modifier of the form this filing's HPWH document uses (urpx-org/urpx#80) is the available route.",
 "Option 4-9 PM-CPP, printed on this filing's own Sheet 2: CPP Event Energy Charge $0.80000/kWh, Summer On-Peak Energy Credit $(0.15170)/kWh outside CPP Events, and Summer Season Maximum Available Credit $(0.41944)/kWh, with the CPP Event Window and the three-hour CPP Event Energy Charge Period defined in Special Condition 1 (Sheet 9) and the program in Special Condition 3 (Sheets 10 to 12). Work, not a blocker: sce/tou-d-prime-cpp ships the same three figures as a urpx:RatePlanModifier, so what is missing is a sibling filing listed in applicable_modifiers, not vocabulary.",
 "San Joaquin Valley Disadvantaged Communities Pilot Bill Protection Discount (Special Condition 12, Sheets 17 and 18, where the continuation is headed 13): 20 percent of the monthly bill in pilot years 1 through 5, then 10 percent or 20 percent in years 6 through 10 depending on SCE's evaluation of participants' energy cost savings. Not modeled: the discount is gated on SJV Pilot participation, and a Price carrying it without that gate would discount every customer on the schedule. The percentage-of-subtotal shape itself is the one sce/care and sce/fera already ship against this filing's urpx:PriceSummary.",
 "Transitional Community Solar Discount (Special Condition 14, Sheet 18): 20 percent monthly bill credit over the same 10-year bill protection period, for SJV Pilot participants who cannot take the Community Solar-Green Tariff or the Disadvantaged Communities-Green Tariff. Same pilot-participation gate as Special Condition 12.",
 "California Climate Credit carry-forward (Sheet 16, Special Condition 10): the $(36.00) per household credit is priced, but the roll-over of any portion not consumed in a billing period to subsequent billing periods is not expressed, so a consumer whose bill is smaller than the credit drops the remainder. Whether URPX can express it is not established: urpx:BillingCycle and settlementInterval exist, and no filing in this corpus uses them.",
 "Schedule TOU-D Sheet 9: \"When any holiday listed above falls on Sunday, the following Monday will be recognized as a holiday. No change will be made for holidays falling on Saturday.\" New Year's Day, Independence Day, Veterans Day and Christmas in sce:tou-d-4-9pm-2026-10-01-holiday-calendar carry no urpx:observanceRule, so each resolves on its actual date and a Saturday one stays on Saturday. The Monday after a Sunday New Year's Day, Independence Day, Veterans Day or Christmas is carried as a dated urpx:Holiday with urpx:holidayDate: 2027-07-05, 2029-11-12, 2032-07-05, 2033-12-26, 2034-01-02, 2035-11-12, 2038-07-05, 2039-12-26, 2040-01-02 and 2040-11-12. After 2040 each such Sunday holiday needs a further dated entry, until urpx:mondayIfSundayObservance (proposed in urpx-org/urpx#77) can state the rule; the dated entries then come out.",
 "Base Services Charge component split (Sheet 3): the $0.794 per meter per day total is carried as one Price, but the sheet also prints its Distribution part of $0.491, itself a BSC Distribution Charge of $0.422 and a BSC Surcharge of $0.069, and a Public Purpose Programs part of $0.303. The $0.069 surcharge is the quantity CARE, FERA and DRAH customers are exempt from; sce/care and sce/fera price that exemption as a separate credit and sce/deed-restricted does not. Expressible now, purely additional PriceDefinitions summing to the same $0.794.",
 "Special Condition 5, Change of Rate Schedule (Sheet 13), governs how long a customer stays on this Option and is not in the model. Verbatim: \"At any time, a Customer on this Schedule may elect to leave his/her Option (e.g., Option 4-9 PM, Option 5-8 PM, Option PRIME) and elect to either: (1) switch to another Option of this Schedule for which they are eligible, or (2) transfer from this Schedule to another applicable residential rate schedule. The elected rate change will become effective on the next regularly scheduled meter read date following the Customer's notice to SCE. Unless the Customer was placed on an Option by SCE (i.e., defaulted), the Customer shall not be allowed to make an additional change in rate until 12 months of service has been provided under the elected rate, unless otherwise specified in that rate schedule.\" urpx:minimumTenure exists on RatePlanVersion and the model does not set it; the re-entry half has no v0.5.1 form.",
 "Special Condition 8, Arrearage Management Plan (Sheet 14), in this filing's own PDF, changes what a customer on this Option owes and is not in the model. Verbatim: \"Once enrolled in the AMP, SCE shall forgive 1/12 of an eligible residential Customer's arrearage after each on-time payment. After 12 on-time payments, SCE shall forgive the remaining arrearage debt up to a maximum of $8,000 per instance of enrollment.\" Eligibility is six months of SCE service, CARE or FERA enrollment, at least one on-time payment, and an arrearage of $500 or greater at least 90 days old.",
]
