notes = """
Source bytes. Retrieved 2026-10-06 from SCE's live tariff book with the fetch
path of dev/fetch_tariff_documents.py. SharePoint's download endpoint answered
with the PDF inside a multipart/form-data envelope; the committed file is that
envelope's one part body, extracted byte for byte, and the sha256 recorded
above is its hash.

Advice 5897-E (Decision 26-04-033) reissued all 19 sheets of Schedule TOU-D
effective October 1, 2026, Cal. P.U.C. Sheets 91689-E (Sheet 1) through
91707-E (Sheet 19). The schedule now holds six rate options, Option 4-9 PM,
4-9 PM-CPP, 5-8 PM, 5-8 PM-CPP, PRIME and PRIME-CPP. Rates are on Sheets 2 to
7. Special Condition 1 (TOU periods, the CPP Event Window, holidays and
seasons) is on Sheets 8 and 9; Special Condition 3 (Critical Peak Pricing) on
Sheets 10 to 12; Special Condition 4 (PRIME Separately-Metered EV Option) on
Sheet 12; Special Conditions 5 to 7 (Change of Rate Schedule, CARE, FERA) on
Sheet 13; Special Condition 8 (Arrearage Management Plan) on Sheet 14; Special
Condition 9 (Billing Calculation, with the DRAH terms) on Sheets 15 and 16;
Special Condition 10 (California Climate Credit) on Sheet 16; the SJV Pilot
Bill Protection Discount (Special Condition 12) on Sheets 17 and 18, where its
continuation is headed 13; the Transitional Community Solar Discount (Special
Condition 14) on Sheet 18; and EV Submetering on Sheet 19. The TOU periods,
holidays and seasons are unchanged from the 2026-03-20 version.

Supersession. This version follows the 2026-06-01 version. Advice 5897-E's
sheets cancel the June 2026 sheets that version models: Advice 5829-E's rate
Sheets 2 to 6 (91196-E to 91200-E, effective June 1, 2026) and Advice 5837-E's
reissue of Sheets 1 and 7 to 19 (91354-E to 91367-E, effective June 25, 2026).

Price changes from the 2026-03-20 version, $ (per kWh unless a per-day
charge):
 tou-d-4-9pm-price-gen-summer-on-peak: 0.25448 -> 0.25729
 tou-d-4-9pm-price-gen-summer-mid-peak: 0.13441 -> 0.11506
 tou-d-4-9pm-price-gen-summer-off-peak: 0.07360 -> 0.07035
 tou-d-4-9pm-price-gen-winter-mid-peak: 0.18077 -> 0.18918
 tou-d-4-9pm-price-gen-winter-off-peak: 0.10212 -> 0.09440
 tou-d-4-9pm-price-gen-winter-super-off-peak: 0.08364 -> 0.06702
 tou-d-4-9pm-price-dist-summer-on-peak: 0.28446 -> 0.28985
 tou-d-4-9pm-price-dist-summer-mid-peak: 0.28446 -> 0.28845
 tou-d-4-9pm-price-dist-summer-off-peak: 0.22702 -> 0.21625
 tou-d-4-9pm-price-dist-winter-mid-peak: 0.28446 -> 0.27307
 tou-d-4-9pm-price-dist-winter-off-peak: 0.22702 -> 0.22459
 tou-d-4-9pm-price-dist-winter-super-off-peak: 0.20636 -> 0.20943
 tou-d-4-9pm-price-transmission: 0.02586 -> 0.02481
 tou-d-4-9pm-price-nsgc: 0.00829 -> 0.00866
 tou-d-4-9pm-price-pppc: 0.00527 -> 0.00556
 tou-d-4-9pm-price-baseline-credit: -0.10108 -> -0.09101
 tou-d-4-9pm-price-fixed-recovery-charge: 0.00619 -> 0.01118

Baseline ladder. The rate sheet footnote (Sheets 2 and 3):
"The Baseline Credit applies up to 100% of the Baseline Allocation,
regardless of Time-of-Use time period. Additional Baseline Allocations apply
for Customers with Heat Pump Water Heaters served under this Option. The
Baseline Allocation is set forth in Preliminary Statement, Part H." Part H
paragraph 3, Sheet 2 (Cal. P.U.C. Sheet 91543-E, summer) and Sheet 3
(91544-E, winter), both effective October 1, 2026 under Advice 5897-E, gives
them in kWh per day by Baseline Region (5, 6, 8, 9, 10, 13, 14, 15, 16) and
Basic or All-Electric Allocation: 36 cells. Each is a Tier 1 bracket from 0 to
the allocation and a Tier 2 bracket above it in sce:tou-d-4-9pm-2026-10-01-tiers-baseline,
qualified by the version's season and by a ProfileAlternative on the custom
dimensions baselineRegion and baselineCode. Part H is vendored here as
sce_prelim-h_2026-10-01.pdf, dated by its latest sheets (2 and 3, effective
October 1, 2026). The Baseline Credit has its own ledger over the kWh
MetricInput sce:tou-d-4-9pm-2026-10-01-mi-energy-baseline, priced $(0.09101) on Tier 1 and 0
on Tier 2; both Prices are in sce:tou-d-4-9pm-2026-10-01-summary-discountable.

Heat Pump Water Heater allocation.
rate-plan-modifier_sce_tou-d-4-9pm-hpwh_2026-10-01.jsonld, a second document in this
directory, carries Part H's HPWH Allocation (1.9 kWh per day in summer for
both allocations; 2.6 Basic and 3.0 All-Electric in winter) as adjusting
ServiceBrackets on this version's Tier 1 upper and Tier 2 lower bounds. They
use urpx:adjustsServiceTier, urpx:lowerBoundOffset and urpx:upperBoundOffset,
proposed in urpx-org/urpx#80 and in no URPX release, so the document does not
validate against the v0.5.1 shapes; dev/validate-with-base.py excepts exactly
the results #80 would remove, under BOUND_OFFSET_EXCEPTION. clj-urpx 0.44.0
resolves the offsets. The modifier is in effect exactly when this version is.
"""

