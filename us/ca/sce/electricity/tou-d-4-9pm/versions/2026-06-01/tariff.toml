extracted_on = "2026-10-06"
notes = """
Source bytes. This is data/documents/sce/ELECTRIC_SCHEDULES_TOU-D.pdf as
retrieved 2026-09-23 by dev/fetch_tariff_documents.py. The unwrapper then in
use cut the multipart part at its last %%EOF and dropped the end-of-line that
closes it, and SCE reissued the document effective 2026-10-01, so the part as
served cannot be fetched again; the committed file and the sha256 above are
those bytes, one end-of-line short of the response.

The 2026-09-23 copy of Schedule TOU-D holds Advice 5829-E's rate sheets,
Sheets 2 to 6 (91196-E to 91200-E), effective June 1, 2026, and Advice
5837-E's reissue of every other sheet (91354-E, 91355-E to 91367-E), effective
June 25, 2026. Advice 5829-E's own copies of the sheets the June 25 reissue
cancelled (Sheet 7, 91201-E; Sheet 18, 91202-E, the CARE and FERA Special
Conditions; Sheet 20, 91203-E, the DRAH terms) print the same values as their
June 25 successors, so the values modeled here held from June 1 to September
30, 2026. Advice 5837-E renumbered the Special Conditions: TOU periods,
holidays and seasons in Special Condition 1 (Sheets 8 and 9); Critical Peak
Pricing in Special Condition 3 (Sheets 10 and 11); PRIME eligibility in
Special Conditions 4 and 5 (Sheet 12); Change of Rate Schedule, CARE and FERA
in Special Conditions 6 to 8 (Sheet 13); the Arrearage Management Plan in
Special Condition 9 (Sheet 14); Billing Calculation, with the DRAH terms, in
Special Condition 10 (Sheets 15 and 16); the California Climate Credit in
Special Condition 11 (Sheet 16); the SJV Pilot and Transitional Community
Solar discounts in Special Conditions 13 and 14 (Sheets 17 and 18); EV
Submetering in Special Condition 17 (Sheet 19). The TOU periods, holidays and
seasons are those of the 2026-03-20 version.

Supersession. This version begins at the effective date of the sheet that
cancels the 2026-03-20 version's rate sheet and ends at 2026-10-01, when
Advice 5897-E's sheets cancel its own.

Advice letters. ELECTRIC_5829-E.pdf (sha256
a5dc33e4ccd6b1dcf2d82bf6b33867ce1cf2d97f19d897ba93c8d9796cc93733) and
ELECTRIC_5837-E.pdf (sha256
44858dad74d4b648cbc31bf4a42590fd0e9063e7f734b94855375f779390ad6b), retrieved
2026-10-06 from SCE's Approved Electric advice letter folder
(https://edisonintl.sharepoint.com/teams/Public/TM2/Shared%20Documents/Public/Regulatory/Filings-Advice%20Letters/Approved/Electric/),
state their sheets' effective dates (June 1, 2026 and June 25, 2026). They are
cited, not vendored.

Price changes from the 2026-03-20 version, $ (per kWh unless a per-day
charge):
 tou-d-4-9pm-price-gen-summer-on-peak: 0.25448 -> 0.25321
 tou-d-4-9pm-price-gen-summer-mid-peak: 0.13441 -> 0.13326
 tou-d-4-9pm-price-gen-summer-off-peak: 0.07360 -> 0.07396
 tou-d-4-9pm-price-gen-winter-mid-peak: 0.18077 -> 0.17956
