## Customer-subgroup exemption table (CCA-CRS Sheet 3)

CCA-CRS distinguishes 8 customer subgroups with different
per-component applicability:

 # Subgroup WFC PCIA CTC FRC
 1 Community Choice Aggregator Applicable App. App. App.
 2 Community Aggregator Applicable App. App. App.
 3 CCA Customers on Medical Baseline Exempt App. App. App.
 4 CCA Customers on CARE Exempt App. App. Exempt
 5 CCA Customers on FERA Applicable App. App. Exempt
 6 Continuous DA/CCA Customers Exempt Exempt App. App.
 7 Returning Continuous DA Customers Exempt App. App. App.
 8 Transitional Bundled Service Applicable App. App. App.

Only the default subgroup (#1 + #2) is captured by the EligibilityRule
here — same Eligibility predicate gates both as 'CCA Service'. The
exemption variants for subgroups 3-8 require either separate
RatePlanModifier filings or a richer EligibilityRule extension that
references the customer's other-program enrollments. Deferred per the
modeling note below.

## Modeling deferrals

Same 4 deferrals as the DA-CRS sibling (see
us/ca/sce/electricity/da-crs/.../tariff.toml):

 1. OAT-side DWRBC subtraction not modeled.
 2. Zero-out of OAT Generation rate for CCA customers not modeled
 (CCA customer buys energy from CCA, not SCE).
 3. Customer-subgroup variants beyond default CCA (subgroups 3-8 in
 the table above) need separate EligibilityRules / per-subgroup
 modifier filings.
 4. PCIA + CARE / FERA / Medical-Baseline stacking exemptions
 deferred to a follow-up issue.
