extracted_on = "2026-05-04"
notes = """
First filing of Schedule CCA-CRS in this corpus. Sourced
from the live tariff-book Other Rates SharePoint folder. Sibling to
Schedule DA-CRS (modeled at us/ca/sce/electricity/da-crs/) — same 4 components
(WFC + CTC + FRC + PCIA), identical Domestic-class numerical values
per PCIA vintage. The two schedules differ only in Eligibility
predicate (CCA Service vs Direct Access) and customer-subgroup
exemption table (CCA-CRS has finer-grained subgroup rules — see
Modeling deferrals below).

Per the SCE convention documented in us/ca/sce/electricity/utility.toml, this
filing is dated to the most recent per-sheet effective date in the
document — newest stamp 90840-E (Sheet 9 PCIA 2026 Vintage), AL
5725-E, effective 2026-01-01. (See sibling DA-CRS tariff.toml for the
note on why this isn't 2026-03-20 like the TOU-D-sourced filings.)

Per-sheet effective dates within the source PDF:
 Sheets 1-3 (Applicability + Composition + Customer Group Exemption
 table) — 2023-07-27 (AL 4882-E baseline)
 Sheet 3 (Domestic-class WFC + CTC + FRC values) — 2025-06-30
 Sheets 4-9 (PCIA per-vintage rate tables) — 2026-01-01
 (AL 5725-E, leaves through 90840-E)

## Modifier shape

Mirror of Schedule DA-CRS (see us/ca/sce/electricity/da-crs/.../tariff.toml for
the detailed shape description). 4 PriceDefinitions on 4 Ledgers +
23 Prices (3 fixed + 20 vintage-discriminated PCIA, gated by
hasApplicabilityRule on `CCA Vintage Year` CustomOperandNode).
applicableToRatePlan: [sce:d, sce:tou-d-4-9pm, sce:tou-d-5-8pm,
sce:tou-d-prime].

## Customer-subgroup exemption table (CCA-CRS Sheet 3)

CCA-CRS distinguishes 8 customer subgroups with different
per-component applicability:

 # Subgroup WFC PCIA CTC FRC
 1 Community Choice Aggregator Applicable App. App. App.
 2 Community Aggregator Applicable App. App. App.
 3 CCA Customers on Medical Baseline Exempt App. App. App.
 4 CCA Customers on CARE Exempt App. App. Exempt
 5 CCA Customers on FERA Applicable App. App. Exempt
 6 Continuous DA/CCA Customers Exempt Exempt App. App.
 7 Returning Continuous DA Customers Exempt App. App. App.
 8 Transitional Bundled Service Applicable App. App. App.

Only the default subgroup (#1 + #2) is captured by the EligibilityRule
here — same Eligibility predicate gates both as 'CCA Service'. The
exemption variants for subgroups 3-8 require either separate
RatePlanModifier filings or a richer EligibilityRule extension that
references the customer's other-program enrollments. Deferred per the
modeling note below.

## Modeling deferrals

Same 4 deferrals as the DA-CRS sibling (see
us/ca/sce/electricity/da-crs/.../tariff.toml):

 1. OAT-side DWRBC subtraction not modeled.
 2. Zero-out of OAT Generation rate for CCA customers not modeled
 (CCA customer buys energy from CCA, not SCE).
 3. Customer-subgroup variants beyond default CCA (subgroups 3-8 in
 the table above) need separate EligibilityRules / per-subgroup
 modifier filings.
 4. PCIA + CARE / FERA / Medical-Baseline stacking exemptions
 deferred to a follow-up issue.
"""

