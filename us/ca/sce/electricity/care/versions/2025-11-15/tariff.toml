# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "CARE Surcharge exemption of $0.212 per meter per day, Sheet 18 Special Condition 8 (Cal. P.U.C. Sheet No. 90675-E, PDF page 46): \"eligible CARE Customers are exempt from paying the CARE Surcharge of $0.212 per meter per day, the Wildfire Fund Non-Bypassable Charge of $0.00595 per kWh, and the Fixed Recovery Charge of $0.00198 per kWh.\" The $0.212 is stated verbatim in the source and carried by no Price here; no Price in the corpus carries -0.212. Expressible now and unbuilt, not blocked: a flat -0.212 credit on the BSC ledger with intervalDuration P1D, the same shape as the $0.063 BSC Surcharge exemption already in this filing, validates composed with the base plans. The earlier rationale, that the base plans must first itemize the surcharge, does not hold: sdge:care already carries its own CARE Surcharge exemption against a base that does not itemize it either. What the committed PDF does not publish is the decomposition of the $0.371 per meter per day PPPC component of the Base Services Charge, inside which footnote 5 places the CARE Surcharge, so the credit rests on the $0.212 figure SC 8 states rather than on a base line item.",
 "The 32.5 percent discount over-credits the two charges Special Condition 8 exempts. Its urpx:basedOnPrice names the eight sce:<plan>-<date>-summary-discountable summaries, and every one of them includes the plan's Wildfire Fund Non-Bypassable Charge ($0.00595/kWh) and Fixed Recovery Charge ($0.00198/kWh), which this filing also credits to zero. A composed bill therefore discounts charges the customer does not pay, over-crediting by 0.325 x 0.00793 = $0.00258/kWh. The fix is expressible now and precedented: give each SCE base plan a CARE-discountable summary that omits the charges CARE exempts and repoint this multiplier at those, leaving the existing summary for sce:fera, whose SC 9 grants no per-kWh exemption. SDG&E base plans already carry the pair (summary-care-discountable with 15 members, summary-fera-discountable with 17). The repair touches sce:d, sce:tou-d-4-9pm, sce:tou-d-5-8pm and sce:tou-d-prime at both dates as well as this filing.",
 "Whether the Base Services Charge belongs inside the 32.5 percent discount base is unsettled and the model assumes it does not. Special Condition 8 defines the base as the electric bill prior to the PUCRF and any applicable user fees, taxes and late payment charges, and does not exclude the Base Services Charge; the eight summaries this filing discounts exclude it, delivering BSC relief instead through the $0.063 exemption and the $(0.153) discount. Schedule D-CARE, the governing CARE schedule, is committed to this corpus at us/ca/sce/electricity/care/versions/2026-03-20/sce_care_2026-03-20.pdf, four of whose six sheets carry this filing's own Advice 5654-E, Decision 24-05-028 and Nov 15, 2025 effective date. Reading it does not settle the question: its RATES section states the base identically to SC 8 with no Base Services Charge carve-out, and its SC 11.a defines a bundled customer's bill as \"the sum of the charges for Delivery Service and Generation service determined as described in this Special Condition, and subject to applicable discounts or adjustments provided under SCE's tariff schedules\", which if it leans at all leans against the model's exclusion. So this is an unsettled reading of a committed source, not a missing source. If the BSC is inside the base, it needs its own percentage Price over a per-day summary, because a PriceSummary sums its members without unit awareness and would otherwise add $/meter/day to $/kWh.",
 "Scope-contingent, and unsettled: Schedule D-CARE Sheet 6, Effective Nov 15, 2025, Advice 5654-E, prices two further CARE benefits that no filing in this corpus models. Special Condition 14, SJV Pilot Bill Protection Discount: \"Years 1-5 of SJV Pilot participation: 20 percent discount / Years 6-10 of SJV Pilot participation: 10 percent or 20 percent discount\". Special Condition 15, Transitional Community Solar Discount: eligible SJV Pilot participants \"shall be provided a 20 percent Transitional Community Solar monthly bill credit for the 10-year bill protection period\". Whether they fall inside this filing's boundary is the unsettled part: this version's own source PDF is the TOU-D book (47 pages, Sheet 18), which contains neither provision, while the filing's identity, docket (\"CARE program terms inherited from Schedule D-CARE\") and extraction notes all point at Schedule D-CARE, whose Nov 15 2025 sheets do. Kept rather than dropped because the sibling sce:d@2026-03-20 records both as deferrals and dates their sheets to 2025-11-15 (AL 5654-E), so the corpus already treats them as coverage items at this vintage. If the ruling is that a filing's boundary is its own committed PDF, drop this entry here and carry it on the 2026-03-20 sibling alone. Building them needs care: both provisions are conditioned on SJV Pilot participation and on the participation year, and a Price that carries no applicability condition applies to every CARE customer.",
 "Special Condition 8 (Sheet 18, Cal. P.U.C. Sheet 90675-E) states four conditions of service that the model carries only as description prose. Verbatim: \"An application and eligibility declaration is required for service under this Special Condition. Eligible Customers shall have the CARE Discount applied to this Schedule commencing no later than one billing period after receipt and approval of the Customer's application by SCE. Customers may be rebilled for periods in which they do not meet the eligibility requirements for the CARE Discount. Customers receiving service under the Family Electric Rate Assistance (FERA) Discount Special Condition of this Schedule are not eligible to take service under this Special Condition.\" The EligibilityRule sce:er-care-eligible tests residential customer kind and CARE program enrollment, and carries no FERA-exclusion predicate, although a notEqualsOperator exclusion is demonstrably expressible in this corpus (cpau:e-nse-1-2025-09-01-cn-nem-successor). The commencement and rebilling clauses have no URPX form at v0.5.1.",
 "Special Condition 8 defines who the discount reaches by reference to a schedule this filing does not commit: \"Customers who meet the definition of a CARE Household, as defined in Schedule D-CARE, may qualify for a 32.5 percent discount\". The model asserts an income test in the EligibilityRule description that the source sheet does not state here. The definition itself is a source gap.",
]

