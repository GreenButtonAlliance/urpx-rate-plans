[review]
status        = "draft"
notes         = "First SCE RatePlanModifier filing. Pattern reference: us/ca/cpau/electricity/e-eec-1/versions/2025-09-01/ for the standalone-modifier filing structure (URPXDocument wrapper + RatePlanModifier + RatePlanModifierVersion + EligibilityRule + PlanElements + PriceDefinitions + Prices). 4 PriceDefinitions: WFC exemption, FRC exemption, BSC Surcharge exemption, BSC Discount. 4 Prices. Bill-subtotal 32.5% discount deferred (URPX vocabulary gap). CARE Surcharge $0.212/meter/day exemption deferred (base TOU-D modeling doesn't track the surcharge). Highest-customer-impact modifier filing in the corpus — overlays SCE residential base rate plans for ~30% of SCE residential customers (~1.5M)."
