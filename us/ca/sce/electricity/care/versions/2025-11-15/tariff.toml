# Extraction ------------------------------------------------------------------
[extraction]
tool          = "manual"
extracted_on  = "2026-04-30"
notes         = """
First RatePlanModifier filing in the SCE corpus. Source-of-record for
the per-line-item credit values is the SCE TOU-D consolidated PDF
(same bytes committed alongside the base TOU-D-4-9PM/-5-8PM/-PRIME
filings); Sheet 18 contains Special Conditions 8 (CARE) which
articulates the exemption + discount values.

The CARE program itself is defined in SCE Schedule D-CARE — a
separate schedule that is the canonical CPUC-mandated source of CARE
eligibility and discount terms. The TOU-D-2025 PDF used as source
here restates the same numerical values via Special Condition 8.
A future filing may pin Schedule D-CARE directly as the source-of-
record once that PDF is fetched and committed to the corpus.

## What this modifier captures

Line-item credits applied as overlays to any SCE residential base
rate plan when the customer is enrolled in CARE:

  WFC Exemption:           -$0.00595/kWh        (cancels base WFC)
  FRC Exemption:           -$0.00198/kWh        (cancels base FRC)
  BSC Surcharge Exemption: -$0.063/meter/day    (cancels BSC Surcharge)
  BSC Discount:            -$0.153/meter/day    (additional reduction)
  ─────────────────────────────────────────────────────────────────
  Net per-kWh:             -$0.00793/kWh
  Net per-meter-per-day:   -$0.216/meter/day

## What this modifier does NOT capture (deferred)

  1. 32.5% bill-subtotal percentage discount — URPX has no
     percentage-of-bill primitive (urpx:Price.unitPrice is
     xsd:decimal in $-per-unit). The 32.5% discount applies to the
     pre-PUCRF / pre-tax subtotal across all base PriceDefinitions,
     not to any single PriceDefinition. Tracked as upstream URPX
     vocabulary gap.

  2. CARE Surcharge $0.212/meter/day exemption — Special Condition 8
     references this surcharge that non-CARE customers pay to fund
     the CARE program. The surcharge is NOT itemized in the SCE
     TOU-D base rate-sheet line items as currently modeled in this
     corpus, so the exemption credit has no base item to cancel.
     Modeling deferred until base rate plans separately track the
     CARE Surcharge as a non-CARE-only line item.

For a CARE customer on TOU-D-4-9PM with average residential usage,
the modeled line-item credits capture roughly half the actual CARE
benefit; the other half is the 32.5% percentage discount.

## Cross-utility consistency

CARE is a CPUC-mandated program implemented by all three CA IOUs
(PG&E, SCE, SDG&E). PG&E and SDG&E equivalents not yet modeled in
this corpus — when filed, they should follow this same modifier shape
with utility-specific exemption + discount values.
"""

