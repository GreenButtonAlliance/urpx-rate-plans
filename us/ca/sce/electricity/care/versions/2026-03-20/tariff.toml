/ELECTRIC_SCHEDULES_D-CARE.pdf and committed alongside this filing.

Re-sourced from the live tariff-book SharePoint folder (URPXT-cah.6).
The D-CARE PDF restates the same numerical CARE values that appear on
TOU-D Sheet 18 (and on Schedule D Sheet 7) — Sheet 1 of D-CARE is the
canonical source.

Per the SCE convention documented in us/ca/sce/electricity/utility.toml, this
filing is dated to the most recent per-sheet effective date in the
document (2026-03-20).

Per-sheet effective dates within the source PDF (D-CARE has 6 sheets):
  Sheet 1 (Applicability + CARE rate components: discount, surcharge
    exemption, WFC exemption, FRC exemption, BSC adjustments) —
    2026-01-01 (AL 5725-E, 90844-E)  *** rates we model here ***
  Sheet 2 (Special Conditions 1-3: seasons, CARE Household income
    eligibility, Group Living Facility) — 2025-11-15 (AL 5654-E)
  Sheet 3 (Special Conditions 4-6: enrollment, post-enrollment
    verification) — 2025-11-15 (AL 5654-E)
  Sheet 4 (Special Conditions 7-9) — 2025-11-15 (AL 5654-E)
  Sheet 5 (Special Conditions 10-12: CCA/DA service paths,
    Climate Credit, etc.) — 2026-03-20 (AL 5771-E, 91034-E)
    *** newest sheet — drives the filing date ***
  Sheet 6 (Special Conditions 13-onward) — 2025-11-15 (AL 5654-E)

Substantive deltas vs the prior 2025-11-15 filing:

(a) RATE REFRESH — AL 5725-E updated all CARE line-item credit values
    effective 2026-01-01:

      WFC exemption           -0.00595 → -0.00591  (+0.00004 less credit)
      FRC exemption           -0.00198 → -0.00619  (-0.00421 deeper credit)
      BSC Surcharge exemption -0.063   → -0.064    (-0.001 deeper credit)
      BSC Discount            -0.153   → -0.155    (-0.002 deeper credit)

    Summary:
      Net per-kWh credit:  -0.00793 → -0.01210  (-0.00417 deeper credit)
      Net per-meter-day:   -0.216   → -0.219    (-0.003 deeper credit)

    The FRC exemption deepening tracks the FRC base rate going up
    (0.00198 → 0.00619 in URPXT-cah.{2,3,4,5}); CARE customers
    remain fully exempt regardless of the underlying FRC level.

(b) CARE Surcharge value (referenced but not modeled): $0.212/meter/day
    → $0.208/meter/day. Still NOT modeled here per the existing
    deferral (the surcharge isn't itemized in the base SCE residential
    rate plans currently in this corpus, so the exemption credit has
    no base item to cancel).

(c) SOURCE-OF-RECORD SWITCH — provenance now points at canonical
    Schedule D-CARE rather than the cross-cutting TOU-D Sheet 18.
    Same numerical values, cleaner attribution.

Modeling deferrals (unchanged from 2025-11-15):
  - 32.5% bill-subtotal percentage discount — URPX has no
    percentage-of-bill primitive (urpx:Price.unitPrice is xsd:decimal
    in $-per-unit). Tracked as an upstream URPX vocabulary gap.
  - CARE Surcharge $0.208/meter/day exemption — not itemized in
    base SCE residential rate plans currently modeled, so the
    exemption credit has no base item to cancel. Modeling deferred
