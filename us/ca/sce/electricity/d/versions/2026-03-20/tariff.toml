notes = """
re-sourced from live tariff-book Schedule D PDF.

Modeling deltas vs the prior 2025-11-15 filing:
 - Adds 2 new PriceDefinitions (Generation→DWREC, Delivery→DWRA, both
 currently 0 but tracked on Sheet 3 of the live PDF).
 - Refreshes 14 of 14 existing prices to AL 5725-E values
 (effective 2026-01-01); see [extraction.notes] for per-component
 deltas. Marginal at 2026-07-15T17:00 PDT drops 0.26828 → 0.26226
 ($/kWh, baseline tier) under the consumer-path validator.
 - RatePlanVersion @id sce:d-2026-03-20 supersedes sce:d-2025-11-15.

IRI strategy for cross-version coexistence:

 Per-version content needed date-suffixed @ids so the validator can
 load both versions into a single graph (via urpx:supersedes) without
 triggering SHACL maxCount violations from value collisions:

 Suffixed (per-version content):
 sce:price-* → sce:price-*-2026-03-20 (unitPrice values differ)
 sce:ps-energy-charges → -2026-03-20 (startDate + member set differ)
 sce:er-residential-d → sce:d-2026-03-20-er-residential
 sce:cx-residential-d → sce:d-2026-03-20-cx-residential
 sce:cn-residential-d → sce:d-2026-03-20-cn-residential
 (ConditionExpression / ComparisonNode contain anonymous-blank-node
 operands; without per-version IRIs the blank nodes from each
 version produce 2 distinct values for leftOperand/rightOperand)
 sce:pd-base-services-charge → sce:pd-base-services-charge-2026-03-20
 (its hasCalculationMethod is a blank node; same blank-node
 duplication issue as the ConditionExpression operands)

 Unsuffixed (structural; identical triples across versions):
 sce:d, sce:season-*, sce:mi-*, sce:ms-*, sce:tier-*, sce:tiers-*,
 sce:ledger-*, sce:pd-* (except BSC, see above)

 This mirrors the PG&E E-ELEC 2026-01-01 → 2026-03-27 pattern. Future
 reprocessings of other SCE schedules should follow the same approach.

Source URL switched from library.sce.com CDN form (no longer canonical
for current filings) to the rendered SharePoint path form on the live
tariff-book folder.
"""
