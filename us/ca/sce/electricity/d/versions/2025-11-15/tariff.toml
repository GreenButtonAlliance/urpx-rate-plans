# Extraction ------------------------------------------------------------------
[extraction]
tool = "manual"
extracted_on = "2026-04-30"
notes = """
Source PDF is SCE's consolidated Schedule D tariff book — 15 pages bundling
per-sheet revisions across 2025. Per the SCE convention documented in
us/ca/sce/electricity/utility.toml, this filing is dated to the most recent per-sheet
effective date (2025-11-15).

Per-sheet effective dates within the source PDF (most recent revision per
sheet):
 Sheet 2 (headline rates) — 2025-11-15 (AL 5654-E, leaf 90634-E)
 Sheet 3 (Delivery Service breakdown) — 2025-11-15 (AL 5654-E, leaf 90635-E)
 Sheet 7 (Special Conditions 4-6: Billing Calculation w/ CARE+FERA,
 Climate Credit, Change of Rate Schedule) — 2025-11-15 (AL 5654-E,
 leaf 90639-E)

Sheets 4-6 (Special Conditions 1-3) are not in this consolidated PDF —
same gap pattern as TOU-D. Special Conditions content needed
for billing calculation specifics, baseline allocation tables, and
DA/CCA delivery clauses.

The fetch path is documented in us/ca/sce/electricity/utility.toml — canonical
PDFs live in the SCE library.sce.com CDN at the URL listed in [source.url],
discovered by browsing the historical-rates portal page through to the
'Residential Rates' SharePoint folder. fetch-sce-tariffs.py (in the
the scripts/ directory) automates the SharePoint enumeration + download.

Modeling deferrals (shared with TOU-D filings, tracked separately):
 - CARE/FERA discount RatePlanModifiers (Special Condition 4 on Sheet 7
 — 32.5% / 18% discounts plus BSC surcharge exemption + BSC
 discount adjustments + CARE Surcharge / WFC / FRC exemptions).
 Modeled at us/ca/sce/electricity/care/ and us/ca/sce/electricity/fera/.
 - Deed-Restricted BSC discount ($-0.334/meter/day) — described in
 plan prose, not yet modeled as an EligibilityRule or modifier.
 Tracked at grid-coordination/urpx-rate-plans#14.
 - Vintage PCIA / DA-CRS / CCA-CRS RatePlanModifiers — delivery-service
 Total varies for Direct Access / CCA customers (subject to DWRBC
 adjustments via Schedule DA-CRS / CCA-CRS). Not yet captured.
"""

# Validation ------------------------------------------------------------------
[validation]
shacl_passed = true
validator = "pyshacl + clj-urpx (URPX v0.5.1)"
validated_on = "2026-09-20"

# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Baseline / Nonbaseline tier boundary is not carried. Sheet 3 (Cal. P.U.C. 90635-E) makes the Conservation Incentive Adjustment the only component that differs between the tiers, $(0.03845) per kWh on Baseline Service against $0.06604 on Nonbaseline, so the boundary decides which of the two Energy Charges a kWh receives. Sheet 2 (90634-E) footnote * puts the boundary outside this document: Nonbaseline Service is all kWh in excess of applicable Baseline allocations as described in Preliminary Statement, Part H, Baseline Service. Part H is in no PDF in this corpus, so this is a source gap for the absolute bounds, and the allocation varies by Baseline Region, by season, and by Basic against All-Electric service. What the model states instead is wrong rather than merely incomplete: sce:d-2025-11-15-tiers-baseline-nonbaseline points referencesMetricInput at sce:d-2025-11-15-mi-energy, whose MetricSpecification carries unitOfMeasure urpx:kWh, while the brackets carry lowerBound 0 with upperBound 1.0, and lowerBound 1.0. Read as written that says Tier 1 ends at one kilowatt-hour, and clj-urpx 0.32.0 surfaces those bounds to a consumer with no unit attached. Two routes are open under v0.5.1 and neither is built: precompute absolute kWh bounds per region, season and service type, the way us/ca/pge/electricity/e-tou-c does at 13.5 and 11.0 kWh per day, which needs Part H; or point referencesMetricInput at a MetricInput whose MetricSpecification carries unitOfMeasure urpx:ratio, which pyshacl accepts against the v0.5.1 shapes and which makes the 0 to 1.0 bounds honest without needing Part H.",
 "Base Services Charge is carried only as its $0.794 per meter per day total. Sheet 3 (90635-E) prices it by component: Distrbtn $0.423, NSGC $0.000, NDC $0.000, PPPC $0.371, and footnote ** splits the $0.423 into a BSC Distribution Charge of $0.360 per meter per day and a BSC Surcharge of $0.063 per meter per day. The model decomposes the Energy Charge into all eight Sheet 3 components but leaves the BSC as one number. The decomposition is load-bearing rather than cosmetic: Special Condition 4 on Sheet 7 (90639-E) exempts CARE and FERA customers from the Base Services Charge Surcharge of $0.063 per meter per day, and us/ca/sce/electricity/care and .../fera each carry a standalone $-0.063 credit with no base component for it to cancel. Expressible now with the same PriceDefinition and Price pattern the Energy Charge already uses; this is work, not a blocker.",
 "CARE Surcharge of $0.212 per meter per day is itemized nowhere. Special Condition 4 on Sheet 7 (90639-E) states that eligible CARE Customers are exempt from paying the CARE Surcharge of $0.212 per meter per day. No rate row on Sheet 2 or Sheet 3 names it. Sheet 3 footnote 5 says the PPPC includes the California Alternate Rates for Energy Surcharge where applicable, and the only per meter per day PPPC on the operative sheets is the BSC PPPC component of $0.371, but whether the $0.212 sits inside that $0.371 is not settled by this PDF and would need Schedule D-CARE or SCE's PPPC detail, neither of which is in this corpus. us/ca/sce/electricity/care records this exemption as the reason its own claim is partial and states that the gap closes when the base SCE filings itemize the surcharge, which makes it this filing's work. Note that the four superseded Sheet 7 revisions in this same PDF carry the surcharge as $0.01435, $0.01292, $0.01462 and $0.01443 per kWh, so the 2025-11-15 restructuring moved it from an energy charge to the Base Services Charge.",
 "California Climate Credit roll-over is not modeled. Special Condition 5 on Sheet 7 (90639-E): any California Climate Credit not consumed in the billing period in which the credit is applied will roll over to each subsequent billing period until the credit is fully consumed. Whether v0.5.1 can express a balance carried between billing periods is not established either way, and should not be recorded as a closed vocabulary gap until somebody settles it: urpx:BillingCycle and urpx:settlementInterval exist, no filing in this corpus uses either, clj-urpx 0.32.0 reads neither, and a SPARQL scan of the ontology at abdfb521 for carry-forward, rollover, carryover, unconsumed and banked returns nothing bearing on a credit balance while BillingCycleShape is sh:closed over eleven properties, none of them a balance. The $(56.00) amount and its April and October ApplicabilityRule are both carried correctly; only the carry-forward is missing. The same Special Condition also fixes the credit's position in the bill, after city and county utility users' taxes and before franchise fees, which is likewise unmodeled; whether URPX expresses bill-item ordering was not established here.",
 "Generation is applicable only to Bundled Service Customers per Sheet 2 (90634-E) footnote 2, and sce:d-2025-11-15-pd-generation carries no applicability gate. Expressible under v0.5.1 through hasApplicabilityRule and a ConditionExpression, and deliberately not built: clj-urpx 0.32.0 evaluates no ConditionExpression at resolution, so a gated Generation Price would fire for every customer including Direct Access and CCA, turning a known omission into a confident wrong number. Revisit when the pinned consumer evaluates conditions. Related and belonging to the CRS filings rather than this one: Sheet 3 footnote 9 says DA and CCA customers are not subject to this Schedule's WFC of $0.00595 per kWh but pay it under Schedule DA-CRS or CCA-CRS, and neither us/ca/sce/electricity/cca-crs nor .../da-crs cancels this plan's WFC, so composing base plus CRS double-counts it. Note also that Sheet 2 footnote 1 names the DWRBC where Sheet 3 footnote 9 names the WFC; the two footnotes on the same filing disagree. Since clj-urpx 0.26.0 the omission is no longer silent: such a tier comes back marked :urpx.resolved/condition-gated, and marginal-unit-rate refuses with :condition-gated-tier rather than summing when a gated tier reaches the marginal, unless the caller passes :assume-conditions-hold? true.",
 "The filed source is three sheets of the schedule, so any completeness claim here is bounded to those three. The PDF at [source].sha256 78fc8c0060f8be7add8a73170a0a21bec1c66078068738c1df96c9e76bdd2c94 is fifteen pages carrying five revisions each of Sheets 2, 3 and 7; the operative ones at this date are 90634-E, 90635-E and 90639-E, all AL 5654-E. Sheet 7 opens with SPECIAL CONDITIONS (Continued) and with 4. Billing Calculation: (Continued), which is direct evidence that Sheets 1 and 4 through 6 exist and are absent: Applicability, Territory, Special Conditions 1 through 3, and the first part of the Billing Calculation condition that Sheet 2 footnote 3 points to for the DWR Energy Credit. What those sheets price cannot be enumerated from this filing. Consequence worth noting: the Summer and Winter season months the model declares (--06 through --09 and --10 through --05) appear on none of the three sheets, so they are asserted from outside the filed source. They are inert today because every rate on Sheet 3 is identical Summer and Winter.",
]
applicable_modifiers = [
 "care",
 "cca-crs",
 "da-crs",
 "deed-restricted",
 "fera",
 "medical-baseline",
]

# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "Third SCE schedule modeled. Structurally distinct from TOU-D options: no TOU schedule (flat all-day rates), 2 ServiceTiers (baseline / nonbaseline) implemented via tier-varying CIA charge (-$0.03845/kWh credit baseline, +$0.06604/kWh charge nonbaseline; the 10.449¢ swing matches the Baseline Credit modeled in SCE TOU-D). Generation, distribution, and other surcharges are flat across tiers and seasons. Pattern reference: CPAU E-1 (also tiered, also uses urpx:hasServiceTiers with serviceTierNumber on one PriceDefinition per tier). 14 PriceDefinitions: 1 generation, 1 distribution, 6 flat delivery surcharges (Trans/NSGC/NDC/PPPC/WFC/PUCRF), 2 CIA (one per tier), 2 bundled adjustments (FRC/MCAM), 1 BSC, 1 climate credit. 14 Prices. Sheet 3 prints one CIA column with a Baseline Service row and a Nonbaseline Service row, and each row's Total carries exactly one of them, so the two rates are alternatives: one PriceDefinition per tier, not one shared by both."
