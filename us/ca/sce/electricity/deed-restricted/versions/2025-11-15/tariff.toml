# Extraction ------------------------------------------------------------------
[extraction]
tool = "manual"
extracted_on = "2026-05-01"
notes = """
Companion modifier to us/ca/sce/{care,fera}/versions/2025-11-15/.
Source is the same SCE TOU-D-2025 consolidated PDF; the Deed-Restricted
discount is documented in description prose of all four affected base
rate-plan filings (TOU-D-4-9PM, TOU-D-5-8PM, TOU-D-PRIME, Schedule D)
under their Special Conditions referencing the BSC structure introduced
by Decision 24-05-028.

## What this modifier captures

A single line-item credit applied as an overlay to any SCE residential
base rate plan when the customer's service address is in qualifying
deed-restricted housing:

 BSC Discount: -$0.334/meter/day

The base BSC of $0.794/meter/day is reduced by this discount, yielding
a net BSC of $0.460/meter/day for deed-restricted customers.

## Eligibility model

Unlike CARE/FERA (which gate on individual customer income), the
Deed-Restricted discount is a UNIT-LEVEL eligibility — based on the
property's deed-restriction status as documented in property records,
regardless of the individual customer's income. Typical qualifying
properties: LIHTC-funded developments, state Multifamily Housing
Program units, local inclusionary-housing-ordinance units.

A customer can be both deed-restricted-eligible AND CARE/FERA-eligible
simultaneously; the discounts stack (BSC adjustments are independent
across modifiers).

## Eligibility encoding

The customer-state property `housingDeedRestricted` (boolean) is
modeled as a CustomOperandNode — there is no URPX-native vocabulary
for property-level eligibility flags. Verification of deed-restriction
status (recorded deed lookup) is operational rather than billing-time
logic; the modifier treats it as a customer-state input.

## What this modifier does NOT capture (out of scope)

 1. Property-records lookup workflow — operational concern, not
 billing-time logic
 2. Stacking interactions with CARE/FERA — handled by the consumer
 applying both modifiers independently to the same base rate plan
"""

