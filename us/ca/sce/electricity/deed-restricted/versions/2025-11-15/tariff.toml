# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "BSC Surcharge exemption of $0.063 per meter per day is not modeled. SCE states the Deed Restricted Affordable Housing (DRAH) provision as two reductions, not one. Schedule D Special Condition 4 (Billing Calculation), in the sibling filing at us/ca/sce/electricity/d/versions/2026-03-20/, reads: \"DRAH Customers or tenants are exempt from the Base Services Charge Surcharge of $0.063 per meter per day and are provided a Base Services Charge Discount of $(0.334) per meter per day to reduce the Base Services Charge.\" This model carries only the $(0.334) discount, which is the line item printed as \"BSC Discount - Deed Restricted - $/Meter/Day (0.334)\" on TOU-D Sheets 2 through 7 (Cal. P.U.C. Sheets 90669-E through 90674-E, Advice 5654-E, effective 2025-11-15) and in the Schedule D 2025-11-15 rate tables. If the two halves are additive, the DRAH reduction is $0.397/meter/day and the net BSC is $0.397, not the $0.460 this manifest states. The corpus already answers the ambiguity against this filing: sce:care and sce:fera at this same effective date read an identically worded sentence as additive and each carry a separate surcharge-exemption Price of -0.063/meter/day beside their discount Price. Either this filing is short one Price or those two carry one too many. Expressible under v0.5.1 with no new vocabulary: copy sce:care-pd-bsc-surcharge-exemption (chargeType creditMisc, chargeCategory discount, billPortion bundledPortion, baseQuantity 1, CalculationMethod intervalDuration P1D) and its Price. Not built because the DRAH special condition is absent from both 2025-11-15 source PDFs in this corpus: the filed TOU-D 2025 book states DRAH only as a rate-table line (a grep for \"deed\" returns the six table rows and nothing else; its Special Conditions 8 and 9 are CARE and FERA), and the Schedule D 2025-11-15 PDF does the same. This is a source gap, not a vocabulary gap. The quoted sentence survives only in the later 2026-03-20 Schedule D, where it carries the 2025-11-15 figures ($0.063 surcharge, $(0.334) discount) while that same document's own footnote gives the surcharge as $0.064 and its own rate table gives the discount as $(0.332), which is why it reads as November 2025 text carried forward unrevised. To settle: obtain an SCE tariff sheet effective 2025-11-15 that states the DRAH special condition, or the Advice 5654-E workpapers.",
]

