# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "DRAH exemption from the Base Services Charge Surcharge is not modeled. Schedule TOU-D Sheet 15 Special Condition 9 (Cal. P.U.C. Sheet 91703-E) and Schedule D Sheet 6 Special Condition 4 (91560-E) both read: \"DRAH Customers or tenants are exempt from the Base Services Charge Surcharge of $0.069 per meter per day and are provided a Base Services Charge Discount of $(0.328) per meter per day to reduce the Base Services Charge.\" Those are two separate reductions, in the same two-clause form Special Conditions 6 and 7 use for CARE and FERA. This filing models only the second, as the rate-table line \"BSC Adjustment - Deed Restricted\" at $-0.328/meter/day (Sheets 2 to 7), so a DRAH customer resolves $0.069/meter/day short of the schedule: $0.466 where the schedule gives $0.397. Expressible now, not blocked: the base plans carry the BSC as one undifferentiated $0.794 Price, so the exemption has to be a second credit Price here, the shape sce/care 2026-10-01 already ships (sce:care-price-bsc-surcharge-exemption-2026-10-01, unitPrice -0.069). The Special Condition prose and the rate-table footnote now agree on both figures.",
 "Schedule TOU-D Sheet 15 Special Condition 9, in this filing's own PDF, states how DRAH status is established, and the model does not carry it. Verbatim: \"DRAH will be identified by the California Housing Partnership database. For properties with less than 80 percent of units identified as DRAH, Customers or tenants must contact SCE or visit www.sce.com and self-attest to living in a DRAH to qualify for the DRAH discount to reduce their Base Services Charge.\" The EligibilityRule tests a CustomOperandNode customConditionProperty \"housingDeedRestricted\" equal to true.",
]

