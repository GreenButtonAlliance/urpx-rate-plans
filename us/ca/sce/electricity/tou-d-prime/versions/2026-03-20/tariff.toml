notes = "re-sourced from live tariff-book TOU-D PDF. 25 of 25 existing prices refreshed to AL 5725-E values (effective 2026-01-01); see [extraction.notes] for per-component deltas. EV Meter Credit decreased from -0.446 to -0.451 (more credit). Adds 2 new PriceDefinitions (Generation→DWREC, Delivery→DWRA) for explicit columns on Sheets 6/7. Sheet 12 (TOU period definitions) and Sheet 13 (PRIME eligibility) now both cited from regulatory source instead of customer-facing page (modeled values unchanged). Per-version IRIs date-suffixed per the pattern, including the 4-way OR EligibilityRule subtree for qualifying technology (storage / EV / heat-pump / NBT). PRIME has 3 PriceDefinitions with blank-node CalculationMethod that needed date-suffixing (sce:pd-base-services-charge, sce:pd-ev-meter-credit, sce:pd-ev-submeter-credit) — anything per-meter-per-day or per-day with a CalculationMethod blank node hits the SHACL maxCount issue documented in . RatePlanVersion @id sce:tou-d-prime-2026-03-20 supersedes sce:tou-d-prime-2025-11-15. Adds the Schedule TOU-D holiday calendar: the eight holidays named on Sheet 13, with urpx:includeHolidays / urpx:includeNonHolidays on the summer peak window so a holiday falling on a summer weekday resolves to Mid-Peak. Labor Day now prices as a Saturday. Winter is unaffected because Sheet 12's winter weekday and weekend/holiday columns are identical."
