# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Schedule TOU-D Sheet 9: \"When any holiday listed above falls on Sunday, the following Monday will be recognized as a holiday. No change will be made for holidays falling on Saturday.\" New Year's Day, Independence Day, Veterans Day and Christmas in sce:tou-d-prime-2026-10-01-holiday-calendar carry no urpx:observanceRule, so each resolves on its actual date and a Saturday one stays on Saturday. The Monday after a Sunday New Year's Day, Independence Day, Veterans Day or Christmas is carried as a dated urpx:Holiday with urpx:holidayDate: 2027-07-05, 2029-11-12, 2032-07-05, 2033-12-26, 2034-01-02, 2035-11-12, 2038-07-05, 2039-12-26, 2040-01-02 and 2040-11-12. After 2040 each such Sunday holiday needs a further dated entry, until urpx:mondayIfSundayObservance (proposed in urpx-org/urpx#77) can state the rule; the dated entries then come out.",
 "Special Condition 4 (Sheet 12) limits the EV Meter Credit of $(0.371) per meter per day to \"customers with a separate meter provided by SCE exclusively for the charging of Electric Vehicles, as defined in Rule 1\", and the EV Submetering Special Condition (Sheet 19) limits the EV Submeter Credit of $(0.051) per meter per day to a customer whose EV submeter meets the Plug-In Electric Vehicle Submetering Protocol of Decision 22-08-024. Both are modeled as unconditional PriceDefinitions, so a consumer gives every Option PRIME customer both credits. v0.5.1 supplies the vocabulary: PriceDefinition and Price both carry urpx:hasApplicabilityRule, and ApplicabilityRule carries urpx:hasConditionExpression with a CustomOperandNode for the metering arrangement. Not built.",
 "San Joaquin Valley Disadvantaged Communities Pilot Bill Protection Discount (Special Condition 12, Sheets 17 and 18, where the continuation is headed 13): 20 percent of the monthly bill in pilot years 1 through 5, then 10 percent or 20 percent in years 6 through 10 depending on SCE's evaluation of participants' energy cost savings. Not modeled: the discount is gated on SJV Pilot participation, and a Price carrying it without that gate would discount every customer on the schedule. The percentage-of-subtotal shape itself is the one sce/care and sce/fera already ship against this filing's urpx:PriceSummary.",
 "Transitional Community Solar Discount (Special Condition 14, Sheet 18): 20 percent monthly bill credit over the same 10-year bill protection period, for SJV Pilot participants who cannot take the Community Solar-Green Tariff or the Disadvantaged Communities-Green Tariff. Same pilot-participation gate as Special Condition 12.",
 "urpx:PriceSummary sce:tou-d-prime-2026-10-01-summary-discountable, the subtotal that sce/care and sce/fera discount against, names 24 Prices in two different denominations: 22 in $/kWh, and two in $/Meter/Day (sce:price-ev-meter-credit-2026-10-01 at $(0.371) and sce:price-ev-submeter-credit-2026-10-01 at $(0.051), both per Sheets 6 and 7). A sum over the urpx:unitPrice values of its members adds dollars per day to dollars per kWh, so the CARE 32.5 percent of Special Condition 6 and the FERA 18.0 percent of Special Condition 7 are percentages of a mixed-unit figure. Split it into two unit-homogeneous summaries with one modifier Price over each.",
 "California Climate Credit carry-forward (Sheet 16, Special Condition 10): the $(36.00) per household credit is priced, but the roll-over of any portion not consumed in a billing period to subsequent billing periods is not expressed, so a consumer whose bill is smaller than the credit drops the remainder. Whether URPX can express it is not established: urpx:BillingCycle and settlementInterval exist, and SMUD NEM1 uses settlementInterval for its 12-month settlement period.",
 "The California Climate Credit's urpx:ApplicabilityRule asserts urpx:month \"--04\" and \"--10\". This filing's PDF names neither month: the rate tables footnote the credit only as \"Applied on an equal basis, per household, semi-annually\" and Special Condition 10 (Sheet 16) names no month. Either cite an external SCE source for April and October, or reduce the claim to the semi-annual statement the sheets make.",
 "Special Condition 5, Change of Rate Schedule (Sheet 13), governs how long a customer stays on this Option and is not in the model. Verbatim: \"At any time, a Customer on this Schedule may elect to leave his/her Option (e.g., Option 4-9 PM, Option 5-8 PM, Option PRIME) and elect to either: (1) switch to another Option of this Schedule for which they are eligible, or (2) transfer from this Schedule to another applicable residential rate schedule. The elected rate change will become effective on the next regularly scheduled meter read date following the Customer's notice to SCE. Unless the Customer was placed on an Option by SCE (i.e., defaulted), the Customer shall not be allowed to make an additional change in rate until 12 months of service has been provided under the elected rate, unless otherwise specified in that rate schedule.\" urpx:minimumTenure exists on RatePlanVersion and the model does not set it; the re-entry half has no v0.5.1 form.",
 "Special Condition 8, Arrearage Management Plan (Sheet 14), in this filing's own PDF, changes what a customer on this Option owes and is not in the model. Verbatim: \"Once enrolled in the AMP, SCE shall forgive 1/12 of an eligible residential Customer's arrearage after each on-time payment. After 12 on-time payments, SCE shall forgive the remaining arrearage debt up to a maximum of $8,000 per instance of enrollment.\" Eligibility is six months of SCE service, CARE or FERA enrollment, at least one on-time payment, and an arrearage of $500 or greater at least 90 days old.",
]
