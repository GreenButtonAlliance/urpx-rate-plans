notes = """
Source bytes. Retrieved 2026-10-06 from SCE's live tariff book with the fetch
path of dev/fetch_tariff_documents.py. SharePoint's download endpoint answered
with the PDF inside a multipart/form-data envelope; the committed file is that
envelope's one part body, extracted byte for byte, and the sha256 recorded
above is its hash.

Advice 5897-E (Decision 26-04-033) reissued all 19 sheets of Schedule TOU-D
effective October 1, 2026, Cal. P.U.C. Sheets 91689-E (Sheet 1) through
91707-E (Sheet 19). The schedule now holds six rate options, Option 4-9 PM,
4-9 PM-CPP, 5-8 PM, 5-8 PM-CPP, PRIME and PRIME-CPP. Rates are on Sheets 2 to
7. Special Condition 1 (TOU periods, the CPP Event Window, holidays and
seasons) is on Sheets 8 and 9; Special Condition 3 (Critical Peak Pricing) on
Sheets 10 to 12; Special Condition 4 (PRIME Separately-Metered EV Option) on
Sheet 12; Special Conditions 5 to 7 (Change of Rate Schedule, CARE, FERA) on
Sheet 13; Special Condition 8 (Arrearage Management Plan) on Sheet 14; Special
Condition 9 (Billing Calculation, with the DRAH terms) on Sheets 15 and 16;
Special Condition 10 (California Climate Credit) on Sheet 16; the SJV Pilot
Bill Protection Discount (Special Condition 12) on Sheets 17 and 18, where its
continuation is headed 13; the Transitional Community Solar Discount (Special
Condition 14) on Sheet 18; and EV Submetering on Sheet 19. The TOU periods,
holidays and seasons are unchanged from the 2026-03-20 version.

Supersession. This version follows the 2026-06-01 version. Advice 5897-E's
sheets cancel the June 2026 sheets that version models: Advice 5829-E's rate
Sheets 2 to 6 (91196-E to 91200-E, effective June 1, 2026) and Advice 5837-E's
reissue of Sheets 1 and 7 to 19 (91354-E to 91367-E, effective June 25, 2026).

Eligibility. Advice 5897-E deletes the PRIME Eligibility Requirements Special
Condition (Special Condition 5 on Sheet 17 of the 2026-03-20 source), which
required a newly enrolling Customer to attest to an electric vehicle,
behind-the-meter storage or an electric heat pump. Sheet 1 now makes the
Schedule, Option PRIME included, available to Customers eligible for Schedules
D, D-CARE and D-FERA. This version therefore drops the qualifying-technology
EligibilityRule the 2026-03-20 version carries.

Price changes from the 2026-03-20 version, $ (per kWh unless a per-day
charge):
