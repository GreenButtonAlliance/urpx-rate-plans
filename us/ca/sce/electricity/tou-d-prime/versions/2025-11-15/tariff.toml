# Extraction ------------------------------------------------------------------
[extraction]
tool = "manual"
extracted_on = "2026-04-30"
notes = """
Source PDF is SCE's consolidated Schedule TOU-D tariff book — a single PDF
that bundles per-sheet revisions across the year, each with its own per-sheet
effective date. Per the SCE convention documented in us/ca/sce/electricity/utility.toml,
this filing is dated to the most recent per-sheet effective date in the
document (2025-11-15).

Per-sheet effective dates within the source PDF (most recent revision per
sheet):
 Sheet 2 (Option 4-9 PM headline rates) — 2025-11-15 (AL 5654-E)
 Sheet 3 (Option 4-9 PM Delivery Service breakdown) — 2025-11-15 (AL 5654-E)
 Sheet 4 (Option 5-8 PM headline rates) — 2025-11-15 (AL 5654-E)
 Sheet 5 (Option 5-8 PM Delivery Service breakdown) — 2025-11-15 (AL 5654-E)
 Sheet 6 (Option PRIME headline rates) — 2025-11-15 (AL 5654-E)
 Sheet 7 (Option PRIME Delivery Service breakdown) — 2025-11-15 (AL 5654-E)
 Sheet 8/9 (Option A) — 2025-06-01 (AL 5555-E) — closed, not modeled here
 Sheet 10/11 (Option B) — 2025-06-01 (AL 5555-E) — closed, not modeled here
 Sheet 18 (Special Conditions 7-9: Change of Rate, CARE, FERA) —
 2025-11-15 (AL 5654-E)

Sheets 12-17 (Special Conditions 1-6: TOU period definitions, Option PRIME
eligibility, billing calculation, baseline allocations, etc.) are NOT in
this consolidated PDF. Sources used for the TOU-period TimeBracket values
in the JSON-LD:

 1. SCE customer-facing rate-plans page
 https://www.sce.com/save-money/rates-financing/residential-rate-plans/time-of-use-plans
 (retrieved 2026-04-30) — provides full season × day-type schedule
 graphics for TOU-D-4-9PM/5-8PM/PRIME including super-off-peak windows.
 2. SCE 2025 Summary of Available Residential and Nonresidential Rates PDF
 (referenced in us/ca/sce/electricity/utility.toml) — confirms 4-9 PM on-peak.

The customer-facing schedule graphics are authoritative for the TOU windows
modeled here; the omitted regulatory Sheets 12-17 govern edge cases (baseline
allocation tables, CCA/DA clauses) that are not yet captured.

Holidays: this filing's source PDF carries no holiday statement, Sheet 13
being one of the sheets the 2025 reissuance omits. The eight holidays and
the observance sentence modeled here are from Schedule TOU-D Sheet 13
(Cal. P.U.C. leaf 89841-E, AL 5497-E, effective 2025-06-02), read from the
live tariff-book PDF staged with the 2026-03-20 filing; that sheet took
effect before 2025-11-15 and was still current at the 2026-03-20 snapshot.
Their day-type treatment is Sheet 12, Special Condition 1: holidays price
in the Weekends-and-Holidays column.

Modeling deferrals:
 - CARE/FERA discount RatePlanModifiers (BSC surcharge exemption +
 BSC discount adjustments, CARE Surcharge $0.212/meter/day exemption,
 Wildfire Fund Charge exemption, Fixed Recovery Charge exemption).
 - Deed-Restricted BSC discount ($-0.334/meter/day) — modeled here as a
 standalone adjustment in description prose, not yet as an EligibilityRule
 or RatePlanModifier.
 - Vintage PCIA / DA-CRS / CCA-CRS RatePlanModifiers (delivery-service
 Total varies for DA/CCA customers; not yet captured).
 - Option PRIME-CPP variant (CPP event charges + non-event credits).
 - Medical Line Item Discount (100% on Sheet 6, additional vs 4-9PM/5-8PM)
 — modeled separately as a RatePlanModifier (deferred).
 - Conditional applicability of EV Meter Credit (only when customer
 has separately-metered EV) and EV Submeter Credit (only when
 customer uses a submeter for EV load) — currently encoded as
 standalone PriceDefinitions; ApplicabilityRule or EligibilityRule
 refinement deferred.
"""

