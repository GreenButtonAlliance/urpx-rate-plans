# MIDAS RIN cross-reference ---------------------------------------------------
# Each per-cell Delivery Price carries its CEC MIDAS Rate Identification
# Number (RIN) in urpx:name for cross-reference. SCE uses per-base-RatePlan
# RIN families; for residential TOU-D-PRIME-NBT:
# USCA-SCXX-0602-0000 TOU-D-PRIME-NBT NON-VINTAGED
# USCA-SCXX-0603-0000 TOU-D-PRIME-NBT 2023 VINTAGE
# USCA-SCXX-0604-0000 TOU-D-PRIME-NBT 2024 VINTAGE
# USCA-SCXX-0605-0000 TOU-D-PRIME-NBT 2025 VINTAGE
# USCA-SCXX-0606-0000 TOU-D-PRIME-NBT 2026 VINTAGE
# Generation EEC IS derivable from MIDAS — discovered 2026-05-29 via
# SCSC-SCXX subtraction:
# USCA-SCSC-{code}-0000 bundled-service rate, carries COMBINED EEC
# USCA-SCXX-{code}-0000 CCA-service rate, carries DELIVERY-ONLY EEC
# Generation EEC = SCSC combined "Energy Export Credit"
# − SCXX "Energy Export Credit Delivery"
# Empirically verified constant across multiple weeks within each vintage's
# lock-in period. Implemented in
# scripts/augment-sce-nbt-with-generation-eec.py. Generation Price names carry
# both source RINs (e.g. "MIDAS RIN: USCA-SCSC-0605-0000 − USCA-SCXX-0605-0000").

# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Sheet 5 prices the Energy Export Credit by hour, by weekday versus weekend/holiday, and by month for each interconnection vintage. The model carries 5,088 of the 5,760 cells that shape implies; the 672 missing are the 2026 vintage for June through December (7 months x 24 hours x 2 day types x 2 components). This is a source gap, not a vocabulary gap: the tariff publishes no EEC numbers at all, every cell in this filing came from CEC MIDAS, and MIDAS had not published 2026 past May at extraction. Reload when it does; the sibling sdge:nbt at 5,760 shows what a complete grid looks like.",
 "Sheet 7's Avoided Cost Calculator Plus table prices 18 cells: six vintage rows (2023, 2024, 2025, 2026, 2027, and 2028-and-later) by three customer columns (Residential Non-Equity, Residential Equity, Non-Residential). Only the 2025 Residential pair is modeled, at -0.024 and -0.056 per kWh. The remaining 16 cells are unbuilt work rather than a blocker: v0.5.1 needs nothing the two existing Prices do not already use, so each is a Price in a customer-segment cell of its vintage, the vintage's ProfileAlternative split by NBT Customer Segment as NBT25's is. Note the inconsistency this leaves, that the 2023, 2024 and 2026 EEC grids are priced while their ACC Plus counterparts are not.",
 "Sheet 8 Rates section 4 prices Net Surplus Compensation as the Net Surplus Compensation Rate times Net Surplus Energy, and Sheet 9 section 4.a adds the Renewable Attribute Adder for customers transferring RECs to SCE. Source gap: the tariff states both formulas and publishes neither number. The NSCR is a rolling 12-month average of SCE hourly DLAP prices for Hour Ending 08 through Hour Ending 17, recomputed monthly and posted on sce.com; the RAA is the WECC average renewable premium, posted at sce.com/regulatory/tariff-books/rates-pricing-choices/renewable-energy-credit. Both also settle over the customer's Relevant Period rather than against any one bill.",
 "Special Condition 4.e on Sheet 23 prices the Energy Export Credit Adjustment at the end of the Relevant Period as Net Surplus Energy times the then posted Average Retail Export Compensation Rate, then applies unapplied Energy Export Credit first to Energy Charges of the Relevant Period not already offset and then to that adjustment, carrying any remaining balance forward to the next Relevant Period from the latter of July 1, 2024 or billing-system implementation (Sheet 23, 87513-E, Special Condition 4.e.ii), and forfeiting excess credit on termination of service (4.e.v). Absent for two independent reasons: the Average Retail Export Compensation Rate is published outside this corpus, and the offset ordering and carry-forward are settlement arithmetic over a 12-month window with no home on a per-bill modifier.",
 "Sheet 10 Rates section 6 prices NBT Aggregation billing service charges: a $25.00 one-time account set-up fee and $20.00 per account per month for manually billed accounts, $16.00 and $2.70 for automated ones. These sit in this schedule's own Rates section, and nothing in Special Condition 10.a limits NBT-A to non-residential customers, so treating them as out of scope is a filing-scope decision rather than something the tariff says. Expressible: four flat Prices, urpx:initiationCharge for the set-up fees and a monthly service charge at intervalDuration P1M for the recurring ones, gated on manual versus automated billing.",
 "Special Condition 10.c on Sheet 40 allocates Energy Export and the corresponding Energy Export Credits proportionally across the metered accounts of an NBT-A arrangement, by each account's cumulative Energy Consumption since the start of the Relevant Period, with the rounding remainder going to one designated account. It introduces no new rate but changes what each account is credited. Not expressible: URPX carries no account identity and no per-account result channel for an allocation to land in.",
 "Five eligibility conditions on the ACC Plus Adder, the one priced item in this filing whose eligibility the model does partly encode, are absent from the model and from the manifest. Sheet 7 (89745-E): ACC Plus customers must \"have an Interconnection Request date between April 15, 2023, and December 31, 2027, or between February 15, 2024, and December 31, 2028, for NBT-A Customers\", and the ACC Plus vintage is that of the Original PTO Date for Interconnection Requests submitted from April 15, 2023 through June 30, 2024 with an Original PTO Date on or before June 30, 2024, otherwise that of the Interconnection Request date. Sheet 8 adds master-metered ineligibility, NEM and NEM-ST transferee ineligibility except for NBT Transition Customers, and \"Customers that add Renewable Generators on a New Construction are not eligible to receive the ACC Plus Adder\". Sheet 2 section 1.d adds non-TOU ineligibility. All are customer attributes of the same class as the Equity Customer segment the model selects on, and all are expressible with the ConditionExpression machinery already in the file, on the NBT25 cells' ProfileAlternatives or as a further segment carrying no ACC Plus Price rather than on the Price.",
 "Sheet 3 Rates 2 conditions a modeled export component on program enrollment: \"Customers enrolled in the California Alternate Rates for Energy (CARE) program or who receive a Medical Baseline Exemption are currently exempt from the Wildfire Fund Charge (WFC). Therefore, the WFC component of the NBCs for these Customers under this Schedule is $0.00/kWh.\" No ApplicabilityRule or Price in the model corresponds to it.",
 "Sheet 6 (89868-E, Advice 5497-E, effective 2025-06-02), Rates section 3.a.ii, assigns the Energy Export Credit vintage: \"Customers that receive an Original PTO Date on or before June 30, 2024, will be assigned the EEC Vintage Year price corresponding to the EEC Vintage Year of their Original PTO date. Customers that submit an Interconnection Request between July 1, 2024, and December 31, 2027, as well as customers who submitted an Interconnection Request before June 30, 2024, whose Original PTO date is after June 30, 2024, will be assigned the EEC Vintage Year price corresponding to the EEC Vintage Year of the date that the Interconnection Request was submitted.\" The vintage ProfileAlternatives condition only on NBT Vintage Label, a value the consumer supplies, so the model carries no rule deriving that label from the Original PTO Date and the Interconnection Request date. Expressible with the date-valued CustomOperandNode comparisons the interconnection-date EligibilityRule already uses, on each vintage ProfileAlternative.",
 "Sheet 34 (89869-E, Advice 5497-E, effective 2025-06-02), Special Condition 7.b: \"NEM or NEM-ST Customers moved (or transitioning) to Schedule NBT increasing their Renewable Electrical Generating Facilities system size due to modifications and/or repairs exceeding the ten (10) percent or 1 kW detailed above will begin a new 9-year legacy period from the PTO date of their modification and/or repairs.\" With the rest of Special Condition 7 (Sheets 33 to 35: the 9-year eligibility period, modifications within the 10 percent or 1 kW limit, storage additions, transferability to an Eligible Same Party In), it sets how long a customer keeps a vintage's prices. The vintage ProfileAlternatives carry only which vintage applies.",
]

