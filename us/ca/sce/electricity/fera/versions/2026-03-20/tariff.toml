# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "18.0 percent discount base excludes the PUC Reimbursement Fee without warrant in FERA's own text. Schedule TOU-D Sheet 18 Special Condition 9, restated in Schedule D Sheet 7, applies the discount to the bill \"prior to the application of any applicable taxes and late payment charges\" and carves out no PUCRF; Special Condition 8 does carve it out for CARE and requires CARE customers to pay it in full. The -0.18 Price here is based on the shared sce:<plan>-<date>-summary-discountable, which excludes the PUCRF (0.00100 $/kWh on Schedule D at this date) and whose name asserts CARE and FERA discount the same components. On the plain text the modeled discount is short by 18 percent of the PUCRF. The fix is expressible under v0.5.1 and is already the SDG&E pattern in this corpus: add a FERA-specific PriceSummary including the PUCRF to each SCE base plan at each date and repoint basedOnPrice at those summaries. Not built. Confirm against SCE billing practice before building, since only the tariff text has been read.",
 "Whether the 18.0 percent applies to the adjusted Base Services Charge is unresolved and the model assumes it does not. Special Condition 9 discounts \"their bill\", on which the $0.794 per meter per day BSC appears, and separately reduces that BSC \"In addition\" by the $0.064 surcharge exemption and the $(0.201) credit adjustment carried here. The model applies the percentage only to the per-kWh subtotal, leaving the adjusted $0.529 per meter per day undiscounted. Neither SCE PDF decides it; SDG&E's Schedule FERA Sheet 1 excludes the base services charge from its own discount base, which supports the current treatment but is another utility's language. If the answer turns out to be yes, it is expressible under v0.5.1: urpx:includesPrice requires at least two members, so build a PriceSummary per base plan and date holding the base's BSC Price plus this filing's two credits (all three $/day, so unit-homogeneous) and add a second -0.18 Price based on it. Pointing basedOnPrice at the BSC Price alone would not validate and would use the unadjusted $0.794.",
 "Special Condition 9 (Sheet 18, Cal. P.U.C. Sheet 90943-E) states four conditions of service the model does not carry. Verbatim: \"An application and eligibility declaration is required for service under this Special Condition. Eligible Customers shall be billed on this Special Condition commencing no later than one billing period after receipt and approval of the Customer's application by SCE. Customers may be rebilled for periods in which they do not meet the eligibility requirements for the CARE Discount. Customers receiving service under the CARE Discount Special Condition of this Schedule are not eligible to take service under this Special Condition.\" The EligibilityRule is residential customer kind AND Program Enrollment = FERA, with no CARE-exclusion predicate.",
 "Special Condition 9 defines the beneficiary by reference to Schedule D-FERA, which is in no PDF in this corpus, so the household definition behind the modeled -0.18 multiplier is unsourced in the filing.",
 "Special Condition 10 Arrearage Management Plan (Sheet 19), in this filing's own PDF, is gated on CARE or FERA enrollment and forgives 1/12 of an eligible Customer's arrearage after each on-time payment, the remainder after 12, up to $8,000 per instance of enrollment, with a 12-month waiting period before re-enrollment. It changes what a FERA customer owes and is not in the model.",
]

