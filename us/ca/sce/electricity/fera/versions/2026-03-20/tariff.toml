notes = """
Source remains the SCE TOU-D PDF (live tariff-book version) Sheet 18,
NOT switched to canonical Schedule D-FERA — see "Source choice" note
below. Re-sourced from the live tariff-book SharePoint folder;
the prior 2025-11-15 filing was sourced from the
historical-rates archive (year-suffixed ELECTRIC_SCHEDULES_TOU-D_2025
.pdf) and has been superseded.

Per the SCE convention documented in us/ca/sce/electricity/utility.toml, this
filing is dated to the most recent per-sheet effective date in the
document (2026-03-20).

Per-sheet effective dates relevant to FERA on the TOU-D PDF:
 Sheet 18 (Special Conditions 7-9 including FERA values) —
 2026-01-01 (AL 5725-E, 90943-E) *** values we model here ***
 Sheet 21 — 2026-03-20 (AL 5771-E, 91040-E) — newest sheet,
 drives the filing date.

## Source choice — why TOU-D Sheet 18, not Schedule D-FERA

The companion CARE modifier switched its source from
TOU-D Sheet 18 to canonical Schedule D-CARE PDF Sheet 1, because
D-CARE Sheet 1 was re-issued under AL 5725-E and carries the new
Jan 1 2026 CARE values directly. FERA presents a different situation:

 D-FERA PDF Sheet 1 (90648-E, AL 5654-E, eff Nov 15, 2025) — still
 shows the OLD pre-2026-01-01 values:
 BSC Surcharge exemption $0.063/meter/day
 BSC Credit Adjustment $(0.202)/meter/day
 TOU-D Sheet 18 (90943-E, AL 5725-E, eff Jan 1, 2026) — shows the
 UPDATED values:
 BSC Surcharge exemption $0.064/meter/day
 BSC Credit Adjustment $(0.201)/meter/day
 Schedule D Sheet 7 (91033-E, AL 5771-E, eff Mar 20, 2026) —
 re-states the same updated values as TOU-D Sheet 18.

AL 5725-E updated the FERA values on TOU-D Sheet 18 and AL 5771-E
restated them on Schedule D Sheet 7, but neither re-issued D-FERA
Sheet 1.
Switching this filing to D-FERA-as-source would force us to either
(a) cite stale values that don't match SCE's billing system, or
(b) cite values that aren't literally on the cited page. Neither is
honest. So the source remains the TOU-D PDF for now; switch to
D-FERA when SCE reissues D-FERA Sheet 1 with current values.

Substantive deltas vs the prior 2025-11-15 filing:

 BSC Surcharge exemption -0.063 → -0.064 (-0.001 deeper credit)
 BSC Credit Adjustment -0.202 → -0.201 (+0.001 less credit)
 Net per-meter-day: -0.265 → -0.265 (no net change)

The two adjustments offset to zero net change — FERA customers see
no per-meter-day difference between the 2025-11-15 and 2026-03-20
filings. The split shifts $0.001/day from one line item to the
other.

The 18.0% bill-subtotal percentage discount is modeled, as a
urpx:Price carrying urpx:multiplier -0.18 and urpx:basedOnPrice
over the discountable urpx:PriceSummary of each base plan this
modifier applies to. Nothing Special Condition 9 prices is
deferred.

Source bytes. [source]: the server answered the 2026-05-04 download with the
PDF inside a multipart/form-data envelope (one part, filename
ELECTRIC_SCHEDULES_TOU-D.pdf, Content-Length 2088177), and that envelope,
sha256 aadbe85df805c38ac05d129a5a264f8c90830dd69cc8ffe55743a442ef853ccc, was
committed here as the PDF until 2026-10-06. The committed file is now the
part's body, extracted byte for byte with dev/fetch_tariff_documents.py
--unwrap, and the sha256 recorded above is its hash. The envelope's boundary
is generated per response, so an envelope hash identifies one response, not
the document.
"""

