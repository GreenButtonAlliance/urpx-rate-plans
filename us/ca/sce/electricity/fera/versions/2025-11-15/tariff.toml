notes = """
Companion modifier to us/ca/sce/electricity/care/versions/2025-11-15/. Source is
the same SCE TOU-D-2025 consolidated PDF; Sheet 18 has Special Condition
9 (FERA) with the BSC adjustment values.

FERA is the second-tier CPUC income-qualified discount program — for
moderate-income households (≤250% FPL) with 3+ residents, who don't
qualify for CARE's deeper discount. Customers receiving CARE are NOT
eligible for FERA simultaneously.

## What this modifier captures

Line-item credits applied as overlays to any SCE residential base
rate plan when the customer is enrolled in FERA:

 BSC Surcharge Exemption: -$0.063/meter/day
 BSC Credit Adjustment: -$0.202/meter/day
 ─────────────────────────────────────────────
 Net per-meter-per-day: -$0.265/meter/day

Unlike CARE, FERA does NOT include WFC or FRC exemptions — FERA
customers continue to pay both at the standard rates.

## What this modifier does NOT capture (deferred)

 1. 18.0% bill-subtotal percentage discount, applying to the pre-tax
 subtotal across all base PriceDefinitions. URPX v0.5.1 CAN express this, via a urpx:PriceSummary over the
 discountable line items with a urpx:Price carrying urpx:multiplier
 and urpx:basedOnPrice. Not yet modeled; the shape is settled.

For a FERA customer on a typical SCE residential schedule, the modeled
BSC credits represent a small fraction of the actual FERA benefit;
the bulk is the 18.0% percentage discount.

## Why the structure is simpler than CARE

CARE has 4 line-item adjustments + 1 deferred percentage discount.
FERA has only 2 line-item adjustments + 1 deferred percentage discount.
FERA's narrower scope reflects its policy positioning as a
moderate-income tier vs CARE's deeper low-income tier.
"""

