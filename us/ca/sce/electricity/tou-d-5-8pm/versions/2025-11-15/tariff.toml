# Extraction ------------------------------------------------------------------
[extraction]
tool = "manual"
extracted_on = "2026-04-30"
notes = """
Source PDF is SCE's consolidated Schedule TOU-D tariff book — a single PDF
that bundles per-sheet revisions across the year, each with its own per-sheet
effective date. Per the SCE convention documented in us/ca/sce/electricity/utility.toml,
this filing is dated to the most recent per-sheet effective date in the
document (2025-11-15).

Per-sheet effective dates within the source PDF (most recent revision per
sheet):
 Sheet 2 (Option 4-9 PM headline rates) — 2025-11-15 (AL 5654-E)
 Sheet 3 (Option 4-9 PM Delivery Service breakdown) — 2025-11-15 (AL 5654-E)
 Sheet 4 (Option 5-8 PM headline rates) — 2025-11-15 (AL 5654-E)
 Sheet 5 (Option 5-8 PM Delivery Service breakdown) — 2025-11-15 (AL 5654-E)
 Sheet 6 (Option PRIME headline rates) — 2025-11-15 (AL 5654-E)
 Sheet 7 (Option PRIME Delivery Service breakdown) — 2025-11-15 (AL 5654-E)
 Sheet 8/9 (Option A) — 2025-06-01 (AL 5555-E) — closed, not modeled here
 Sheet 10/11 (Option B) — 2025-06-01 (AL 5555-E) — closed, not modeled here
 Sheet 18 (Special Conditions 7-9: Change of Rate, CARE, FERA) —
 2025-11-15 (AL 5654-E)

Sheets 12-17 (Special Conditions 1-6: TOU period definitions, Option PRIME
eligibility, billing calculation, baseline allocations, etc.) are NOT in
this consolidated PDF. Sources used for the TOU-period TimeBracket values
in the JSON-LD:

 1. SCE customer-facing rate-plans page
 https://www.sce.com/save-money/rates-financing/residential-rate-plans/time-of-use-plans
 (retrieved 2026-04-30) — provides full season × day-type schedule
 graphics for TOU-D-4-9PM/5-8PM/PRIME including super-off-peak windows.
 2. SCE 2025 Summary of Available Residential and Nonresidential Rates PDF
 (referenced in us/ca/sce/electricity/utility.toml) — confirms 4-9 PM on-peak.

The customer-facing schedule graphics are authoritative for the TOU windows
modeled here; the omitted regulatory Sheets 12-17 govern edge cases (baseline
allocation tables, CCA/DA clauses) that are not yet captured.

Holidays: this filing's source PDF carries no holiday statement, Sheet 13
being one of the sheets the 2025 reissuance omits. The eight holidays and
the observance sentence modeled here are from Schedule TOU-D Sheet 13
(Cal. P.U.C. leaf 89841-E, AL 5497-E, effective 2025-06-02), read from the
live tariff-book PDF staged with the 2026-03-20 filing; that sheet took
effect before 2025-11-15 and was still current at the 2026-03-20 snapshot.
Their day-type treatment is Sheet 12, Special Condition 1: holidays price
in the Weekends-and-Holidays column.

Modeling deferrals:
 - Heat Pump Water Heater additional baseline allocation modifier.
 - CARE/FERA discount RatePlanModifiers (BSC surcharge exemption +
 BSC discount adjustments, CARE Surcharge $0.212/meter/day exemption,
 Wildfire Fund Charge exemption, Fixed Recovery Charge exemption).
 - Deed-Restricted BSC discount ($-0.334/meter/day) — modeled here as a
 standalone adjustment in description prose, not yet as an EligibilityRule
 or RatePlanModifier.
 - Vintage PCIA / DA-CRS / CCA-CRS RatePlanModifiers (delivery-service
 Total varies for DA/CCA customers; not yet captured).
 - Option 5-8 PM-CPP variant (CPP event charges + non-event credits).

Baseline ladder (added 2026-10-06). The rate sheet footnote (Sheets 4 and 5):
"The Baseline Credit applies up to 100% of the Baseline Allocation,
regardless of Time-of-Use time period. Additional Baseline Allocations apply
for Customers with Heat Pump Water Heaters served under this Option. The
Baseline Allocation is set forth in Preliminary Statement, Part H." Part H
paragraph 3, Sheet 2 (Cal. P.U.C. Sheet 74486-E, summer) and Sheet 3
(74487-E, winter), both effective October 1, 2022 under Advice 4864-E, gives
them in kWh per day by Baseline Region (5, 6, 8, 9, 10, 13, 14, 15, 16) and
Basic or All-Electric Allocation: 36 cells. Each is a Tier 1 bracket from 0 to
the allocation and a Tier 2 bracket above it in sce:tou-d-5-8pm-2025-11-15-tiers-baseline,
qualified by the version's season and by a ProfileAlternative on the custom
dimensions baselineRegion and baselineCode. Part H is vendored here as
sce_prelim-h_2024-08-15.pdf, dated by its latest sheets (4 to 6, effective
August 15, 2024). The Baseline Credit has its own ledger over the kWh
MetricInput sce:tou-d-5-8pm-2025-11-15-mi-energy-baseline, priced $(0.10449) on Tier 1 and 0
on Tier 2; both Prices are in sce:tou-d-5-8pm-2025-11-15-summary-discountable.

Heat Pump Water Heater allocation.
rate-plan-modifier_sce_tou-d-5-8pm-hpwh_2025-11-15.jsonld, a second document in this
directory, carries Part H's HPWH Allocation (1.9 kWh per day in summer for
both allocations; 2.6 Basic and 3.0 All-Electric in winter) as adjusting
ServiceBrackets on this version's Tier 1 upper and Tier 2 lower bounds. They
use urpx:adjustsServiceTier, urpx:lowerBoundOffset and urpx:upperBoundOffset,
proposed in urpx-org/urpx#80 and in no URPX release, so the document does not
validate against the v0.5.1 shapes; dev/shacl.sh excepts exactly
the results #80 would remove, under BOUND_OFFSET_EXCEPTION. clj-urpx 0.59.0
resolves the offsets. The modifier is in effect exactly when this version is.

Source bytes. [source.prelim_h]: the server answered the 2026-05-04 download
of Part H with the PDF inside a multipart/form-data envelope (one part,
filename ELECTRIC_PRELIM_H.pdf, Content-Length 447508, envelope sha256
e54ae55e3b49d5398a981ebfba3d714cba0c90de100e7addde8a6706bdde0f16). Part H was
first committed as that part's body cut at its last %%EOF, sha256
898b6a89bf63455d37964670b54847544865dcd1da988275940f6a12cb389325, one byte
short of the part; the committed file is now the whole part, extracted with
dev/fetch_tariff_documents.py --unwrap, and the sha256 recorded above is its
hash. The envelope's boundary is generated per response, so an envelope hash
identifies one response, not the document.
"""

# Validation ------------------------------------------------------------------
[validation]
shacl_passed = true
validator = "clj-shacl + clj-urpx (URPX v0.5.1)"
validated_on = "2026-10-10"

# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Preliminary Statement Part H, paragraph 3: \"The total billable baseline quantity is determined based upon the total number of winter days and total number of summer days during the billing period. Total billable baseline is then proportionately billed to winter and summer periods based upon the percentage of customer-consumption registered during the winter and summer seasons.\" The Tier 1 and Tier 2 brackets carry the Sheet 2 and Sheet 3 quantities as kWh-per-day bounds on a kWh MetricInput, qualified by season, as pge:e-tou-c does. Nothing in the filing states the daily basis, the multiplication by the days of each season in a billing period, or the proration by consumption, so a consumer must scale the bounds to the billing period itself.",
 "Preliminary Statement Part H, paragraph 4: \"The standard Medical Baseline Allocation will be 16.5 kWh per day\", provided \"in addition to the applicable Baseline Allocation set forth in Paragraph 3\". Not modeled: the Tier 1 and Tier 2 bounds here carry the paragraph 3 allocation only, and sce:medical-baseline carries the Schedule MB-E Wildfire Fund exemption and no allocation. An adjusting-bracket modifier of the form this filing's HPWH document uses (urpx-org/urpx#80) is the available route.",
 "SCE's Sunday-to-Monday holiday observance (Schedule TOU-D Sheet 13: 'When any holiday listed above falls on Sunday, the following Monday will be recognized as a holiday. No change will be made for holidays falling on Saturday.'). New Year's Day, Independence Day, Veterans Day and Christmas in sce:tou-d-5-8pm-2025-11-15-holiday-calendar carry no urpx:observanceRule, so each resolves on its actual date. This version is in effect from 2025-11-15 until 2026-01-01, when no listed holiday falls on a Sunday, so the rule creates no Monday inside it and no dated observed holiday is carried; the 2026-03-20 filing carries them through 2040.",
 "Option 5-8 PM-CPP not modeled. Its three prices are on this filing's own operative Sheet 4 (leaf 90671-E, Effective Nov 15 2025), under the heading \"Option 5-8 PM-CPP\": CPP Event Energy Charge $0.80000/kWh, Summer CPP Non-Event Credit On-Peak Energy Credit $(0.15170)/kWh, and Maximum Available Credit $(0.55677)/kWh for the Summer Season, footnoted \"the capped credit amount for CPP Customers dual participating in other demand response programs\". This filing therefore describes the non-CPP option only. The corpus files a CPP variant as its own modifier overlay (sce:tou-d-prime-cpp@2026-03-20); no tou-d-5-8pm-cpp exists yet, and tou-d-prime-cpp's own deferrals name this variant as outstanding. Recording it on the base filing follows the corpus convention: the 2026-03-20 version of this same schedule, tou-d-4-9pm@2026-03-20 and tou-d-prime@2026-03-20 all carry the equivalent entry in their deferrals arrays.",
 "Special Condition 7, Change of Rate Schedule (Sheet 18), governs how long a customer stays on this Option and is not in the model. Verbatim: \"At any time, a Customer on this Schedule may elect to leave his/her Option (e.g., Option 4-9 PM, Option 5-8 PM, Option PRIME, Option A, Option B) and elect to either: (1) switch to another Option of this Schedule for which they are eligible, or (2) transfer from this Schedule to another applicable residential rate schedule. The elected rate change will become effective on the next regularly scheduled meter read date following the Customer's notice to SCE. Unless the Customer was placed on an Option by SCE (i.e., defaulted), the Customer shall not be allowed to make an additional change in rate until 12 months of service has been provided under the elected rate, unless otherwise specified in that rate schedule.\" urpx:minimumTenure exists on RatePlanVersion and the model does not set it; the re-entry half has no v0.5.1 form.",
]
applicable_modifiers = [
 "care",
 "cca-crs",
 "da-crs",
 "deed-restricted",
 "fera",
 "tou-d-5-8pm-hpwh",
 "medical-baseline",
]

# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "Second SCE schedule, scaffolded from us/ca/sce/electricity/tou-d-4-9pm/versions/2025-11-15/. Same structure (24 PriceDefinitions, 4 TOUTiers, 6 TOUPeriods); differs from 4-9PM only in: on-peak/mid-peak time windows (5pm-8pm vs 4pm-9pm), super-off-peak end (5pm vs 4pm), per-period rate values (Sheet 4/5 of source PDF, leaves 90671-E and 90672-E), and the description (alternate CPUC default for inland climate zones vs the 4-9PM coastal default). Flat-rate surcharges (Trans/NSGC/NDC/PPPC/CIA/WFC/PUCRF), Fixed Recovery, MCAM, BSC, BSC Deed-Restricted Discount, Baseline Credit, and Climate Credit values are all identical to 4-9PM. Adds the Schedule TOU-D holiday calendar: the eight holidays named on Sheet 13, with urpx:includeHolidays / urpx:includeNonHolidays on the summer peak window so a holiday falling on a summer weekday resolves to Mid-Peak. Labor Day now prices as a Saturday. Winter is unaffected because Sheet 12's winter weekday and weekend/holiday columns are identical."
