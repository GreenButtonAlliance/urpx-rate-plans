# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Baseline Credit bound not modeled. Sheet 4 (Cal. P.U.C. leaf 90671-E, AL 5654-E, Effective Nov 15 2025) prices the credit at $(0.10449)/kWh and footnote *** limits it: \"The Baseline Credit applies up to 100% of the Baseline Allocation, regardless of Time-of-Use time period.\" This filing carries the credit as an unbounded per-kWh Price with no ServiceTiers at all, so a consumer billing from it credits every kWh and overstates the credit for any customer above baseline. Two routes exist at v0.5.1 and neither is clean. Precomputed absolute per-cell bounds (the pge:e-tou-c pattern, which ships 120 ServiceBrackets in a separate modifier file at the 2026-03-01 vintage) need the allocation quantities, and SCE publishes those only in Preliminary Statement Part H, which is in no PDF in this corpus, confirmed by grep across all 19 SCE PDFs. The other route needs nothing external, because the bound the footnote states is a percentage: urpx:ratio and urpx:percent are both UnitOfMeasureValue members, and a ServiceTiers whose referencesMetricInput points at a ratio-denominated MetricSpecification with brackets 0..1.0 and >1.0 validates. But the bound carries no unit of its own: a ServiceBracket holds a bare decimal, and whether 0..1.0 means a fraction of the allocation or one kilowatt-hour rides entirely on the MetricSpecification the tiers reference. sce:d ships that defect today at both dates: its baseline bracket is 0 to 1.0 against sce:ms-energy, whose unitOfMeasure is urpx:kWh, so the document says the baseline tier ends at one kilowatt-hour. Do not copy it.",
 "Heat Pump Water Heater additional baseline allocation not modeled. Sheet 4 footnote *** (leaf 90671-E): \"Additional Baseline Allocations apply for Customers with Heat Pump Water Heaters served under this Option. The Baseline Allocations are set forth in Preliminary Statement, Part H.\" Blocked twice. The quantities are in Part H, which this corpus does not hold. And v0.5.1 cannot state an allocation as an additive delta over the base: urpx-shacl:ServiceBracketShape is sh:closed over six properties whose bounds are absolute xsd:decimal values, with no delta property (upstream urpx-org/urpx#32 open on whether an additive quantity is meant to be representable). Precomputed absolute per-cell bounds are the available route once the Part H numbers are in hand. Related manifest cleanup, not a coverage item: hpwh-baseline names a directory that does not exist and should come out of applicable_modifiers on all five SCE manifests that list it.",
 "SCE's Sunday-to-Monday holiday observance (Schedule TOU-D Sheet 13: 'When any holiday listed above falls on Sunday, the following Monday will be recognized as a holiday. No change will be made for holidays falling on Saturday.'). New Year's Day, Independence Day, Veterans Day and Christmas in sce:tou-d-5-8pm-2025-11-15-holiday-calendar carry no urpx:observanceRule, so each resolves on its actual date. This version is in effect from 2025-11-15 until 2026-01-01, when no listed holiday falls on a Sunday, so the rule creates no Monday inside it and no dated observed holiday is carried; the 2026-03-20 filing carries them through 2040.",
 "Option 5-8 PM-CPP not modeled. Its three prices are on this filing's own operative Sheet 4 (leaf 90671-E, Effective Nov 15 2025), under the heading \"Option 5-8 PM-CPP\": CPP Event Energy Charge $0.80000/kWh, Summer CPP Non-Event Credit On-Peak Energy Credit $(0.15170)/kWh, and Maximum Available Credit $(0.55677)/kWh for the Summer Season, footnoted \"the capped credit amount for CPP Customers dual participating in other demand response programs\". This filing therefore describes the non-CPP option only. The corpus files a CPP variant as its own modifier overlay (sce:tou-d-prime-cpp@2026-03-20); no tou-d-5-8pm-cpp exists yet, and tou-d-prime-cpp's own deferrals name this variant as outstanding. Recording it on the base filing follows the corpus convention: the 2026-03-20 version of this same schedule, tou-d-4-9pm@2026-03-20 and tou-d-prime@2026-03-20 all carry the equivalent entry in their deferrals arrays.",
 "Special Condition 7, Change of Rate Schedule (Sheet 18), governs how long a customer stays on this Option and is not in the model. Verbatim: \"At any time, a Customer on this Schedule may elect to leave his/her Option (e.g., Option 4-9 PM, Option 5-8 PM, Option PRIME, Option A, Option B) and elect to either: (1) switch to another Option of this Schedule for which they are eligible, or (2) transfer from this Schedule to another applicable residential rate schedule. The elected rate change will become effective on the next regularly scheduled meter read date following the Customer's notice to SCE. Unless the Customer was placed on an Option by SCE (i.e., defaulted), the Customer shall not be allowed to make an additional change in rate until 12 months of service has been provided under the elected rate, unless otherwise specified in that rate schedule.\" urpx:minimumTenure exists on RatePlanVersion and the model does not set it; the re-entry half has no v0.5.1 form.",
]
applicable_modifiers = [
 "care",
 "cca-crs",
 "da-crs",
 "deed-restricted",
 "fera",
 "hpwh-baseline",
 "medical-baseline",
]

# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "Second SCE schedule, scaffolded from us/ca/sce/electricity/tou-d-4-9pm/versions/2025-11-15/. Same structure (24 PriceDefinitions, 4 TOUTiers, 6 TOUPeriods); differs from 4-9PM only in: on-peak/mid-peak time windows (5pm-8pm vs 4pm-9pm), super-off-peak end (5pm vs 4pm), per-period rate values (Sheet 4/5 of source PDF, leaves 90671-E and 90672-E), and the description (alternate CPUC default for inland climate zones vs the 4-9PM coastal default). Flat-rate surcharges (Trans/NSGC/NDC/PPPC/CIA/WFC/PUCRF), Fixed Recovery, MCAM, BSC, BSC Deed-Restricted Discount, Baseline Credit, and Climate Credit values are all identical to 4-9PM. Adds the Schedule TOU-D holiday calendar: the eight holidays named on Sheet 13, with urpx:includeHolidays / urpx:includeNonHolidays on the summer peak window so a holiday falling on a summer weekday resolves to Mid-Peak. Labor Day now prices as a Saturday. Winter is unaffected because Sheet 12's winter weekday and weekend/holiday columns are identical."
