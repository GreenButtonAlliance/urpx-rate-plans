# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Baseline Credit $(0.10108)/kWh (Sheet 4, AL 5725-E, effective 2026-01-01) is carried as an unbounded per-kWh credit with no urpx:ServiceTiers in the filing. The rate sheet footnote limits it: \"The Baseline Credit applies up to 100% of the Baseline Allocation, regardless of Time-of-Use time period.\" A consumer computing a bill therefore credits every kWh and overstates the credit for any customer above baseline. URPX v0.5.1 can express the bound (hasServiceTiers to ServiceTier to ServiceBracket with matching bound operators, as pge:e-tou-c does in absolute kWh). The blocker is the source, not the vocabulary: SCE publishes the allocations only in Preliminary Statement, Part H, which is committed to no filing in this corpus.",
 "Heat Pump Water Heater additional Baseline Allocation (Sheet 4 footnote: \"Additional Baseline Allocations apply for Customers with Heat Pump Water Heaters served under this Option\"). Blocked twice. The quantities are in Preliminary Statement, Part H, which this corpus does not hold. And an allocation stated as an increment on another allocation has no representation: urpx:ServiceBracket bounds are absolute xsd:decimal on a sh:closed shape, and urpx-org/urpx#32 is open on whether an additive quantity is meant to be representable. Precomputing absolute bounds per cell resolves it once Part H is sourced.",
 "SCE's Sunday-to-Monday holiday observance (Sheet 13: \"When any holiday listed above falls on Sunday, the following Monday will be recognized as a holiday. No change will be made for holidays falling on Saturday.\"). The eight holidays carry urpx:holidayRule text only, so each resolves on its actual date and the Monday after an Independence Day falling on a Sunday prices Summer On-Peak instead of the Mid-Peak Sheet 12 directs. Work, not a blocker: none of the four urpx:ObservanceRuleValue individuals is Sunday-only, but urpx:holidayDate is an optional xsd:date on urpx:Holiday, so adding one dated Holiday per Monday the rule creates expresses it. Sheet 12's winter weekday and weekend/holiday columns are identical and Labor Day is always a Monday, so only Independence Day matters: through 2045 the entries needed are 2027-07-05, 2032-07-05 and 2038-07-05.",
 "Option 5-8 PM-CPP, printed on this filing's own Sheet 4: CPP Event Energy Charge $0.80000/kWh, Summer CPP Non-Event On-Peak Energy Credit $(0.15170)/kWh, and Summer Season Maximum Available Credit $(0.58794)/kWh, with the CPP Event Period defined on Sheets 12 and 13 as 4 p.m. to 9 p.m. Work, not a blocker: sce/tou-d-prime-cpp already ships exactly this as a urpx:RatePlanModifier with the same three figures, so what is missing is a sibling tou-d-5-8pm-cpp filing listed in applicable_modifiers, not vocabulary. Note that the Maximum Available Credit caps the sum of credits across a dual-participation program; prime-cpp carries it as a plain Price that nothing enforces, and URPX has no way to bound one credit by the value of another.",
 "Special Condition 15 (Sheet 25) San Joaquin Valley Pilot Bill Protection Discount and Special Condition 16 (Sheet 25) Transitional Community Solar Discount: a 20 percent monthly bill discount each, the SJV discount dropping to 10 percent for years 6 through 10 if the pilot evaluation finds savings. Neither is modeled. A percentage of a computed subtotal is expressible (urpx:PriceSummary plus a multiplier Price with basedOnPrice, as sce/care and sce/fera already do against this filing's summary-discountable), but both are gated on pilot participation and clj-urpx 0.32.0 evaluates no urpx:ConditionExpression at resolution, so a gated discount would apply to every customer on the schedule and make the bill worse than omitting it. Partial source gap as well: Sheet 25 carries only the continuation of Special Condition 15, so the first-five-year discount rate is never stated in this PDF. Since clj-urpx 0.26.0 the omission is no longer silent: such a tier comes back marked :urpx.resolved/condition-gated, and marginal-unit-rate refuses with :condition-gated-tier rather than summing when a gated tier reaches the marginal, unless the caller passes :assume-conditions-hold? true.",
 "Special Condition 12 (Sheet 21): \"Any California Climate Credit not consumed in the billing period in which the credit is applied will roll over to each subsequent billing period until the credit is fully consumed.\" The $(36.00) per-household credit is modeled, with a urpx:ApplicabilityRule for April and October, but the carry-forward of an unconsumed balance is not. Whether URPX can express it is unsettled rather than closed: urpx:BillingCycle and urpx:settlementInterval exist in v0.5.1, no filing in this corpus uses either, and clj-urpx 0.32.0 reads neither.",
 "Special Condition 7, Change of Rate Schedule (Sheet 18), governs how long a customer stays on this Option and is not in the model. Verbatim: \"At any time, a Customer on this Schedule may elect to leave his/her Option (e.g., Option 4-9 PM, Option 5-8 PM, Option PRIME, Option A, Option B) and elect to either: (1) switch to another Option of this Schedule for which they are eligible, or (2) transfer from this Schedule to another applicable residential rate schedule. The elected rate change will become effective on the next regularly scheduled meter read date following the Customer's notice to SCE. Unless the Customer was placed on an Option by SCE (i.e., defaulted), the Customer shall not be allowed to make an additional change in rate until 12 months of service has been provided under the elected rate, unless otherwise specified in that rate schedule.\" urpx:minimumTenure exists on RatePlanVersion and the model does not set it; the re-entry half has no v0.5.1 form.",
 "Special Condition 10, Arrearage Management Plan (Sheet 19), in this filing's own PDF, changes what a customer on this Option owes and is not in the model. Verbatim: \"Once enrolled in the AMP, SCE shall forgive 1/12 of an eligible residential Customer's arrearage after each on-time payment. After 12 on-time payments, SCE shall forgive the remaining arrearage debt up to a maximum of $8,000 per instance of enrollment.\" Eligibility is six months of SCE service, CARE or FERA enrollment, at least one on-time payment, and an arrearage of $500 or greater at least 90 days old. The corpus's existing treatment, recorded in this filing's own CoverageClaim Evaluation as governing \"enrollment and account administration rather than price\", is the reading LAYOUT.md section 4.4 does not support.",
]
