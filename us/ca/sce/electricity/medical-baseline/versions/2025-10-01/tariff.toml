# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Schedule MB-E Sheet 1 (Revised Cal. P.U.C. Sheet 90597-E) says only that \"the effective Minimum Charge will be $5.00\", with no unit or period, and the model carries no Price for it. The 2025-11-15 SCE base sheets (Schedule D, and TOU-D Options 4-9 PM, 5-8 PM and A) priced \"Minimum Charge (Medical Baseline)\" at $0.173 per meter per day against a regular Minimum Charge of $0.346. The active 2026-03-20 base sheets carry no residential Minimum Charge: Schedule D replaced it with the Base Services Charge of $0.424 per meter per day, and the TOU-D schedule (filed here under tou-d-4-9pm, tou-d-5-8pm, tou-d-prime and tou-d-prime-cpp) lists one only on closed Option A, Sheets 8 and 9. The $5.00 therefore has no Minimum Charge on an active Otherwise Applicable Tariff to override. A minimum charge is a floor on the bill, which URPX v0.5.1 has no way to state; urpx-org/urpx#76 proposes min and max value expressions.",
 "The WFC exemption is transcribed as a fixed -$0.00591/kWh rather than expressed as a cancellation, and its Price declares startDate 2026-01-01 while this version is effective 2025-10-01, so the first quarter of the version's own window carries no credit and a medical baseline customer is billed the full WFC there. The base WFC over that window was $0.00595/kWh (sce:d 2025-11-15), not $0.00591 (sce:d 2026-03-20), so the pinned literal was also the wrong magnitude for it. Schedule MB-E prices the removal of whatever the WFC currently is (\"the Wildfire Fund Non-Bypassable Charge (WFC) shall not apply\"), which URPX v0.5.1 states directly: a Price with multiplier -1 and basedOnPrice naming the base plan's WFC Price, composed one base at a time so each credit resolves against a single unambiguous basis. Rebuilding it this way also removes the standing re-sync obligation every time SCE refiles the WFC.",
]

