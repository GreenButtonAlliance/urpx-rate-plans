# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "CPP time windows are not modeled, so both CPP prices apply at every hour. Special Condition 1 (Sheets 8 and 9): the CPP Event Window is \"the five-hour period from 4:00 p.m. to 9:00 p.m. during which SCE may designate the three-hour CPP Event Energy Charge Period\"; the CPP Event Energy Charge applies in that designated period, and during the Summer Season the CPP Non-Event Energy Credit Period is the hours of the window outside it, the whole window when no Event is called. This filing carries no TOUSchedule, TOUPeriod or TimeBracket. The window is expressible at v0.5.1 with urpx:hasTOUSchedule on the modifier's BillingModel (precedent: smud:tou-pev-credit); which three hours SCE designates is event data, not tariff data.",
 "Maximum Available Credit is carried as an additive credit of -0.41944 per kWh, but the schedule makes it a cap. Sheet 6 footnote: \"The Maximum Available Credit is the capped credit amount for CPP Customers dual participating in other demand response programs.\" Special Condition 3.d (Sheet 11): \"For CPP Customers eligible to continue to dually participate with Schedule D-SDP, the sum of credits provided by the dual participating demand response program of this Schedule will be capped.\" URPX v0.5.1 has no vocabulary for a bound on the sum of two credits: bounds exist only on ServiceBracket, and priceFloor / priceCeiling are DynamicPricing runtime clamps. Stop publishing it as an additive Price.",
 "Summer-only applicability is recorded on the Price rather than the PriceDefinition. Both credit Prices carry urpx:hasApplicabilityRule with month --06 --07 --08 --09, and neither PriceDefinition carries a month of its own. Moving the rule to the PriceDefinition is the modeling fix; URPX expresses the constraint either way.",
 "Exported generation is not distinguished. Special Condition 3 (Sheet 10): \"During the Summer Season, exported generation during the CPP Non-Event Energy Credit Period may result in charges under this Schedule. Exported generation during the CPP Event Energy Charge Period may result in applicable CPP Event energy credits, regardless of the season in which the CPP Event occurs.\" All three CPP prices share one direction-less MetricInput, sce:tou-d-prime-cpp-2026-10-01-mi-energy, so nothing in this filing separates imported from exported kWh. urpx:flowDirection on a MetricSpecification is the v0.5.1 route. Work, not a blocker.",
 "Bill Protection is not modeled. Special Condition 3.e (Sheet 11): \"A Customer served on CPP will receive a one-time Bill Protection credit for the positive sum, if any, in total CPP Event Energy Charges and total CPP Summer Non-Event Energy Credits as calculated under a the applicable Option with CPP, and as measured over a period of up to 12 months from the date the Customer elects an Option with CPP.\" What cannot be computed is its amount, the conditional positive-part arithmetic in 'the positive sum, if any'; v0.5.1 has no cap, floor or greater-of vocabulary outside DynamicPricing runtime clamps.",
 "Special Conditions 3.a to 3.c (Sheet 10) trigger and bound the CPP Event Energy Charge this filing prices at $0.80000/kWh, and none of it is in the model. Verbatim: \"SCE may, at its discretion, call a CPP Event any day.\" \"20 CPP Events are called per calendar year. Each CPP Event has a duration of 3 hours, for a total of 60 hours per calendar year.\" \"SCE will begin to notify Customers no later than 3:00 p.m. the day before a CPP Event.\" DynamicPricingShape and PriceUpdateRuleShape are both sh:closed and neither admits an event count, a duration, a notice interval or a trigger criterion, so this is a blocked deferral rather than unbuilt work.",
 "Special Condition 3.d's limits (Sheet 11: Bundled Service Customers only; Direct Access, CCA Service and Schedule S customers ineligible; no dual enrollment in other demand response programs) and Special Condition 3.f's 12-month minimum participation (Sheet 12) are availability terms the single EligibilityRule does not encode.",
 "The Maximum Available Credit Price is gated on a customer attribute this filing cannot decide: its ApplicabilityRule compares the CustomOperandNode 'Grandfathered D-SDP Dual Participation' to true, and whether a given customer continues dual participation with Schedule D-SDP is stated by no property of the document. A per-unit rate summed over the three Prices therefore rests on assuming the gate holds, so dev/baseline/marginal-rates.edn records this filing as refused rather than carrying a rate.",
]

