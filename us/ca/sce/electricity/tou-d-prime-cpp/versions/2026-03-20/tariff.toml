# Extraction ------------------------------------------------------------------
[extraction]
tool = "manual"
extracted_on = "2026-05-04"
notes = """
First filing of Option PRIME-CPP variant in this corpus. Modeled as a urpx:RatePlanModifier overlaying the base PRIME RatePlan (sce:tou-d-prime). Customer-state-driven sub-option that adds CPP event-window charges and non-event-window credits to a PRIME customer's bill. Sourced from the live TOU-D PDF: Sheet 6 carries the PRIME-CPP rate values (alongside PRIME headline rates), Sheets 12 and 15-16 document the CPP framework. Per the SCE convention documented in us/ca/sce/electricity/utility.toml, this filing is dated to the most recent per-sheet effective date in the source PDF (2026-03-20). Per-sheet effective dates relevant to the PRIME-CPP filing: Sheet 6 (Option PRIME-CPP rate values: Event Charge, Non-Event Credit, Maximum Available Credit) 2026-01-01 (AL 5725-E); Sheet 12 (Special Condition 1: TOU period definitions including CPP Event Period and CPP Non-Event Credit Period windows) 2022-06-01 (AL 4765-E); Sheet 15 (Special Condition 4: Critical Peak Pricing event framework, 12-15 events/year, day-before notification) 2022-06-01; Sheet 16 (Special Condition 4 continued: CPP participation rules, Maximum Available Credit cap, Bill Protection) 2019-03-01; Sheet 21, 2026-03-20, the newest sheet in the document and the one that drives the filing date. Modifier shape: modeled as a urpx:RatePlanModifier (sibling pattern to DA-CRS / CCA-CRS), NOT as a separate urpx:RatePlan, because PRIME-CPP customers pay the FULL base PRIME rate structure PLUS CPP-window adjustments and a modifier overlay is more lightweight than cloning the entire 25-PriceDefinition PRIME structure; the issue-original framing offered both 'fifth OR-path on PRIME' and 'separate RatePlan' options, and the modifier path is structurally cleaner and consistent with how DA-CRS and CCA-CRS overlay on the same residential bases. 3 PriceDefinitions (Sheet 6 of source PDF): CPP Event Energy Charge $+0.80000/kWh, which applies during the CPP Event Period (4 p.m.-9 p.m. summer or winter days, ON CPP Event days only; SCE may call any day a CPP Event; 12-15 events per calendar year, day-before notice); CPP Non-Event On-Peak Energy Credit $-0.15170/kWh, which applies during the CPP Non-Event Credit Period (4 p.m.-9 p.m. Summer Season days, ON non-CPP-Event days only), with no credit provided on exported generation (i.e. behind-the-meter solar output during 4 p.m.-9 p.m. doesn't earn the credit); and Maximum Available Credit $-0.58794/kWh (Summer Season cap), which caps the total credit a CPP customer can earn when dually participating in another DR program and applies only to customers grandfathered to dual participation with Schedule D-SDP under Option A-CPP / B-CPP terms (NOT directly applicable to PRIME-CPP customers per Sheet 16, but listed on Sheet 6 as a reference cap for the dual-participation grandfather; modeled here for completeness and forward use). Eligibility encoding: the customer must be enrolled in PRIME (the base RatePlan eligibility applies, qualifying technology: storage / EV / heat-pump / NBT) AND must have elected the CPP variant. The CPP election is encoded as a CustomOperandNode predicate 'CPP Election' = 'PRIME-CPP'. The bundled-service-only constraint per Sheet 16 SC 4.d (DA / CCA customers ineligible) is partly redundant with PRIME's existing service-role constraint and partly captured by the upstream OAT eligibility. Event-day gating, refactored 2026-05-04: the CPP Event Energy Charge Price uses urpx:hasDynamicPricing with dynamicPricingType=urpx:criticalPeakPricing + priceSource=urpx:wholesaleMarketSource + updateFrequency=urpx:eventTriggeredUpdates + a urpx:PriceUpdateRule whose description carries the SCE-specific event-trigger semantics (12-15 events/year, day-before notification, CAISO Flex Alert conditions). This is the canonical URPX v0.2.0 vocabulary for event-driven pricing, surfaced by the urpx-org/urpx PG&E B6-PDP example (commit 55584e2 on v0.2.0-candidate). Originally (commit 6720054) the Event Charge was modeled with an ApplicabilityRule + CustomOperandNode 'Is CPP Event Today' = true gate, a self-invented predicate, and was refactored 2026-05-04 to use hasDynamicPricing after pulling commit 55584e2 surfaced the canonical pattern; the vocabulary terms have been in v0.2.0 since the initial commit and we missed them when first modeling. The CPP Non-Event Credit Price (-$0.15170/kWh) RETAINS its ApplicabilityRule + CustomOperandNode 'Is CPP Event Today' = false gate, because the inverse polarity ('applies when no event is called') isn't naturally expressed by DynamicPricing, whose semantic is 'this Price is event-driven', not 'this Price applies in the absence of an event'. The Non-Event Credit also carries month --06 --07 --08 --09 for Summer Season gating. The Maximum Available Credit Price (-$0.58794/kWh) RETAINS its ApplicabilityRule + CustomOperandNode 'Grandfathered D-SDP Dual Participation' = true gate, a customer-attribute gate unrelated to event status and not a candidate for DynamicPricing. The time-of-day discrimination (the 4-9 p.m. window) is descriptive in the modifier prose and is not structurally encoded in this filing. The three prices sum to a net $+0.06036/kWh, an upper bound rather than any customer's adjustment: which of them applies on a given day turns on whether SCE called a CPP Event and on whether the customer is grandfathered into D-SDP dual participation, and this document states neither. Modeling deferrals, also carried structurally in [modeling].deferrals: (1) Bill Protection, the guarantee that for the first 12 months of CPP enrollment a customer pays no more than they would have under the equivalent non-CPP PRIME option, is a year-long bill calculation that doesn't fit a per-bill RatePlan/Modifier shape and is not modeled. (2) Event-day gating is carried declaratively: the Event Charge uses hasDynamicPricing for the canonical event-driven semantics, while the Non-Event Credit and Max Credit keep CustomOperandNode predicates because their gating semantics (inverse-event-polarity and grandfathered-customer-attribute, respectively) don't map to DynamicPricing, so the event calendar and the customer's grandfathered status are settled at billing time and not in this document. (3) No-export-credit rule: the CPP Non-Event Credit excludes kWh exported by behind-the-meter generation during 4 p.m.-9 p.m., which requires distinguishing import from export kWh on the energy metric input; not modeled. (4) Sibling 4-9 PM-CPP and 5-8 PM-CPP variants: the same modifier pattern would apply to TOU-D-4-9 PM and TOU-D-5-8 PM bases; tracked in those bases' tariff.toml deferrals, and can be modeled in a follow-up issue.

Source bytes. [source]: the server answered the 2026-05-04 download with the
PDF inside a multipart/form-data envelope (one part, filename
ELECTRIC_SCHEDULES_TOU-D.pdf, Content-Length 2088177), and that envelope,
sha256 aadbe85df805c38ac05d129a5a264f8c90830dd69cc8ffe55743a442ef853ccc, was
committed here as the PDF until 2026-10-06. The committed file is now the
part's body, extracted byte for byte with dev/fetch_tariff_documents.py
--unwrap, and the sha256 recorded above is its hash. The envelope's boundary
is generated per response, so an envelope hash identifies one response, not
the document.
"""

