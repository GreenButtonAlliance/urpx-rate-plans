# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "CPP Event Period and CPP Non-Event Credit Period time windows are not modeled, so both CPP prices apply at every hour. Sheet 13 (SC 1): 'CPP Event Energy Charge Periods: 4:00 p.m. to 9:00 p.m. summer and winter days during a CPP Event only. CPP Non-Event Energy Credit Periods: Summer Season days 4:00 p.m. to 9:00 p.m., when a CPP Event is not occurring.' Sheet 12's Option PRIME / PRIME-CPP table shows the CPP Event Period as 4 p.m. to 9 p.m. in all four weekday/weekend, summer/winter cells. This filing carries no TOUSchedule, TOUPeriod or TimeBracket. The earlier claim that the modifier inherits the base PRIME 4-9 p.m. window is wrong: the base splits 16:00-21:00 across Summer On-Peak weekday, Summer Mid-Peak weekend and Winter Mid-Peak, and no base period equals 16:00-21:00 on all days. Expressible at v0.5.1: urpx:hasTOUSchedule on the modifier's BillingModel plus urpx:touPeriodNumber on the PriceDefinitions, so the windows are stated in this filing rather than inherited. Precedent: smud:tou-pev-credit. Work, not a blocker.",
 "Maximum Available Credit is carried as an additive credit of -0.58794 per kWh, but the schedule makes it a cap. Sheet 6 footnote: 'The Maximum Available Credit is the capped credit amount for CPP Customers dual participating in other demand response programs.' Sheet 16 (SC 4.d): 'the sum of credits provided by the dual participating demand response program and Option A-CPP or Option B-CPP of this Schedule will be capped. The capped credit amount, also known as the Maximum Available Credit, is listed in the applicable Option A-CPP and Option B-CPP of this Schedule.' SC 4.d confines that grandfathering to Schedule D-SDP dual participants under Option A-CPP or Option B-CPP, so no Option PRIME-CPP customer is subject to it. URPX v0.5.1 has no vocabulary for a bound on the sum of two credits: bounds exist only on ServiceBracket, and priceFloor / priceCeiling are DynamicPricing runtime clamps. The Price carries urpx:unitPrice -0.58794 and no bound of any kind, so a consumer bills it as a credit on every kWh rather than as a limit on a sum. Stop publishing it as an additive Price.",
 "Summer-only applicability is recorded on the Price rather than the PriceDefinition. Both credit Prices carry urpx:hasApplicabilityRule with month --06 --07 --08 --09, and neither PriceDefinition carries a month of its own, so a reader that gates definitions by month finds nothing restricting the Summer Season credit of -0.15170 or the Summer Season Maximum Available Credit of -0.58794 to June through September. The corpus pattern for a month-restricted credit puts the rule on the PriceDefinition: sce:d-2026-03-20-pd-climate-credit carries month --04 --10 there. Moving the rule to the PriceDefinition is the modeling fix; URPX expresses the constraint either way, so this is not a URPX expressibility gap.",
 "No CPP credit for exported generation is not modeled. Sheet 15 (SC 4): 'No CPP credits will be provided for exported generation, i.e., energy produced and exported by the Customer's Generating Facility during CPP Non-Event Credit Periods.' The credit basis is import-side. urpx:flowDirection did not exist at v0.2.1 and does at v0.5.1 (MetricSpecification, FlowDirectionValue: forward, reverse, net, bidirectional, with forward noted as consumption/import), and other filings in this corpus already use it, sce:nbt-ms-energy-export among them. The fix is a credit-specific MetricInput whose MetricSpecification carries urpx:flowDirection urpx:forward; today all three CPP prices share one direction-less MetricInput, sce:tou-d-prime-cpp-mi-energy, so nothing in this filing separates imported from exported kWh and the credit is priced on both. Work, not a blocker.",
 "Bill Protection is not modeled. Sheet 16 (SC 4.e): 'A Customer served on CPP will receive a one-time Bill Protection credit for the positive sum, if any, in total CPP Event Energy Charges and total CPP Summer Non-Event Energy Credits ... as measured over a period of up to 12 months from the date the Customer elects an Option with CPP.' The obstacle is not the twelve-month span: urpx:intervalDuration expresses multi-month periods. Nor is the credit unrecordable: urpx:creditPriceProtection is a ChargeTypeValue member at v0.5.1 (verified in the ChargeTypeValue oneOf at abdfb521), so the line item can be declared and cited. What cannot be computed is its amount, the conditional positive-part arithmetic in 'the positive sum, if any'. SPARQL over the v0.5.1 ontology finds no cap, floor or greater-of vocabulary; priceFloor and priceCeiling are DynamicPricing runtime clamps. Same standard-level shape as a greater-of minimum charge.",
 "Special Condition 4.a, 4.b and 4.c (Sheets 15 and 16, in this filing's own PDF) bound and trigger the CPP Event Energy Charge this filing prices at $0.80000/kWh, and none of it is in the model. Verbatim: \"CPP Events: SCE may, at its discretion, call a CPP Event any day. CPP Events will be called based on any one of the following criteria: (1) California Independent System Operator (CAISO) Alert, (2) Forecasts of SCE system emergencies ... (3) Forecasts of extreme or unusual temperature conditions impacting system demand, or (4) Day-ahead load and/or price forecasts.\" \"Number of CPP Events: There will be a minimum of 12 CPP events and a maximum of 15 CPP Events per calendar year.\" \"SCE will begin to notify Customers no later than 3:00 p.m. the day before a CPP Event.\" The model carries a DynamicPricing node with one PriceUpdateRule; DynamicPricingShape and PriceUpdateRuleShape are both sh:closed and neither admits an event count, a notice interval or a trigger criterion, so this is a blocked deferral rather than unbuilt work.",
 "Special Condition 4.d's Direct Access and Community Choice Aggregation ineligibility, and Special Condition 5's attestation requirement (Sheet 17), are availability terms of this Option that the single EligibilityRule does not encode.",
 "The Maximum Available Credit Price is gated on a customer attribute this filing cannot decide: its ApplicabilityRule carries a urpx:ConditionExpression comparing the CustomOperandNode 'Grandfathered D-SDP Dual Participation' to true, and whether a given customer is grandfathered into Schedule D-SDP dual participation is stated by no property of the document. A per-unit rate summed over the three Prices therefore rests on assuming the gate holds, which would be a confident wrong number, and dev/baseline/marginal-rates.edn records every probe instant inside this filing's window as refused on the condition-gated-tier reason rather than carrying a rate.",
]

