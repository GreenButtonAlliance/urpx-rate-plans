[modeling]
complete = false
deferrals = [
 "CPP Event Period and CPP Non-Event Credit Period time windows are not modeled, so both CPP prices apply at every hour. Sheet 13 (SC 1): 'CPP Event Energy Charge Periods: 4:00 p.m. to 9:00 p.m. summer and winter days during a CPP Event only. CPP Non-Event Energy Credit Periods: Summer Season days 4:00 p.m. to 9:00 p.m., when a CPP Event is not occurring.' Sheet 12's Option PRIME / PRIME-CPP table shows the CPP Event Period as 4 p.m. to 9 p.m. in all four weekday/weekend, summer/winter cells. This filing carries no TOUSchedule, TOUPeriod or TimeBracket. The earlier claim that the modifier inherits the base PRIME 4-9 p.m. window is wrong: the base splits 16:00-21:00 across Summer On-Peak weekday, Summer Mid-Peak weekend and Winter Mid-Peak, and no base period equals 16:00-21:00 on all days. Expressible at v0.5.1 and read at the pin: urpx:hasTOUSchedule on the modifier's BillingModel plus urpx:touPeriodNumber on the PriceDefinitions, which clj-urpx 0.32.0 modifier-ledger-results gates against the modifier's own resolved period. Precedent: smud:tou-pev-credit. Work, not a blocker.",
 "Maximum Available Credit is carried as an additive credit of -0.58794 per kWh, but the schedule makes it a cap. Sheet 6 footnote: 'The Maximum Available Credit is the capped credit amount for CPP Customers dual participating in other demand response programs.' Sheet 16 (SC 4.d): 'the sum of credits provided by the dual participating demand response program and Option A-CPP or Option B-CPP of this Schedule will be capped. The capped credit amount, also known as the Maximum Available Credit, is listed in the applicable Option A-CPP and Option B-CPP of this Schedule.' SC 4.d confines that grandfathering to Schedule D-SDP dual participants under Option A-CPP or Option B-CPP, so no Option PRIME-CPP customer is subject to it. URPX v0.5.1 has no vocabulary for a bound on the sum of two credits: bounds exist only on ServiceBracket, and priceFloor / priceCeiling are DynamicPricing runtime clamps that no clj-urpx 0.32.0 code reads. Measured effect of the present shape, dev/baseline/marginal-rates.edn: -0.58794 is subtracted at all 19 probe instants, winter included. Stop publishing it as an additive Price.",
 "Summer-only applicability is recorded on the Price rather than the PriceDefinition, where nothing reads it. Both credit Prices carry urpx:hasApplicabilityRule with month --06 --07 --08 --09 on the Price; clj-urpx 0.32.0 evaluates the month gate in pd-active-in-month? against the PriceDefinition, and the corpus pattern that works is sce:d-2026-03-20-pd-climate-credit. Measured: the Summer Season credit of -0.15170 is applied at every winter probe instant. Moving the rule to the PriceDefinition is the modeling fix. It will not change the pinned consumer's number on its own, because modifier-ledger-results does not month-gate at all; that half is a clj-urpx issue, not a URPX expressibility gap.",
 "No CPP credit for exported generation is not modeled. Sheet 15 (SC 4): 'No CPP credits will be provided for exported generation, i.e., energy produced and exported by the Customer's Generating Facility during CPP Non-Event Credit Periods.' The credit basis is import-side. urpx:flowDirection did not exist at v0.2.1 and does at v0.5.1 (MetricSpecification, FlowDirectionValue: forward, reverse, net, bidirectional, with forward noted as consumption/import), and 22 filings in this corpus already use it, sce:nbt-ms-energy-export among them. The fix is a credit-specific MetricInput whose MetricSpecification carries urpx:flowDirection urpx:forward; today all three CPP prices share one direction-less MetricInput, sce:tou-d-prime-cpp-mi-energy. At the pin, clj-urpx uses flowDirection only to exclude reverse ledgers from the import marginal, so this is declaratively correct rather than enforced. Work, not a blocker.",
 "Bill Protection is not modeled. Sheet 16 (SC 4.e): 'A Customer served on CPP will receive a one-time Bill Protection credit for the positive sum, if any, in total CPP Event Energy Charges and total CPP Summer Non-Event Energy Credits ... as measured over a period of up to 12 months from the date the Customer elects an Option with CPP.' The obstacle is not the twelve-month span: urpx:intervalDuration expresses multi-month periods and the corpus uses P1D, P1M, P2M and P6M. Nor is the credit unrecordable: urpx:creditPriceProtection is a ChargeTypeValue member at v0.5.1 (verified in the ChargeTypeValue oneOf at abdfb521), so the line item can be declared and cited. What cannot be computed is its amount, the conditional positive-part arithmetic in 'the positive sum, if any'. SPARQL over the v0.5.1 ontology finds no cap, floor or greater-of vocabulary; priceFloor and priceCeiling are DynamicPricing runtime clamps and are read by nothing in clj-urpx 0.32.0. Same standard-level shape as a greater-of minimum charge.",
 "Special Condition 4.a, 4.b and 4.c (Sheets 15 and 16, in this filing's own PDF) bound and trigger the CPP Event Energy Charge this filing prices at $0.80000/kWh, and none of it is in the model. Verbatim: \"CPP Events: SCE may, at its discretion, call a CPP Event any day. CPP Events will be called based on any one of the following criteria: (1) California Independent System Operator (CAISO) Alert, (2) Forecasts of SCE system emergencies ... (3) Forecasts of extreme or unusual temperature conditions impacting system demand, or (4) Day-ahead load and/or price forecasts.\" \"Number of CPP Events: There will be a minimum of 12 CPP events and a maximum of 15 CPP Events per calendar year.\" \"SCE will begin to notify Customers no later than 3:00 p.m. the day before a CPP Event.\" The model carries a DynamicPricing node with one PriceUpdateRule; DynamicPricingShape and PriceUpdateRuleShape are both sh:closed and neither admits an event count, a notice interval or a trigger criterion, so this is a blocked deferral rather than unbuilt work.",
 "Special Condition 4.d's Direct Access and Community Choice Aggregation ineligibility, and Special Condition 5's attestation requirement (Sheet 17), are availability terms of this Option that the single EligibilityRule does not encode.",
 "The pinned consumer refuses this filing's marginal rather than returning a number. clj-urpx 0.32.0 evaluates no urpx:ConditionExpression, but since 0.26.0 it marks a gated tier :urpx.resolved/condition-gated and marginal-unit-rate throws :condition-gated-tier instead of summing it. The Maximum Available Credit Price keeps its 'Grandfathered D-SDP Dual Participation' gate, which is what trips this, and every probe instant is recorded refused on that reason in dev/baseline/marginal-rates.edn. That is the intended outcome rather than a regression: the gate is a customer-attribute constraint this library does not evaluate, so summing across it would have produced a confident wrong number. :assume-conditions-hold? true restores the pre-0.26.0 every-condition-true behaviour.",
]

