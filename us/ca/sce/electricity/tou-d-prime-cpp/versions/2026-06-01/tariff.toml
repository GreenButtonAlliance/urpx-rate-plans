# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "CPP time windows are not modeled, so both CPP prices apply at every hour. Special Condition 1 (Sheet 9): \"CPP Event Energy Charge Periods: 4:00 p.m. to 9:00 p.m. summer and winter days during a CPP Event only. CPP Non-Event Energy Credit Periods: Summer Season days 4:00 p.m. to 9:00 p.m., when a CPP Event is not occurring.\" This filing carries no TOUSchedule, TOUPeriod or TimeBracket. Expressible at v0.5.1 with urpx:hasTOUSchedule on the modifier's BillingModel (precedent: smud:tou-pev-credit). Work, not a blocker.",
 "Maximum Available Credit is carried as an additive credit of -0.58794 per kWh, but the schedule makes it a cap. Sheet 6 footnote: \"The Maximum Available Credit is the capped credit amount for CPP Customers dual participating in other demand response programs.\" Special Condition 3.d (Sheet 11): \"For CPP Customers grandfathered to continue to dually participate with Schedule D-SDP, the sum of credits provided by the dual participating demand response program of this Schedule will be capped.\" URPX v0.5.1 has no vocabulary for a bound on the sum of two credits. Stop publishing it as an additive Price.",
 "Summer-only applicability is recorded on the Price rather than the PriceDefinition. Both credit Prices carry urpx:hasApplicabilityRule with month --06 --07 --08 --09, and neither PriceDefinition carries a month of its own. Moving the rule to the PriceDefinition is the modeling fix; URPX expresses the constraint either way.",
 "No CPP credit for exported generation is not modeled. Special Condition 3 (Sheet 10): \"No CPP credits will be provided for exported generation, i.e., energy produced and exported by the Customer's Generating Facility during CPP Non-Event Credit Periods.\" All three CPP prices share one direction-less MetricInput, sce:tou-d-prime-cpp-2026-06-01-mi-energy, so the credit is priced on imported and exported kWh alike. urpx:flowDirection on a MetricSpecification is the v0.5.1 route. Work, not a blocker.",
 "Bill Protection is not modeled. Special Condition 3.e (Sheet 11): \"A Customer served on CPP will receive a one-time Bill Protection credit for the positive sum, if any, in total CPP Event Energy Charges and total CPP Summer Non-Event Energy Credits as calculated under a the applicable Option with CPP, and as measured over a period of up to 12 months from the date the Customer elects an Option with CPP.\" What cannot be computed is its amount, the conditional positive-part arithmetic in 'the positive sum, if any'; v0.5.1 has no cap, floor or greater-of vocabulary outside DynamicPricing runtime clamps.",
 "Special Conditions 3.a to 3.c (Sheet 10) trigger and bound the CPP Event Energy Charge this filing prices at $0.80000/kWh, and none of it is in the model. Verbatim: \"SCE may, at its discretion, call a CPP Event any day.\" \"There will be a minimum of 12 CPP events and a maximum of 15 CPP Events per calendar year.\" \"SCE will begin to notify Customers no later than 3:00 p.m. the day before a CPP Event.\" DynamicPricingShape and PriceUpdateRuleShape are both sh:closed and neither admits an event count, a notice interval or a trigger criterion, so this is a blocked deferral rather than unbuilt work.",
 "Special Condition 3.d's limits (Sheet 11: Bundled Service Customers only; Direct Access, CCA Service and Schedule S customers ineligible; no dual enrollment in other demand response programs) and the PRIME attestation of Special Condition 4 (Sheet 12) are availability terms the single EligibilityRule does not encode.",
 "The Maximum Available Credit Price is gated on a customer attribute this filing cannot decide: its ApplicabilityRule compares the CustomOperandNode 'Grandfathered D-SDP Dual Participation' to true, and whether a given customer continues dual participation with Schedule D-SDP is stated by no property of the document. A per-unit rate summed over the three Prices therefore rests on assuming the gate holds, so dev/baseline/marginal-rates.edn records this filing as refused rather than carrying a rate.",
]

