# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Component exemptions by customer group are not modeled. Sheet 3 (Cal. P.U.C. Sheet 74861-E) carries the table \"Applicability and Exemption\" and Special Condition 1.b on Sheet 11 (90852-E) restates it in words: eight customer groups, of which five are exempt from components this filing charges to every customer. DA customers on Medical Baseline are exempt from the Wildfire Fund Non-Bypassable Charge; DA customers on CARE are exempt from that charge and from the Fixed Recovery Charge; DA customers on FERA are exempt from the Fixed Recovery Charge; Continuous DA customers are exempt from the Wildfire Fund charge and from the Power Charge Indifference Adjustment; Returning Continuous DA customers are exempt from the Wildfire Fund charge. Green Rate and Transitional Bundled Service customers are subject to all four and need nothing. Sheet 3's footnote compounds them: except for Green Rate customers, a customer qualifying for several groups gets every exemption of all of them. This is unbuilt work and not a vocabulary gap: sce:care-price-wfc-exemption-2026-10-01 and sce:medical-baseline-price-wfc-exemption-2025-10-01 already cancel a base component with a negative unitPrice. Build it as per-subgroup exemption credits of that shape rather than as per-Price ConditionExpression gates.",
 "The base plan's Wildfire Fund Non-Bypassable Charge is not cancelled, so composing this modifier with its base double-charges it. Sheet 2 (74860-E) says \"With the exception of the CTC and WFC, all charges, terms, and conditions of the customer's Otherwise Applicable Tariff (OAT), or contract rate shall apply\", and Schedule D Sheet 3 (91559-E) footnote 9 says the same from the base side: DA and CCA customers are not subject to the WFC component of that Schedule but instead pay it under Schedule DA-CRS. sce:d-2026-10-01-price-wfc is ungated at $0.00591/kWh and this modifier adds a second $0.00591/kWh. The fix is a cancelling Price of -0.00591 here, the shape sce:care already uses; check sce:tou-d-4-9pm, sce:tou-d-5-8pm and sce:tou-d-prime for the same ungated component. The CTC half of the Sheet 2 sentence needs no cancelling Price of its own, because Schedule D recovers the CTC inside the Generation UG component rather than as a separate Price, and this filing's Generation offset cancels that component.",
 "Only the Domestic rate group is modeled. Sheets 4 through 10 (91564-E through 91570-E) publish the same twenty-three values for thirteen further rate groups: GS-1, TC-1, GS-2, TOU-GS-3, TOU-8 Secondary, TOU-8 Primary, TOU-8 Subtransmission, Small Agricultural, Large Agricultural, Street Lighting, Standby Secondary, Standby Primary and Standby Subtransmission. Three hundred and twenty-two cells in the source against twenty-three modeled. Whether these count against a residential-focused corpus is an open corpus-level scope ruling, not a fact about this filing: LAYOUT 4.4 scopes complete to the source document, which argues they count, while no SCE non-residential base plan exists here for them to attach to. Recorded so the exclusion is stated rather than silent; the ruling belongs in MODELING-GAPS.md and settles smud:eapr Section V and sdge:care Section 2 at the same time.",
 "Sheet 1 APPLICABILITY names three customer classes and the EligibilityRule tests one. Verbatim: \"Applicable to Customers including those classified as (1) Direct Access (DA) Customers, (2) any Customer served under Bundled Service and Schedule PC-TBS during the transitional period, (3) and Bundled Service Customers served on Schedules GTSR-GR and GTSR-CR.\" The single EligibilityRule compares a CustomOperandNode \"Energy Service Type\" to \"Direct Access\". Sheet 3's Applicability and Exemption table and Special Condition 1.b treat these as distinct groups with distinct component exemptions.",
 "PCIA Vintage Methodology determines which of the 20 modeled PCIA Prices applies and is not derived anywhere in the model. Sheet 11 Special Condition 1.c, verbatim: \"i. Continuous DA Customers: the applicable PCIA vintage is year 2001 ii. All other DA Customers: the applicable PCIA vintage shall be determined by SCE's acceptance date of the customer's Six-Month Notice to Switch to DA Service (PCIA Vintage Determination Date). If the PCIA Vintage Determination Date is on or after January 1st and before July 1st, the PCIA vintage shall be set for the prior year. If the PCIA Vintage Determination Date is on or after July 1st and before January 1st, the PCIA vintage shall be set for the current year.\" Special Condition 1(TBS).b and Special Condition 2.b give the Transitional Bundled Service and Green Rate variants, and Special Condition 3 preserves vintage and exemption status across a DA to CCA switch. The model treats the vintage as a customer-supplied attribute. The model's own CoverageClaim already names this as a gap; the assessment dropped it because \"under the stated standard this reads as customer classification\", which is the reading being corrected.",
]
