notes         = """
First filing of Schedule DA-CRS in this corpus (URPXT-cah.9). Sourced
from the live tariff-book Other Rates SharePoint folder. Schedule
DA-CRS lives outside the Residential Rates folder because it's a
cross-class cost-responsibility surcharge applicable to any departing-
load customer (Domestic / Commercial / Agricultural — only the
Domestic-class values are modeled here).

Per the SCE convention documented in us/ca/sce/electricity/utility.toml, this
filing is dated to the most recent per-sheet effective date in the
document — newest stamp 90853-E (Sheet 9 PCIA 2026 Vintage), AL 5725-E,
effective 2026-01-01.

(Note: 2026-01-01 not 2026-03-20 here. The other Schedule TOU-D-
sourced filings in URPXT-cah are dated 2026-03-20 because the source
TOU-D PDF has Sheets 20-21 effective 2026-03-20. The DA-CRS PDF's most
recent sheet is 2026-01-01; no AL has touched DA-CRS since then.)

Per-sheet effective dates within the source PDF:
  Sheets 1-3 (Applicability + Composition of Rate + Customer Group
    Exemption table) — 2023-07-27 (AL 4882-E, baseline)
  Sheet 3 (Domestic-class WFC + CTC + FRC values) — 2025-06-30
    (AL 5560-E or similar; values 0.00591 / 0.00014 / 0.00619)
  Sheets 4-9 (PCIA per-vintage rate tables) — 2026-01-01
    (AL 5725-E, leaves 90840-E through 90853-E)

## Modifier shape

Schedule DA-CRS is published as an additive overlay applied to a DA
customer's Otherwise Applicable Tariff (OAT). Modeled here as a
urpx:RatePlanModifier with applicableToRatePlan: [sce:d, sce:tou-d-
4-9pm, sce:tou-d-5-8pm, sce:tou-d-prime] (the four currently-modeled
SCE residential bases). Eligibility: customer's Energy Service Type =
'Direct Access' (CustomOperandNode predicate, evaluated against
customer-state input).

4 PriceDefinitions, each on its own Ledger so urpx.price/marginal-
unit-rate sums all four contributions independently:
  - WFC (Wildfire Fund Non-Bypassable Charge): 0.00591 $/kWh
  - CTC (Competition Transition Charge):       0.00014 $/kWh
  - FRC (Fixed Recovery Charge):               0.00619 $/kWh
  - PCIA (Power Charge Indifference Adjustment): vintage-conditional,
    20 vintages 2001 through 2026 with values from $-0.00644 (2025
    and 2026 vintages — credits, where DA customers' departing load
    is below market price) to $0.02624 (2023 vintage)

Per-vintage PCIA Prices each carry a urpx:hasApplicabilityRule with
a ConditionExpression that gates on the customer's `DA Vintage Year`
(CustomOperandNode property). Currently the urpx.price resolver does
NOT enforce ConditionExpression-based ApplicabilityRules at marginal-
rate computation time — this is a documented future enhancement (see
clj-urpx/src/urpx/price.clj 'Unmapped alternatives are silently
skipped — programmatic ConditionExpression evaluation against a
customer profile is a future enhancement'). The current resolver
picks the FIRST PCIA Price (2001 vintage) as a fallback when no
vintage context is provided. This behavior is forward-compatible:
when the resolver gains ConditionExpression evaluation, the existing
ApplicabilityRules will start filtering correctly.

## Modeling deferrals

  1. **OAT-side adjustments not modeled.** Per TOU-D Sheet 18 SC 11(b)
     and Schedule D Sheet 6 SC 4(b), the DA customer's OAT charges
     apply EXCEPT the DWRBC component is subtracted from total
     Delivery Service before billing-determinant multiplication; and
     the OAT Generation rate is effectively replaced by the DA
     customer's ESP charges (off-bill from SCE's perspective). This
     OAT-side adjustment is NOT modeled — would require itemizing
     DWRBC as a separate PriceDefinition in the base TOU-D / Schedule
     D filings (currently embedded in the PPPC column, not broken
     out), and would also need a "zero-out OAT Generation" mechanism
     that URPX doesn't currently support natively.

  2. **Customer-subgroup exemptions partially captured.** DA-CRS
     Sheet 3 customer-group exemption table distinguishes Direct
     Access (DA), PC-TBS, GTSR-GR, and GTSR-CR subgroups with
     different per-component applicability. Only the default DA
     subgroup is captured by the EligibilityRule here; the other 3
     subgroups need separate RatePlanModifier filings or a
     subgroup-discriminating EligibilityRule extension.

  3. **Sibling Schedule CCA-CRS** carries identical Domestic-class
     PCIA values for CCA-Service customers — modeled at
     us/ca/sce/electricity/cca-crs/.

  4. **PCIA stacking with CARE/FERA exemptions** not modeled here.
     CCA-CRS Sheet 3 has a richer customer-subgroup exemption table
     (CCA on Medical Baseline → WFC-exempt; CCA on CARE → WFC + FRC
     exempt; etc.). Same pattern applies to DA-CRS where compatible.
     These are stacking interactions with the already-modeled
     CARE / FERA / Medical-Baseline modifiers; deferred to a
     follow-up issue.
"""

