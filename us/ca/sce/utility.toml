ANONYMOUS DOWNLOAD RECIPE
-------------------------
SharePoint anonymous-share folders use opaque share-token URLs in the
:f:/t/Public/TM2/<token> form. Direct curl against the rendered file
path returns 403 — the FedAuth cookie must first be established by
navigating the share-token URL in a real browser.

 # 1. Open the share-token folder URL in spel — the browser
 # establishes an anonymous FedAuth cookie scoped to the tenant.
 spel open "https://edisonintl.sharepoint.com/:f:/t/Public/TM2/<token>"

 # 2. Extract the cookie.
 FEDAUTH=$(spel cookies | awk -F= '/^FedAuth=/{print $2}' | awk '{print $1}')

 # 3. Download via the SharePoint download.aspx endpoint.
 BASE="https://edisonintl.sharepoint.com/teams/Public/TM2/_layouts/15/download.aspx"
 SRC="/teams/Public/TM2/Shared Documents/Public/Regulatory/<full-path-to-pdf>"
 curl -sL -o "$(basename "$SRC")" -b "FedAuth=$FEDAUTH" "${BASE}?SourceUrl=${SRC}"

The cookie has a limited lifespan (minutes to a few hours, not days);
pull a target set in one session. Cache canonical URLs in each filing's
tariff.toml [source.url] using the rendered path form (more readable
than share-token URLs). Recompute sha256 on subsequent fetches to
detect in-place reissuances.

For ad-hoc lookups outside this recipe, contact tariffs.manager@sce.com
(per SCE's regulatory page) — there is no public direct-download API
as of 2026.

Alternative cross-check source: OEDI USURDB
(https://apps.openei.org/USURDB/) has SCE rates parsed but is
community-curated, not authoritative — useful for cross-checking values,
not as the source-of-record for filings here.

MIXED PER-SHEET EFFECTIVE DATES WITHIN A SINGLE PDF
---------------------------------------------------
Each live-tariff-book PDF carries per-sheet revisions whose effective
dates drift out of sync as advice letters take effect on different
sheets at different times. Example: the live ELECTRIC_SCHEDULES_TOU-D.pdf
as of 2026-05-04 contains sheets effective Oct 1 2025, Nov 15 2025,
Jan 1 2026, and Mar 20 2026 because each sheet was last touched by
a different advice letter. PG&E's tariff PDFs do not exhibit this —
each PG&E PDF generally carries one effective date for the whole
document.

Convention for this corpus: treat the SCE PDF as a single filing dated
to the *most recent per-sheet effective date* in the document — the
date on which the rate plan in its currently-serialized form became
effective. Earlier-dated sheets are unchanged since their last revision;
the PDF as a whole is a snapshot of what's in force right now. Record
the per-sheet effective dates in tariff.toml [extraction.notes] for
traceability.

Two alternatives were considered and rejected for the common case:

 (1) Multiple urpx:RatePlanVersion entries in an @graph, one per
 sheet-effective-date. Faithful to advice-letter granularity but
 heavy — implies parallel rate publications when the per-sheet
 structure is really just bookkeeping for sheet replacements.
 Reserve this pattern for cases like PG&E's 2026-03-27 partial
 reissue, where ONE advice letter explicitly publishes multiple
 per-sheet effective dates simultaneously.

 (2) Carving the PDF into multiple per-effective-date filings
 (versions/2025-01-01/, versions/2025-03-01/, ...). Most granular
 but very high effort, and many sheet revisions are typographical
 or non-rate updates.

Either alternative remains available if a specific SCE filing's
structure demands it — but the default for SCE consolidated tariff-book
PDFs is single-filing-dated-to-most-recent.
