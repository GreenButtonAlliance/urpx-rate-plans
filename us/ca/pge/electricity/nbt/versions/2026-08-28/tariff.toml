# MIDAS RIN cross-reference ---------------------------------------------------
# Each Delivery Component Price carries its CEC MIDAS Rate Identification
# Number in urpx:name. PG&E E-ELEC NBT RINs:
# USCA-PGXX-3500-0000 E-ELEC + NBT23-CCA (Delivery)
# USCA-PGXX-3600-0000 E-ELEC + NBT24-CCA (Delivery)
# USCA-PGXX-3900-0000 E-ELEC + NBT25-CCA (Delivery)
# USCA-PGXX-4000-0000 E-ELEC + NBT26-CCA (Delivery)
# CCA-flavored AltRateName1 is a labeling artifact: Delivery values are
# system-wide and apply identically to Bundled and CCA customers.
# Generation Component Prices are NOT RIN-tagged: PG&E does not publish
# Generation EEC via MIDAS (USCA-XXPG family contains only SGIP and Flex
# entries). Same pattern as SCE.
# Tagging tool: scripts/tag-pge-nbt-prices-with-midas-rins.py

# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "PG&E's TOU schedules take holiday dates as \"those on which the holidays are legally observed\", read here as California Government Code section 6701: \"(a) If January 1, February 12, March 31, July 4, September 9, November 11, or December 25 falls upon a Sunday, the Monday following is a holiday. (b) If November 11 falls upon a Saturday, the preceding Friday is a holiday.\" In this modifier's own calendar, pge:nbt-2026-08-28-holidays, a weekday holiday takes the weekend export value. Veterans Day carries urpx:nearestWeekdayObservance, which is exactly 6701 for November 11. New Year's Day, Independence Day and Christmas Day carry urpx:actualDateObservance, so a Saturday one stays on Saturday, and the Monday after a Sunday one is carried as a dated urpx:Holiday with urpx:holidayDate: 2027-07-05, 2032-07-05, 2033-12-26, 2034-01-02, 2038-07-05, 2039-12-26 and 2040-01-02. After 2040 each Sunday New Year's Day, Independence Day or Christmas Day needs a further dated entry, until urpx:mondayIfSundayObservance (proposed in urpx-org/urpx#77) can state the rule; the dated entries then come out.",
 "ACC Plus adder is carried for the 2025 interconnection vintage only, at -0.01320 residential and -0.05400 low income. Sheet 11 prints the whole table: Residential 0.02200, 0.01760, 0.01320, 0.00880, 0.00440 for vintages 2023 through 2027, and Residential Low Income 0.09000, 0.07200, 0.05400, 0.03600, 0.01800. Eight Prices are missing. Each missing row is one Price in each customer-segment cell of its vintage, which means splitting that vintage's ProfileAlternative by NBT Customer Segment as the 2025 one is split, so this is work, not a blocker.",
 "The four exclusions from the ACC Plus adder that Sheets 11 and 12 list are not modeled: customers transitioning from NEM or NEM2 at the end of their legacy period, Change of Party customers who bought a building with an existing system, non-residential customers, and customers required to add solar by building code. Expressible with the same CustomOperandNode predicates the filing already uses for REGF and interconnection vintage.",
 "Sheet 17 SC 2.d requires generation export credits to offset only volumetric generation charges and delivery export credits only volumetric delivery charges, but both Export Compensation Rate PriceDefinitions carry urpx:bundledPortion and both Ledgers urpx:bundledLedger, flattening the distinction the schedule makes load-bearing. v0.5.1 offers supplyPortion and deliveryPortion, supplyLedger and deliveryLedger, and the chargeTypes exportCredit and creditGeneration where all four PriceDefinitions currently use creditEnergy. The offset rule itself, including the SC 2.f rule that the Public Purpose Program, Nuclear Decommissioning, Competition Transition and Wildfire Fund charges cannot be reduced by export credits while ACC Plus credits can, is a consumer-side billing rule with no URPX expression.",
 "Net Surplus Compensation (SC 5, Sheets 27 to 29) is not carried, and the schedule publishes no NSC number. Sheet 27 SC 5.b defines the NSC Rate as a simple rolling average of PG&E's default load aggregation point price from 7 a.m. to 5 p.m. over a 12-month period, recalculated monthly. v0.5.1 can declare the shell (a Price with hasDynamicPricing, dynamicPricingType urpx:indexBasedPricing, priceSource urpx:wholesaleMarketSource, updateFrequency urpx:monthlyUpdates, plus a PriceUpdateRule carrying the SC 5.b text) but carries no value. The Sheet 28 SC 5.d arithmetic, which compares cumulative exports against cumulative imports over the Relevant Period and then debits at the average realized export compensation rate and credits at the NSC Rate, has no URPX expression.",
 "The Net Surplus Compensation Renewable Attribute Adder (Sheet 28 SC 5.c) is not carried. Its value is the most recent WECC average renewable premium submitted by annual advice letter, which is in no PDF in this corpus, and it is contingent on the customer transferring WREGIS Certificates to PG&E. This is a source gap before it is anything else.",
 "Annual true-up over the Relevant Period is not carried (SC 2.g and 2.h, Sheets 18 to 19, and SC 2.e, Sheet 17). Unused generation and delivery export credits carry forward within the Relevant Period and then into the next one, and are forfeited at the last true-up once the customer is no longer served under NBT. urpx:BillingCycle exists with intervalDuration, intervalType and intervalAlignment, but no filing in this corpus uses it, so whether a year-long settlement window is meant to be representable is unsettled upstream.",
 "Load Aggregation (SC 6) prices two charges this filing does not carry. Sheet 30: a One-Time Setup Charge of $25.00 per Aggregated Account and for the Generating Account, cumulatively limited to no more than $500 per Load Aggregation Arrangement, with the limit not applying to accounts added after the PTO date, plus a Monthly Charge of $5 per Aggregated Account and for the Generating Account. The $5 monthly charge is expressible. The $500 cumulative cap is not, because urpx:unitOfMeasure is domain-restricted to MetricSpecification and its members contain no currency, and neither is the per-account dimension, because URPX carries no account identity. NBTA is neither a separate filing nor non-residential: Sheet 1 states that residential customers, including Load Aggregation Generating and Aggregated Accounts, take NBT on E-ELEC.",
 "NBT Paired Storage (SC 8, Sheets 34 to 43) prices two things this filing does not carry. Sheet 43 caps the fee for installing standard metering equipment at $600.00, with no cap for complex metering, and states only the cap rather than a fee. Sheet 41 caps monthly NBT-eligible exports for Small NBT Paired Storage without a Certified PCS at a CSI EPBB calculator production estimate, with excess forfeited and deemed to have occurred in the highest price period of the billing cycle; that bound is a per-customer output of an external calculator and has no URPX expression. SC 8 is a Special Condition inside this PDF, not a sibling filing, and footnote 14 on Sheet 41 applies the estimation methodology to residential customers.",
 "Multiple Tariff Facilities (SC 4, Sheets 25 to 26) is not carried, and Sheet 12 section F prices it: for NBT-MT, only the Renewable Portion of the exports to the grid will be credited, valued as in the Export Credits section. Nothing in SC 4, the Sheet 8 overview, or the Sheet 13 sub-schedule list restricts NBT-MT to non-residential customers; it is defined by facility configuration, multiple generators behind one revenue meter. The renewable proportion itself comes from the customer's generator mix, not from the tariff.",
 "Special Condition 7 NBT Legacy Provisions beyond the vintage lock-in: permanent forfeiture of remaining NEM or NEM2 transition eligibility when a customer switches to NBT early and the bar on changing back, and the rule that customers arriving at the end of a NEM/NEM2 or NEM2A legacy period may not start a new legacy period under NBT and get no 9-year legacy treatment, and the Sheet 32 rule (61550-E) that a NEM or NEM2 customer moved to NBT by a modification or repair exceeding its tariff's threshold begins a new 9-year legacy period from the modification's PTO date. The vintage ProfileAlternatives carry only which Export Compensation Rate vintage applies.",
 "Special Condition 10 Prevailing Wage: the PU Code Section 769.2 contractor wage and payroll requirements that condition a facility's participation in a Section 2827 or 2827.1 tariff, loss and regain of tariff access on a willful violation and its reversal, and the January 1, 2025 bar on violating contractors applying to interconnect. Named in coverage prose only.",
 "Special Condition 9 Natural or Human-Made Disasters: service on this tariff from the original pre-disaster permission-to-operate date through the customer's first Energy True Up in the tenth year, the replacement-system sizing limit and proof-of-destruction condition on reapplication, the oversizing attestation, and the true-up plus Net Surplus Compensation treatment up to the date of the disaster. Named in coverage prose only.",
 "Sheet 10 (59900-E, Advice 7155-E-A, effective 2024-07-01): 'Bundled customers are eligible to receive both generation components and delivery components from PG&E, while unbundled customers will only receive delivery components from PG&E.' The Generation and Delivery Export Compensation Rate Prices carry no condition on bundled service, so a Direct Access or Community Choice Aggregation customer composing this modifier is credited the generation component PG&E does not pay it. Expressible as a condition on pge:program-cca, pge:program-da and pge:program-tbs over the Generation Prices, or as a urpx:ProfileAlternative for bundled against unbundled service.",
]

