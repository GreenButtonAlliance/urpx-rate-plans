notes = "PG&E E-ELEC reissued under AL 7869-E (D.26-03-013) effective 2026-03-27 — same advice letter that did E-TOU-C / E-TOU-D / EV2's 2026-03-27 reissue. Substantive changes from 2026-01-01: (1) flat $0.49281/meter/day base services charge replaced with 3 income-tier prices (CARE $0.19713, FERA $0.39688, Tier-3 $0.79343 — same values as E-TOU-C / E-TOU-D / EV2 / E-1 sibling filings); (2) California Climate Credit ($-36.18 per household, semi-annual April / October) REMOVED; (3) per-kWh unbundled rates updated per Sheet 3. Eligibility (residential + qualifying-tech-or-NBT) is unchanged. The composite tariff PDF mixes sheets at different revisions: Sheet 2 advances to 7869-E / 2026-03-27, Sheet 1 + Sheets 3-onward stay at 7846-E / 2026-03-01 — both TariffPublications are declared in @graph. DERIVED FROM ../2026-01-01/rate-plan_pge_e-elec_2026-01-01.jsonld by scripts/derive-e-elec-2026-03-27.py."
