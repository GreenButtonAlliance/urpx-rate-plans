deferrals = [
 "Sheet 5 (AL 7846-E, leaf 61120-E) prices the Vintaged Power Charge Indifference Adjustment as 18 per-kWh rates, 2009 Vintage $0.02973 through 2026 Vintage $(0.01011), payable by DA, CCA and TBS customers under Special Condition 4. Not modeled; the only PCIA in the model is the single Sheet 3 Bundled PCIA at $(0.01011). Expressible under v0.5.1 and already built for the sibling filing issued under the same advice letter: pge:e-tou-c-vintage-pcia-2026-03-01 carries all 18 as a RatePlanModifierVersion with an 18-member ProfileAlternatives over vintage year plus a CCA/DA/TBS boolean gate, and its values are identical to this schedule's table. Port that modifier and add it to applicable_modifiers. Work, not a blocker.",
 "Sheet 2 (AL 7921-E, leaf 61363-E) defines Income Tier 2 as customers who either (a) take service on FERA or (b) live in an affordable rental unit within a property listed in the California Housing Partnership's database restricted to residents at or below 80 percent of Area Median Income. The model gates Tier 2 on hasProgramEnrollment equals pge:program-fera alone, so a qualifying branch-(b) customer not on FERA falls through to the Standard alternative and is billed $0.79343 per meter per day instead of $0.39688, exactly double. Expressible: urpx:conditionProperty carries no sh:in in the v0.5.1 shapes (any IRI is accepted) and CustomOperandNode.customConditionProperty is available, so branch (b) can be OR'd into the Tier 2 expression with a matching third negation on the Standard branch. Every PG&E residential base schedule shares this gap, so fix them together.",
 "Special Condition 4 (Sheets 4 and 5) prices Direct Access, Community Choice Aggregation and Transitional Bundled Service customers as paying every charge in the Unbundling of Total Rates except the Bundled Power Charge Indifference Adjustment and the generation charge. Not modeled: pge:program-cca, pge:program-da and pge:program-tbs are declared in @graph and referenced nowhere else in the document. Expressible as a modifier Price with multiplier -1 and basedOnPrice naming the generation and Bundled PCIA Prices. Unbuilt across the whole PG&E residential set (zero urpx:multiplier uses in e-1, e-tou-c, e-tou-d, ev2, e-elec). The related cross-references (Schedule TBCC commodity prices, Schedule E-FFS franchise fee surcharge, DA CRS and CCA CRS exemptions) are other schedules' pricing and are out of scope for this filing.",
 "Special Condition 7 (Sheet 6) states the Wildfire Fund Charge 'applies to all retail sales, excluding CARE and Medical Baseline sales'; the model carries it as an unconditional $0.00591/kWh Price, so it prices the CARE and Medical Baseline sales the tariff excludes. The CARE half is carried by pge:d-care, whose exemption Price is urpx:multiplier -1 over this Price. The Medical Baseline half is not modeled for this schedule; pge:e-1-medical-baseline and pge:e-tou-c-medical-baseline carry it for Schedules E-1 and E-TOU-C only.",
 "Sheet 3 also prices the Base Services Charge by component (Distribution, Public Purpose Program, Nuclear Decommissioning, New System Generation Charge, each at three income tiers, 12 figures). Only the three bundled totals are modeled. The components do sum to the modeled totals, so nothing resolves wrong, but the filing is asymmetric: energy is modeled unbundled and the base charge bundled. This is the convention across the PG&E residential filings, not an e-elec slip; it matters for a DA or CCA consumer needing the delivery-only components. Lowest-weight item in this list.",
]
