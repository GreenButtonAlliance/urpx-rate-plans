[modeling]
complete = false
deferrals = [
 "Vintaged PCIA table, Sheet 4 Special Condition 4 (Cal. P.U.C. Sheet 60703-E): 18 per-kWh rates by departure vintage, 2009 ($0.02973) through 2026 (($0.01011)), payable by Direct Access, Community Choice Aggregation and Transitional Bundled Service customers taking service under this schedule. The model carries only the single Bundled PCIA line from Sheet 2 (-$0.01011). Not a vocabulary gap: v0.5.1 PriceDefinitionShape carries referencesProfileAlternatives and referencesProfileAlternative, and this corpus already ships the identical 18 values at us/ca/pge/electricity/e-tou-c/versions/2026-03-27/ as an inline RatePlanModifier gated by ProfileAlternatives on departure-vintage year. Unbuilt work, portable from that filing. Tracked at grid-coordination/urpx-rate-plans#12. The sibling filing at ../2026-03-27/ has the same gap.",
 "DA / CCA / TBS component exclusion, Sheet 4 Special Condition 4: these customers 'shall pay all charges shown in the Unbundling of Total Rates except for the Bundled Power Charge Indifference Adjustment and the generation charge.' The model prices pd-pcia and the six pd-gen-* components for every customer with no exclusion. Expressible under v0.5.1 either as a modifier Price with multiplier -1 and basedOnPrice naming the base component (resolves at clj-urpx 0.31.0) or as a ConditionExpression on the base PriceDefinition (declarative only, since 0.25.0 evaluates no ConditionExpression). Open question before building: e-tou-c@2026-03-27 carries its vintage modifier without this zeroing and is marked complete, so decide once whether the vintage modifier alone is the intended coverage answer.",
 "Wildfire Fund Charge exclusion, Sheet 5 Special Condition 7 (Cal. P.U.C. Sheet 54740-E): the charge 'applies to all retail sales, excluding CARE and Medical Baseline sales.' pd-wildfire-fund prices $0.00591 per kWh unconditionally. Expressible under v0.5.1: PriceDefinitionShape permits hasApplicabilityRule and ApplicabilityRuleShape permits hasConditionExpression, and pd-climate-credit in this same file already uses hasApplicabilityRule. Not carried elsewhere either: PG&E CARE and Medical Baseline modifiers are absent from this corpus. Note that adding the gate does not change the resolved number at the pinned clj-urpx 0.31.0, which fires gated Prices unconditionally.",
]
applicable_modifiers = [
