[modeling]
complete = false
deferrals = [
 "Sheet 8: CCA, Direct Access and Transitional Bundled Service customers pay every charge in the Unbundling of Total Rates EXCEPT the Bundled Power Charge Indifference Adjustment and the generation charge, taking the applicable Vintaged PCIA instead. This package carries the 18 vintage rates but nothing suppresses the base plan's four seasonal generation Prices or its Bundled PCIA (-$0.01011/kWh), so a consumer composing base plus modifier bills a departed customer PG&E generation plus both adjustments. The filing's own urpx:CoverageClaim on pge:e-tou-c-vintage-pcia-2026-03-01 already records this as urpx:partial. Expressible under v0.5.1 as a suppression Price (multiplier -1 plus basedOnPrice, which the pinned consumer resolves) or as hasApplicabilityRule on the base Prices (which it does not). Work, not a blocker.",
 "Sheet 4 prices the Base Services Charge by component, per income tier, $ per customer per day: Distribution (-$0.10751 / -$0.02710 / $0.36945), Public Purpose Program ($0.19131 / $0.31065 / $0.31065), Nuclear Decommissioning ($0.00000 all tiers), New System Generation Charge ($0.11333 all tiers). The model carries only the three Sheet 2 bundled totals ($0.19713 / $0.39688 / $0.79343), which the components sum to exactly, so no number is wrong today. What is lost is the delivery-versus-supply split of the fixed charge, which is what Sheet 8's CCA/DA treatment needs, and the model already unbundles the energy side this way. Expressible now: three more PriceDefinitions, each with a three-alternative PriceSetAlternatives mirroring the existing Base Services Charge structure.",
 "Sheet 1 and Special Condition 11 (Sheet 10) exempt CARE and Medical Baseline customers from the Wildfire Fund Charge: 'Customers receiving a medical baseline allowance shall pay for all usage based on the rates shown below and shall not pay the Wildfire Fund Charge' (Sheet 1), and the charge 'applies to all retail sales, excluding CARE and Medical Baseline sales' (Sheet 10). The model's Wildfire Fund Charge Price ($0.00591/kWh) carries no condition. The CARE half is carried by pge:d-care, whose exemption Price is urpx:multiplier -1 over this Price. The Medical Baseline half is not modeled, and no PG&E Medical Baseline schedule is modeled.",
 "Sheet 1 defines Income Tier 2 by two disjuncts: (a) FERA-eligible households, or (b) residents of an affordable rental unit in a property listed in the California Housing Partnership's database and restricted to incomes at or below 80 percent of Area Median Income. The tier-2 ProfileAlternative gates only on hasProgramEnrollment = pge:program-fera, so a qualifying (b) customer resolves to Income Tier 3 and is billed $0.79343 per customer per day where the schedule prices $0.39688. Expressible now as an orOperator disjunct over a CustomOperandNode, the construct this file's vintage-PCIA alternatives already use for customConditionProperty 'departureVintage'.",
 "Sheet 1, RATES: 'TOU period usage is assigned to tiers on a pro-rated basis. For example, if twenty percent of a customer's usage is in the peak period, then twenty percent of the total usage in each tier will be treated as on-peak usage.' This is the rule composing this version's TOU dimension with its baseline tiers, and neither is stated to depend on the other. Under v0.5.1, CalculationMethodShape is sh:closed and the only slot is the free-text calculationFormula, so the rule can be recorded as prose but not as a computable composition. Standard-level, not a modeling oversight.",
 "Sheet 3's line item New System Generation Charge (all usage), $0.00000 per kWh, has no PriceDefinition and no Price. Zero-valued, so no bill is wrong and the 20 modeled components still reconstruct the Sheet 2 totals, but the unbundled component list is incomplete against the sheet and the omission becomes a wrong number the first time PG&E sets the charge nonzero.",
 "Special Condition 1 (Sheet 5, Cal. P.U.C. Sheet 61128-E) publishes the baseline quantities as kWh PER DAY. pge:e-tou-c-2026-03-27-mi-energy-baseline declares unitOfMeasure urpx:kWh with no intervalDuration, so a bracket bound of 13.5 reads as 13.5 kWh rather than 13.5 kWh per day; on a 30-day summer bill in territory P the real Tier 1 ceiling is 405 kWh. v0.5.1 MetricSpecificationShape carries urpx:intervalDuration (xsd:duration, maxCount 1), so P1D is expressible. Put the interval there and not on a PriceDefinition's CalculationMethod, where an interval states the window a charge is calculated over rather than the period the baseline quantity is published in.",
 "The schedule draws one usage boundary, baseline versus over baseline: Sheet 2's 'Applied to Baseline Usage Only' and the two Sheet 3 Conservation Incentive Adjustment lines. This version asserts a third tier, pge:e-tou-c-2026-03-27-tier-baseline-t2c 'above four times the Special Condition 1 quantity', and caps tier 2 at exactly 4x the Special Condition 1 quantity in every cell. Nothing in the ten sheets states 400 percent, four times, or a second over-baseline tier. Both tiers price at $0.05354 so the split is economically inert, but it publishes a boundary this filing does not. Either cite the source for the 4x figure or collapse Tier 2 and Tier 2 Continued.",
]
