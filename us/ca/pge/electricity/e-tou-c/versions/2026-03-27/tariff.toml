deferrals = [
 "Sheet 8: CCA, Direct Access and Transitional Bundled Service customers pay every charge in the Unbundling of Total Rates EXCEPT the Bundled Power Charge Indifference Adjustment and the generation charge, taking the applicable Vintaged PCIA instead. This package carries the 18 vintage rates but nothing suppresses the base plan's four seasonal generation Prices or its Bundled PCIA (-$0.01011/kWh), so a consumer composing base plus modifier bills a departed customer PG&E generation plus both adjustments. The filing's own urpx:CoverageClaim on pge:e-tou-c-vintage-pcia-2026-03-01 already records this as urpx:partial. Expressible under v0.5.1 as a suppression Price (multiplier -1 plus basedOnPrice, which the pinned consumer resolves) or as hasApplicabilityRule on the base Prices (which it does not). Work, not a blocker.",
 "Sheet 4 prices the Base Services Charge by component, per income tier, $ per customer per day: Distribution (-$0.10751 / -$0.02710 / $0.36945), Public Purpose Program ($0.19131 / $0.31065 / $0.31065), Nuclear Decommissioning ($0.00000 all tiers), New System Generation Charge ($0.11333 all tiers). The model carries only the three Sheet 2 bundled totals ($0.19713 / $0.39688 / $0.79343), which the components sum to exactly, so no number is wrong today. What is lost is the delivery-versus-supply split of the fixed charge, which is what Sheet 8's CCA/DA treatment needs, and the model already unbundles the energy side this way. Expressible now: three more PriceDefinitions, each with a three-alternative PriceSetAlternatives mirroring the existing Base Services Charge structure.",
 "Sheet 1 and Special Condition 11 (Sheet 10) exempt CARE and Medical Baseline customers from the Wildfire Fund Charge: 'Customers receiving a medical baseline allowance shall pay for all usage based on the rates shown below and shall not pay the Wildfire Fund Charge' (Sheet 1), and the charge 'applies to all retail sales, excluding CARE and Medical Baseline sales' (Sheet 10). The model's Wildfire Fund Charge Price ($0.00591/kWh) carries no condition. The CARE half is carried by pge:d-care, whose exemption Price is urpx:multiplier -1 over this Price. The Medical Baseline half is not modeled, and PG&E has no medical-baseline filing in this corpus.",
 "Sheet 1 defines Income Tier 2 by two disjuncts: (a) FERA-eligible households, or (b) residents of an affordable rental unit in a property listed in the California Housing Partnership's database and restricted to incomes at or below 80 percent of Area Median Income. The tier-2 ProfileAlternative gates only on hasProgramEnrollment = pge:program-fera, so a qualifying (b) customer resolves to Income Tier 3 and is billed $0.79343 per customer per day where the schedule prices $0.39688. Expressible now as an orOperator disjunct over a CustomOperandNode, the construct this file's vintage-PCIA alternatives already use for customConditionProperty 'departureVintage'.",
 "Sheet 1, RATES: 'TOU period usage is assigned to tiers on a pro-rated basis. For example, if twenty percent of a customer's usage is in the peak period, then twenty percent of the total usage in each tier will be treated as on-peak usage.' This is the rule composing this filing's TOU dimension with the baseline-tier dimension carried in the 2026-03-01 version's sibling modifier. Note that THIS version has no such sibling: the phrase described the corpus as of the 2026-03-01 filing and was carried over. Until an overlay is issued here there is no second dimension to compose, so the pro-ration rule is doubly unmodeled, and neither file states it. Under v0.5.1, CalculationMethodShape is sh:closed and the only slot is the free-text calculationFormula, so the rule can be recorded as prose but not as a computable composition. Standard-level, not a modeling oversight.",
 "Sheet 3's line item New System Generation Charge (all usage), $0.00000 per kWh, has no PriceDefinition and no Price. Zero-valued, so no bill is wrong and the 20 modeled components still reconstruct the Sheet 2 totals, but the unbundled component list is incomplete against the sheet and the omission becomes a wrong number the first time PG&E sets the charge nonzero.",
 "This version's own document carries neither the Conservation Incentive Adjustment nor the baseline-allowance matrix: 0 urpx:ServiceBracket, 0 occurrences of baselineTerritory, 0 of conservationCharge. Sheet 3 of its own pge_e-tou-c_2026-03-27.pdf prices the adjustment at ($0.02786) on baseline usage and $0.05354 above it, and Sheet 5 (Cal. P.U.C. Sheet 61128-E) carries the quantities over 10 territories, 2 codes and 2 seasons. Both reach this version through the sibling pge:e-tou-c-baseline-tier, which names the plan rather than one of its versions in urpx:applicableToRatePlan and is offered here in urpx:hasModifierOptions. What the composition cannot say is that it is required: every customer on this schedule is billed the adjustment, and urpx:hasModifierOptions states only that the modifier is available, so a consumer resolving this version alone gets its energy charges with no baseline tiering and no adjustment. Measured composed against the overlay: Territory P Code B bounds 0 to 13.5 and 13.5 to 54.0 in summer, 0 to 11.0 and 11.0 to 44.0 in winter.",
]
applicable_modifiers = [
