# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "RatePlan + Vintaged-PCIA RatePlanModifier in single @graph. The Conservation Incentive Adjustment and the baseline allowance matrix, all ten baseline territories in both codes across both seasons, are in the base version: pge:e-tou-c-2026-03-01-tiers-baseline, over the 60-cell income tier, territory and code container pge:e-tou-c-2026-03-01-pa-income-territory-code. Sheet 2's Baseline Credit states the same money as the Sheet 3 CIA pair and is deliberately not priced separately. The Standard Medical Baseline Quantity of Electric Rule 19 (Code M and Code S) and the Medical Baseline Wildfire Fund Charge exemption are pge:e-tou-c-medical-baseline, a second document in this directory, whose adjusting brackets (urpx-org/urpx#80) move this version's tier bounds; Rule 19 is vendored here as pge_rule-19_2023-03-23.pdf."
