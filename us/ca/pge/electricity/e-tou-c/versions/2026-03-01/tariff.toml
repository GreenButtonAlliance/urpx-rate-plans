deferrals = [
 "Sheet 8 (Cal. P.U.C. Sheet 61131-E) directs CCA, DA and TBS customers to pay every charge in the Unbundling of Total Rates 'except for the Bundled Power Charge Indifference Adjustment and the generation charge'. The base filing's four generation Prices and its Bundled PCIA credit of $(0.01011) per kWh carry no condition, and the vintage-PCIA modifier adds the 18 replacement rates without removing them, so a CCA customer resolves to PG&E generation (up to $0.20782 per kWh at summer peak) plus both adjustments. Expressible under v0.5.1 as a multiplier -1 Price with basedOnPrice on the vintage modifier, which clj-urpx 0.32.0 resolves. Work, not a blocker, and the largest wrong number in this filing.",
 "Sheet 1 and Special Condition 11 (Sheet 10, Cal. P.U.C. Sheet 61133-E) exempt CARE and Medical Baseline sales from the Wildfire Fund Charge. pd-wildfire-fund carries no applicability condition, so $0.00591 per kWh is priced for every customer, and no PG&E care, fera or medical-baseline modifier exists in this corpus to zero it. Expressible: urpx:hasApplicabilityRule and urpx:hasApplicabilityGroup are both on PriceShape at v0.5.1. Note that clj-urpx 0.32.0 evaluates no ConditionExpression, so the gate would be declarative at the current pin and would not change any resolved number.",
 "Special Condition 1 (Sheet 5, Cal. P.U.C. Sheet 61128-E) publishes the baseline quantities as kWh PER DAY. pge:ms-energy-baseline declares unitOfMeasure urpx:kWh with no intervalDuration, so a bracket bound of 13.5 reads as 13.5 kWh rather than 13.5 kWh per day; on a 30-day summer bill in territory P the real Tier 1 ceiling is 405 kWh. v0.5.1 MetricSpecificationShape carries urpx:intervalDuration (xsd:duration, maxCount 1), so P1D is expressible. It is a correctness fix that moves no number at the pin, and that is settled rather than unverified: clj-urpx 0.32.0 ledger-metric-info surfaces only measurementKind, unitOfMeasure and flowDirection off a MetricSpecification, and recurring-interval reads intervalDuration only off a PriceDefinition's CalculationMethod. Do not move the interval onto a CalculationMethod to make it visible, because its presence there excludes the price from the per-kWh marginal.",
 "The schedule draws one usage boundary, baseline versus over baseline: Sheet 2's 'Applied to Baseline Usage Only' and the two Sheet 3 Conservation Incentive Adjustment lines. The modifier asserts a third tier, pge:tier-baseline-t2c 'over 400% of baseline', and caps tier 2 at exactly 4x the Special Condition 1 quantity in all 40 cells. Nothing in the ten sheets states 400 percent, four times, or a second over-baseline tier. Both tiers price at $0.05354 so the split is economically inert, but it publishes a boundary this filing does not. Either cite the source for the 4x figure or collapse Tier 2 and Tier 2 Continued.",
 "Special Condition 5 (Sheet 6, Cal. P.U.C. Sheet 61129-E) adds Code M (basic plus medical) and Code S (all-electric plus medical) quantities to the Special Condition 1 baseline to raise the ceiling on usage billed at Tier 1 rates, with further quantities under Rule 19 for the primary and additional meters. This is first a source gap: the PDF prints no kWh figure for either code, and neither Rule 19 nor Preliminary Statement Part A is committed to this repo. It is secondarily an expressibility question: ServiceBracketShape at v0.5.1 is sh:closed with lowerBound and upperBound as xsd:decimal and no delta property, so the allowance cannot be stated as an addition and would have to be precomputed across all 40 territory, code and season cells. Upstream urpx-org/urpx#32 is open.",
 "Sheet 4 (Cal. P.U.C. Sheet 61127-E) publishes the Base Services Charge by component for each income tier, twelve values: Distribution -0.10751 / -0.02710 / 0.36945, Public Purpose Program 0.19131 / 0.31065 / 0.31065, Nuclear Decommissioning zero across all three, New System Generation Charge 0.11333 across all three. The filing models only the three daily totals of $0.19713, $0.39688 and $0.79343. The components sum exactly to the totals, so there is no bill effect, but the energy side is modeled at component granularity and this is not. Expressible today and at v0.2.1; simply unbuilt.",
 "Sheet 1 gives Income Tier 2 two qualification paths: FERA enrollment, or an affordable rental unit within a property listed in the California Housing Partnership's database restricted to residents at or below 80 percent of Area Median Income. Only the FERA branch is modeled, and the Tier 3 alternative is an AND of notEquals against CARE and FERA, so a customer qualifying through affordable housing alone resolves to $0.79343 per day instead of $0.39688. Expressible: urpx:orOperator is in v0.5.1, and this filing already uses CustomOperandNode for departureVintage and baselineTerritory.",
 "Sheet 3's New System Generation Charge on all usage, $0.00000 per kWh, is the only one of the 23 published Sheet 3 line items with no Price in the model. Zero-valued, so there is no bill effect, but every sibling line is modeled.",
 "Neither proration rule is carried. Sheet 1 states that time-of-use period usage is assigned to baseline tiers pro rata, so that a customer with twenty percent of its usage in the peak period has twenty percent of the usage in each tier treated as on-peak. Special Condition 4 (Sheet 6) prorates the daily baseline quantity and rates by the number of days of each season in a bill spanning the June 1 or October 1 changeover. The base filing carries the time-of-use dimension and the baseline-tier modifier carries the tier dimension, but nothing states how the two combine or how a daily quantity scales to a billing period. Not expressible at v0.5.1: CalculationMethodShape is sh:closed with no condition or allocation path and only the free-text calculationFormula, which no consumer reads; urpx:prorationMethod is an xsd:string on BillingModel scoped to mid-period service start and stop.",
 "Special Condition 8 (Sheet 7, Cal. P.U.C. Sheet 61130-E) and its CCA and DA counterpart on Sheet 9 credit a customer, for twelve months from enrollment, the difference between what it paid on this schedule and what it would have paid on the tiered non-time-of-use Schedule E-1, subject to their own exclusions. Not modeled. Recordable but not computable under v0.5.1: urpx:creditPriceProtection is a ChargeTypeValue member (verified in the ChargeTypeValue oneOf at abdfb521), so the line item can be declared and cited, but its amount is a whole bill computed under a different schedule and settles as a cumulative true-up on a later bill rather than as a rate, and URPX carries no cross-schedule bill comparison. If the corpus decides a 12-month retrospective true-up is rebilling rather than pricing, drop this entry rather than leaving it to depress coverage.",
 "The baseline overlay's ServiceBrackets are not reached by the pinned consumer. clj-urpx 0.32.0 reads tier bounds only on the base-plan path and these tiers live in the modifier, so no resolved entry carries a tier number or a bound in either season: the matrix is correct data that no consumer can currently reach, rather than data that resolves wrongly. Tracked by the clj-urpx session as URPX-sr4; bracket selection itself is their URPX-rng and shipped in 0.32.0. Reaching these brackets therefore needs both a pin bump and sr4, where PG&E E-1's matrix needed the pin alone because its ServiceTiers live in its base plan. One consequence of sr4's shape bears on this filing: these brackets name the base plan's urpx:Season nodes and this modifier declares none of its own, so resolved alone the bounds are withheld as not evaluable rather than refused, and composed against the base the references resolve.",
]
