 "fera",
 "medical-baseline",
]

# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "Non-TOU residential. RatePlan + Vintaged-PCIA modifier in single @graph. Income-tier base charge (CARE / FERA / std). KNOWN LIMITATION: baseline matrix is modeled with one cell only (Territory P, Code B) — correct for those customers, wrong tier boundaries for everyone else. Tracked at grid-coordination/urpx-rate-plans#18, blocked on upstream urpx-org/urpx discussion #31."
