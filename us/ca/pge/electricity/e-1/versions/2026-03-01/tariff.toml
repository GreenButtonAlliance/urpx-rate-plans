[modeling]
complete = false
deferrals = [
 "Base Services Charge is carried by a sibling modifier rather than by the base plan, and URPX has no way to say that composing it is mandatory. Every E-1 customer pays a Base Services Charge; only the amount varies, by income tier (0.19713 CARE, 0.39688 FERA, 0.79343 standard per customer per day, Sheet 1, 61247-E). urpx:PlanElements allows one urpx:hasProfileAlternatives container per version (sh:maxCount 1) and the base plan spends its container on the 20-cell baseline Territory x Code matrix that sets the energy tier boundaries, so the income tier moved to rate-plan-modifier_pge_e-1-income-tier_2026-03-01.jsonld with a container of its own. The only link back is urpx:hasModifierOptions, which says the modifier is available rather than required, so a consumer resolving the base plan alone gets the energy charges and no daily charge at all. Measured 2026-09-23: the base plan alone resolves 4 ledgers and composed with the modifier 5, and the marginal rate 0.32561 is the same either way because the charge is per P1D and not per kWh. Three shapes that would have kept it in the base plan were measured first and each fails differently. Gating three Prices on program enrollment with urpx:hasApplicabilityGroup validates under v0.5.1, and a consumer that does not evaluate the enrollment predicate applies all three daily charges at once and bills every customer 1.38744 per day. Pricing it in the base plan at the Income Tier 3 amount and re-pricing it in the modifier has no precedent here to measure against, since none of the 34 modifier filings in this corpus prices a urpx:PriceDefinition that its own base defines. And carrying the matrix in a modifier instead, the shape sibling e-tou-c uses, would leave the base plan's brackets as a second source of tier bounds.",
 "Season is absent from the machine-readable data. Sheet 4 (61099-E) gives separate summer and winter bounds and Special Condition 6 (Sheet 5, 61100-E) defines summer as June 1 through September 30. The two urpx:Season nodes in this file are declared and referenced by nothing: of the 120 urpx:ServiceBracket nodes on the six tiers, 20 per tier, not one carries urpx:appliesInSeason, and no Price carries it either, so season survives only inside urpx:name strings and the tier identities. Each tier's 20 brackets are discriminated by baseline cell alone, which leaves the six tiers overlapping over one kWh metric: at Territory P Code B, 12 kWh/day matches both summer tier 1 (0 to 13.5) and winter tier 2 (11.0 to 44.0) with no discriminator. Measured 2026-09-23 with a cell nominated, at 2026-07-15T17:00-07:00 and at 2026-12-15T17:00-08:00: all six tiers resolve with identical bounds at both instants. Writing appliesInSeason on all 120 is a change of its own, and because this filing declares its own two Season nodes, nothing would depend on another plan's definitions. appliesInSeason is 0..n on both ServiceBracketShape and PriceShape at v0.5.1.",
 "Wildfire Fund Charge exemption not modeled. Sheet 1 (61247-E) states that customers receiving a medical baseline allowance shall not pay the Wildfire Fund Charge, and Special Condition 12 (Sheet 7, 61102-E) states the charge applies to all retail sales excluding CARE and Medical Baseline sales. The model prices it unconditionally at 0.00591 per kWh as pge:e-1-2026-03-01-price-wildfire-fund in pge:e-1-2026-03-01-ps-adjustment-charges, so CARE customers are overcharged. The CARE case needs the income-tier ProfileAlternatives, which since 2026-09-23 lives in the sibling rate-plan-modifier_pge_e-1-income-tier_2026-03-01.jsonld while the charge is priced in the base plan, so the two are no longer in one document: it would take a Price on that modifier's CARE cell carrying urpx:multiplier -1 with urpx:basedOnPrice naming pge:e-1-2026-03-01-price-wildfire-fund, which is the pattern the generation-charge deferral below describes. The Medical Baseline case is a second dimension and PG&E has no medical-baseline filing in this corpus.",
 "Direct Access, CCA and Transitional Bundled Service customers do not pay the generation charge or the Bundled Power Charge Indifference Adjustment (Special Condition 9, Sheet 6, 61101-E), but nothing in the model removes them. The pge:e-1-vintage-pcia modifier adds the vintaged replacement rate and asserts the substitution only in urpx:description prose, so composing the base plan with the modifier bills a CCA customer 0.12855 per kWh of PG&E generation on top of their vintaged PCIA. Expressible as modifier Prices carrying multiplier -1 with basedOnPrice naming pge:price-generation and pge:e-1-2026-03-01-price-bundled-pcia.",
 "Income Tier 2 is under-specified. Sheet 1 (61247-E) defines it as either (a) FERA-enrolled or (b) a resident of an affordable rental unit listed in the California Housing Partnership database and restricted to incomes at or below 80 percent of Area Median Income. The model gates Income Tier 2 only on enrollment in pge:program-fera and defines Income Tier 3 as not-CARE and not-FERA, so a branch (b) customer resolves to Tier 3 and is billed 0.79343 per day instead of 0.39688, roughly double. The gate lives in the sibling rate-plan-modifier_pge_e-1-income-tier_2026-03-01.jsonld. Expressible and precedented in this filing: the vintage-PCIA modifier and the base plan's 20 baseline cells both use CustomOperandNode with customConditionProperty for a predicate URPX does not name.",
 "Base Services Charge is modeled only as the three income-tier totals (0.19713, 0.39688, 0.79343), in the sibling rate-plan-modifier_pge_e-1-income-tier_2026-03-01.jsonld. Sheet 3 (61098-E) also prices it by component, 4 components x 3 income tiers = 12 values in dollars per customer per day: Distribution (-0.10751 / -0.02710 / 0.36945), Public Purpose Program (0.19131 / 0.31065 / 0.31065), Nuclear Decommissioning (0.00000 x3) and New System Generation Charge (0.11333 x3). None of the 12 appears in the model. The totals are right and the components sum to them, so no bill is wrong, but the published unbundling is absent while the energy rates are fully unbundled.",
 "Standard medical quantities are not modeled. Special Condition 7 (Sheet 5, 61100-E) adds Code M and Code S quantities to the Special Condition 2 baseline, raising the usage billed at Tier 1 rates. Two obstacles. The quantities are not stated in this PDF and additional quantities are 'as provided in Rule 19', which is not committed to this corpus, so it is partly a source gap. And an additive allowance is not expressible as a delta under v0.5.1: ServiceBracketShape is sh:closed with xsd:decimal bounds and upstream urpx-org/urpx #32 is open on whether an additive quantity is meant to be representable; precomputing absolute bounds per cell would work. Sibling us/ca/pge/electricity/e-tou-c records this identical provision as its one deferral.",
 "Seasonal changeover proration not modeled. Special Condition 6 (Sheet 5, 61100-E) requires bills that include the June 1 or October 1 changeover to multiply the applicable daily baseline quantity for each season by the number of days in each season. Nothing in the model expresses this. The only slot is urpx:prorationMethod, and it is settled rather than unconfirmed: BillingModelShape gives it sh:datatype xsd:string with sh:maxCount 1 and no sh:in, so it is free text with no allowed-value list to establish (verified against abdfb521). It is used by zero filings in this corpus, and its own skos:note scopes it to service starting or ending mid-period rather than to a season boundary, so it would carry this provision as prose at best. The allocation arithmetic itself has no computable form in v0.5.1.",
 "New System Generation Charge, energy component, 0.00000 per kWh (Sheet 2, 61097-E) has no PriceDefinition and no Price. Zero-valued today so no bill is affected, but the schedule's line item is unrepresented and a future nonzero value would be silently missing. Minor; listed so the Sheet 2 enumeration is complete.",
]
applicable_modifiers = [
 "care",
 "e-1-income-tier",
 "e-1-vintage-pcia",
 "e-rsmart",
 "fera",
 "medical-baseline",
]

# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "Non-TOU residential. RatePlan plus the Vintaged-PCIA modifier in one @graph; the Base Services Charge by income tier is a second modifier, in its own document in this directory, because urpx:PlanElements allows one urpx:hasProfileAlternatives container and the base plan spends its container on the baseline matrix. The baseline allowance matrix is complete as of 2026-09-23: 20 ProfileAlternative cells over baselineTerritory x baselineCode, and 120 ServiceBrackets, 20 on each of the six tiers, carrying all 40 of Sheet 4's kWh/day values with Tier 2 at four times Tier 1. A caller nominates a cell; with none nominated the tier bounds stay unselected rather than guessed, and the marginal rate is unaffected either way. What the filing still does not carry is in [modeling].deferrals."
