# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "Non-TOU residential. RatePlan + Vintaged-PCIA modifier in single @graph. Income-tier base charge (CARE / FERA / std). KNOWN LIMITATION: baseline matrix is modeled with one cell only (Territory P, Code B) — correct for those customers, wrong tier boundaries for everyone else. Tracked at grid-coordination/urpx-rate-plans#18. Blocked on the consumer, not on the vocabulary: clj-urpx resolves bounds from the first ServiceBracket on a tier and filters by neither season nor ProfileAlternative (tracked by the clj-urpx session as URPX-rng). Discussion #31 was never the blocker and is closed; the vocabulary supports the full matrix and this corpus already ships it twice. The remaining work and the one obstacle to reusing the existing overlay (its brackets bind E-TOU-C's own season nodes) are in [modeling].deferrals."
