deferrals = [
 "Baseline tier bounds: Special Condition 2, Sheet 4 (Cal. P.U.C. Sheet 61099-E) prices a matrix of 10 baseline territories x 2 codes (B basic, H all-electric) x 2 seasons = 40 kWh/day values. The model carries one cell, Territory P Code B (summer 13.5, winter 11.0), so tier boundaries are wrong for nine of ten territories and for every all-electric customer, shifting kWh between the -0.04052 and +0.04089 Conservation Incentive Adjustment rates. Expressible under v0.5.1 and already built for this identical PG&E table at us/ca/pge/electricity/e-tou-c/versions/2026-03-01/rate-plan-modifier_pge_e-tou-c-baseline-tier_2026-03-01.jsonld, which ships 120 brackets using ServiceBracket.appliesInSeason plus ServiceBracket.referencesProfileAlternative against a 20-member baselineTerritory x baselineCode ProfileAlternatives hosted on a sibling modifier version. Upstream discussion #31 is closed and was never the blocker: sh:maxCount 1 caps ProfileAlternatives containers per PlanElements, not dimensions within one, and two dimensions are stated as their cross-product. Measured 2026-09-23: the E-TOU-C baseline-tier modifier ships 2 AlternativeDimension nodes (baselineTerritory P Q R S T V W X Y Z, baselineCode B H) over 20 ProfileAlternative cells and 120 ServiceBrackets, and its Territory P Code B bounds are identical to the six this filing carries inline (summer 0-13.5, 13.5-54.0, >54.0; winter 0-11.0, 11.0-44.0, >44.0), so it is the same table. What is NOT reusable as it stands, and what an earlier reading of this deferral assumed was: every one of those 120 brackets binds urpx:appliesInSeason to pge:e-tou-c-2026-03-01-season-summer or -winter, E-TOU-C's own version-scoped season nodes. Applying that modifier to pge:e-1 would make this plan's tier bounds depend on another plan's season definitions. The alternative and bracket IRIs are already plan-neutral (pge:pa-baseline-p-b, pge:bracket-t1-p-b-summer), so only the season references stand in the way. Note also that E-TOU-C's base plan carries zero inline ServiceBrackets and relies wholly on the overlay, while this filing carries six, so whichever shape is chosen has to say what happens to those six rather than leaving two sources of tier bounds. So it is held, and the hold is the consumer's first-bracket rule rather than anything URPX lacks. The remaining obstacle is the consumer, and it is why this filing still carries one cell rather than twenty. clj-urpx 0.31.0 tier-info takes (first (:urpx/hasServiceBracket service-tier)) with no season and no ProfileAlternative filtering; its own docstring calls per-season and per-ProfileAlternative selection 'a future-day concern'. This filing encodes season in the tier identity, six tiers each holding one bracket, so first is always the right bracket for the tier it sits on. That is not the same as being season-correct, and it is not. Measured here on 2026-09-23 against the pinned clj-urpx, at 2026-07-15T17:00-07:00 and 2026-12-15T17:00-08:00: resolve-prices surfaces all six tiers with bounds at BOTH instants, identically, tiers 1 to 3 carrying the summer bounds 0-13.5, 13.5-54.0 and above 54.0 and tiers 4 to 6 the winter bounds 0-11.0, 11.0-44.0 and above 44.0, with nothing gating on season. The marginal is 0.32561 at both, because this schedule's CIA prices do not vary by season (-0.04052 within baseline, 0.04089 above). The clj-urpx session reported the same thing first; this is our own measurement of it. The rate is unaffected because this schedule's summer and winter CIA prices are the same numbers and its generation price is flat. What matters for holding is narrower: winter's correct 11.0 is PRESENT today, as tier 4. Adopting the 20-cell overlay shape would put 20 brackets under each tier, first would be Territory P Code B, and the bounds would be right for whichever season sorts first and wrong for the other. So completing the data would make the resolution worse, and that trade is not worth making: correct-and-incomplete beats complete-and-wrong. Verified against PG&E's own Sheet 4 in this filing's PDF on 2026-09-23: all 40 Tier-1 values agree with the E-TOU-C overlay's brackets, 0 disagreements, with T2 = 4 x Tier 1 throughout, so the data is ready to use the moment the consumer can select a bracket. Raised with the clj-urpx session, which corrected two things. Its #7 and #8 are CLOSED (2026-05-05, 2026-05-07) and were Malli schema-acceptance work, never resolution, so they are why appliesInSeason validates and not why it is unread; the resolution work was unfiled and is now its URPX-rng (bracket selection) and URPX-sr4 (modifier tiers reach no tier-info). URPX-rng is implemented and green in the clj-urpx working tree as of 2026-09-23, both scopes with refusal on ambiguity, but it is NOT committed there and this corpus pins 0.31.0, so the matrix is not buildable yet: it needs the commit, a release and a pin bump first. Two things to know when it is. This filing's ServiceTiers live in its BASE plan, so bracket selection reaches them and it does not also wait on URPX-sr4, which is the separate gap that the modifier path never calls tier-info at all; the E-TOU-C overlay's tiers DO live in a modifier and so do wait on sr4. And an unqualified bracket beside a cell-scoped one is deliberately not read as a default, so every rung this filing wants has to carry its own qualifier rather than relying on omission. The 40 values are already verified against Sheet 4 with no disagreements, so the work is enumeration. Its PROPOSAL on shape, which we accepted after weighing it: author the qualifier on the ServiceBracket rather than on the ServiceTiers container. Both are read and they compose, so either would resolve; the bracket is the finer scope, it is what the E-TOU-C overlay already does so the two filings stay consistent, and putting it on the container as well would create a second place to keep in sync. The decision is ours and it is recorded here rather than inherited. One caveat it raised, and the guard is theirs rather than nothing: a bracket naming two Season nodes admits the UNION of their months, so if the two filings' season definitions ever diverge, two brackets on one tier would both admit the divergent month. clj-urpx refuses that with :ambiguous-service-bracket, naming both brackets, rather than picking one and returning a wrong bound, which is the behaviour we wanted. What is still unguarded is the timing: the divergence surfaces when a consumer resolves, not when the corpus is built, and lint_copy_divergence polices byte-identity of shared nodes while policing nothing about whether two filings' Season definitions still agree. That check belongs on our side and belongs in the same change as these cells, since it is vacuous until a bracket names two seasons.",
 "Season is absent from the machine-readable data. Sheet 4 (61099-E) gives separate summer and winter bounds and Special Condition 6 (Sheet 5, 61100-E) defines summer as June 1 through September 30. The two urpx:Season nodes in this file are declared and referenced by nothing: no ServiceBracket and no Price carries appliesInSeason. The six tiers are therefore overlapping unqualified brackets over one kWh metric, so 12 kWh/day matches both summer tier 1 (0 to 13.5) and winter tier 2 (11.0 to 44.0) with no discriminator, and the season survives only inside urpx:name strings. appliesInSeason is 0..n on both ServiceBracketShape and PriceShape at v0.5.1.",
 "Wildfire Fund Charge exemption not modeled. Sheet 1 (61247-E) states that customers receiving a medical baseline allowance shall not pay the Wildfire Fund Charge, and Special Condition 12 (Sheet 7, 61102-E) states the charge applies to all retail sales excluding CARE and Medical Baseline sales. The model prices it unconditionally at 0.00591 per kWh in pge:e-1-2026-03-01-ps-adjustment-charges, so CARE customers are overcharged. The CARE case is expressible with machinery already in this file: add a second PriceSetAlternatives over the existing income-tier ProfileAlternatives giving 0.00591 for Income Tiers 2 and 3 and 0 for Tier 1; the selection layer is read by clj-urpx 0.31.0. The Medical Baseline case is a second dimension and PG&E has no medical-baseline filing in this corpus.",
 "Direct Access, CCA and Transitional Bundled Service customers do not pay the generation charge or the Bundled Power Charge Indifference Adjustment (Special Condition 9, Sheet 6, 61101-E), but nothing in the model removes them. The pge:e-1-vintage-pcia modifier adds the vintaged replacement rate and asserts the substitution only in urpx:description prose, so composing the base plan with the modifier bills a CCA customer 0.12855 per kWh of PG&E generation on top of their vintaged PCIA. Expressible as modifier Prices carrying multiplier -1 with basedOnPrice naming pge:price-generation and pge:e-1-2026-03-01-price-bundled-pcia; that pattern resolves at clj-urpx 0.31.0.",
 "Income Tier 2 is under-specified. Sheet 1 (61247-E) defines it as either (a) FERA-enrolled or (b) a resident of an affordable rental unit listed in the California Housing Partnership database and restricted to incomes at or below 80 percent of Area Median Income. The model gates Income Tier 2 only on enrollment in pge:program-fera and defines Income Tier 3 as not-CARE and not-FERA, so a branch (b) customer resolves to Tier 3 and is billed 0.79343 per day instead of 0.39688, roughly double. Expressible and precedented in this same file: the vintage-PCIA modifier already uses CustomOperandNode with customConditionProperty for an unnamed predicate.",
 "Base Services Charge is modeled only as the three income-tier totals (0.19713, 0.39688, 0.79343). Sheet 3 (61098-E) also prices it by component, 4 components x 3 income tiers = 12 values in dollars per customer per day: Distribution (-0.10751 / -0.02710 / 0.36945), Public Purpose Program (0.19131 / 0.31065 / 0.31065), Nuclear Decommissioning (0.00000 x3) and New System Generation Charge (0.11333 x3). None of the 12 appears in the model. The totals are right and the components sum to them, so no bill is wrong, but the published unbundling is absent while the energy rates are fully unbundled.",
 "Standard medical quantities are not modeled. Special Condition 7 (Sheet 5, 61100-E) adds Code M and Code S quantities to the Special Condition 2 baseline, raising the usage billed at Tier 1 rates. Two obstacles. The quantities are not stated in this PDF and additional quantities are 'as provided in Rule 19', which is not committed to this corpus, so it is partly a source gap. And an additive allowance is not expressible as a delta under v0.5.1: ServiceBracketShape is sh:closed with xsd:decimal bounds and upstream urpx-org/urpx #32 is open on whether an additive quantity is meant to be representable; precomputing absolute bounds per cell would work. Sibling us/ca/pge/electricity/e-tou-c records this identical provision as its one deferral.",
 "Seasonal changeover proration not modeled. Special Condition 6 (Sheet 5, 61100-E) requires bills that include the June 1 or October 1 changeover to multiply the applicable daily baseline quantity for each season by the number of days in each season. Nothing in the model expresses this. The only slot is urpx:prorationMethod, and it is settled rather than unconfirmed: BillingModelShape gives it sh:datatype xsd:string with sh:maxCount 1 and no sh:in, so it is free text with no allowed-value list to establish (verified against abdfb521). It is used by zero filings in this corpus and read by no function in clj-urpx 0.31.0, and its own skos:note scopes it to service starting or ending mid-period rather than to a season boundary, so it would carry this provision as prose at best. The allocation arithmetic itself has no computable form in v0.5.1.",
 "New System Generation Charge, energy component, 0.00000 per kWh (Sheet 2, 61097-E) has no PriceDefinition and no Price. Zero-valued today so no bill is affected, but the schedule's line item is unrepresented and a future nonzero value would be silently missing. Minor; listed so the Sheet 2 enumeration is complete.",
]
