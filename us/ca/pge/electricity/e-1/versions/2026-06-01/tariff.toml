# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Base Services Charge is carried by a sibling modifier rather than by the base plan, and URPX has no way to say that composing it is mandatory. Every E-1 customer pays a Base Services Charge; only the amount varies, by income tier (0.19713 CARE, 0.39688 FERA, 0.79343 standard per customer per day, Sheet 1, 61362-E). urpx:PlanElements allows one urpx:hasProfileAlternatives container per version (sh:maxCount 1) and the base plan spends its container on the 20-cell baseline Territory x Code matrix that sets the energy tier boundaries, so the income tier moved to rate-plan-modifier_pge_e-1-income-tier_2026-06-01.jsonld with a container of its own. The only link back is urpx:hasModifierOptions, which says the modifier is available rather than required, so a consumer resolving the base plan alone gets the energy charges and no daily charge at all. Measured on this version 2026-10-07: at 2026-07-15T17:00-07:00 the base plan alone resolves 4 ledgers and composed with the modifier 5 (5 and 6 at 2026-09-07T17:00-07:00, when the Climate Credit applies), and the marginal rate 0.32561 is the same either way because the charge is per P1D and not per kWh. Three shapes that would have kept it in the base plan were measured first and each fails differently. Gating three Prices on program enrollment with urpx:hasApplicabilityGroup validates under v0.5.1, and a consumer that does not evaluate the enrollment predicate applies all three daily charges at once and bills every customer 1.38744 per day. Pricing it in the base plan at the Income Tier 3 amount and re-pricing it in the modifier has no precedent here to measure against, since no modifier filing in this corpus prices a urpx:PriceDefinition that its own base defines. And carrying the matrix in a modifier instead, the shape sibling e-tou-c uses, would leave the base plan's brackets as a second source of tier bounds.",
 "Season is absent from the machine-readable data. Sheet 4 (61099-E) gives separate summer and winter bounds and Special Condition 6 (Sheet 5, 61100-E) defines summer as June 1 through September 30. The two urpx:Season nodes in this file are declared and referenced by nothing: of the 120 urpx:ServiceBracket nodes on the six tiers, 20 per tier, not one carries urpx:appliesInSeason, and no Price carries it either, so season survives only inside urpx:name strings and the tier identities. Each tier's 20 brackets are discriminated by baseline cell alone, which leaves the six tiers overlapping over one kWh metric: at Territory P Code B, 12 kWh/day matches both summer tier 1 (0 to 13.5) and winter tier 2 (11.0 to 44.0) with no discriminator. Measured on this version 2026-10-07 with Territory P Code B nominated, at 2026-07-15T17:00-07:00 and at 2026-12-15T17:00-08:00: all six tiers resolve at both instants with identical bounds (summer 13.5, 54.0; winter 11.0, 44.0). Writing appliesInSeason on all 120 is a change of its own, and because this filing declares its own two Season nodes, nothing would depend on another plan's definitions. appliesInSeason is 0..n on both ServiceBracketShape and PriceShape at v0.5.1.",
 "Direct Access, CCA and Transitional Bundled Service customers do not pay the generation charge or the Bundled Power Charge Indifference Adjustment (Special Condition 9, Sheet 6, 61101-E), but nothing in the model removes them. The pge:e-1-vintage-pcia modifier adds the vintaged replacement rate and asserts the substitution only in urpx:description prose, so composing the base plan with the modifier bills a CCA customer 0.12855 per kWh of PG&E generation on top of their vintaged PCIA. Expressible as modifier Prices carrying multiplier -1 with basedOnPrice naming pge:e-1-2026-06-01-price-generation and pge:e-1-2026-06-01-price-bundled-pcia.",
 "Income Tier 2 is under-specified. Sheet 1 (61362-E) defines it as either (a) FERA-enrolled or (b) a resident of an affordable rental unit listed in the California Housing Partnership database and restricted to incomes at or below 80 percent of Area Median Income. The model gates Income Tier 2 only on enrollment in pge:program-fera and defines Income Tier 3 as not-CARE and not-FERA, so a branch (b) customer resolves to Tier 3 and is billed 0.79343 per day instead of 0.39688, roughly double. The gate lives in the sibling rate-plan-modifier_pge_e-1-income-tier_2026-06-01.jsonld. Expressible and precedented in this filing: the vintage-PCIA modifier and the base plan's 20 baseline cells both use CustomOperandNode with customConditionProperty for a predicate URPX does not name.",
 "Base Services Charge is modeled only as the three income-tier totals (0.19713, 0.39688, 0.79343), in the sibling rate-plan-modifier_pge_e-1-income-tier_2026-06-01.jsonld. Sheet 3 (61098-E) also prices it by component, 4 components x 3 income tiers = 12 values in dollars per customer per day: Distribution (-0.10751 / -0.02710 / 0.36945), Public Purpose Program (0.19131 / 0.31065 / 0.31065), Nuclear Decommissioning (0.00000 x3) and New System Generation Charge (0.11333 x3). None of the 12 appears in the model. The totals are right and the components sum to them, so no bill is wrong, but the published unbundling is absent while the energy rates are fully unbundled.",
 "Rule 19 Part F: \"If PG&E finds that you need more than the standard 16.438 kWh per day, it will increase your daily Medical Baseline Quantity. In determining how many Additional Quantities you will be assigned, PG&E will round its calculation of your total daily kWh medical needs up to the nearest increment of 16.438 kWh.\" pge:e-1-medical-baseline-2026-06-01 carries one Standard Medical Baseline Quantity. An additional quantity is a per-customer multiple PG&E assigns, so it is a customer attribute rather than a tariff figure; it is expressible as further adjusting brackets once a multiple is chosen, and nothing in this corpus chooses one.",
 "Seasonal changeover proration not modeled. Special Condition 6 (Sheet 5, 61100-E) requires bills that include the June 1 or October 1 changeover to multiply the applicable daily baseline quantity for each season by the number of days in each season. Nothing in the model expresses this. The only slot is urpx:prorationMethod, and it is settled rather than unconfirmed: BillingModelShape gives it sh:datatype xsd:string with sh:maxCount 1 and no sh:in, so it is free text with no allowed-value list to establish (verified against abdfb521). It is used by zero filings in this corpus, and its own skos:note scopes it to service starting or ending mid-period rather than to a season boundary, so it would carry this provision as prose at best. The allocation arithmetic itself has no computable form in v0.5.1.",
 "New System Generation Charge, energy component, 0.00000 per kWh (Sheet 2, 61097-E) has no PriceDefinition and no Price. Zero-valued today so no bill is affected, but the schedule's line item is unrepresented and a future nonzero value would be silently missing. Minor; listed so the Sheet 2 enumeration is complete.",
]
