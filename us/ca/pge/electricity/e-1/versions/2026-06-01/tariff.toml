 Sheet 6: 61101-E, Advice 7846-E, effective 2026-03-01
 Sheet 7: 61102-E, Advice 7846-E, effective 2026-03-01

Advice 7921-E (Decision D.26-04-036), effective 2026-06-01, reissues Sheet 1
(61362-E, cancelling 61247-E) to state the California Climate Credit, ($36.18)
per household, as a semi-annual payment in the August and September bill
cycles. The 2026-03-01 version carries no Climate Credit: its document's Sheet
