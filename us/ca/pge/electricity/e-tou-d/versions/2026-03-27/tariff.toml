[review]
status = "draft"
notes = "Initial conversion + HolidayCalendar adoption. RatePlan + Vintaged-PCIA modifier in single @graph. No baseline credit/CIA (this schedule has none). No climate credit on rate sheet. Holiday-on-weekday TOU correctness expressed via urpx:includeHolidays / urpx:includeNonHolidays booleans on TimeBracket. Eight named PG&E holidays embedded as a urpx:HolidayCalendar under PlanElements (each Holiday carries holidayName + holidayRule). SHACL conforms; clj-urpx resolves correctly with a holiday predicate (verified across 7 cases including Memorial Day, Christmas, Independence Day Saturday)."
