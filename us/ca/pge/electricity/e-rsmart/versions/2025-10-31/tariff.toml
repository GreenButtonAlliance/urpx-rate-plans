# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "The model cannot say \"on a SmartDay\", and that single absence blocks both the $0.60000/kWh charge and the two credits. Sheet 2 prices the SmartDay High-Price Period Charge at $0.60000/kWh under footnote *, \"Applicable on SmartDays\", and the two credits under footnote **, \"Applicable to Non High-Price Period usage on SmartDays and all usage for those days in a bill period not declared as SmartDays\"; Sheet 1 says the same in prose. The modifier carries no urpx:hasTOUSchedule and no Price or PriceDefinition carries urpx:referencesTouPeriod or urpx:touPeriodNumber, so at clj-urpx 0.32.0 all three prices resolve at every hour of the year and the marginal is -0.00803 at every probe instant. The obvious repair, a clock-only 4:00 p.m. to 9:00 p.m. TOU window with the charge on period 1 and the credits on period 2, was built, validates against v0.5.1 and resolves cleanly, and is wrong: it returns 0.60000 alone at 17:00 on every day of the year, when on the roughly 350 days that are not SmartDays the credits do apply in that window and the charge does not apply at all. Blocked at v0.5.1 on the absence of an event-day predicate. urpx:DayTypeValue has exactly four members (allDays, customDays, weekdayDays, weekendDays) and none means a called event day; urpx-shacl:TimeBracketShape is sh:closed over appliesInSeason, dayType, endTime, includeHolidays, includeNonHolidays and startTime; urpx-shacl:PriceUpdateRuleShape is sh:closed over name, description and priority, so the trigger can only be prose; and a full-text scan of the v0.5.1 ontology for event vocabulary returns only urpx:OrganizationEvent, urpx:eventDrivenPricing and urpx:eventTriggeredUpdates. Do not use urpx:customDays, which clj-urpx 0.32.0 maps to all seven days. This filing's own README already records the obstacle at line 52, \"The 4-9pm window only matters on event days\".",
 "SmartRate credits carry the per-event rate rather than the billed amount, and fire when they should not. Sheet 2 prices the Non-High-Price Period Credit at ($0.00636) and the Participation Credit at ($0.00167), each \"x Number of SmartDays in a bill period\", and Sheet 1 states they \"are only applicable for bill periods in which at least one SmartDay occurs\". Sheet 4 bounds the multiplier: \"A maximum of fifteen (15) SmartDay Event Days and a minimum of nine (9) SmartDay Event Days may be called in any calendar year.\" The model carries the two per-event rates as unitPrice and states both the multiplier and the at-least-one-SmartDay condition only as prose in each Price's ApplicabilityRule name; clj-urpx 0.32.0 reads hasApplicabilityRule on PriceDefinitions only and only for urpx:month, and these rules hang off the Prices, so they are doubly unread and both credits resolve at -0.00636 and -0.00167 in every bill period including one with no SmartDay, where the correct value is zero. The SmartDay count appears nowhere as data. Not expressible at v0.5.1: urpx:multiplier is xsd:decimal, urpx:basedOnPrice names another Price, and CalculationMethodShape is sh:closed with only a free-text calculationFormula. The conditional value expression that would express it, urpx:ValueExpression with urpx:ConditionalValueNode, is proposed under specs 041-043 and has zero triples in the v0.5.1 ontology and SHACL; do not reach for it. Same root cause as the entry above: without an event-day predicate there is no bill-period SmartDay count to multiply by.",
 "Bill Protection, Sheet 5, is not modeled. Through the first full Summer Season, defined in Sheet 5 footnote 1 as May 1 through October 31 rather than the June 1 through September 30 summer of the underlying residential schedules, \"the customer will not pay more under the SmartRate program than it would pay under its OAS\", computed cumulatively at the end of the season and credited on the next regular bill, extended to \"any preceding partial summer, during the initial bill protection period\" and prorated on early termination so that \"the customer will receive bill protection up to the date the customer terminates its participation\". This prices a credit equal to the excess of the SmartRate bill over the otherwise applicable schedule's bill and states no amount. The datum is recordable: urpx:creditPriceProtection is a ChargeTypeValue at v0.5.1 (\"Credit from price protection program\", chargeCategory discount), and a urpx:GeneralRule carrying the clause verbatim can be reached directly from this RatePlanModifierVersion through urpx:referencesGeneralRule, which is one of the 42 properties on RatePlanModifierVersionShape and needs no TariffFiling or PricingModel container. What is not expressible is the value: it is a whole bill recomputed under a different schedule and differenced, there is no cross-plan bill comparison and no greater-of arithmetic anywhere in v0.5.1, and the credit's window depends on the customer's enrollment date. urpx:GeneralRule has zero uses across the 72 filings and is declarative at the pin.",
 "Sheet 4 Notification and Trigger: the day-ahead temperature-forecast trigger (98 F on non-holiday weekdays, 105 F on holidays and weekends, averaged across San Jose, Concord, Red Bluff, Sacramento and Fresno, adjustable up to twice a month), the CAISO alert, high spot-price, event-count and testing initiation paths, and PG&E's retained sole discretion not to call an event. Carried in PriceUpdateRule description prose only, in no structurally evaluable form.",
 "Sheet 5 Interaction with Other Demand Response Programs: SmartRate participants may no longer dual enroll in other PG&E or third-party demand response programs, and those dual enrolled with SmartAC before October 26, 2018 may remain in both at their December 10, 2018 subscribed megawatt level but receive no energy payment for performance during the SmartDay High-Price Period. The bar and its grandfather exception are prose only; the filing's single EligibilityRule tests SmartRate election alone.",
 "Sheet 1 Applicability: enrollment takes effect on the first day of the next Billing Cycle whose start date falls at least five business days after the customer's request, and a request received inside that window moves to the following Billing Cycle. Absent from the model.",
 "The pinned consumer refuses this filing's marginal rather than returning a number. clj-urpx 0.32.0 evaluates no urpx:ConditionExpression, but since 0.26.0 it marks a gated tier :urpx.resolved/condition-gated and marginal-unit-rate throws :condition-gated-tier instead of summing it. Every probe instant for this filing is recorded refused on that reason in dev/baseline/marginal-rates.edn, and reports/ready-for-use.md lists it blocked for the same reason. That is the intended outcome: the ApplicabilityRule gates on the two Credits are real constraints this library does not evaluate, so a number would have been a confident wrong one. A caller that wants one anyway passes :assume-conditions-hold? true, which restores the pre-0.26.0 behaviour of treating every condition as satisfied.",
]

