notes = "first PG&E SmartRate filing in corpus, also first multi-base RatePlanModifier in corpus (5 bases: E-1, E-ELEC, E-TOU-C, E-TOU-D, EV2). Follows PRIME-CPP modeling pattern. 3 PriceDefinitions on 3 Ledgers: SmartDay High-Price Period Charge ($+0.60000, hasDynamicPricing + criticalPeakPricing + PriceUpdateRule); Non-High-Price Period Credit ($-0.00636 per-event rate, N_SmartDays multiplier deferred to consumer); Participation Credit ($-0.00167 per-event rate, N_SmartDays multiplier deferred). Single EligibilityRule on 'SmartRate Election' predicate. The 4-9pm High-Price window is descriptive prose, not structurally encoded — same approach as PRIME-CPP relies on. Composite tariff PDF: Sheet 1 reissued 2025-10-31 (Advice 7747-E); Sheets 2-5 unchanged since 2022-05-01 (Advice 6560-E). Per SCE convention, filing dated to most recent per-sheet effective date."
