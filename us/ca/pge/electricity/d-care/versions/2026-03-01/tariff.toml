# Extraction ------------------------------------------------------------------
[extraction]
tool = "manual"
extracted_on = "2026-10-05"
notes = """
Two sheets. Sheet 1 (61093-E, Advice 7846-E, effective March 1, 2026) states the
discount base; Sheet 2 (59087-E, Advice 7469-E, effective January 1, 2025) prices
it: A. D-CARE Discount 35.000%, B. Delivery Minimum Bill Discount 50.000%,
C. Master-Meter D-CARE Discount 35.000%, D. Master-Meter Delivery Minimum Bill
Discount 50.000%. Dated by the newer sheet.

Sheet 1 APPLICABILITY: "CARE service is available on Schedules E-1, E-TOU-C,
E-TOU-D, EV2, E-ELEC, EM, ES, ESR, ET and EM-TOU." The first five are the
residential bases this corpus holds, and urpx:applicableToRatePlan names them.

The schedule states no date of first introduction, so
urpx:initialEffectiveDate carries this version's date, as pge:e-1-income-tier
and pge:e-tou-c-baseline-tier do.
"""

