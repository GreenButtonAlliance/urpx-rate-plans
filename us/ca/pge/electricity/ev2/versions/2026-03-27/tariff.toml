]

# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "Residential TOU for plug-in EV customers. Three TOU periods (Peak / Part-Peak / Off-Peak) every day including weekends and holidays. No baseline credit, no CIA, no climate credit, no baseline matrix. RatePlan + Vintaged-PCIA modifier in single @graph. Customer-facing name is 'EV2-A' per PG&E (per Sheet 1 'Bills issued under Schedule EV2 will be identified as EV2A')."
