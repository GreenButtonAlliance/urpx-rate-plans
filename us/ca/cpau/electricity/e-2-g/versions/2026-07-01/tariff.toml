# Modeling --------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Sheet E-2-G-1 Section C.2 prices a 1000 kWh Block Purchase Option that the model does not carry: base E-2 unbundled rates with no per-kWh green adder ($0.27676 summer, $0.18067 winter), plus \"Palo Alto Green Charge (per 1000 kWh block) $7.50\" for each block of RECs the customer requests (Sheet E-2-G-2 D.3: the customer designates the number of blocks and may change it in writing at any time). The model holds only Section C.1's $0.0075/kWh adder, so a Block Purchase customer has no price at all here. This is unbuilt work, not a vocabulary blocker: add a second MetricInput for the requested block count with unitOfMeasure urpx:count and a Price with unitPrice 7.50 against it. Verified to conform against the v0.5.1 shapes in the merged CPAU graph. urpx:count exists at v0.2.1 as well, so the v0.5.1 migration did not unblock this. Do not carry the 1000 kWh block size in urpx:baseQuantity: a urpx:unitPrice of 7.50 stands as written against the metric its Price references, so a block priced that way states 7.50 rather than 7.50 per 1000 kWh.",
 "Sheet E-2-G-1 Section C offers the 100% Renewable Option (C.1) and the 1000 kWh Block Purchase Option (C.2) as alternatives and a customer is on exactly one, but the model states the C.1 $0.0075/kWh Palo Alto Green Charge in a single ungated PriceSet with no ProfileAlternatives and no ApplicabilityRule. A consumer therefore applies the per-kWh adder to every E-2-G customer, including Block Purchase customers, whose C.2 per-kWh totals ($0.27676 summer, $0.18067 winter) contain no green component. Needs PlanElements.hasProfileAlternatives plus Prices.hasPriceSetAlternatives with one alternative per option, the pattern pge/e-1 2026-03-01 already ships; verified to conform against the v0.5.1 shapes in the merged CPAU graph. Expressible at v0.2.1 too. Fix this alongside the block charge: adding the $7.50 price without the selection layer would make the model apply both charges at once.",
]

