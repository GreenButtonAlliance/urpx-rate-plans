# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Sheet E-2-G-1 Section C.2 prices a 1000 kWh Block Purchase Option that the model does not carry: base E-2 unbundled rates with no per-kWh green adder ($0.26485 summer, $0.17290 winter), plus \"Palo Alto Green Charge (per 1000 kWh block) $7.50\" for each block of RECs the customer requests (Sheet E-2-G-2 D.3: the customer designates the number of blocks and may change it in writing at any time). The model holds only Section C.1's $0.0075/kWh adder, so a Block Purchase customer has no price at all here. This is unbuilt work, not a vocabulary blocker: add a second MetricInput for the requested block count with unitOfMeasure urpx:count and a Price with unitPrice 7.50 against it. Verified to conform against the v0.5.1 shapes in the merged CPAU graph. urpx:count exists at v0.2.1 as well, so the v0.5.1 migration did not unblock this. Do not carry the 1000 kWh block size in urpx:baseQuantity: a urpx:unitPrice of 7.50 stands as written against the metric its Price references, so a block priced that way states 7.50 rather than 7.50 per 1000 kWh.",
 "Sheet E-2-G-1 Section C offers the 100% Renewable Option (C.1) and the 1000 kWh Block Purchase Option (C.2) as alternatives and a customer is on exactly one, but the model states the C.1 $0.0075/kWh Palo Alto Green Charge in a single ungated PriceSet with no ProfileAlternatives and no ApplicabilityRule. A consumer therefore applies the per-kWh adder to every E-2-G customer, including Block Purchase customers, whose C.2 per-kWh totals ($0.26485 summer, $0.17290 winter) contain no green component. Needs PlanElements.hasProfileAlternatives plus Prices.hasPriceSetAlternatives with one alternative per option, the pattern pge/e-1 2026-03-01 already ships; verified to conform against the v0.5.1 shapes in the merged CPAU graph. Expressible at v0.2.1 too. Fix this alongside the block charge: adding the $7.50 price without the selection layer would make the model apply both charges at once.",
]

# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "CPAU Schedule E-2-G (Residential Master-Metered and Small Non-Residential Green Power Electric Service). First standalone modifier filing in the urpx-rate-plans corpus (CPAU E-2-G, E-4-G and E-7-G were filed together): the top-level entity is urpx:RatePlanModifier, not urpx:RatePlan. Modifies the cpau:e-2 base by adding a Palo Alto Green Charge of $0.0075/kWh to all energy consumption for small commercial / master-metered multi-family customers participating in the Palo Alto Green Program under the 100% Renewable Option. Section A eligibility: customer qualifies for E-2 Service AND elects to participate in the Palo Alto Green Program. The 1000 kWh Block Purchase Option ($7.50/block) published in the same rate filing is not modeled here (different metric shape: per-block discrete purchase against continuous per-kWh consumption); see the deferrals above. Generated by scripts/build-cpau-e-2-g-2025-07-01.py. urpx-org/urpx#23 asks how a standalone modifier filing should express applicableToRatePlan when the base RatePlan sits in a separate file; the property is omitted here, matching the URPX-team test-case pattern, and will be retrofitted once the URPX team responds. This filing carries the modifier alone, so it yields a bill only in composition with the cpau:e-2 base, and that composition convention likewise awaits urpx-org/urpx#23."
