# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Sheet E-1-TOU-2 Section D.2 (SEASONAL RATE CHANGES) provides that when a billing period includes use in both the Summer and Winter periods, 'usage will be prorated based on the number of days in each seasonal period, and the Charges based on the applicable rates therein' (further discussion at CPAU Rule and Regulation 11, which is not in this corpus). The model carries both Seasons and all six seasonal commodity rates but nothing that allocates a straddling period's usage between them, so a consumer must supply the day-count split itself, and a consumer that instead assigns each metered interval to the season of its timestamp gets a different bill. urpx:prorationMethod (xsd:string, 0..1 on BillingModelShape) can carry the provision declaratively; it is used by no filing in this corpus and read by no function in clj-urpx 0.32.0, and the allocation arithmetic itself has no computable form in v0.5.1.",
 "Section A excludes Net Energy Metered customers (\"This Rate Schedule is not available to Net Energy Metered (NEM) customers and is provided at the sole discretion of CPAU\"). The model quotes the sentence in a description; cpau:er-residential-tou carries four ComparisonNodes (residential kind, single-family, separately metered, AMI) and no NEM predicate. Expressible: cpau:e-nse-1-2025-09-01-cn-nem-successor is a notEqualsOperator NEM test in this same corpus.",
]
applicable_modifiers = [
 "e-hra",
 "e-nse-1",
]

# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "City of Palo Alto Utilities (CPAU) E-1 TOU Residential Time-Of-Use Electric Service. DCJ-authored rate plan; original v0.1.x conversion contributed to urpx-org/urpx test-cases via PR #7 (urpx-org/urpx#7). Migrated to URPX v0.2.0 on 2026-04-28 from urpx-org/urpx PR head e8ed4f0 using scripts/migrate-cpau-v020.py. Substantive changes vs. the v0.1.x source: ConditionExpression rewrite of the EligibilityRule (residential single-family separately-metered + AMI-meter required), BillingModel-owned PriceDefinitions with referencesLedger, ratePlanIdentifier → ratePlanUniqueIdentifier rename, ServiceTier description + hasCalculationMethod stripped where applicable, profileMetricProperty numberOfMeters → meterCount where applicable, IRI prefix urpx:cpau-* → cpau:* per repo convention. Voluntary residential TOU schedule with 3 periods (peak 4-9pm / off-peak / super off-peak) × 2 seasons. Only commodity rate varies by TOU; distribution and public benefits are flat. Two CPAU RatePlanModifiers (E-HRA, E-NSE-1) apply to this RatePlan but are not yet incorporated — packaging decision pending."
