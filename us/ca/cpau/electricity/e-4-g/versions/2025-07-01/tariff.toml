notes = "CPAU Schedule E-4-G (Medium Non-Residential Green Power Electric Service). FIRST STANDALONE MODIFIER FILING (along with sibling CPAU E-2-G / E-4-G / E-7-G filed together) in the urpx-rate-plans corpus — top-level entity is urpx:RatePlanModifier (not urpx:RatePlan). Modifies the cpau:e-4 base by adding a Palo Alto Green Charge of $0.0075/kWh to all energy consumption for medium commercial (demand-metered, < 1000 kW) customers participating in the Palo Alto Green Program under the 100% Renewable Option. Section A eligibility: customer qualifies for E-4 Service AND elects to participate in the Palo Alto Green Program. The 1000 kWh Block Purchase Option ($7.50/block) published in the same rate filing is NOT modeled in v1 — different metric shape (per-block discrete purchase vs continuous per-kWh consumption); tracked as a follow-up bd issue. Generated by shadow-repo/scripts/build-cpau-e-4-g-2025-07-01.py. Two URPX-team / clj-urpx threads in flight while this filing was being modeled: (1) urpx-org/urpx#23 — how a standalone modifier filing should express applicableToRatePlan when the base RatePlan is in a separate file (the property is OMITTED in this filing matching the URPX-team test-case pattern; will retrofit once URPX team responds); (2) clj-urpx — loader support for standalone RatePlanModifier filings (closed in faebc1a → 994f2e7; this filing now load+coerce+validates end-to-end). Resolution semantics (combining base + modifier into a single bill calculation) await urpx-org/urpx#23 to converge on the consumer convention. pyshacl Conforms: True; clj-urpx load+coerce+validate clean (resolve N/A — modifier requires base composition)."
