status = "draft"
notes = "CPAU Schedule E-4-G (Medium Non-Residential Green Power Electric Service). First standalone modifier filing in the corpus, along with sibling CPAU E-2-G and E-7-G filed together: the top-level entity is urpx:RatePlanModifier, not urpx:RatePlan. It modifies the cpau:e-4 base by adding a Palo Alto Green Charge of $0.0075/kWh to all energy consumption for medium commercial (demand-metered, < 1000 kW) customers participating in the Palo Alto Green Program under the 100% Renewable Option. Section A eligibility: the customer qualifies for E-4 Service AND elects to participate in the Palo Alto Green Program. The 1000 kWh Block Purchase Option ($7.50/block) published in the same rate filing is not modeled and is tracked as follow-up work; the first deferral records both the omission and the shape a build would take. urpx-org/urpx#23 asked how a standalone modifier filing should express applicableToRatePlan when the base RatePlan is in a separate file; this filing carries the property, naming cpau:e-4 and cpau:e-4-tou. Resolution semantics, combining base plus modifier into a single bill calculation, await the convention that thread converges on. Generated by scripts/build-cpau-e-4-g-2025-07-01.py. pyshacl Conforms: True against the v0.5.1 shapes; this filing prices nothing on its own, since a modifier resolves only composed onto its base."
