[review]
status        = "draft"
notes         = "City of Palo Alto Utilities (CPAU) E-1 Residential Electric Service — 2025-09-01 SNAPSHOT. Base RatePlanVersion (cpau:e-1-2025-07-01) is identical to ../2025-07-01/. What's new in this filing: E-EEC-1 (Solar NEM 2 Export Electricity Compensation, applies only to E-1) and E-NSE-1 (Solar NEM 1 Net Surplus Electricity Compensation, applies to E-1 and E-1-TOU) modifier RatePlanModifierVersions added to the @graph; both became effective 2025-09-01. E-HRA carried over from the 2025-07-01 filing (effective 2023-01-01; per the canonical landing page, annotated 'Inactive as of 7/1/2023' — the schedule still applies but currently produces zero adjustment). The 4-entity @graph is the consumer-ready snapshot for any consumer querying CPAU E-1 as of 2025-09-01 onwards. Modifier source data: the migration script consumed the modifier JSON-LD from urpx-org/urpx PR #7 head e8ed4f0 (DCJ-authored) and applied the v0.2.0 transforms (Decision #094/097/098 ConditionExpression rewrites including nested ApplicabilityRule.hasCondition migration, BillingModel-owned PriceDefinition with referencesLedger, isOptional removal, modifierIdentifier→modifierUniqueIdentifier relocation, IRI prefix translation). Validates clean via pyshacl + clj-urpx."
