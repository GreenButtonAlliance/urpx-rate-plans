# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Tier 1 quantity is denominated per day and prorated: Sheet E-1-1 Section D.2, \"a level of 15 kWh per day, prorated by Meter reading days of Service... for a 30-day bill, the Tier 1 level would be 450 kWh.\" cpau:tier-1-bracket carries upperBound 15 against cpau:ms-energy (unitOfMeasure urpx:kWh, no intervalDuration), and no tier name or description states the denomination, so the bound resolves as 15 kWh rather than 15 kWh/day. The per-day denomination IS expressible under v0.5.1 and was validated 2026-09-21: a daily-energy MetricInput whose MetricSpecification carries intervalDuration \"P1D\" and intervalType urpx:dailyInterval, pointed at by ServiceTiers.referencesMetricInput, conforms against the v0.5.1 shapes. It would be declarative at clj-urpx 0.32.0, whose ledger-metric-info (price.clj) surfaces only measurementKind, unitOfMeasure and flowDirection off a MetricSpecification. Work, not a blocker.",
 "The proration arithmetic itself is not expressible: a Tier 1 bound of 15 kWh times the number of meter reading days (Sheet E-1-1 Section D.2, which refers the calculation to Rule and Regulation 11, a document not held in this corpus). ServiceBracketShape is sh:closed in v0.5.1 and lowerBound/upperBound are xsd:decimal literals with no formula or metric reference, so a bound that scales with billing-period length cannot be stated. Same class as urpx-org/urpx#32 (additive baseline allowance), open. Corpus-wide: pge/e-1, pge/e-tou-c, sce/d, sdge/dr and ladwp/r-1a all encode a daily allowance as a bare decimal on an undenominated kWh metric.",
]
applicable_modifiers = [
 "e-eec-1",
 "e-hra",
 "e-nse-1",
]

# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "City of Palo Alto Utilities (CPAU) E-1 Residential Electric Service. DCJ-authored rate plan; original v0.1.x conversion contributed to urpx-org/urpx test-cases via PR #7 (urpx-org/urpx#7). Migrated to URPX v0.2.0 on 2026-04-28 from urpx-org/urpx PR head e8ed4f0 (after Una's 2026-04-28 SHACL-compliance push) using scripts/migrate-cpau-v020.py. Substantive changes vs. the v0.1.x source: ConditionExpression rewrite of the EligibilityRule (residential customer + single-family dwelling + separately metered), BillingModel-owned PriceDefinitions with referencesLedger, ratePlanIdentifier → ratePlanUniqueIdentifier rename, ServiceTier description + hasCalculationMethod stripped (ServiceTierShape is closed in v0.2.0), profileMetricProperty numberOfMeters → meterCount, IRI prefix urpx:cpau-* → cpau:* per repo convention. Three CPAU RatePlanModifiers (E-EEC-1, E-HRA, E-NSE-1) apply to this RatePlan but are not yet incorporated — packaging decision pending (cross-RatePlan applicability, urpx-org/urpx#16 SHACL-stub problem)."
