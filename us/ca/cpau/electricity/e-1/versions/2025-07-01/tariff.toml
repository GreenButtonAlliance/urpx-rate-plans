notes = "City of Palo Alto Utilities (CPAU) E-1 Residential Electric Service. DCJ-authored rate plan; original v0.1.x conversion contributed to urpx-org/urpx test-cases via PR #7 (urpx-org/urpx#7). Migrated to URPX v0.2.0 on 2026-04-28 from urpx-org/urpx PR head e8ed4f0 (after Una's 2026-04-28 SHACL-compliance push) using shadow-repo/scripts/migrate-cpau-v020.py. Substantive changes vs. the v0.1.x source: ConditionExpression rewrite of the EligibilityRule (residential customer + single-family dwelling + separately metered), BillingModel-owned PriceDefinitions with referencesLedger, ratePlanIdentifier → ratePlanUniqueIdentifier rename, ServiceTier description + hasCalculationMethod stripped (ServiceTierShape is closed in v0.2.0), profileMetricProperty numberOfMeters → meterCount, IRI prefix urpx:cpau-* → cpau:* per repo convention. Three CPAU RatePlanModifiers (E-EEC-1, E-HRA, E-NSE-1) apply to this RatePlan but are not yet incorporated — packaging decision pending (cross-RatePlan applicability, urpx-org/urpx#16 SHACL-stub problem)."
