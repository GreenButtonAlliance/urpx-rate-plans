notes = "CPAU Schedule E-2 (Residential Master-Metered and Small Non-Residential Electric Service) — first commercial filing in the urpx-rate-plans corpus. Two-period seasonal rate (Summer May–Oct, Winter Nov–Apr), no TOU within periods, no tiers; three-component unbundling per kWh (commodity / distribution / public benefits) plus a flat $6.22/month customer charge. Eligibility: non-residential customers with non-demand-metered service OR residential master-metered multi-family customers with non-demand-metered service (encoded as a 2-way OR over BooleanOperationNode AND-branches). NEW URPX modeling territory exercised here for the first time in our corpus: (1) urpx:nonResidentialKind eligibility (commercial customers); (2) urpx:appliesInSeason on PriceDefinition for non-TOU seasonal applicability (PG&E uses TOU + ApplicabilityRule.month; CPAU E-1-TOU uses TOU + Season-via-TOUPeriod; this is the simplest case — Season alone, no TOU); (3) urpx:hasSeasons on PlanElements; (4) customer charge with monthly intervalDuration P1M (residential CPAU + PG&E use P1D). Generated by shadow-repo/scripts/build-cpau-e-2-2025-07-01.py. pyshacl + clj-urpx end-to-end validate clean (clj-urpx@86d109e adds appliesInSeason → Season.month gating per ; summer marginal at probe instant = 0.26485 = 0.15075 + 0.10806 + 0.00604, matching Section C of the PDF)."
