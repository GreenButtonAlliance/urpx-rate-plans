# Modeling --------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Annual settlement period not modeled. Sheet E-NSE-1 prices the compensation against net surplus electricity accumulated over an annual settlement period: Section A applies the schedule to customers \"who, at the end of an annual settlement period, as described in Rule 29, are Net Surplus Customer-Generators\", and Special Condition 1 states \"Net surplus electricity, as specified in Rule 29, if applicable, will be multiplied by the above compensation rate to determine the Customer's annual net surplus electricity compensation stated in dollars.\" The model carries the $0.1064/kWh rate correctly but has no CalculationMethod and no interval property anywhere, so nothing in it distinguishes this annual true-up credit from a per-interval export credit such as CPAU E-EEC-1; the two models differ only in price value and description prose. Expressible under v0.5.1 and verified by pyshacl against the shapes at abdfb521 (zero new violations): add urpx:intervalDuration \"P1Y\" and urpx:intervalType urpx:annualInterval to cpau:nse-ms-energy-net-surplus, the same MetricSpecification-level pattern pge:ms-energy-annual-rolling already ships. Put it on the MetricSpecification, NOT on the PriceDefinition: the annual period bounds the accumulation of the surplus kWh being measured, while the price itself stays a per-unit $0.1064/kWh rate rather than a charge recurring once an interval. Leave urpx:intervalAlignment unset: the window's start and end are defined in CPAU Rule 29, which is not held in this corpus, so the alignment cannot be sourced without fetching it. This is work, not a blocker.",
]

