# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Annual settlement period not modeled. Sheet E-NSE-1 prices the compensation against net surplus electricity accumulated over an annual settlement period: Section A applies the schedule to customers \"who, at the end of an annual settlement period, as described in Rule 29, are Net Surplus Customer-Generators\", and Special Condition 1 states \"Net surplus electricity, as specified in Rule 29, if applicable, will be multiplied by the above compensation rate to determine the Customer's annual net surplus electricity compensation stated in dollars.\" The model carries the $0.1012/kWh rate correctly but has no CalculationMethod and no interval property anywhere, so nothing in it distinguishes this annual true-up credit from a per-interval export credit such as CPAU E-EEC-1; the two models differ only in price value and description prose. Expressible under v0.5.1 and verified by pyshacl against the shapes at abdfb521 (zero new violations): add urpx:intervalDuration \"P1Y\" and urpx:intervalType urpx:annualInterval to cpau:nse-ms-energy-net-surplus, the same MetricSpecification-level pattern pge:ms-energy-annual-rolling already ships. Put it on the MetricSpecification, NOT on the PriceDefinition: clj-urpx 0.25.0 reads urpx:intervalDuration only off a PriceDefinition's CalculationMethod (price.clj recurring-interval), and its presence there excludes the price from the per-kWh marginal, which would be wrong for a genuinely per-unit rate. Leave urpx:intervalAlignment unset: the window's start and end are defined in CPAU Rule 29, which is not held in this corpus, so the alignment cannot be sourced without fetching it. This is work, not a blocker.",
]

# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "CPAU Schedule E-NSE-1 — standalone urpx:RatePlanModifier filing applicable to residential and small commercial NEM 1. Solar NEM 1 Net Surplus Electricity Compensation — annual-settlement compensation rate for NEM 1 customers who are net surplus generators at year-end and elect monetary payment. Does NOT apply to NEM 2 (Successor) customers. Net surplus electricity × compensation rate = annual monetary compensation. Originally DCJ-authored, contributed to urpx-org/urpx/test-cases/ via PR #7 (cpau-rate-plans branch); brought into urpx-rate-plans on 2026-04-30 by scripts/extract-cpau-modifiers-tdk.py — carves the modifier subtree out of the existing CPAU E-1 2025-09-01 multi-source filing's @graph into a standalone @graph. Both compatibility properties were stripped when the subtree was carved out, as a workaround for urpx-org/urpx#23; that issue closed and urpx:applicableToRatePlan was restored, naming cpau:e-1, cpau:e-1-tou and cpau:e-2. urpx:applicableToRatePlanVersion is deliberately not stated: it would have to name a version of each of those three plans and be re-edited on every new base version, and Decision #090 makes it additive rather than restrictive, so its absence asserts nothing false. DataSourceReference updated to the canonical paloalto.gov URL (vs the placeholder file:// URI inherited from the URPX-team-authored source). pyshacl + clj-urpx end-to-end validate clean (resolve N/A — modifier requires base+modifier composition; awaits urpx-org/urpx#23)."
