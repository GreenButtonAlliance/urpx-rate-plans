notes = "CPAU Schedule E-14 (Street Lights) — flat per-fixture-per-month rates for street/highway lighting installations and traffic signals owned by governmental agencies other than the City of Palo Alto. CPAU supplies electricity, performs switching, and maintains lamps + glassware (Section A). 17 fixture types modeled (16 lamps + 1 traffic-signal-controller + others) plus a $2.50/month switching surcharge for separately-switched circuits below 10 kW lamp load (Section D.2) — 18 PriceDefinitions total, each with its own MetricInput (count of fixtures of that type at the customer's installation). chargeType=urpx:serviceNonMetered; intervalDuration P1M. NEW URPX modeling territory: per-fixture-type pricing with one MetricInput per type (vs. previous corpus filings' shared-energy-MetricInput shape). Section D.5 interim-rate provision (lamps not on schedule) is documented in prose only — not a published rate. Section D.3 annual burning schedule (4100 hours/year) is an operational rule; not modeled. Generated by shadow-repo/scripts/build-cpau-e-14-2025-07-01.py. pyshacl + clj-urpx end-to-end validate clean (resolve=0 because rates are per-fixture/month, not $/kWh; correct exclusion from kWh marginal sum)."
