# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "CPAU Schedule E-4 (Medium Non-Residential Electric Service), the non-TOU sibling of CPAU E-4 TOU. Demand-metered Secondary service for customers with maximum demand below 1000 kW (eligibility encoded as a 2-way AND ConditionExpression: metering = 'Demand metered Secondary' AND monthlyMaxDemand_kW < 1000). Two-period seasonal rate (Summer May-Oct, Winter Nov-Apr); no TOU within periods. Three-component unbundled energy ($/kWh: commodity / distribution / public-benefits) plus a two-component demand charge ($/kW: commodity / distribution) plus $126.24/month customer charge. 11 PriceDefinitions: 6 energy (3 components × 2 seasons) + 4 demand (2 components × 2 seasons) + 1 customer charge. Demand calculated as the max kW in any 15-minute interval over the billing month (urpx:CalculationMethod with aggregationMethod=urpx:maximum, intervalDuration=P1M). NOT modeled in v1: Section D.5 Primary Voltage Discount (2.5% for >2 kV; same clause as E-4 TOU. Not yet modeled; the shape is settled, a urpx:Price carrying urpx:multiplier whose urpx:basedOnPrice names a urpx:PriceSummary); Section D.6 Standby Charge (deferred, urpx-org/urpx discussion #36; same shape as E-4 TOU's D.7); Section D.3 TES carve-out (Thermal Energy Storage customers' billing demand uses the noon-6pm weekday window instead of all-hours; deferred to a follow-up issue, customer-attribute-conditional CalculationMethod). Section D.3 5-minute interval option (City discretion for fluctuating loads) noted in description; default 15-minute is modeled. Generated by scripts/build-cpau-e-4-2025-07-01.py. Validation is clean end to end: the summer energy marginal at a probe instant is 0.15842 = 0.12441 + 0.02797 + 0.00604, matching Section C of the PDF, and the demand and service ledgers are excluded from the kWh marginal sum."
