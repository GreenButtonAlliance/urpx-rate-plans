[review]
status = "draft"
notes = "CPAU Schedule E-EEC-1: standalone urpx:RatePlanModifier filing for Export Electricity Compensation, applying in conjunction with the otherwise applicable Rate Schedule for each Customer class. Provides compensation for electricity exported to the grid by Customer-Generators as defined in Rule and Regulation 2 who are either not eligible for Net Energy Metering or who are eligible for it but elect to take Service under this Rate Schedule. Reverse-flow per-kWh credit; not applicable with TOU schedules. Requires a bidirectional meter. Originally DCJ-authored, contributed to urpx-org/urpx/test-cases/ via PR #7 (cpau-rate-plans branch); brought into urpx-rate-plans on 2026-04-30 by scripts/extract-cpau-modifiers-tdk.py, which carves the modifier subtree out of the existing CPAU E-1 2025-09-01 multi-source filing's @graph into a standalone @graph. urpx:applicableToRatePlan names cpau:e-1, cpau:e-2, cpau:e-3, cpau:e-4, cpau:e-7, cpau:e-14 and cpau:e-16; urpx:applicableToRatePlanVersion is absent per the standalone-modifier cross-graph identity workaround for urpx-org/urpx#23 (same shape as the green-power filings E-2-G / E-4-G / E-7-G). DataSourceReference updated to the canonical paloalto.gov URL (vs the placeholder file:// URI inherited from the URPX-team-authored source). The filing carries no base-plan prices of its own, so it prices nothing standing alone: billing a Customer-Generator needs this modifier composed with one of those base plans, which awaits urpx-org/urpx#23."
