[review]
status        = "draft"
notes         = "CPAU Schedule E-4 TOU (Medium Non-Residential Electric Time of Use Service) — first commercial TOU + demand-charge filing in the urpx-rate-plans corpus. Voluntary opt-in rate for demand-metered Secondary Electric Service customers with sustained demand 500–1000 kW (eligibility encoded as a 4-way AND ConditionExpression: metering = 'Demand metered Secondary' AND monthlyMaxDemand_kW BETWEEN 500 AND 1000 AND demandSustainedConsecutiveMonths = 3). Two seasons (Summer May–Oct, Winter Nov–Apr); three TOU periods for energy (Peak 4-9pm / Mid-Peak / Off-Peak — windows differ between Summer and Winter); two demand windows (Peak Demand within the energy peak window + Max Demand at any time of month). Holiday-aware (US federal holidays observed by CA utilities — same set as PG&E E-TOU-D). 27 PriceDefinitions: 18 energy (3 components × 3 TOU periods × 2 seasons) + 8 demand (2 components × 2 demand-types × 2 seasons) + 1 customer charge ($126.24/month). NEW URPX modeling territory exercised here for the first time in our corpus: (1) urpx:demand measurementKind + urpx:kW unit-of-measure (per-kW pricing); (2) two distinct demand charges (Peak vs Max) modeled as separate TOUPeriods on a Demand TOUSchedule; (3) two TOUSchedules in one BillingModel — energy and demand have different period structures so each MetricInput gets its own (urpx:TOUSchedule.referencesMetricInput); (4) commercial TOU windows that DIFFER between Summer and Winter (Summer Mid-Peak: 2-4pm + 9-11pm; Winter Mid-Peak: 9am-2pm); (5) holiday-aware TOU using the established PG&E E-TOU-D pattern (HolidayCalendar at PlanElements; includeHolidays/includeNonHolidays booleans on TimeBracket); (6) urpx:CalculationMethod with aggregationMethod=urpx:maximum on demand PriceDefinitions (vs implicit sum-aggregation for energy). DEFERRED to follow-up: Section D.5 Primary Voltage Discount (2.5% for >2kV service); Section D.7 Standby Charge (per-kW for non-utility on-site generation, with NEM-eligibility exemptions); Section D.4 12-month minimum commitment (URPX has no native vocabulary for minimum-term commitments — possible upstream issue). Section D.3 demand-meter installation rule (8000-kWh trigger) is operations, not a rate. Generated by shadow-repo/scripts/build-cpau-e-4-tou-2025-07-01.py. pyshacl + clj-urpx end-to-end validate clean (clj-urpx@faebc1a adds vector cardinality on BillingModel.hasTOUSchedule per URPX-qb5; summer peak energy marginal at probe instant = 0.20629 = 0.17208 + 0.02817 + 0.00604, matching Section C of the PDF; demand and service ledgers correctly excluded from the kWh marginal sum)."
