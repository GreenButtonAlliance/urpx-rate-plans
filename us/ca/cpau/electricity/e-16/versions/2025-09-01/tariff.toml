status        = "draft"
notes         = "CPAU Schedule E-16 (Unmetered Electric Service) — for customers with unmetered service (billboards, traffic cameras, irrigation systems, wireless antennas, etc.). PARTIAL MODELING in v1: customer charge $10.96/month (Section C.1, also acts as Section C.3 minimum charge) is modeled structurally as a single PriceDefinition. The Section C.2 energy charge — published as 'using Electric Rate Schedule E-2 plus all applicable riders' — is a CROSS-SCHEDULE REFERENCE pattern for which we couldn't figure out a structural URPX representation; it's described in prose only. Consumers needing a full E-16 bill must combine this filing with cpau:e-2 and applicable riders (E-HRA, E-EEC-1, E-NSE-1 as relevant). Section D estimation method (kWh estimated from Total Wattage × annual operating hours / 1000 / 12) is a calculation rule documented in prose. Section E miscellaneous fees (license fees for conduit usage, utility pole attachments, communication equipment mounting; CPI-indexed per Section F) are NOT modeled — annual rather than monthly, applies to physical infrastructure not energy service; deferred to a follow-up bd issue. Generated by shadow-repo/scripts/build-cpau-e-16-2025-09-01.py. pyshacl + clj-urpx end-to-end validate clean (resolve=0 because energy charge is prose-only and customer charge is per-month, not $/kWh)."
