[review]
status        = "draft"
notes         = "CPAU Schedule E-3 (Customer-Owned Generation Retail Rate) — buyback rates the utility pays for power produced by customer-owned generation facilities NOT NEM-eligible. Effective 2007-07-01, long-stable (no published reissues since 2007 — oldest filing in the urpx-rate-plans corpus). V1 SCOPE: Section C.1 WITHOUT-interval-meter case only — 4 PriceDefinitions: 2 energy buyback PDs (Summer / Winter at $0.07902 / $0.07831 per kWh, applies to both Firm and Non-Firm), 2 capacity-credit PDs (Summer / Winter at $4.32/kW/month each, gated to Firm-power customers via inline ApplicabilityGroup). NEW URPX MODELING TERRITORY: first reverse-flow filing in the corpus (urpx:flowDirection: urpx:reverse on energy + capacity MetricInputs). Reuses the buyback pattern established by CPAU E-EEC-1 / E-NSE-1 modifiers (chargeType urpx:creditEnergy, chargeCategory urpx:discount); for the capacity credit uses chargeType urpx:creditGeneration (the inverse direction of demand-charge schedules' urpx:demandDirect). DEFERRED: Section C.2 WITH-interval-meter TOU buyback (3 TOU periods Summer Peak/Mid-Peak/Off-Peak + 2 TOU periods Winter Peak/Off-Peak; TOU windows DIFFER from CPAU E-4 TOU and E-7 TOU — Summer Peak is 12 noon-6pm not 4-9pm); Section C.3 market-based buyback rate for facilities >1 MW (range pricing $2-10/kW, $0.03-0.20/kWh — URPX modeling for range pricing is itself a separate question). Both filed as bd follow-ups. Generated by shadow-repo/scripts/build-cpau-e-3-2007-07-01.py. pyshacl + clj-urpx end-to-end validate clean (summer energy marginal at probe instant = 0.07902, matching Section C.1; capacity-credit ledger correctly excluded from kWh marginal sum)."
