# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Section C.3 (Sheet E-3-2) prices a market-based buyback for facilities rated above 1 MW on customer request, and nothing of it is in the model: Firm $2.00 to $10.00 per kW-month and $0.03 to $0.20 per kWh, Non-Firm $0.03 to $0.20 per kWh with no capacity component, the rate itself being the City's average cost of electricity at the PG&E City Gate for energy and capacity purchased at the first of the month together with daily market prices for that month. Expressible under v0.5.1 and therefore unbuilt work rather than a blocker: a Price carrying urpx:hasDynamicPricing (dynamicPricingType urpx:indexBasedPricing, priceSource urpx:wholesaleMarketSource) with urpx:priceFloor and urpx:priceCeiling, plus a scalar such as urpx:currentPrice to satisfy PriceShape's sh:xone; that candidate was built into this filing's own document and conforms under the v0.5.1 shapes. Two caveats to record with it: clj-urpx 0.25.0 reads neither priceFloor nor priceCeiling and excludes hasDynamicPricing prices from the marginal by default, so the band would be declarative; and the ontology comments define these two as a clamp preventing a computed price from crossing a threshold, which is not obviously the same thing as a published tariff band.",
 "Sections C.1 and C.2 (Sheet E-3-1) are the two alternative buyback tables, selected by whether the facility has an interval meter, and the model places both under urpx:hasPriceSet with the choice expressed only as a urpx:ApplicabilityGroup on each PriceSet. clj-urpx 0.25.0 walks every hasPriceSet unconditionally and evaluates no ConditionExpression, so both tables resolve into cpau:e3-ledger-energy-buyback at the same instant: a summer weekday at 13:00 returns 0.07902 from C.1 and 0.09566 from C.2 together, and the same doubling occurs at every probed instant in both seasons. The v0.5.1 ontology reserves hasPriceSet for base sets and directs mutually exclusive sets to urpx:hasPriceSetAlternatives, and cpau:e-3 is the only filing in the corpus gating a PriceSet this way. Restructuring to a ProfileAlternatives (AlternativeDimension with customDimensionProperty hasIntervalMeter) plus a PriceSetAlternatives holding the C.1 and C.2 branches conforms under the v0.5.1 shapes and, driven through clj-urpx 0.25.0 with :profile-alternatives, returns 0.07902 alone for the no-interval-meter selection and 0.09566 alone for the interval-meter selection. Unbuilt work.",
 "Special Note 8 (Sheet E-3-3) requires that when a billing period falls partly in the summer period and partly in the winter period, total kWh usage, kW demand and the applicable rates be prorated between the two seasons by the ratio of the number of days in each. Not modeled. The only v0.5.1 vocabulary for this is urpx:prorationMethod, an xsd:string on BillingModel whose stated purpose is service starting or ending mid-period; it would carry the provision as prose, is read by no consumer, and is used by no filing in the corpus. Per-instant appliesInSeason already gives an interval consumer the right rate, so the unmodeled case is a C.1 monthly total that straddles April 30 or October 31.",
 "Special Note 2 (Sheet E-3-2) requires the quantity of power delivered to the utility to be adjusted for the effect of losses and for administrative costs associated with the facility, and states no factor. A source gap rather than a vocabulary gap: no number is published in this schedule, and Special Note 4 places all interconnection and sales terms in the customer's service contract. Section D likewise sets transmission rates site by site on a case by case basis with no published number, and Special Note 5 reserves a standby customer charge to that same service contract; none of the three is missing from the model so much as unpriced by the schedule.",
]
applicable_modifiers = [
 "e-eec-1",
