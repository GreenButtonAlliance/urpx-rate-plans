[review]
status = "draft"
notes = "CPAU Schedule E-7 TOU (Large Non-Residential Electric Time of Use Service) — large-commercial sibling of CPAU E-4 TOU and TOU sibling of CPAU E-7. Voluntary opt-in TOU rate for demand-metered customers with maximum demand >= 1000 kW per site, sustained 3+ consecutive months in the most recent 12-month period. Two seasons; 3 TOU periods for energy (Peak / Mid-Peak / Off-Peak — same windows as E-4 TOU); 2 demand windows (Peak Demand within energy peak window + Max Demand at any time of month). Holiday-aware. 27 PriceDefinitions: 18 energy (3 components × 3 TOU periods × 2 seasons) + 8 demand (2 components × 2 demand-types × 2 seasons) + 1 customer charge ($578.08/month — same as E-7 base). Section D.3 site-aggregation feature (multiple Accounts on contiguous parcels with a common billing address) is noted but not modeled — URPX has no native vocabulary. NOT modeled in v1: Section D.6 Primary Voltage Discount (2.8% — urpx-org/urpx discussion #34; note rate variance from E-4 TOU's 2.5%); Section D.7 Standby Charge (rates differ from E-4 TOU: $40.79 summer / $27.75 winter; urpx-org/urpx discussion #36); Section D.5 12-month minimum commitment (urpx-org/urpx#22 upstream URPX vocabulary issue). No TES carve-out (TES exception is on the non-TOU schedules only — E-4, E-7). Generated by shadow-repo/scripts/build-cpau-e-7-tou-2025-07-01.py (templatized from E-4 TOU build script). pyshacl + clj-urpx end-to-end validate clean (summer peak energy marginal at probe instant = 0.19205 = 0.18199 + 0.00402 + 0.00604, matching Section C of the PDF; demand and service ledgers correctly excluded from kWh marginal sum)."
