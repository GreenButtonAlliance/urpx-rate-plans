[modeling]
complete = false
deferrals = [
 "Section D.6, Sheet E-7-TOU-3: Primary Voltage Discount of 2.8 percent where delivery is made at the same voltage as the supplying line and that line is above 2 kV. Not modeled; no Price in this filing carries urpx:multiplier. Expressible at v0.5.1 as a Price with multiplier -0.028 and basedOnPrice naming a urpx:PriceSummary, gated by an ObjectOperandNode with conditionProperty urpx:voltageLevel and referencesValue urpx:primaryVoltage; urpx:voltageLevel's own skos:note sanctions that route. Two things to settle first. The schedule never states the base: D.1 implies the whole Section C bill, which needs three unit-homogeneous PriceSummaries ($/kWh, $/kW, $/month) because clj-urpx 0.32.0 sums includesPrice members without unit awareness. And clj-urpx 0.32.0 evaluates no ConditionExpression (pd-active-in-month? reads only urpx:month and its own docstring says condition gating is deferred), so a gated discount would reduce every customer's bill.",
 "Section D.7.b, Sheet E-7-TOU-4: Standby Charge per kW of Reserved Capacity, summer $9.25 commodity plus $31.54 distribution equals $40.79, winter $0.00 plus $27.75 equals $27.75, applicable under D.7.a to customers with a non-utility generation source behind the revenue meter. Not modeled; urpx:standbyCharge has zero uses anywhere in this corpus. Expressible at v0.5.1, where urpx:standbyCharge is one of 68 ChargeTypeValue members and is new since v0.2.1. Before building, settle the denomination: the assessor's candidate used urpx:virtualMetricInput, whose v0.5.1 skos:definition is \"Metric input for virtual net metering\" and is the wrong term here, and urpx:standbyCharge's own skos:note reads \"Distinct from urpx:capacityCharge (reserved supply capacity)\", which is directly on point for a charge priced per kW of Reserved Capacity. MeasurementTypeValue has 14 members and none is capacity. Same consumer caveat as D.6: the applicability gate is inert at the pin, so the charge would bill to customers with no generator.",
 "Section D.7.d(1), Sheet E-7-TOU-4: where Maximum Demand occurs while one or more non-utility generators are not operating, Maximum Demand is reduced by the sum of those generators' Maximum Generation, floored at zero (D.7.d(2) waives both charge and credit if the generator does not operate for an entire billing cycle). Not expressible at v0.5.1. Arithmetic vocabulary does exist (urpx:OperationNode, and 17 OperatorValue members including urpx:subtractOperator), but it is reachable only inside a ConditionExpression, whose only four hosts are ApplicabilityGroupShape, ApplicabilityRuleShape, EligibilityRuleShape and ProfileAlternativeShape, all boolean gates; nothing floors or clamps a billing determinant, since urpx:priceFloor and urpx:priceCeiling are rdfs:domain urpx:DynamicPricing. urpx-shacl:CalculationMethodShape is sh:closed over nine properties with no condition path, and its free-text calculationFormula is read by no consumer.",
 "Section D.7.e(1), Sheet E-7-TOU-5: the standby charge does not apply to backup generators designed to operate only during a service interruption and not used to offset customer purchases. What is not expressible is the backup-only fact as a property of a modeled DER: urpx-shacl:DistributedEnergyResourceShape is sh:closed over exactly 12 properties and none states an operating mode. The exemption itself is gateable as a urpx:CustomOperandNode predicate on the standby charge, the same route D.7.e(2)'s Public Utilities Code 2827(b)(4) test would take and the route this filing already uses for six CustomOperandNodes in its EligibilityRule, so it is half buildable rather than blocked outright. No consumer interprets such a predicate, and clj-urpx 0.32.0 evaluates none. D.7.e(3), Utilities Director discretion, is not modelable.",
 "Section D.3, Sheet E-7-TOU-3: a qualifying customer may take service for more than one Account or Meter where the Accounts cover contiguous parcels with no intervening public right-of-way and share a common billing address. This makes both the Section A 1,000 kW threshold (stated per site) and the demand determinants site-level rather than account-level, so it bears on pricing and not only on enrollment. Not expressible at v0.5.1: the ontology's own skos:note on urpx:AccountServiceAgreement says \"Service account and agreement data lives in customer data, not URPX.\" A MetricInput with metricInputType urpx:aggregatedMetricInput plus a CalculationMethod carrying aggregationMethod urpx:sum and a prose description validates and declares the intent, but it names no accounts, and clj-urpx 0.32.0 passes metricInputType through without acting on it. The filing prices a single account.",
]
