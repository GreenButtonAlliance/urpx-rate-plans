# Extraction ------------------------------------------------------------------
[extraction]
tool = "manual + script-derivation from sdge:ev-tou-5"
extracted_on = "2026-05-04"
notes = """
First filing of SDG&E Schedule EV-TOU in this corpus.
Sourced via the SDG&E Azure FDoor tariff API (recipe documented in
us/ca/sdge/electricity/utility.toml [scrape_notes]).

Schedule EV-TOU is the older EV-charging-targeted residential TOU
schedule — predecessor to EV-TOU-2 (sdge:ev-tou-2, not yet modeled)
and EV-TOU-5 (sdge:ev-tou-5). Per Sheet 1 applicability prose,
EV-TOU is "optionally available" — still open to enrollment, with
the quirk that under D.18-01-024 it's also applicable to commercial
EVSE pass-through customers.

Per the SDG&E convention (most-recent per-sheet date), this filing
is dated 2026-04-01 — Sheets 1-3 carry that effective date under
AL 4791-E or AL 4791-E-A; Sheets 4-5 are older (Jan 1 2023 under
AL 4129-E, no rate change since).

## Per-sheet effective dates

 Sheet 1 (Applicability + Total Rates table + Minimum Bill) —
 2026-04-01 (AL 4791-E-A, 64665-E) *** newest ***
 Sheet 2 (UDC Rates per-component breakdown) —
 2026-04-01 (AL 4791-E-A, 64371-E)
 Sheet 3 (TOU period table + Special Conditions 1-5) —
 2026-04-01 (AL 4791-E, 64372-E)
 Sheet 4 (Special Conditions 6-8: Optional Billing, Billing
 paths, Other Applicable Tariffs) — 2023-01-01 (AL 4129-E)
 Sheet 5 (Special Condition 9: PCIA Recovery) —
 2023-01-01 (AL 4129-E)

## Structural relationship to EV-TOU-5

EV-TOU shares the same TOU window structure as EV-TOU-5 (and TOU-DR1
and TOU-DR — all SDG&E residential TOU schedules use the unified
on-peak 4-9pm every day with weekday/weekend split super-off-peak).
EECC values are IDENTICAL between EV-TOU and EV-TOU-5 (Summer:
0.47019/0.17311/0.08147; Winter: 0.19990/0.14337/0.07410).

Differences from EV-TOU-5:

 (a) NO Base Services Charge — EV-TOU uses the older $0.413/day
 Minimum Bill mechanic instead (predates the BSC introduced
 under Decision 24-05-028). Reduced to $0.207/day for
 CARE/Medical-Baseline/FERA customers per Sheet 2 prose
 (50% discount) — modeled here at the standard rate; the
 discounted rate is captured implicitly in the relevant
 modifier filings if/when they apply on EV-TOU.

 (b) NO Baseline Adjustment Credit — EV-TOU customers don't
 receive the baseline credit (all kWh are billed at the same
 rates regardless of usage relative to baseline allocation).

 (c) Different UDC sub-component values:
 Component EV-TOU-5 EV-TOU delta
 Distribution 0.21102/0.02601 0.25679/0.10014 higher
 (TOU-varying; (TOU-varying;
 super-off-peak super-off-peak
 cheaper) cheaper, but
 both higher
 than EV-TOU-5)
 Transmission 0.10067/0 0.10067 flat
 (TOU-varying; (no super-off-peak
 zero on discount)
 super-off-peak)
 PPP 0.01515 0.01713 +0.00198
 LGC 0.00000 0.01235 +0.01235
 TRAC 0.00000 0.00000 same

 Net: EV-TOU's UDC Total is HIGHER than EV-TOU-5's in all
 periods. Combined with identical EECC, EV-TOU's all-in rate
 is higher than EV-TOU-5's; the schedule remains attractive
 for niche use cases (commercial EVSE pass-through per
 D.18-01-024) but is dominated by EV-TOU-5 for standard
 residential EV-owner use.

## Eligibility specifics

 - Customer must have a registered Motor Vehicle: BEV or PHEV
 recharged at premises, OR NGV refueled via HRA (Sheet 1).
 - NOT available to conventional charge-sustaining HEVs.
 - Per Special Condition 2: customer MUST separately meter EV
 charging facilities (EV charging gets its own meter, not
 the whole premise).
 - 12-month minimum stay rule (Special Condition 4) — once on
 EV-TOU, customer must stay 12 months before changing rates;
 after departing, can't return for 1 year.
 - Eligibility verification by utility (Special Condition 5).

## Modifier compose

CARE/FERA/DRAH from us/ca/sdge/{care,fera,drah}/ should be
extended to include sdge:ev-tou in their applicableToRatePlan once
this filing lands. Done in the same commit.


## Holiday calendar

The Sheet 3 Time Periods table (64372-E) gives one column for Weekdays
and one for Weekends and Holidays, and they differ only over 6 AM to
10 AM: Off-Peak on a weekday, Super Off-Peak on a weekend or holiday.
This PDF names no holiday and its Special Conditions carry no pointer to
Rule 1, so the set is the HOLIDAYS entry of SDG&E Electric Rule 1
(DEFINITIONS), Sheet 6, Cal. P.U.C. Sheet No. 61672-E, which is not
committed to this repo.

The calendar, its eight Holidays and the bracket flags follow
sdge:ev-tou-5 2026-04-01, whose Time Periods table is the same: the
6 AM to 10 AM weekday Off-Peak brackets exclude holidays, and a 6 AM to
10 AM weekday Super Off-Peak bracket applies only on a holiday. Weekend
brackets carry no flags, so a holiday on a Saturday or Sunday keeps the
weekend windows. No urpx:observanceRule is set.

## Modeling deferrals

 - Optional Billing - Utility Option (Special Condition 6) —
 utility may bill the lower of EV-TOU or non-TOU rate for first
 3 months. Not modeled — utility-discretionary policy, not a
 rate component.
 - PCIA recovery for CCA-served customers (Special Condition 9) —
 same deferral as the other SDG&E filings.
 - Franchise Fee Differential 5.78% for City of San Diego customers.
 - The 50% Minimum Bill discount for CARE/Medical-Baseline/FERA
 customers — modeled at the standard $0.413/day here; the
 discount path applies when the relevant program-overlay
 modifier is composed in.
"""

