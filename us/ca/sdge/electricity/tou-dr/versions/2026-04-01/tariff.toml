notes = """
First filing of SDG&E Schedule TOU-DR in this corpus.
Sourced via the SDG&E Azure FDoor tariff API (recipe documented in
us/ca/sdge/electricity/utility.toml [scrape_notes]).

Schedule TOU-DR is the older 3-period residential TOU schedule —
predecessor pattern to TOU-DR1 (sdge:tou-dr1). Per Sheet 1
applicability, TOU-DR is "optionally available to domestic service"
— still open to enrollment as of AL 4791-E-A (Mar 30 2026), though
TOU-DR1 became the CPUC mass-migration default for SDG&E in 2019.

Per the SDG&E convention (most-recent per-sheet date in source PDF),
this filing is dated 2026-04-01 — Sheets 1-5 all carry that effective
date under AL 4791-E or AL 4791-E-A. Sheet 6 is older (newly added
content, original 25542-E) and Sheet 7 is from 2015 (AL 2662-E).

## Structural relationship to TOU-DR1

TOU-DR's structure is byte-for-byte identical to TOU-DR1's except for
the EECC (Electric Energy Commodity Cost) values per TOU period and
season. Confirmed by reading TOU-DR's Sheet 1 ('Total Rates' table)
and Sheet 3 ('UDC Rates' table — the per-component breakdown of UDC
Total): every UDC sub-component (Transm, Distr, PPP, ND, CTC, LGC,
RS, TRAC) carries IDENTICAL values to TOU-DR1's; the BSC variants
(standard, DRAH, FERA, CARE) carry IDENTICAL values; the Baseline
Adjustment Credit ($-0.10892/kWh up to 130%) is identical; the
DWR-BC and WF-NBC values are identical.

Only EECC differs:

 TOU-DR1 TOU-DR delta
 Summer On-Peak 0.34920 0.22895 -0.12025
 Summer Off-Peak 0.12853 0.17007 +0.04154
 Summer Super-Off-Peak 0.04121 0.11457 +0.07336
 Winter On-Peak 0.27475 0.27453 -0.00022
 Winter Off-Peak 0.19304 0.19288 -0.00016
 Winter Super-Off-Peak 0.10228 0.10220 -0.00008

Net effect: TOU-DR has a flatter EECC profile in summer (smaller
spread between on-peak and super-off-peak) than TOU-DR1, making it
relatively more attractive for customers with less ability to shift
load away from on-peak. Winter EECC is essentially identical.

Per-sheet effective dates within source PDF:
 Sheet 1 (Applicability + Total Rates table) — 2026-04-01
 (AL 4791-E-A, 64655-E) *** newest, drives filing date ***
 Sheet 2 (Total Rates continued: TOU-DR-LI + TOU-DR-MB customer
 illustrations) — 2026-04-01 (AL 4791-E-A, 64641-E)
 Sheet 3 (UDC Rates per-component breakdown) — 2026-04-01
 (AL 4791-E-A, 64656-E)
 Sheet 4 (Notes + Rate Components definitions + Franchise Fee
 Differential) — 2026-04-01 (AL 4791-E)
 Sheet 5 (TOU period table + Special Conditions 1-2 Billing) —
 2026-04-01 (AL 4791-E)
 Sheet 6 (Special Conditions 3-onward; new content) — 2026-04-01
 (AL 4791-E, original 25542-E sheet)
 Sheet 7 (older Special Conditions) — 2015-02-01 (AL 2662-E)

## Derivation

JSON-LD generated from sdge:tou-dr1's existing 2026-04-01 filing by
script-derivation (in-place IRI prefix substitution + EECC price
refresh + DataSourceReference update + name/description rewrite).
26 PriceDefinitions, 6 EECC × season/period Prices, all UDC sub-
component Prices unchanged from TOU-DR1.

## Modeling deferrals (shared with TOU-DR1)

 - **PCIA** (Power Charge Indifference Adjustment for CCA-served
 customers) — referenced in Special Condition; not modeled. Same
 as the SDG&E TOU-DR1 deferral.
 - **Franchise Fee Differential** (5.78% for City of San Diego
 customers) — affects bill total but not per-component rates;
 deferred.
 - **TOU-DR-LI and TOU-DR-MB illustrative columns on Sheet 2** —
 those are illustrations of the bill that customers on Schedule
 E-CARE (sdge:care) or Schedule E-MEDICAL (Medical Baseline,
 blocked on urpx-org/urpx#32) would see when they're also on
 TOU-DR. Modeling lives in the standalone modifier filings, not
 here.

## Holiday calendar

The Time Periods table on this filing's own sheet gives one column for
Weekdays and one for Weekends and Holidays but names no holiday. Special
Condition 4 sends the reader to Rule 1: "The Definitions of terms used in
this Schedule are found either herein or in Rule 1." The set therefore comes
from SDG&E Electric Rule 1 (DEFINITIONS), Sheet 6, Original Cal. P.U.C.
Sheet No. 61672-E, AL 4375-E, D.23-12-037, effective Jul 1 2024, entry
HOLIDAYS, quoted in full:

 The Time-of-Use Holidays are New Year's Day (January 1), President's Day
 (third Monday in February), Memorial Day (last Monday in May),
 Independence Day (July 4), Labor Day (first Monday in September),
 Veterans Day (November 11), Thanksgiving Day (fourth Thursday in
 November), and Christmas Day (December 25). When a Holiday listed above
 falls on Sunday, the following Monday shall be defined as a Holiday. No
 change will be made for Holidays falling on Saturday.

Eight holidays, and NOT the federal set: SDG&E omits Martin Luther King Jr.
Day and Juneteenth, and its observance rule shifts only Sunday. Rule 1 is
not committed to this directory; fetch it from the SDG&E tariff portal at
tarfKey=77 via the Azure endpoint documented in
us/ca/sdge/electricity/utility.toml.

## How the calendar is applied

Weekday and weekend/holiday differ in exactly one window. Weekday Super
Off-Peak is midnight-6am plus 10am-2pm; weekend/holiday Super Off-Peak is a
continuous midnight-2pm. On-Peak is 4pm-9pm on every day type, and the
14:00-16:00 and 21:00-24:00 Off-Peak windows are common to both. So the only
hours that disagree are 6am-10am, Off-Peak on a weekday and Super Off-Peak
on a weekend or holiday.

Both halves of the swap are modeled, because either half alone leaves a
weekday-holiday morning resolving to the wrong tier or to nothing:

 - the 6am-10am weekday Off-Peak bracket takes includeHolidays = false and
 includeNonHolidays = true, so it no longer applies on a holiday;
 - a new 6am-10am weekday Super Off-Peak bracket takes includeHolidays =
 true and includeNonHolidays = false, so it applies only on a holiday.

Weekend brackets carry no holiday flags and so keep covering a holiday that
falls on a Saturday or Sunday, which is what Rule 1 directs (no shift for
Saturday, and a Sunday holiday is a Sunday). The On-Peak 4pm-9pm bracket is
urpx:allDays and likewise carries no flags, matching the tariff's identical
On-Peak column for weekdays and for weekends and holidays.

## Observance: what is not modeled

Rule 1's shift is Sunday-only. urpx:ObservanceRuleValue in URPX v0.5.1 has
four members (actualDateObservance, fridayIfWeekendObservance,
mondayIfWeekendObservance and nearestWeekdayObservance) and none of them
means "shift Sunday, leave Saturday alone". mondayIfWeekendObservance is the
near miss and it is wrong in a way that costs real money: it would also move
a Saturday holiday to the following Monday, pricing that Monday's 6am-10am
as Super Off-Peak on a day the tariff says is an ordinary weekday.
Independence Day 2026 falls on a Saturday, so that error would be live in
the first summer this filing is effective.

urpx:observanceRule is therefore left unset rather than set to a value the
source contradicts, and the rule is carried as text in each fixed-date
holiday's urpx:holidayRule. The cost of leaving it unset is the opposite and
smaller error: the Monday after a Sunday-falling New Year's Day,
Independence Day, Veterans Day or Christmas Day resolves as an ordinary
weekday. The first such date after this filing's effective date is
2027-07-05.
"""

