[modeling]
complete = false
deferrals = [
 "BSC placement is exclusive across DRAH, CARE and FERA, and the model does not say so. Sheet 5 (Cal. P.U.C. Sheet 65216-E) names four Base Services Charges, priced on Sheet 2 (standard 0.79343, DRAH 0.39688, FERA 0.39688, CARE 0.19713) and states: \"BSC placement will be determined by participation in CARE, FERA, and/or successfully meeting the deed-restricted affordable housing (DRAH) requirement. All other customers will receive the Base Services Charge.\" A customer may satisfy more than one test and still receives exactly one BSC. sdge:drah, sdge:care and sdge:fera are three separately published modifiers, each with its own BSC adjustment Price, so composing two of them stacks the credits and understates the bill (0.79343 - 0.39655 - 0.59630 is a negative fixed charge). This is unbuilt work, not a standard-level blocker. urpx-shacl:RatePlanModifierVersionShape carries 42 property shapes and one of them is urpx:referencesGeneralRule, whose range urpx:GeneralRule is documented \"Used for rules defined once at the tariff book level and referenced by multiple PricingModels, TariffFilings, RatePlanVersion, and RatePlanModifierVersion instances and elements\"; GeneralRuleShape admits generalRuleID, hasDataSourceReference, name, description, contributedBy and hasApplicabilityRule, ApplicabilityRuleShape admits hasConditionExpression, and BooleanOperatorValue includes urpx:notOperator. A GeneralRule carrying the Sheet 5 sentence verbatim with a NOT(CARE OR FERA) ApplicabilityRule, referenced from this modifier version and merged with the base documents, conforms against the v0.5.1 shapes. Three caveats to carry with it. urpx:GeneralRule has no use in any filing in this corpus, so the pattern is unattested here. The rule would state the exclusivity declaratively, machine-locatable and citable, and would change no Price: each of the three modifiers keeps its own BSC adjustment Price, so the graph still admits composing two. And the priority is a source gap: Sheet 5 says placement is determined by participation in CARE, FERA and/or DRAH but never says which wins when a customer satisfies more than one test, so the rule can say at most one BSC and cannot say CARE beats DRAH. Consider recording it once for the SDG&E BSC family rather than three times.",
 "Model defect pending a fix, not deferred work: urpx:applicableToRatePlan lists sdge:ev-tou, which the source excludes. Schedule EV-TOU has no Base Services Charge; its only fixed charge is a minimum bill of $0.413/day (EV-TOU Sheet 4, Cal. P.U.C. Sheet 65184-E), reduced 50 percent \"for CARE, Medical Baseline, or Family Electric Rate Assistance Program (FERA) customers\" only. DRAH, deed and affordable appear nowhere in sdge_ev-tou_2026-09-30.pdf, and that sheet was revised under the same advice letter (AL 4874-E, effective Sep 30 2026) that carries the DRAH BSC rows on the other eight SDG&E residential schedules, so the omission is deliberate rather than stale. This filing's DRAH Price is a bare unitPrice -0.39655 with no basedOnPrice, so composing it onto sdge:ev-tou drops a raw -$0.39655/day credit against a $0.413/day minimum bill, netting $0.01645/day. Fix: drop sdge:ev-tou from applicableToRatePlan here and drop \"drah\" from [modeling].applicable_modifiers in us/ca/sdge/electricity/ev-tou/versions/2026-09-30/tariff.toml, then delete this entry rather than carrying it. Note that sdge:care and sdge:fera carry the same defect and theirs is not fixable by deletion, since EV-TOU does grant them a benefit, just a differently shaped one; that belongs on those two filings.",
]

