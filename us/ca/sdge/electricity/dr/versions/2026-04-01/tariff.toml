notes = "Second SDG&E schedule. Pattern reference: us/ca/sce/electricity/d/versions/2025-11-15/ for non-TOU tier structure (also uses urpx:hasServiceTiers + serviceTierNumber on the tier-varying credit Price). 13 PriceDefinitions: 1 EECC (flat) + 8 UDC sub-components (flat, identical values to TOU-DR1) + DWR-BC + WF-NBC + 1 Baseline Adjustment Credit (tier-1 only) + 1 BSC. 13 Prices total. Unique to SDG&E DR vs SCE Schedule D: SCE encoded the tier structure in CIA (Conservation Incentive Adjustment); SDG&E DR encodes it in a separate Baseline Adjustment Credit tied to the same UDC ledger. Both achieve the same economic effect."
