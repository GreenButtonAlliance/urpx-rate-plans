extracted_on = "2026-04-30"
notes = """
Source pattern shared with TOU-DR1 — see us/ca/sdge/electricity/utility.toml for
the SDG&E tariff-portal URL convention (tariffsprd.sdge.com viewer +
Azure Front Door direct-PDF endpoint with X-Azure-FDID header).

Filing details (5-page PDF):
 Sheet 1 (RATES — standard + DR-LI/CARE) — AL 4791-E-A, Sheet 64653-E
 Sheet 2 (RATES — MB) — AL 4791-E-A, Sheet 64654-E
 Sheets 3-5 (Special Conditions, Baseline allocation table) — AL 4791-E,
 Sheets 64338-E / 64339-E / 64340-E

Same source PDF series as TOU-DR1 (AL 4791-E + 4791-E-A supplement).

## Modeling structure

Schedule DR is non-TOU but tier-varying:
 - 2 ServiceTiers: Tier 1 (≤130% of CPUC baseline allocation) and
 Tier 2 (above 130%). Threshold per Special Condition 3 varies
 by Climate Zone × Season × Basic/All-Electric:

 Baseline Allowance For Climatic Zones (kWh/day)
 Coastal Inland Mountain Desert
 Basic Allowance:
 Summer 9.0 10.4 13.6 15.9
 Winter 9.2 9.6 12.9 10.9
 All-Electric:
 Summer 6.0 8.7 15.2 17.0
 Winter 8.8 12.2 22.1 17.1

 - Bill = UDC + (DWR-BC + WF-NBC) + EECC, where:
 - UDC: Tier 2 = $0.34061/kWh (matches TOU-DR1's flat UDC); Tier 1
 effectively $0.23169/kWh = Tier 2 - $0.10892 (the Baseline
 Adjustment Credit). Modeled as 8 flat UDC sub-component
 PriceDefinitions (Trans, Distr, PPP, ND, CTC, LGC, RS, TRAC) +
 a tier-1-only Baseline Adjustment Credit PriceDefinition.
 - DWR-BC + WF-NBC: 0.00000 + 0.00591 = $0.00591/kWh flat.
 - EECC (Generation): FLAT $0.18274/kWh — no TOU, no season, no
 tier variation. Bundled customers only; CCA customers pay PCIA
 per Special Condition 11 (PCIA modeling deferred).
 - Base Services Charge: $0.79343/day for standard customers.

UDC sub-component values are identical to TOU-DR1 (same tariff year,
same overall delivery cost structure):
 Trans 0.10067, Distr 0.15719, PPP 0.01515, ND 0.00000,
 CTC -0.00007, LGC 0.00000, RS 0.00005, TRAC 0.06762

Baseline Adjustment Credit modeled as a separate Price tagged with
serviceTierNumber=1 (PG&E-E-1-style pattern). Tier 2 has no credit
Price entry (default 0).

## Modeling deferrals

Same as TOU-DR1:
 - PCIA (Power Charge Indifference Adjustment) for CCA customers.
 - Franchise Fee Differential 5.78% within City of San Diego.
 - CARE / Medical Baseline / FERA / DRAH RatePlanModifiers (Sheet 1
 Tier 1/Tier 2 rates published for each variant; modeled as
 standalone modifiers in grid-coordination/urpx-rate-plans#13 secondary epic).
 - The ServiceTier upper bound of 1.3 here is a placeholder
 representing 130% of customer-specific baseline allocation —
 the actual customer-facing threshold depends on the Climate Zone
 × Season × Basic/All-Electric matrix in Special Condition 3.
 Refining ServiceTier bounds to a per-customer-applicable value
 is a downstream consumer responsibility (the corpus exposes the
 tier structure; consumers resolve customer-specific allocations).
"""

