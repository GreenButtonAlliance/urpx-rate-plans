[modeling]
complete = false
deferrals = [
 "Sheet 2 (Cal. P.U.C. Sheet 64654-E) publishes a DR-MB rate table for Medical Baseline customers: Base Services Charge $0.79343/day (note 6: the MB program provides no BSC discount), UDC $0.23169/kWh up to 130% of baseline and $0.34061/kWh above it, DWR-BC + WF-NBC $0.00000 (note 3 exempts MB customers), EECC $0.18274/kWh, and Total Effective MB Rates of $0.32475/kWh and $0.41010/kWh. No SDG&E Medical Baseline overlay exists anywhere in this corpus, so an MB customer on Schedule DR cannot be billed from this data. Expressible under v0.5.1 in the CARE and FERA shape already shipping against this filing: a RatePlanModifierVersion carrying the DWR-BC and WF-NBC exemption credits plus a percentage Price using multiplier and basedOnPrice over an MB-discountable PriceSummary. Work, not a blocker.",
 "Sheet 3 (Cal. P.U.C. Sheet 64338-E): \"A Franchise Fee Differential of 5.78% will be applied to the monthly billings calculated under this schedule for all customers within the corporate limits of the City of San Diego.\" Not modeled. Expressible under v0.5.1 as a Price with multiplier 0.0578 and basedOnPrice over a PriceSummary of the monthly billing, chargeType urpx:taxMunicipal, gated on hasMunicipality in a ConditionExpression. Do not ship it against clj-urpx 0.32.0, which evaluates no ConditionExpression at resolution: the gate would be inert and the 5.78% would be charged to every DR customer, inside the city limits or not. Since clj-urpx 0.26.0 the omission is no longer silent: such a tier comes back marked :urpx.resolved/condition-gated, and marginal-unit-rate refuses with :condition-gated-tier rather than summing when a gated tier reaches the marginal, unless the caller passes :assume-conditions-hold? true.",
 "Special Condition 3 on Sheet 4 (Cal. P.U.C. Sheet 64339-E) publishes the Baseline Allowance table in kWh/day for Coastal, Inland, Mountain and Desert zones: Basic Allowance summer 9.0, 10.4, 13.6, 15.9 and winter 9.2, 9.6, 12.9, 10.9; All Electric summer 6.0, 8.7, 15.2, 17.0 and winter 8.8, 12.2, 22.1, 17.1. None of the 16 values is in the model, and sdge:tiers-baseline-130pct instead bounds Tier 1 at a dimensionless 1.3 while referencing sdge:dr-2026-04-01-mi-energy, whose unitOfMeasure is urpx:kWh, so the document as serialized says Tier 1 ends at 1.3 kWh. Both fixes validate against the v0.5.1 shapes: point ServiceTiers.referencesMetricInput at a MetricSpecification with unitOfMeasure urpx:ratio, keeping 1.3 and making it mean a fraction of the customer's allowance; or carry the absolute allowances as per-season ServiceBrackets using ServiceBracketShape appliesInSeason. Prefer the ratio route, because the allowance is denominated per day against a billing-period quantity and because, through clj-urpx 0.31.0, the consumer read only the first ServiceBracket per ServiceTier. That half is resolved at 0.32.0, which reads every bracket and selects by urpx:appliesInSeason and urpx:referencesProfileAlternative; the per-day-against-billing-period denomination is the half that still stands.",
 "Schedule E-CARE Sheet 2 states that \"The line-item bill discounts will be applied to the total bill (less any applicable exemptions, minimum bill amount and base services charge),\" and DR Sheet 1's published Total Effective CARE Rates match that ordering exactly: (0.41443 - 0.00864) x 0.65 = 0.26376 and (0.52335 - 0.00864) x 0.65 = 0.33456. sdge:dr-2026-04-01-summary-care-discountable omits the Base Services Charge, DWR-BC and WF-NBC but carries the PPP charge at its full $0.01515/kWh, so the CARE Surcharge exemption that the overlay applies as a separate -$0.00864/kWh Price falls outside the 35% base; composing overlay and base yields $0.26074 and $0.33154 per kWh, $0.00302 low in both tiers. Unresolved: where the $0.00864 sits inside DR's own rates. Sheet 3 splits PPP into LI-PPP $0.00976/kWh and Non-LI-PPP $0.00531/kWh, and neither is it, so the surcharge cannot be netted out by dropping a member from the summary. Sheet 1 note (4) calls the effective-rate column illustrative.",
 "Special Condition 9.b, the Direct Access and Community Choice Aggregation bill path, is a computation rule on this schedule's own charges and is in no part of the model. The assessment read urpx:serviceRole urpx:bundledServiceRole as scoping the version out of it, but that is a statement the model makes, not one the source makes: Sheet 1 note (2) says \"Differences in total rates paid by Direct Access (DA) and Community Choice Aggregation (CCA) customers are identified in Schedule DA-CRS and CCA-CRS, respectively\" and Special Condition 9.b routes those customers through the Cost Responsibility Surcharge. The crediting half operates on this filing's own EECC Prices; the CRS half is another schedule's and no SDG&E DA-CRS or CCA-CRS filing exists in this corpus. The assessment itself asked for a corpus-wide ruling here.",
 "Special Condition 1 (Sheet 3) states load-check and rebilling terms on this schedule, including an 11-month rebilling window, and nothing in the model corresponds to them.",
]
