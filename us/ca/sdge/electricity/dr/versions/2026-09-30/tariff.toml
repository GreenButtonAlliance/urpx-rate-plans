deferrals = [
 "Sheet 2 (Cal. P.U.C. Sheet 65131-E) publishes DR-MB columns for Medical Baseline customers: Base Services Charge $0.79343/day, the same as the standard charge; Total Energy Rates for unbundled customers of $0.21900/kWh up to 130% of baseline and $0.32601/kWh above it, with the Wildfire Non-Bypassable Charge and DWR Bond Charge shown as N/A for DR-MB on Sheet 4 (Cal. P.U.C. Sheet 65133-E); EECC $0.18808/kWh; and Total Effective Rates for bundled customers of $0.31899/kWh and $0.40284/kWh. No SDG&E Medical Baseline overlay exists anywhere in this corpus, so an MB customer on Schedule DR cannot be billed from this data. Expressible under v0.5.1 in the CARE and FERA shape already shipping against this filing: a RatePlanModifierVersion carrying the DWR-BC and WF-NBC exemption credits plus a percentage Price using multiplier and basedOnPrice over an MB-discountable PriceSummary. Work, not a blocker.",
 "Sheet 5 (Cal. P.U.C. Sheet 65134-E): \"A Franchise Fee Differential of 5.78% will be applied to the monthly billings calculated under this schedule for all customers within the corporate limits of the City of San Diego.\" Not modeled. Expressible under v0.5.1 as a Price with multiplier 0.0578 and basedOnPrice over a PriceSummary of the monthly billing, chargeType urpx:taxMunicipal, gated on hasMunicipality in a ConditionExpression; the gate carries the whole restriction, since an ungated Price would charge the 5.78% to every DR customer, inside the city limits or not.",
 "General Special Condition 3 on Sheet 6 (Cal. P.U.C. Sheet 65135-E) publishes the Baseline Allowance table in kWh/day for Coastal, Inland, Mountain and Desert zones: Basic Allowance summer 9.0, 10.4, 13.6, 15.9 and winter 9.2, 9.6, 12.9, 10.9; All Electric summer 6.0, 8.7, 15.2, 17.0 and winter 8.8, 12.2, 22.1, 17.1. None of the 16 values is in the model, and sdge:dr-2026-09-30-tiers-baseline-130pct instead bounds Tier 1 at a dimensionless 1.3 while referencing sdge:dr-2026-09-30-mi-energy, whose unitOfMeasure is urpx:kWh, so the document as serialized says Tier 1 ends at 1.3 kWh. Both fixes validate against the v0.5.1 shapes: point ServiceTiers.referencesMetricInput at a MetricSpecification with unitOfMeasure urpx:ratio, keeping 1.3 and making it mean a fraction of the customer's allowance; or carry the absolute allowances as per-season ServiceBrackets using ServiceBracketShape appliesInSeason. Prefer the ratio route, because the allowance is denominated per day against a billing-period quantity.",
 "General Special Condition 9.b, the Direct Access and Community Choice Aggregation bill path, is a computation rule on this schedule's own charges and is in no part of the model. The assessment read urpx:serviceRole urpx:bundledServiceRole as scoping the version out of it, but that is a statement the model makes, not one the source makes: Sheet 2 note 1 says \"Direct Access, Community Choice Aggregation and Transitional Bundled Service Customers pay the applicable Vintaged Power Charge Indifference Adjustment (PCIA)\", Sheet 4 points the unbundled PCIA to Schedules DA-CRS and CCA-CRS, and General Special Condition 9.b routes those customers through the Cost Responsibility Surcharge. The crediting half operates on this filing's own EECC Prices; the CRS half is another schedule's and no SDG&E DA-CRS or CCA-CRS filing exists in this corpus. The assessment itself asked for a corpus-wide ruling here.",
 "General Special Condition 1 (Sheet 6) states load-check and rebilling terms on this schedule, including an 11-month rebilling window, and nothing in the model corresponds to them.",
]
