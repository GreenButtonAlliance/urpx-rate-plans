deferrals = [
 "Sheet 2 (Cal. P.U.C. Sheet 64924-E) publishes a DR-MB rate table for Medical Baseline customers: Base Services Charge $0.79343/day (note 6: the MB program provides no BSC discount), UDC $0.21900/kWh up to 130% of baseline and $0.32601/kWh above it, DWR-BC + WF-NBC $0.00000 (note 3 exempts MB customers), EECC $0.18808/kWh, and Total Effective MB Rates of $0.31899/kWh and $0.40284/kWh. No SDG&E Medical Baseline overlay exists anywhere in this corpus, so an MB customer on Schedule DR cannot be billed from this data. Expressible under v0.5.1 in the CARE and FERA shape already shipping against this filing: a RatePlanModifierVersion carrying the DWR-BC and WF-NBC exemption credits plus a percentage Price using multiplier and basedOnPrice over an MB-discountable PriceSummary. Work, not a blocker.",
 "Sheet 3 (Cal. P.U.C. Sheet 64338-E): \"A Franchise Fee Differential of 5.78% will be applied to the monthly billings calculated under this schedule for all customers within the corporate limits of the City of San Diego.\" Not modeled. Expressible under v0.5.1 as a Price with multiplier 0.0578 and basedOnPrice over a PriceSummary of the monthly billing, chargeType urpx:taxMunicipal, gated on hasMunicipality in a ConditionExpression; the gate carries the whole restriction, since an ungated Price would charge the 5.78% to every DR customer, inside the city limits or not.",
 "Special Condition 3 on Sheet 4 (Cal. P.U.C. Sheet 64339-E) publishes the Baseline Allowance table in kWh/day for Coastal, Inland, Mountain and Desert zones: Basic Allowance summer 9.0, 10.4, 13.6, 15.9 and winter 9.2, 9.6, 12.9, 10.9; All Electric summer 6.0, 8.7, 15.2, 17.0 and winter 8.8, 12.2, 22.1, 17.1. None of the 16 values is in the model, and sdge:dr-2026-08-01-tiers-baseline-130pct instead bounds Tier 1 at a dimensionless 1.3 while referencing sdge:dr-2026-08-01-mi-energy, whose unitOfMeasure is urpx:kWh, so the document as serialized says Tier 1 ends at 1.3 kWh. Both fixes validate against the v0.5.1 shapes: point ServiceTiers.referencesMetricInput at a MetricSpecification with unitOfMeasure urpx:ratio, keeping 1.3 and making it mean a fraction of the customer's allowance; or carry the absolute allowances as per-season ServiceBrackets using ServiceBracketShape appliesInSeason. Prefer the ratio route, because the allowance is denominated per day against a billing-period quantity.",
 "Special Condition 9.b, the Direct Access and Community Choice Aggregation bill path, is a computation rule on this schedule's own charges and is in no part of the model. The assessment read urpx:serviceRole urpx:bundledServiceRole as scoping the version out of it, but that is a statement the model makes, not one the source makes: Sheet 2 note (2) says \"Differences in total rates paid by Direct Access (DA) and Community Choice Aggregation (CCA) customers are identified in Schedule DA-CRS and CCA-CRS, respectively\" and Special Condition 9.b routes those customers through the Cost Responsibility Surcharge. The crediting half operates on this filing's own EECC Prices; the CRS half is another schedule's and no SDG&E DA-CRS or CCA-CRS filing exists in this corpus. The assessment itself asked for a corpus-wide ruling here.",
