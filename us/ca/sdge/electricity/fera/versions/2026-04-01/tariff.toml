# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Schedule EV-TOU minimum bill halving, Sheet 1 benefit (a) (\"a 50% minimum bill or a reduced base services charge\"). Eight of the nine plans named in applicableToRatePlan publish a Base Services Charge of $0.79343/day standard and $0.39688/day FERA, so the -$0.39655/day credit modeled here is right for them. Schedule EV-TOU publishes no BSC: its own rate sheet prices a $0.413/day Minimum Bill and states \"with a 50% discount applied for CARE, Medical Baseline, or Family Electric Rate Assistance Program (FERA) customers resulting in a minimum bill of $0.207 per day\". Composed onto sdge:ev-tou this modifier therefore credits $0.39655/day against a $0.413/day charge instead of the $0.206/day the tariff grants, which is a wrong number rather than a missing one. Expressible under v0.5.1 and simply unbuilt: add a Price of unitPrice -0.206 (or multiplier -0.5 with basedOnPrice sdge:ev-tou-2026-04-01-price-base-services-charge, which yields -0.2065 against the published -0.206), and re-express the flat BSC credit as multiplier -0.5 over each base plan's BSC Price so it stops firing on EV-TOU (that route yields -0.396715/day against the published -0.39655/day). Schedule EV-TOU's own manifest defers this outward to \"the relevant program-overlay modifier composition\", which is this filing.",
 "Sheet 1 APPLICABILITY states three eligibility predicates and the EligibilityRule encodes one. Verbatim: \"Applicable to domestic service customers residing in permanent single-family dwellings, and sub-metered multifamily dwellings, mobilehome parks, or qualifying RV parks and marinas located on a single premise where all of the accommodations are separately metered by the utility.\" \"This schedule is not applicable to customers receiving service under Schedule E-CARE and Schedule DM.\" \"Customers eligible for this schedule must meet specific income guidelines and have at least three (3) or more persons residing in each individual accommodation, as set forth in Special Condition 1, in order to receive the benefit of this schedule.\" The model's ConditionExpression is residential customer kind AND Program Enrollment = FERA. The E-CARE exclusion is load-bearing: at the pin, composing sdge:fera and sdge:care onto sdge:dr returns both Base Services Charge credits against one charge, a fixed charge of -0.19942 per day.",
 "Special Condition 9 (Sheet 3) states which load the modeled discount reaches: \"The utilities shall apply FERA discounts to both the load measured at the primary meter and the submetered load if the tariffs allow for FERA enrollment.\" The model's kWh MetricSpecification makes no submeter distinction. The shipped deferral \"EV Submetering applicability (Sheet 3 SC 9)\" records this and should be kept, not dropped.",
]

