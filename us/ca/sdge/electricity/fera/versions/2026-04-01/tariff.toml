extracted_on = "2026-05-04"
notes = """
First filing of SDG&E Schedule FERA in this corpus.
Sourced via the SDG&E Azure FDoor tariff API (recipe documented in
us/ca/sdge/electricity/utility.toml [scrape_notes]). Companion to us/ca/sdge/
care/2025-10-01/.

Per the SDG&E convention (most-recent per-sheet date), this filing
is dated to 2026-04-01 — Sheet 1's effective date under AL 4791-E.

Per-sheet effective dates:
 Sheet 1 (Applicability + Discount + Special Condition 1 income
 eligibility table) — 2026-04-01 (AL 4791-E, 64381-E)
 *** newest, drives filing date ***
 Sheet 2 (Special Conditions 2-8: Application, recertification,
 Billing for UDC/DA/CCA paths) — 2022-06-01 (AL 3994-E, 36062-E)
 Sheet 3 (Special Condition 9: EV Submetering for FERA) —
 2024-02-12 (AL 4385-E, 61753-E)

## Modifier shape

Modeled as urpx:RatePlanModifier (sibling pattern to 
SCE FERA and the just-completed SDG&E CARE). Eligibility
predicate: customer's 'Program Enrollment' = 'Family Electric Rate
Assistance (FERA)' (CustomOperandNode), matching the SCE/cross-utility
naming.

FERA customer benefits per Sheet 1 'Discount' section:
 (a) 50% minimum bill OR reduced Base Services Charge (relative to
 standard residential customers)
 (b) 18% line-item bill discount on the total bill (less any minimum
 bill amount or base services charge), as calculated for bundled
 service customers

## What this modifier captures

Two Prices (overlay onto any SDG&E residential base RatePlan when
customer is enrolled in FERA). One line-item credit:

 BSC Adjustment: -$0.39655/day (Standard $0.79343 → FERA $0.39688;
 exactly 50% reduction per Sheet 1
 prose 'a 50% minimum bill or a
 reduced base services charge')

 Source for BSC values: SDG&E TOU-DR1 base rate sheet (Sheet 1
 'Total Rates' table, row 'Base Services Charge – FERA'). Same
 numerical values appear consistently across the SDG&E residential
 bases.

And one percentage discount, a Price over a subtotal rather than a
line item:

 18% bill discount: sdge:fera-price-bill-discount-2026-04-01
 carries urpx:multiplier -0.18, and its urpx:basedOnPrice names
 sdge:<base>-2026-04-01-summary-fera-discountable in each of the 9
 bases listed in applicableToRatePlan, so the discount composes
 against whichever base the customer is on.

 Each of those urpx:PriceSummary nodes is the FERA-discountable
 subtotal Sheet 1 defines as the total bill less any minimum bill
 amount or base services charge: it excludes the fixed charge and
 nothing else, so the DWR-BC and the WF-NBC sit inside it. That is
 the one structural difference from the CARE subtotals, which
 exclude both. 12 members on sdge:dr, 26 on sdge:ev-tou-5.

Unlike SDG&E CARE, FERA does NOT include WF-NBC, DWR-BC, or CARE
Surcharge exemptions. The FERA prose only mentions the BSC adjustment
and the 18% discount.

## What this modifier does NOT capture (deferred)

 1. **FERA Medical Baseline customer co-benefits** — Sheet 1 prose:
 'FERA Medical Baseline customers taking electric service will
 also receive applicable benefits associated with Medical Baseline
 Program participation pursuant to D.25-09-006.' Those benefits
 live in Schedule E-MEDICAL, blocked on urpx-org/urpx#32 OPEN.

 2. **EV Submetering provision** (Sheet 3, Special Condition 9) —
 FERA discounts apply to both primary-meter load and submetered
 EV load when EV submetering is in use. This is more of an
 applicability extension than a separate Price; not modeled
 because base SDG&E filings don't separately track EV submeter
 load.

## Eligibility — Lower-Middle Income tier

Sheet 1 Special Condition 1 defines 'Lower-Middle Income Household'
as the eligibility band: total annual gross income within the
$42,301-$135,375 range (depending on household size, 1-2 through 8
persons). Income bracket is between 200% (CARE upper limit) + $1
through 250% of the Federal Poverty Limit. Updated annually by CPUC.
Required: 3 or more persons living in the household. NOT applicable
to customers receiving CARE or DM service.
"""

