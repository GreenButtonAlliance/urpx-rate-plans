deferrals = [
 "Baseline Adjustment Credit is modeled as a single unbounded Price at $-0.10892/kWh, but Sheet 2 (Cal. P.U.C. 64669-E) prices it only \"up to 130% of Baseline\" and note (4) confirms the cap, so as modeled it applies to every kWh and a high-usage bill comes out too low (summer on-peak marginal 0.59129 against 0.70021, a 15.6 percent understatement). Not a source gap: Special Condition 15 on Sheet 7 publishes the allowance quantities (Basic summer 9.0 / 10.4 / 13.6 / 15.9 and winter 9.2 / 9.6 / 12.9 / 10.9 kWh per day for Coastal / Inland / Mountain / Desert; All Electric summer 6.0 / 8.7 / 15.2 / 17.0 and winter 8.8 / 12.2 / 22.1 / 17.1). Expressible at v0.5.1 either by precomputing 1.3x the daily allowance as ServiceBracket bounds over the 16 zone x allowance-type x season cells as a ProfileAlternatives selection (the pge:e-tou-c pattern, whose 120 brackets live in a separate modifier file at that filing's 2026-03-01 vintage), or by a ratio-denominated MetricSpecification bounded 0 to 1.3 and 1.3 up. A 16-cell precomputed candidate conforms against the v0.5.1 shapes; the tier vocabulary is materially unchanged since v0.2.1, so this is unbuilt work and the migration did not unblock it. Do not copy sdge:dr, which bounds at 1.3 against a kWh metric.",
 "Franchise Fee Differential of 5.78 percent is not modeled. Sheet 5 (Cal. P.U.C. 64386-E): \"A Franchise Fee Differential of 5.78% will be applied to the monthly billings calculated under this Schedule for all customers within the corporate limits of the City of San Diego.\" The figure previously recorded here, 0.78 percent, was wrong. Expressible at v0.5.1, with urpx:taxMunicipal as the charge type, but it needs two Prices and not one. The tariff applies the percentage to the monthly billings under this Schedule, which include the $/day Base Services Charge as well as the $/kWh energy, and clj-urpx 0.32.0 sums a PriceSummary's members with no unit awareness, so a percentage spanning both units needs one Price per unit-homogeneous base. urpx-shacl:PriceSummaryShape requires includesPrice at minCount 2, so the single BSC Price cannot get a summary of its own and its leg must use basedOnPrice pointing at sdge:tou-dr1-2026-04-01-price-base-services-charge directly, while the energy leg goes over the 17-member $/kWh summary. A two-leg candidate built that way conforms merged with the nine SDG&E base plans. A one-leg build silently omits 5.78 percent of the Base Services Charge, about $1.38 on a 30-day cycle. Leave it unbuilt on the base plan because the geographic gate is inert at the pinned consumer: clj-urpx 0.32.0 evaluates no ConditionExpression at resolution, so an inline gated Price would charge 5.78 percent to every TOU-DR1 customer. Build it as a separate modifier filing alongside care, fera and drah so it is opt-in. Since clj-urpx 0.26.0 the omission is no longer silent: such a tier comes back marked :urpx.resolved/condition-gated, and marginal-unit-rate refuses with :condition-gated-tier rather than summing when a gated tier reaches the marginal, unless the caller passes :assume-conditions-hold? true.",
 "Sunday holiday observance is carried as prose and is not machine-readable. Special Condition 4 refers definitions to Electric Rule 1, whose HOLIDAYS entry makes the following Monday a holiday when a fixed-date holiday falls on Sunday, with no change for Saturday. This filing's weekday and weekend/holiday shapes differ only over 6 AM to 10 AM, so each such Monday should price Super Off-Peak instead of Off-Peak in that window. urpx:observanceRule has no Sunday-only member (the four are actualDate, fridayIfWeekend, mondayIfWeekend and nearestWeekday, and mondayIfWeekend would wrongly move Saturday holidays too), so the buildable fix is one dated urpx:Holiday per Monday the rule creates: 2027-07-05, 2029-11-12, 2032-07-05, 2033-12-26, 2034-01-02, 2035-11-12, 2038-07-05, 2039-12-26, 2040-01-02, 2040-11-12. Electric Rule 1 is not committed to this directory; fetch it from the SDG&E portal at tarfKey=77 before relying on the block quote in the extraction notes.",
 "TOU-DR1-MB rates published on Sheet 3 (Cal. P.U.C. 64642-E) have no model anywhere in the corpus: Base Services Charge $0.79343/day, UDC $0.34061, DWR-BC plus WF-NBC $0.00000, EECC unchanged, Total Effective MB Rate $0.54054 / $0.36762 / $0.29919 summer and $0.48220 / $0.41817 / $0.34705 winter on-peak / off-peak / super off-peak, and a Baseline Adjustment Credit of $(0.10892) showing $(0.08535) effective. The CARE, FERA and DRAH columns of the same sheets are carried by us/ca/sdge/electricity/{care,fera,drah}; Medical Baseline is the one published variant with no counterpart, and applicable_modifiers omits it. The cells are more clearly buildable than a table of numbers would suggest: the Total Effective MB column is exactly 0.783603 times the Total Rate in all six season-and-period cells and on the baseline-credit line, and the sibling sdge:dr MB table carries the same constant, so the published MB cells reduce to a single multiplier over a unit-homogeneous summary, the shape care and fera already ship. What is not in this PDF is the mechanism behind the factor: Special Condition 14 attributes it to the extra allotment granted under Schedule E-MEDICAL, E-MEDICAL is not in this corpus, and an additive allowance extension has no URPX form today (urpx-org/urpx#32 open). Six SDG&E filings publish an MB table, so this is a corpus-wide gap rather than one filing's. Add \"medical-baseline\" to applicable_modifiers once the modifier exists. Unsettled: Sheet 2 note (6) explicitly calls the CARE effective column illustrative and Sheet 3 carries no equivalent note, which decides whether an MB modifier should reproduce those numbers or derive them.",
