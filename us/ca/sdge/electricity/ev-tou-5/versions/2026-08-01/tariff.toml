[modeling]
complete = false
deferrals = [
 "Franchise Fee Differential 5.78% (Sheet 4, Cal. P.U.C. Sheet No. 64379-E): applied to the monthly billings calculated under this schedule for all customers within the corporate limits of the City of San Diego. Expressible under URPX v0.5.1 and pyshacl-validated against the v0.5.1 candidate: a Price with multiplier 0.0578, chargeType urpx:taxMunicipal and basedOnPrice naming a PriceSummary, gated by an ApplicabilityRule. It needs two unit-homogeneous summaries, one over the 27 per-kWh Prices and one over the per-day Base Services Charge, because the fee applies to the whole bill and a PriceSummary carries no unit conversion across the Prices it includes. Unbuilt rather than unbuildable: the restriction to the city limits lives in the ApplicabilityRule condition rather than in the price, so a consumer that does not evaluate that condition charges the fee to every customer on the schedule, not only those inside the city.",
 "Medical Baseline rates (Sheet 2, Cal. P.U.C. Sheet No. 64941-E): the schedule prints a Total Effective MB Rate for all six TOU cells, exactly 0.80 x the Total Rate in every cell, and note (3) exempts Medical Baseline customers from DWR-BC + WF-NBC, worth $0.00591/kWh. Neither the exemption nor the differential is modeled here or anywhere in the corpus; there is no sdge medical-baseline modifier filing and applicable_modifiers does not list one. The schedule states the discount is identified in Schedule E-MEDICAL, so the corpus pattern is the CARE and FERA one: host an MB-discountable PriceSummary in this filing and carry the percentage in an E-MEDICAL modifier. The summary validates under v0.5.1; sce/medical-baseline is the shape precedent.",
 "SDG&E Electric Rule 1 (DEFINITIONS), Sheet 6, Cal. P.U.C. Sheet No. 61672-E, HOLIDAYS: \"When a Holiday listed above falls on Sunday, the following Monday shall be defined as a Holiday. No change will be made for Holidays falling on Saturday.\" New Year's Day, Independence Day, Veterans Day and Christmas Day in sdge:ev-tou-5-2026-08-01-holidays carry no urpx:observanceRule, so each resolves on its actual date and a Saturday one stays on Saturday. The Monday after a Sunday New Year's Day, Independence Day, Veterans Day or Christmas Day is carried as a dated urpx:Holiday with urpx:holidayDate: 2027-07-05, 2029-11-12, 2032-07-05, 2033-12-26, 2034-01-02, 2035-11-12, 2038-07-05, 2039-12-26, 2040-01-02 and 2040-11-12. After 2040 each such Sunday holiday needs a further dated entry, until urpx:mondayIfSundayObservance (proposed in urpx-org/urpx#77) can state the rule; the dated entries then come out.",
 "Direct Access and Community Choice Aggregation billing (Special Condition 9.b, Sheet 6, Cal. P.U.C. Sheet No. 63296-E): a DA or CCA customer's bill is the bundled bill credited by the EECC component, and by the DWR-BC component for continuous DA customers exempt from that charge, plus the applicable Cost Responsibility Surcharge. Nothing in this model expresses that, so a DA or CCA bill resolves at the bundled rate. The two credits are expressible as Prices with multiplier -1 and basedOnPrice naming the six EECC Prices and the DWR-BC Price. The CRS amounts are priced in Schedules DA-CRS and CCA-CRS (Sheet 2 note 2), neither of which is in this corpus, so that half is a source gap. Special Condition 11's PCIA is not a separate item: the sheet states it is already embedded in the bundled EECC rates this filing carries, so the PCIA deferral recorded on the sibling SDG&E filings misdescribes the source.",
 "California Climate Credit $(49.36) semi-annual (Sheet 1, Cal. P.U.C. Sheet No. 64940-E): the schedule states the amount and attributes it to Schedule GHG-ARR, which is not in this corpus. The amount is expressible as a Price with intervalDuration P6M; the two months it lands in are a source gap, because this PDF never names them. Recorded the same way on the sibling sdge/ev-tou-2 filing.",
 "Optional Billing, Utility Option (Special Condition 8, Sheet 5, Cal. P.U.C. Sheet No. 64380-E): the utility may at its option bill a new customer the lower of the bill under this schedule or the bill under the customer's regularly applicable non-TOU schedule for three consecutive months. Bill-level lesser-of arithmetic across two schedules. Recordable but not computable under v0.5.1: urpx:creditPriceProtection is a ChargeTypeValue member (verified in the ChargeTypeValue oneOf at abdfb521), so a bill-protection line item can be declared and cited, but its value is a whole bill computed under another schedule and URPX carries no cross-schedule bill comparison; urpx:minimumBill and urpx:minimumCharge are ChargeTypeValue labels rather than operations, so neither expresses the lesser-of. Recorded the same way on sdge/ev-tou and sdge/ev-tou-2.",
 "Special Condition 12's submetering provision states which load the schedule's charges reach and is in no part of the model, whose single kWh MetricSpecification makes no submeter distinction.",
]
