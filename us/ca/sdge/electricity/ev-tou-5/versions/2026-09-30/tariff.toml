deferrals = [
 "Franchise Fee Differential 5.78% (Sheet 7, Cal. P.U.C. Sheet No. 65203-E): applied to the monthly billings calculated under this schedule for all customers within the corporate limits of the City of San Diego. Expressible under URPX v0.5.1 and pyshacl-validated against the v0.5.1 candidate: a Price with multiplier 0.0578, chargeType urpx:taxMunicipal and basedOnPrice naming a PriceSummary, gated by an ApplicabilityRule. It needs two unit-homogeneous summaries, one over the 27 per-kWh Prices and one over the per-day Base Services Charge, because the fee applies to the whole bill and a PriceSummary carries no unit conversion across the Prices it includes. Unbuilt rather than unbuildable: the restriction to the city limits lives in the ApplicabilityRule condition rather than in the price, so a consumer that does not evaluate that condition charges the fee to every customer on the schedule, not only those inside the city.",
 "Medical Baseline rates (Sheets 2 and 3, Cal. P.U.C. Sheet Nos. 65198-E and 65199-E): the schedule prints an EV-TOU-5-MB column whose Total Effective Energy Rates are 0.80 x its Total Energy Rates in all six TOU cells, unbundled and bundled on EECC, and Sheet 6 (65202-E) marks the Wildfire Non-Bypassable Charge and the DWR Bond Charge N/A for EV-TOU-5-MB, worth $0.00591/kWh. Neither the exemption nor the differential is modeled here or anywhere in the corpus; there is no sdge medical-baseline modifier filing and applicable_modifiers does not list one. The schedule attributes the effective rates to discounts under Schedule E-MEDICAL, so the corpus pattern is the CARE and FERA one: host an MB-discountable PriceSummary in this filing and carry the percentage in an E-MEDICAL modifier. The summary validates under v0.5.1; sce/medical-baseline is the shape precedent.",
 "SDG&E Electric Rule 1 (DEFINITIONS), Sheet 6, Cal. P.U.C. Sheet No. 61672-E, HOLIDAYS: \"When a Holiday listed above falls on Sunday, the following Monday shall be defined as a Holiday. No change will be made for Holidays falling on Saturday.\" New Year's Day, Independence Day, Veterans Day and Christmas Day in sdge:ev-tou-5-2026-09-30-holidays carry no urpx:observanceRule, so each resolves on its actual date and a Saturday one stays on Saturday. The Monday after a Sunday New Year's Day, Independence Day, Veterans Day or Christmas Day is carried as a dated urpx:Holiday with urpx:holidayDate: 2027-07-05, 2029-11-12, 2032-07-05, 2033-12-26, 2034-01-02, 2035-11-12, 2038-07-05, 2039-12-26, 2040-01-02 and 2040-11-12. After 2040 each such Sunday holiday needs a further dated entry, until urpx:mondayIfSundayObservance (proposed in urpx-org/urpx#77) can state the rule; the dated entries then come out.",
 "Direct Access and Community Choice Aggregation billing (General Special Condition 9.b, Sheet 10, Cal. P.U.C. Sheet No. 65206-E): a DA or CCA customer's bill is the bundled bill credited by the EECC component, and by the DWR-BC component for continuous DA customers exempt from that charge, plus the applicable Cost Responsibility Surcharge. Nothing in this model expresses that, so a DA or CCA bill resolves at the bundled rate. The two credits are expressible as Prices with multiplier -1 and basedOnPrice naming the six EECC Prices and the DWR-BC Price. The CRS amounts are priced in Schedules DA-CRS and CCA-CRS (the PCIA - Unbundled line on Sheet 6), neither of which is in this corpus, so that half is a source gap. EECC Special Condition 6's PCIA is not a separate item: Sheet 11 states it is already embedded in the bundled EECC rates this filing carries, so the PCIA deferral recorded on the sibling SDG&E filings misdescribes the source.",
 "California Climate Credit $(49.36) semi-annual (Sheet 1, Cal. P.U.C. Sheet No. 65197-E): the schedule states the amount and attributes it to Schedule GHG-ARR, which is not in this corpus. The amount is expressible as a Price with intervalDuration P6M; the two months it lands in are a source gap, because this PDF never names them. Recorded the same way on the sibling sdge/ev-tou-2 filing.",
 "Optional Billing, Utility Option (General Special Condition 8, Sheet 9, Cal. P.U.C. Sheet No. 65205-E): the utility may at its option bill a new customer the lower of the bill under this schedule or the bill under the customer's regularly applicable non-TOU schedule for three consecutive months. Bill-level lesser-of arithmetic across two schedules. Recordable but not computable under v0.5.1: urpx:creditPriceProtection is a ChargeTypeValue member (verified in the ChargeTypeValue oneOf at abdfb521), so a bill-protection line item can be declared and cited, but its value is a whole bill computed under another schedule and URPX carries no cross-schedule bill comparison; urpx:minimumBill and urpx:minimumCharge are ChargeTypeValue labels rather than operations, so neither expresses the lesser-of. Recorded the same way on sdge/ev-tou and sdge/ev-tou-2.",
 "General Special Condition 11's submetering provision states which load the schedule's charges reach and is in no part of the model, whose single kWh MetricSpecification makes no submeter distinction.",
 "Option EECC-EV-TOU-5-P (Reduce Your Use), which Advice 4874-E prints in this schedule, is not modeled: its applicability on Sheet 12 (Cal. P.U.C. Sheet No. 65208-E), its rates on Sheets 3 and 6 (65199-E and 65202-E), and EECC-EV-TOU-5-P Special Conditions 1 to 18 on Sheets 13 to 15. A bundled customer on it pays EECC-EV-TOU-5-P commodity rates of $0.42974, $0.15823 and $0.07447 per kWh in summer and $0.20347, $0.14593 and $0.07542 in winter, on-peak, off-peak and super off-peak, in place of the six EECC Prices modeled here, plus an RYU Adder of $1.16 per kWh billed from 4:00 p.m. to 9:00 p.m. on an RYU Event Day (EECC-EV-TOU-5-P Special Condition 14), with at most eighteen RYU Events a calendar year (EECC-EV-TOU-5-P Special Condition 13). The option is not applicable to Direct Access, Transitional Bundled Service or Community Choice Aggregation customers. Nothing in this filing selects the option or marks an RYU Event Day.",
