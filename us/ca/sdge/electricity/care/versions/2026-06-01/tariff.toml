deferrals = [
 "Sheet 1 DISCOUNT 1)(b) prices the fixed-charge benefit as either a 50 percent minimum bill or a reduced base services charge. The model carries only the reduced-BSC form, as an ungated flat -$0.59630/day credit (DR Sheet 2: BSC $0.79343 less BSC-CARE $0.19713) applied to every plan in applicableToRatePlan. Schedule EV-TOU has no base services charge: its Sheet 2 prices \"the minimum bill charge of $0.413 per day times the number of days in the billing cycle with a 50% discount applied for CARE, Medical Baseline, or Family Electric Rate Assistance Program (FERA) customers resulting in a minimum bill of $0.207 per day\", so an EV-TOU CARE bill as modeled comes to 0.413 - 0.59630 = -$0.1833/day where the schedule says $0.207/day. Expressible at v0.5.1 and unbuilt: a second Price carrying multiplier -0.5 with basedOnPrice naming the base services charge Price of the sdge:ev-tou version in force, such as sdge:ev-tou-2026-06-01-price-base-services-charge (which holds 0.413, misleadingly named). Building it is not sufficient on its own: the existing flat -0.59630 must also stop reaching EV-TOU, or both fire and the bill goes to -$0.2065/day. The same defect sits on sdge:fera, whose flat -$0.39655/day resolves $0.01645/day against a filed $0.207/day.",
 "Sheet 2 section 2) prices a 0.35000 Non-Residential CARE line-item discount on all customer demand and energy charges plus exemptions from the CARE Surcharge, WF-NBC and DWR-BC, and five of the seven cells in the Sheet 2 CARE Surcharges table are non-residential ($0.01062/kWh for Small Commercial, Medium Commercial and Large C&I Secondary, Primary and Secondary Substation, Primary Substation and Transmission; $0.00 per kW for that last class). None of it is modeled: the EligibilityRule gates on hasCustomerKind = residentialKind, and this corpus holds no SDG&E non-residential base plan for the 0.35000 to compose against. The five surcharge values are carryable as data today, but the only customer-class scope in this filing sits on that one EligibilityRule and covers the modifier as a whole: a Price here carries no class of its own, so five added non-residential Prices would sit beside the residential ones with nothing to tell them apart. The discount is blocked on corpus scope, not on vocabulary.",
 "Sheet 1 APPLICABILITY enumerates five customer types and the EligibilityRule encodes one. Verbatim: \"1) Customers residing in a permanent single-family accommodation, separately metered by the Utility. 2) Multi-family dwelling units and mobile home parks supplied through one meter on a single premises where the individual unit is submetered. 3) Non-profit group living facilities. 4) Agricultural employee housing facilities. 5) Homekey housing facilities, administered by the California Department of Housing and Community Development (HCD)\". The model's ConditionExpression is residential customer kind AND Program Enrollment = CARE.",
 "Special Condition 4's income table (from $43,280 for one to two persons up to $111,440 for eight, plus $11,360 per additional person) and Special Condition 9's retention conditions are this schedule's substantive eligibility content and are in no ConditionExpression. Special Condition 9 verbatim: \"CARE program participants with electric usage above 400% of baseline allowance must provide proof of qualifying household income, including IRS Tax Return Transcripts, agree to participate in the Energy Savings Assistance program, and keep their usage below 600% of baseline allowance to remain enrolled in CARE.\" This filing's own CoverageClaim cites the income table as a reason the claim stays partial; the assessment ruled it out of scope, which is the reading being corrected.",
 "Special Condition 20 (Sheet 8) states which load the modeled discount reaches: \"Utility will apply the CARE discount to both the load measured at the primary meter and the submetered load if the tariffs allow for CARE enrollment.\" The model's single MetricSpecification is an undifferentiated kWh input with no submeter distinction. The shipped deferral \"PEV Submetering applicability (Sheet 8 SC 20)\" records this and should be kept, not dropped.",
]

