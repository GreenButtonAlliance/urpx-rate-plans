notes = "Second SDG&E electrification-targeted schedule modeled (after EV-TOU-5). Pattern reference: us/ca/sdge/electricity/tou-dr1/versions/2026-04-01/ for the flat-UDC structure (TOU-DR1 and TOU-ELEC both have flat-across-periods UDC, unlike EV-TOU-5 which has TOU-varying transmission/distribution); us/ca/sdge/electricity/ev-tou-5/versions/2026-04-01/ for the multi-way-OR EligibilityRule pattern (extended here from 3-way to 4-way: BEV/PHEV via urpx:evChargingDER, NGV+HRA via CustomOperandNode, Rule-21 storage via urpx:storageDER, electric heat pump via CustomOperandNode). 16 PriceDefinitions: 6 EECC (TOU-varying generation) + 8 UDC sub-components (flat across periods/seasons) + DWR-BC + WF-NBC + BSC. NO Baseline Adjustment Credit (vs 1 in TOU-DR1). 16 Prices total. Distinguishing structural feature vs TOU-DR1: lower UDC ($0.26288 vs $0.34061) reflecting electrification-incentive subsidy via Distr ($0.14708 vs $0.15719) and TRAC ($0.00000 vs $0.06762)."
