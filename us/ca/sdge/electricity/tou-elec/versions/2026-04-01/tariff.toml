deferrals = [
 "Franchise Fee Differential 5.78% (Sheet 4, Cal. P.U.C. Sheet No. 64397-E): \"applied to the monthly billings calculated under this schedule for all customers within the corporate limits of the City of San Diego\" and added as a separate bill item. Not modeled. Expressible under URPX v0.5.1 as a modifier Price with multiplier 0.0578 and basedOnPrice naming a unit-homogeneous PriceSummary, chargeType urpx:taxMunicipal. Two cautions for whoever builds it: the City of San Diego gate needs a ConditionExpression, because a fee Price carrying no condition applies to every TOU-ELEC customer and would charge the 5.78% outside the corporate limits too; and a percentage spanning both $/kWh and $/day components needs one Price per unit-homogeneous summary, since PriceSummary members are summed without unit awareness. This is work, not a vocabulary blocker. No filing in the corpus models the franchise fee today.",
 "Medical Baseline rates (Sheet 2, Cal. P.U.C. Sheet No. 64674-E, table \"Description - TOU-ELEC MB Rates\"). Note 3 exempts MB customers from DWR-BC and WF-NBC, so their DWR-BC + WF-NBC column reads 0.00000 against 0.00591 on the standard table, and the Total Effective MB Rate column is exactly 80.000% of the Total MB Rate in all six season/period cells (0.57582, 0.31386, 0.27940, 0.40479, 0.30450, 0.27315). Note 6 confirms MB carries no BSC discount. Neither part is modeled: there is no SDG&E medical-baseline RatePlanModifier in this corpus (only us/ca/sce/electricity/medical-baseline/) and [modeling].applicable_modifiers omits it. The exemption half is expressible and precedented: sdge/care already carries sdge:care-price-wf-nbc-exemption-2025-10-01 at -0.00591 and a DWR-BC exemption at -0.00000 against the same base. The 80% factor is stated nowhere in this PDF; SC 5 sends the reader to Schedule E-MEDICAL, which this corpus does not hold, so the mechanism behind that column is a source gap even though the resulting per-cell rates are published here.",
 "SDG&E Rule 1's Sunday-to-Monday holiday observance is not in the model. The eight Time-of-Use Holidays are carried as urpx:Holiday entries with urpx:holidayRule strings and no urpx:holidayDate, so each falls on its own date and no observed Monday is added. urpx:observanceRule is correctly left unset, since none of its four values means \"shift Sunday, leave Saturday alone\" and mondayIfWeekendObservance would wrongly move Saturday 2026-07-04 to Monday 2026-07-06. The route that does work is unbuilt: add one further urpx:Holiday with urpx:holidayName and an explicit urpx:holidayDate for each Monday the rule creates, which the calendar then carries alongside the rule-derived dates. Over a reasonable horizon this matters at SDG&E on 2027-07-05, 2029-11-12, 2032-07-05, 2033-12-26, 2034-01-02, 2035-11-12, 2038-07-05, 2039-12-26, 2040-01-02 and 2040-11-12, where 06:00-10:00 should price as Super Off-Peak rather than Off-Peak (the only window where this filing's weekday and weekend/holiday shapes differ). Sibling us/ca/sdge/electricity/tou-dr records the same gap.",
 "SC 7.b (Sheet 6, Cal. P.U.C. Sheet No. 63312-E) directs that a Direct Access or CCA customer's bill is computed as a bundled bill and then credited \"by the amount of the EECC component and DWR-BC + WF-NBC component ... and including the appropriate Cost Responsibility Surcharge (CRS)\" per Schedules DA-CRS and CCA-CRS. The modeled RatePlanVersion declares urpx:serviceRole urpx:bundledServiceRole, so the DA/CCA branch is outside its declared scope, and the CRS amounts live in Schedules DA-CRS and CCA-CRS, which this corpus does not hold for SDG&E. Recorded for parity with sdge/dr, sdge/tou-dr, sdge/tou-dr1, sdge/ev-tou and sdge/ev-tou-2. Note that those filings' equivalent deferrals attribute this to the PCIA Special Condition, which is wrong: on TOU-ELEC the PCIA condition is SC 9, it concerns bundled customers only, and it prices nothing extra because the PCIA is already inside the modeled bundled EECC.",
 "Special Condition 10's enrollment cap is a term of availability of this schedule, stated twice in this filing's own PDF, and the model records neither statement. Sheet 1: \"There is a cap of 10,000 customers who may take service on this rate, as defined in SC 10.\" Special Condition 10 verbatim: \"Enrollment Cap: There is a cap of 10,000 customers who may take service on this rate. A customer's ability to enroll will depend on availability. In the event that the cap is reached, SDG&E is not responsible for maintaining a queue of customers who want to take service on TOU-ELEC.\" The v0.5.1 ontology has no enrollment-cap property, so this is a blocked deferral. This filing currently ships complete = true with an empty deferrals array.",
 "Special Condition 4's re-entry bar is unmodeled while its twelve-month stay is modeled. Verbatim: \"A customer receiving service under this schedule may elect to change to another applicable rate schedule after receiving service on this schedule for at least 12 consecutive months. If a customer elects to discontinue service on this schedule, the customer will not be permitted to return to this schedule for a period of 12 consecutive months.\" The model sets urpx:minimumTenure P12M for the first sentence; minimumTenure is the only tenure term at v0.5.1, so the second sentence is unexpressible.",
 "Special Condition 7.b, the Direct Access and Community Choice Aggregation bill path (Sheet 5), computes a bundled bill and then credits back \"the EECC component and DWR-BC + WF-NBC component ... and including the appropriate Cost Responsibility Surcharge (CRS)\". The crediting half operates on this filing's own Prices; the CRS half points at Schedules DA-CRS and CCA-CRS, which SDG&E has in no filing in this corpus. Five sibling SDG&E filings record this provision and this one records nothing.",
]
