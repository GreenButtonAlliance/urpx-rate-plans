deferrals = [
 "Baseline Adjustment Credit is carried as a flat $-0.10702/kWh with no upper bound. Sheet 2 publishes it as 'Summer/Winter Baseline Adjustment Credit up to 130% of Baseline' and note (4) confirms the credit is limited to usage up to 130% of baseline; Special Condition 15 on Sheet 7 supplies the allowance quantities in kWh/day (Basic Allowance summer 9.0, 10.4, 13.6, 15.9 and winter 9.2, 9.6, 12.9, 10.9 for Coastal, Inland, Mountain, Desert; All Electric summer 6.0, 8.7, 15.2, 17.0 and winter 8.8, 12.2, 22.1, 17.1). As modeled the credit applies to every kWh, so the summer on-peak marginal rate resolves to 0.58895 where the schedule publishes 0.69597. Expressible under v0.5.1 and precedented in this corpus: pge:tiers-baseline on the PG&E E-TOU-C baseline-tier modifier carries absolute kWh/day ServiceBracket bounds per climate-zone ProfileAlternative and season. The work is 16 cells at 1.3 times the SC 15 allowance, hosted the same way. Not a vocabulary gap and not a source gap.",
 "Franchise Fee Differential of 5.78 percent is not modeled. Sheet 5: 'A Franchise Fee Differential of 5.78% will be applied to the monthly billings calculated under this Schedule for all customers within the corporate limits of the City of San Diego.' Expressible under v0.5.1 as a multiplier Price with basedOnPrice over a PriceSummary, chargeType urpx:taxMunicipal. It needs two such Prices over two separate unit-homogeneous summaries, because the fee applies to the whole monthly bill, which mixes the $/kWh components with the $/day Base Services Charge, and one summary spanning both would add unlike units; neither existing summary can be reused, since both deliberately exclude the BSC. The City of San Diego gate (urpx:hasMunicipality inside a ConditionExpression) validates and carries the restriction declaratively, so a build that left the gate out would charge the fee to every customer on the schedule.",
 "TOU-DR2-MB rate table on Sheet 3 is not carried, and no SDG&E Medical Baseline overlay exists anywhere in this corpus, so an MB customer cannot be billed from this data. The schedule publishes Total Effective MB Rates of 0.54073 and 0.32186 per kWh summer on-peak and off-peak, 0.47706 and 0.36658 winter, a Baseline Adjustment Credit at (0.08386), DWR-BC and WF-NBC at 0.00000, and per note (7) no Base Services Charge discount. Sheet 1 places these tables inside this schedule ('The rates for CARE customers and/or Medical Baseline are identified in the rate tables below'), on the same footing as the CARE column that the corpus does carry. Buildable now by per-cell subtraction against the Total MB Rate, and by the exemption-credit shape the sdge care modifier already ships; what this filing does not state is the rule that produces the effective rates (they are the Total MB Rate times a uniform factor of 0.7836, to the rounding of the published cells, which no provision here explains), so a modifier built this way is faithful to this filing but will not generalize. Schedule E-MEDICAL, which SC 14 names as the authority, is not committed to this repo.",
 "Semi-annual California Climate Credit of $(49.36) per Schedule GHG-ARR, named in the Sheet 1 applicability section, is not modeled. Expressible under v0.5.1 as a credit Price with urpx:intervalDuration P6M. The alternative form, an ApplicabilityRule enumerating the two credit months the way sce:d does, cannot be sourced from this filing: the schedule names neither month, and Schedule GHG-ARR is not in this corpus. That part is a source gap, not a vocabulary gap.",
 "Special Condition 9 (Sheet 6) bars a customer who leaves this schedule from returning for 12 months; the schedule sets no minimum stay. This is a term of service on this schedule, set aside by the assessment as \"service and enrollment terms, not rates\", and no re-entry construct exists at v0.5.1.",
]
