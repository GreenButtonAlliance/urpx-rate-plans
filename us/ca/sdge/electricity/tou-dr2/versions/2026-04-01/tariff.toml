[extraction]
tool = "manual"
extracted_on = "2026-04-30"
notes = """
Source pattern shared with TOU-DR1 / DR — see us/ca/sdge/electricity/utility.toml
for the SDG&E tariff-portal URL convention.

Filing details (8-page PDF):
 Sheet 1 (APPLICABILITY) — AL 4791-E, P.U.C. Sheet 64388-E
 Sheet 2 (RATES — standard + CARE) — AL 4791-E-A supplement, Sheet 64671-E
 Sheet 3 (RATES — MB) — AL 4791-E-A supplement
 Sheet 4 (UDC sub-component breakdown) — AL 4791-E-A, Sheet 64672-E
 Sheets 5-8 — Special Conditions, Time Periods table (Sheet 5)

## TOU period definitions (Sheet 5)

 TOU Period Summer / Winter (year-round identical windows)
 ─────────── ───────────────────────────────────────────────
 On-Peak 4:00 p.m. – 9:00 p.m. (all days)
 Off-Peak all other hours (9:00 p.m. – 4:00 p.m.)

NO Super Off-Peak — TOU-DR2's distinguishing feature vs TOU-DR1.
Otherwise the schedule structure (4-9pm peak, all-days, Jun-Oct
summer, Nov-May winter) matches TOU-DR1.

## Modeling structure

Bill = UDC + (DWR-BC + WF-NBC) + EECC, where:
 - UDC: 7 flat sub-components (Trans, Distr, PPP, ND, CTC, LGC, RS)
 identical to TOU-DR1, plus 1 TOU-VARYING sub-component (TRAC):
 Summer On-Peak TRAC: $0.07211/kWh
 Summer Off-Peak TRAC: $0.06564/kWh
 Winter On-Peak TRAC: $0.06762/kWh (matches TOU-DR1 winter UDC TRAC)
 Winter Off-Peak TRAC: $0.06762/kWh

 - DWR-BC + WF-NBC: 0.00000 + 0.00591 = $0.00591/kWh flat (same as TOU-DR1).
 - EECC (Generation): 4 distinct values (2 periods × 2 seasons) —
 no super-off-peak.
 Summer On-Peak: $0.34920 (matches TOU-DR1)
 Summer Off-Peak: $0.08432 (between TOU-DR1's Off-Peak 0.12853
 and Super-Off-Peak 0.04121 — averaged across the wider
 off-peak window)
 Winter On-Peak: $0.27475 (matches TOU-DR1)
 Winter Off-Peak: $0.13777 (between TOU-DR1's Off-Peak 0.19304
 and Super-Off-Peak 0.10228)
 - Baseline Adjustment Credit: $-0.10892/kWh applies to consumption up
 to 130% of CPUC baseline allocation (both seasons; same as TOU-DR1).
 - Base Services Charge: $0.79343/day for standard customers.

## Modeling deferrals

Same as TOU-DR1:
 - PCIA (Special Condition 16) for CCA-served customers.
 - Franchise Fee Differential 5.78% within City of San Diego.
 - 130%-of-baseline ServiceTier (currently encoded as flat credit).
 - CARE / Medical Baseline / FERA / DRAH RatePlanModifiers
 (grid-coordination/urpx-rate-plans#13 secondary epic).

The PPP charge ($0.01515/kWh) is split on the delivery
ledger into PPP excluding CARE Surcharge ($0.00651) and CARE
Surcharge ($0.00864, Schedule E-CARE Sheet 2, "All Other Residential CARE Schedules"
column). sdge:care exempts the second by referencing it, and the
CARE-discountable subtotal names only the first.
"""

