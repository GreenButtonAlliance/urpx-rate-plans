[modeling]
complete = false
deferrals = [
 "Sheet 7 SC 3.c confines each EEC component to its own side of the bill: \"EEC for generation avoided costs will only offset volumetric generation charges accrued per the customers' OAS, and EEC for delivery avoided costs will only offset volumetric delivery charges associated with the customer's OAS.\" The model splits the components into two Ledgers and two PriceDefinitions but tags all four urpx:bundledLedger / urpx:bundledPortion, so each credit lands on the bundled bill rather than on its own side and the distinction the sheet draws is absent from the data. v0.5.1 supplies urpx:supplyLedger / urpx:deliveryLedger and urpx:supplyPortion / urpx:deliveryPortion, and the base plan sdge:ev-tou-5 already uses them (EECC supplyPortion, UDC deliveryPortion). Work, not a blocker.",
 "NBT Aggregation billing charges are priced in this PDF, not in a sibling filing. Sheet 31 SC 12.d.1: \"A one-time service establishment fee of $25 per Aggregated Account (capped at $500 per Aggregated Arrangement) and a monthly billing fee of $5 per Aggregated Account will be assessed to NBT Aggregation Customers receiving service under this SC.\" Neither amount is modeled. The $25 and the $5 at intervalDuration P1M are expressible as Prices over a urpx:count metric input; SHACL conforms against the v0.5.1 shapes. The $500-per-Arrangement cap is not expressible: urpx:unitOfMeasure has no currency member and PriceShape is sh:closed with no cap slot. urpx-org/urpx PR #76, open, proposes urpx:currencyUnit and urpx:minOperator.",
 "NBT Paired Storage metering, Sheet 22 SC 8.e: \"The fee for installation of standard metering equipment is capped at $600.00\", with complex metering billed at SDG&E's actual cost. Not modeled. A currency-denominated cap has no slot under v0.5.1, the same reason as the $500 aggregation cap, so the honest record here is the citation rather than a shape.",
 "Small NBT Paired Storage credit cap, Sheet 20 SC 8.d.i and Sheet 21 SC 8.d.i(A)-(C): \"Small NBT Paired Storage billing uses an estimation methodology that caps NBT bill credits based on monthly solar renewable electrical generating facility production estimates.\" Sheet 21 gives the method: a cap on NBT-eligible exports for each calendar month and climate zone, the customer's installed PV kW times a kWh/kW production factor that SDG&E derived with the CSI EPBB calculator for each month and each of the four climate zones in its service area. Exports above the cap \"shall be assumed to have occurred during the highest price billing period during the billing cycle\" and earn no NBT credit. The production factor table is not printed in this PDF, so the cap's values cannot be sourced from the filed document, and applying it needs the customer's climate zone and installed PV capacity. Not modeled.",
 "Relevant Period settlement, Sheet 8 SC 3.d through 3.f: twelve monthly billing cycles running from Permission To Operate and each anniversary, unused generation and delivery credits carried forward within the period, and at true-up \"Any excess generation credits or excess delivery credits remaining at the end of a customer's relevant period (true-up period) be carried forward to the customer's next relevant period.\" The carry-forward holds only while the customer stays on NBT: leaving NBT forfeits the excess credits at the last NBT true-up, and a switch between bundled and unbundled service forfeits the generation credits. v0.5.1 can now declare the window, urpx:Ledger urpx:settlementInterval (xsd:duration) and urpx:hasBillingCycle, and \"P12M\" conforms under SHACL validation. It cannot express the carry-forward across periods or the forfeiture rules, and SMUD NEM1 uses settlementInterval only for the length of its 12-month settlement period.",
 "Net Surplus Compensation, Sheet 15 SC 6.b.i: net surplus kWh times SDG&E's Default Load Aggregation Point price, \"the simple rolling average of SDG&E's DLAP price from 7 a.m. to 5 p.m. corresponding to the customer's 12-month relevant period\". The tariff gives the formula and sends the reader elsewhere for the number: \"This rate will be updated monthly and is available at: http://www.sdge.com/nem/.\" No value is in this PDF, so it is a source gap as well as a settlement-window one.",
 "NSC Renewable Attribute Adder, Sheet 16 SC 6.b.ii: net surplus kWh times the WECC average renewable premium, \"updated annually and is available at http://www.sdge.com/nem\", paid only where the customer certifies REC ownership, holds CEC RPS certification and transfers the certificates through WREGIS. No value in this PDF. Source gap plus a year-end contingency.",
 "Discontinuance of NSC Double Compensation, Sheet 17 SC 6.c: at the twelve-month true-up, positive net exports are debited \"at a rate equal to the utility's average real-world retail export compensation rates for all net billing tariff customers in their service territory over the past 12 months\", then credited at the NSC rate. That debit rate is derived from SDG&E's own book of business and is published nowhere in this filing. Source gap.",
 "NBT Aggregation credit allocation, Sheet 32 SC 12.e.3 and Sheet 33 SC 12.e.5.b: the monthly export dollar amount is allocated across the Aggregated Account meters \"based on the proportion of cumulative usage at each aggregated account, and the cumulative generation from the generating account from the start of the Relevant Period\". Not expressible: URPX carries no account identity, so there is no per-account channel for an allocation to land in.",
]

