# Extraction ------------------------------------------------------------------
[extraction]
tool = "manual"
extracted_on = "2026-10-14"
notes = """
First SDG&E NBT filing in this corpus. Sibling of PG&E NBT
(us/ca/pge/electricity/nbt/versions/2025-10-17/) and SCE NBT (us/ca/sce/electricity/nbt/
versions/2025-04-23/) — third export-direction modifier in the corpus.
Modeling pattern derived from the PG&E + SCE filings.

SDG&E Schedule designation is "Schedule NBT" (same as PG&E and SCE).
Customer-facing names include "Solar Billing Plan" (SBP) and the vintage
labels used in pricing communications.

Composite PDF is 33 pages, Sheets 1-33, retrieved 2026-10-14. It
carries the Advice 4377-E, 4377-E-A and 4377-E-B sheets (Resolution
E-5301, effective Jul 1, 2024) and replaces the 31-page PDF retrieved
2026-05-29, which lacked Sheets 21-22 and printed the pre-4377-E text
of the sheets that series revises. Most recent per-sheet effective date
is still 2025-01-27 (Advice 4596-E) on Sheets 23, 24, 25: Prevailing
Wage updates. No rate value changed between the two PDFs.

## Modifier shape

Modeled as urpx:RatePlanModifier overlaying sdge:ev-tou-5 (the mandatory
residential base RatePlan per Sheet 3: "Separately metered, residential
customers including Aggregation customers taking service on the NBT
tariff must take service on Schedule EV-TOU-5 as their OAS"). Single-
base binding — same shape as PG&E NBT (E-ELEC mandatory) and SCE NBT
(TOU-D-PRIME mandatory). EV-TOU-5 is SDG&E's residential EV-friendly TOU
rate; mandating it for NBT customers reflects the assumption that solar
customers are also EV-adopting / electrification-leaning households.

Non-Residential NBT customers may take any applicable TOU rate (Sheet 3);
this filing scopes to canonical residential NBT (EV-TOU-5-required).
NBT Aggregation (NBT-A, Sheet 26 SC 12) and NBT Paired Storage (Sheets
19-22 SC 8) sub-cases deferred.

NBT-V (Virtual NBT, separate filed schedule at tarfKey=1130) is a
sibling tariff for multi-tenant properties, modeled separately.

## Export-side direction modeling

MetricSpecification carries urpx:flowDirection urpx:reverse — same
vocabulary as PG&E and SCE NBT. URPX v0.2.0 vocabulary supports the
export-side direction natively.

## SDG&E-specific differences from PG&E and SCE

 1. Base RatePlan binding: sdge:ev-tou-5 (vs pge:e-elec / sce:tou-d-prime)

 2. **5 NBCs** vs the 4-NBC pattern in PG&E and SCE: SDG&E adds DWR-BC
 (Department of Water Resources Bond Charge) to the PPP, ND, CTC,
 WF-NBC list (Sheet 4). DWR-BC reflects San Diego's particular
 exposure to DWR's California Water Project — not common across
 the other two IOU territories.

 3. CARE/FERA discount NOT applied to retail export compensation rate
 (Sheet 4) — same pattern as PG&E and SCE.

 4. **ACC Plus not in this schedule**: no sheet of this PDF names
 ACC Plus or prices it; there is no values table analogous to PG&E
 Sheet 11 and SCE Sheet 7. The only mention in the earlier PDF, an
 exclusion in the Sheet 8 SC 3.f true-up text ("not including the
 ACC Plus credit"), was removed by Advice 4377-E-A. Sheets 21-22
 hold Paired Storage and consumer-protection text, not ACC Plus.
 The model carries two PriceDefinitions, the generation and
 delivery export compensation components, and no ACC Plus.

 5. SDG&E low-income definition (Sheet 5 §1.c — "Low Income Customers"):
 (i) CARE/FERA enrolled, OR (ii) resident-owners of single-family
 homes in disadvantaged communities (D.18-06-027), OR (iii)
 Residential Customers in California Indian Country (D.20-12-003).
 SAME definitional basis as PG&E and SCE. SDG&E uses "Low Income
 Customers" terminology vs SCE's "Equity Customer" or PG&E's
 "Residential Low Income".

## EEC data source

Sheet 4 directly cites the EEC values URL:

 https://www.sdge.com/solar/solar-billing-plan/export-pricing

This is the source for per-cell EEC values for . Unlike
the SCE case (where the equivalent data URL was not exposed in the
tariff or customer-facing pages), SDG&E publishes the URL directly in
the tariff text — clean entry point for the price-data load.

## ACC methodology + 9-year lock-in

Same as PG&E and SCE:
 - Customers submitting a complete interconnection application
 2023-04-15 to 2027-12-31 (5-year glide path) receive a 9-year
 locked-in EEC schedule from the ACC adopted as of January 1 of
 their interconnection application year (Sheet 4); the nine-year
 lock-in is measured from the PTO date
 - After 5-year glide path end: no locked-in schedule; current-year ACC
 - Customers may opt for 1-year EEC during glide path (no opt-back-in)

## ACC components (Sheet 4 / Sheet 5)

EEC has two components:
 - Generation EEC (energy, cap-and-trade, generation capacity) —
 offsets generation volumetric import charges only
 - Delivery EEC (transmission, distribution, greenhouse adder,
 methane leakage) — offsets delivery volumetric import charges only

Both component values published per (month × hour × weekday/weekend)
per vintage. Same 576-cells-per-vintage × 2-components shape as PG&E
and SCE.

## Binding mechanism

urpx:applicableToRatePlan sdge:ev-tou-5 — single-base modifier overlay.
Mirror of the PG&E NBT and SCE NBT pattern.

## Eligibility encoding

Two EligibilityRules (same as PG&E + SCE NBT pattern):
 1. Customer has Eligible Renewable Electrical Generating Facility
 (REGF — biomass, solar thermal, PV, wind, geothermal, fuel cells,
 small hydro, biogas, etc. per Sheet 5 §1.b)
 2. Interconnection application submitted on or after 2023-04-15
 (NEM-ST sunset date)

NEM Transition Customer state, NBT Aggregation / Paired Storage / Multi-
Tariff sub-cases handled in description prose, not encoded as separate
EligibilityRule entities.

## Settlement deferrals (per PG&E + SCE NBT precedent)

 - Annual true-up at end of customer's Relevant Period (12 cycles from
 PTO anniversary). Excess generation and delivery credits carry
 forward to the next Relevant Period while the customer stays on
 NBT (Sheet 8 SC 3.f). Year-long calculation, doesn't fit per-bill
 modifier shape.
 - Net Surplus Compensation (NSC) — end-of-year DLAP-based settlement.
 NSCR = simple rolling 12-month avg of SDG&E hourly DLAP prices 7am-
 5pm. Separate from per-hour Export Credit; computed at true-up.
 - NSC Renewable Attribute Adder (RAA) — WECC-based renewable premium
 if customer transfers WREGIS Certificates to SDG&E.
 - Discontinuance of NSC Double Compensation (Sheet 17 §6.c) — adjusts
 customer credit at true-up for net surplus exports.
 - PEV Submetering exclusion (Sheet 33 §13) — per D.22-08-024, PEV
 Submetering customers ineligible for NBT.

Consumer-side responsibilities (price-server / billing engine).

## Sub-schedule mapping (vs PG&E and SCE)

SDG&E NBT sub-cases:
 - NBT Aggregation (SC 12, added by D.23-11-068)
 - NBT Paired Storage (SC 8)
 - Multiple Tariff Facilities (SC 5)

Plus the SEPARATELY FILED Schedule NBT-V (Virtual NBT, tarfKey 1130)
for multi-tenant properties — analogous to NEM-V / VNM-A under the
NEM regime.

Sibling filings for SDG&E NBT-A, NBT-PS, NBT-V deferred.
"""

