scrape_notes = """
LADWP is a publicly-owned utility (POU) governed by the City of Los Angeles
Department of Water and Power Board of Commissioners; rate changes are
adopted via City of Los Angeles ordinance (Mayor + City Council approval)
rather than CPUC advice letter / resolution. tariff.toml [regulator]
should use authority = "city-council" (precedent: ca/pou/cpau/).

Rate filings are decomposed into THREE published documents that combine
to determine the customer-facing rate:

 1. Electric Rates Ordinance — the base ordinance establishing rate
 schedules R-1, A-1, etc. Last amended around 2016 (see filename of
 "Final Incremental Electric Rate Ordinance 4-15-16.pdf"). Sets
 base rate values for each schedule.

 2. Final Incremental Electric Rate Ordinance — the second ordinance
 layered on top of (1) with incremental adjustments. Together (1)
 and (2) define the "Capped" + "Incremental" rate components.

 3. Electric Rate Summary — a customer-facing summary document
 synthesizing (1) and (2) into per-schedule rate sheets. The
 current public summary is dated effective 2019-07-01.

 4. Quarterly Adjustment Factors — pass-through factors (ECA, ESA,
 RCA, IRCA, VEA, CRPSEA, VRPSEA) updated quarterly. Published as
 a table on the LADWP residential-adjustment-billing-factors HTML
 page, not as PDFs. These factors get added to the per-tier
 energy charge and recover variable costs (fuel, RPS compliance,
 reliability). The MOST RECENT effective date for any LADWP
 schedule is the start of the current quarterly factor period.

Convention for this corpus: each LADWP filing snapshot is dated to the
start of the current quarterly adjustment-factor period (2026-04-01 for
the Apr-Jun 2026 quarter). The base rates (from the 2019-07-01 summary)
combine with the current factors into a single all-in JSON-LD snapshot
under this corpus's "single snapshot per filing" convention. Each
quarterly factor refresh creates a new filing version.

The Electric Rate Summary PDF is committed alongside each filing as the
authoritative source for base rates. The quarterly factors are scraped
from the residential-adjustment-billing-factors HTML page; values are
recorded inline in tariff.toml [extraction.notes] for traceability,
with retrieval date + URL.

LADWP publishes electric rates as predictable URLs under
ladwp.com/sites/default/files/documents/. No SharePoint complexity
like SCE; direct curl works.

LADWP's territory is split into Zone 1 (coastal/cooler) and Zone 2
(inland/hotter). Zone determines tier breakpoints for tiered schedules
(R-1A); the assignment is by service address. Modeling convention:
zone is a customer-profile attribute, not a tariff-level filter; both
zones share the same rate plan ID and tariff.toml — the modeled tiers
include both zones' breakpoints.
"""
