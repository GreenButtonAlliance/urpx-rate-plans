Reconciliation. Base charge plus the factor sum equals the 2026 Total
Consumption Charge on https://www.ladwp.com/account/customer-service/electric-rates/residential-rates (retrieved 2026-10-07,
sha256 9757e61920d84ceab82d98d51e15463c3ddc5efe2d71137322334032ad6768ec):
 winter-high-peak: 0.30168
