Commissioners Resolution No. 027 035, adopted at the meeting held Sept 8,
2026, Attachment B page 11 (Factors Summary). RCA and IRCA: Resolution No. 026
243, adopted at the meeting held Jun 9, 2026, Appendix (page 8), for fiscal
year 2026-27. ESA: the capped-ordinance value on the 2019-07-01 summary. Each
factor Price cites its document and page. Both resolutions are listed on
https://www.ladwp.com/account/understanding-your-rates/approved-expenditures-water-and-power-pass-through-adjustment-factors.

Factors page. The same values are the 2026 table's "Oct - Dec" row on
https://www.ladwp.com/account/customer-service/electric-rates/residential-adjustment-billing-factors,
retrieved 2026-10-07, sha256
4ec12973af3cb9f764cad0fd7eef73b7c34a768bfc9afcd2f2221381b1bb8779 for the HTML
as served. The page is not vendored: this corpus vendors PDF source documents
only.

Factor values, $/kWh, against the 2026-07-01 version:
 ECA: 0.05690 -> 0.05690
 ESA: 0.00147 -> 0.00147
 RCA: 0.00300 -> 0.00300
 IRCA: 0.06934 -> 0.06934
 VEA: 0.01071 -> 0.01590
