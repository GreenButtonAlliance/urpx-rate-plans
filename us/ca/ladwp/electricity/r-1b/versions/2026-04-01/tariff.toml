# Review ----------------------------------------------------------------------
[review]
status        = "draft"
notes         = "Second LADWP filing. Pattern reference: us/ca/sce/electricity/tou-d-4-9pm/versions/2025-11-15/ (TOU structure with hasTOUSchedule + 3 tiers + 6 periods = 2 seasons × 3 tiers). LADWP TOU windows don't vary by season (unlike SCE's super-off-peak that's winter-only), so Summer and Winter periods share the same TimeBracket times but differ in rate values. 14 PriceDefinitions: 6 energy charges (3 tiers × 2 seasons), 1 service charge ($12/month flat), 7 quarterly adjustment factors. 14 Prices total. Base period uses 3 TimeBrackets per season to capture (M-F evening 20:00-00:00) + (M-F early morning 00:00-10:00) + (weekend full day 00:00-00:00). Electric Vehicle Discount referenced on rate sheet but deferred — conditional on EV ownership."
