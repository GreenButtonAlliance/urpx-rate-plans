# Extraction ------------------------------------------------------------------
[extraction]
tool          = "manual"
extracted_on  = "2026-04-30"
notes         = """
Same source PDF as us/ca/ladwp/electricity/r-1a/versions/2026-04-01/. Page 2 of
the Electric Rate Summary (effective 2019-07-01) covers Schedule R-1(B).

TOU period definitions are explicitly listed in the source PDF
(footnotes on the rate sheet):

  High Peak Period:  1:00 p.m. – 5:00 p.m., Monday through Friday
  Low Peak Period:   10:00 a.m. – 1:00 p.m., Monday through Friday,
                     and 5:00 p.m. – 8:00 p.m., Monday through Friday
  Base Period:       8:00 p.m. – 10:00 a.m., Monday through Friday,
                     all day Saturday and Sunday

TOU windows do NOT vary by season — only the per-tier rates differ
between High Season (Jun-Sep) and Low Season (Oct-May). Winter High
Peak rate ($0.10018) collapses to the Low Peak rate (same flattening
pattern as R-1A's Tier 3 winter collapse).

ADJUSTMENT FACTORS (quarterly pass-through):
Same as R-1A — see us/ca/ladwp/electricity/r-1a/versions/2026-04-01/tariff.toml
for the full listing. Apr-Jun 2026 values captured inline:

  ECA 0.05690 + ESA 0.00147 + RCA 0.00300 + IRCA 0.05505 + VEA 0.00503
  + CRPSEA 0.01779 + VRPSEA 0.03296 = 0.17220 total $/kWh pass-through

MANDATORY ENROLLMENT: residential customers whose annual monthly
average consumption reaches or exceeds 3,000 kWh in a 12-month period
are mandatorily moved to Schedule R-1(B). Below threshold customers
may voluntarily choose R-1(A) or R-1(B); customers transferring from
R-1(B) to R-1(A) cannot revert to R-1(B) before 12 months elapse.

Modeling deferrals:
  - Electric Vehicle Discount of $-0.025/kWh appears on the rate sheet
    but is conditional on EV ownership. Modeling deferred to a
    follow-up issue (separate from grid-coordination/urpx-rate-plans#16 since this discount lives
    inside R-1B itself rather than as a standalone Service Rider).
    Will file as a child of grid-coordination/urpx-rate-plans#16 when work approaches.
  - The "(1) Conditions for this element set in the capped ordinance"
    footnote suggests EV-discount eligibility specifics live in the
    base Electric Rates Ordinance (not the Incremental Ordinance).
    Verify when modeling.
"""

