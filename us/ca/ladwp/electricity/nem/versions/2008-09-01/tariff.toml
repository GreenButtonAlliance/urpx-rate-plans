[modeling]
complete = false
deferrals = [
 "Section 3.b export credit, sheet 21: the rider prices the credit only by reference, \"A credit for the energy received will be calculated using the applicable Rate Schedule energy pricing.\" No credit Price is written here, and none can be until the deferral below settles which base price the credit mirrors, because the two readings need different shapes rather than different numbers. The shape for the narrower reading is proven against the real base plans: a Price carrying urpx:multiplier -1 and exactly one urpx:basedOnPrice, with no urpx:unitPrice, which PriceShape's sh:xone admits. Measured 2026-09-23, composing a probe modifier with ladwp:r-1a: a credit naming ladwp:price-energy-high-zone1-t1 resolves to -0.07142 and one naming the tier 3 price to -0.21702; a credit naming an r-1b price comes back as an unresolved reference rather than a wrong number, so the cells self-scope across the rider's two bases; and the import marginal is unchanged at 0.24362, since the credits sit on a reverse-flow ledger. The fuller reading is not expressible in that shape at all: two urpx:basedOnPrice entries on one Price are alternatives rather than components, so such a Price comes back with an ambiguous basis, and it would need either one credit Price per component or a urpx:PriceSummary added to both base plans in the manner of sce:care-price-bill-discount-2026-03-20. The multiplier must be -1: every export credit in this corpus is negative on a credit or discount PriceDefinition.",
 "\"Applicable Rate Schedule energy pricing\" (Section 3.b, sheet 21) is undefined and is what holds the credit. The phrase occurs exactly once in the 88-page ordinance, in that sentence, and matches no term the tariff defines; \"Rate Schedule\" is undefined too. Six independent readings of the source were taken on 2026-09-23 and none settles it, with the evidence two-sided rather than convergent. Toward the Energy Charge alone: the Definitions make an Energy Charge \"that portion of the bill for electric service based upon the electric energy (kilowatt-hours) consumed\" while the ECA and the ESA are each \"an addition to the amount of the bill\", so the two are definitionally disjoint, and Schedule LS-1 uses \"energy price\" for a charge that excludes the adjustments. Toward the fuller rate: Schedule R-1 bills \"the sum of parts (1) through (4)\", parts 2 to 4 being those adjustments as numbered per-kWh entries of the Rate Schedule itself, and LADWP's own 2015 Power System Rate Action Report says NEM offsets load \"at the full retail rate for the energy\". A third reading was found and is covered by neither: Schedule R-1 Section 4.b sends parallel generators supplying beyond full offset to the Standard Energy Credit under Schedule CG-2, which the Definitions fix at the Department's estimated hourly marginal production costs rather than any retail rate, and the rider never displaces that clause for R-1 customers. On ladwp:r-1a at the April 2026 factors the first two readings are 0.07142 per kWh against 0.24362. LADWP publishes nothing that resolves it: the NEM Guidelines paraphrase Section 3.a and drop the credit sentence, the Understanding Solar Billing section is an empty heading, and the archived rates FAQ answers which bill lines a banked balance offsets rather than what an exported kWh is worth, giving different answers for R-1A and R-1B. The cheapest thing that would settle it is one number from one bill: a redacted R-1A net-metering bill, or a written answer from LADWP, for a month whose factors this corpus holds. A source question, not a URPX vocabulary question.",
 "The credit carries no Price, deliberately, so composing this rider with either base plan yields no export credit rather than a wrong one. Until 2026-09-23 this filing shipped one Price at unitPrice \"0\" for the credit, and that zero was not inert: a Price carrying a unit price of 0 prices the export credit at 0.00 per kWh, which is not one of the candidate readings above and is wrong under all of them. Removing it costs discoverability and buys the absence of a number nobody should bill from. The rider's declaration of the credit, its reverse-flow metric input, its ledger and its price definition all remain in the document, so a reader still finds the provision and this manifest says why it is unpriced.",
 "Section 3.b also suspends charges: in any billing period where generation exceeds consumption, \"all applicable monthly billing charges, except energy related charges or charges based upon kWh, shall apply\" (sheet 21). Nothing in this filing conditions any base charge on net flow, and the version description narrows the provision to the energy charges alone. The provision is inherently conditional on the period's net flow, and neither placement available in this filing expresses that condition: built as offsetting Prices with multiplier -1 and basedOnPrice on a forward-flow ledger, it was measured to drive ladwp:r-1a's marginal from 0.24362 to 0.00000, zeroing the entire energy bill for every R-1A customer whether or not they generate; placed on the existing reverse-flow ledger it never reaches the import energy charges it is meant to suspend, so it does nothing. Do not build this until the net-flow condition itself can be expressed. Open reading question inside the item: whether ladwp:r-1a's tier-varying Power Access Charge is a charge \"based upon kWh\".",
 "Section 3.c credit carry-forward, sheet 21: an unconsumed credit balance is applied to each subsequent bill except Taxes and Minimum Charges, and any remainder is zeroed at termination of service with no further compensation. URPX v0.5.1 has no term for a carried balance. urpx:settlementInterval (domain Ledger, range xsd:duration, \"Period over which ledger balances are settled\") states a finite settlement window, and an open-ended carry-forward is not one; LedgerShape and BillingCycleShape are sh:closed and none of their other properties names a balance, and a full-text scan for carry, rollover, banked or balance vocabulary turns up nothing else. Raise upstream rather than modeling around it.",
 "Section 3.d per-meter confinement, sheet 21: \"Credit balances will only be applied to the bill associated with the meter that measured the Excess Energy.\" The provision appears nowhere in this filing, in structure or in prose. URPX carries no account or meter identity at which to scope a balance; the ontology's skos:note on urpx:AccountServiceAgreement says service account and agreement data lives in customer data, not URPX. A consumer aggregating NEM credits across a multi-meter premises would be wrong and nothing here says otherwise.",
 "The net measurement basis, Sections 2.a, 2.b and 3.a, sheet 20: \"Net Energy Metering means measuring the difference between the electricity supplied from the electric grid and the electricity generated on the Customer's premises\", accomplished \"by measuring the flow of electricity in two directions\", after which \"the customer shall be billed for the net energy supplied under the customer's currently applicable rate.\" The rider's central definition is not in the model. URPX names this case: urpx:net is defined \"Net energy flow - net of consumption and generation\", and urpx:flowDirection's skos:note reads \"forward (consumption/import), reverse (generation/export), net (net metering), or bidirectional. Critical for DER and net metering scenarios.\" This filing models a single MetricInput at flowDirection urpx:reverse, and the corpus census is 20 forward, 13 reverse, 0 net, 0 bidirectional. So a reader of this modifier finds an unpriced export input and never learns that the base schedule's charges apply to a netted quantity rather than to gross consumption. The vocabulary exists; whether a netted quantity belongs in an import energy total is unsettled, so switching this MetricInput to urpx:net is not a clean fix.",
 "Service Rider NEM Section 2.d Green Power election: the customer may elect to purchase Green Power under Service Rider REO for net energy supplied by the Department. Carried in description prose only, with no structural representation in this filing.",
]

