notes = "First LADWP RatePlanModifier filing. Pattern reference: us/ca/cpau/electricity/e-eec-1/versions/2025-09-01/ for the standalone-modifier filing structure with reverse-flowDirection MetricInput. Smallest modifier filing in the corpus to date — single Eligibility Rule (3-way AND for a solar or wind facility, as typed urpx:derType values, + bidirectional meter + ≤1MW capacity), single MetricInput, single Ledger, single PriceDefinition, and no Price. Discussion #63, closed, settled the credit's shape across the rider's two bases (r-1a, r-1b): PriceShape's sh:xone admits a Price carrying urpx:basedOnPrice and urpx:multiplier with no urpx:unitPrice, as sce:care-price-bill-discount-2026-03-20 ships, and one credit Price per base energy Price, each naming a single basedOnPrice, self-scopes. The 18 cells wait on which base price the rider's undefined 'applicable Rate Schedule energy pricing' means, recorded in [modeling] deferrals."
