# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Section 3.b export credit, sheet 21: the rider prices the credit only by reference, \"A credit for the energy received will be calculated using the applicable Rate Schedule energy pricing.\" This filing ships one Price with unitPrice \"0\" in its place, and that placeholder is not inert: clj-urpx 0.25.0 returns urpx:unitPrice whenever it is present, so the pinned consumer resolves the NEM export credit as $0.00/kWh rather than refusing. Buildable now with no new vocabulary: PriceShape's sh:xone admits a Price carrying urpx:basedOnPrice plus urpx:multiplier and no urpx:unitPrice, and sce:care-price-bill-discount-2026-03-20 already ships that shape. Build one credit Price per base energy Price, each naming exactly one basedOnPrice among ladwp:r-1a's 12 energy Prices and ladwp:r-1b's 6; composing against one base was measured to resolve all 12 of that base's credits at the correct values and to return clean :unresolved-reference on the other base's 6, with no :ambiguous-basis. The multiplier must be -1, not 1: every export credit in this corpus is negative on a credit or discount PriceDefinition, and multiplier 1 would ship the credit as a positive charge. Deleting the placeholder is part of the build, since basedOnPrice plus unitPrice together violate the sh:xone. One consumer limit to expect: clj-urpx 0.25.0's modifier-ledger-results attaches no tier identity, so the 12 per-tier credits come back correct in value with no tier number and no bounds.",
 "\"Applicable Rate Schedule energy pricing\" (Section 3.b, sheet 21) is undefined in the rider and must be settled from an LADWP source before the credit Prices are written. It may mean the Energy Charge line alone or the Energy Charge plus the per-kWh adjustments the base schedules carry. On ladwp:r-1a at the April 2026 factors the two readings are $0.07142/kWh (Zone 1 Tier 1 Energy Charge) against $0.24362/kWh (that charge plus ECA, ESA, RCA, IRCA, VEA, CRPSEA and VRPSEA, which total $0.17220/kWh); clj-urpx returns 0.24362 as the base marginal, so the second reading is what a composed bill would mirror. A source question, not a URPX vocabulary question.",
 "Section 3.b also suspends charges: in any billing period where generation exceeds consumption, \"all applicable monthly billing charges, except energy related charges or charges based upon kWh, shall apply\" (sheet 21). Nothing in this filing conditions any base charge on net flow, and the version description narrows the provision to the energy charges alone. Blocked at the pinned consumer rather than buildable. The provision is inherently conditional on the period's net flow, and clj-urpx 0.25.0 has no placement that expresses that condition: built as offsetting Prices with multiplier -1 and basedOnPrice on a forward-flow ledger, it was measured to drive ladwp:r-1a's marginal from 0.24362 to 0.00000, zeroing the entire energy bill for every R-1A customer whether or not they generate; placed on the existing reverse-flow ledger, import-energy-ledger? excludes it and it does nothing. A ConditionExpression gate is equally unavailable, since clj-urpx 0.25.0 evaluates none and flags none. Do not build this until the consumer can express the net-flow condition. Open reading question inside the item: whether ladwp:r-1a's tier-varying Power Access Charge is a charge \"based upon kWh\".",
 "Section 3.c credit carry-forward, sheet 21: an unconsumed credit balance is applied to each subsequent bill except Taxes and Minimum Charges, and any remainder is zeroed at termination of service with no further compensation. We have not found a way to state a carried balance in URPX v0.5.1. urpx:settlementInterval (domain Ledger, range xsd:duration, \"Period over which ledger balances are settled\") and urpx:hasBillingCycle exist, a full-text scan for carry, rollover, banked or balance vocabulary turns up nothing else, no filing in this corpus uses any of them, and clj-urpx 0.25.0 reads none. An open-ended carry-forward is not a finite settlement window, so settlementInterval does not say it. Raise upstream rather than modeling around it.",
 "Section 3.d per-meter confinement, sheet 21: \"Credit balances will only be applied to the bill associated with the meter that measured the Excess Energy.\" The provision appears nowhere in this filing, in structure or in prose. URPX carries no account or meter identity at which to scope a balance; the ontology's skos:note on urpx:AccountServiceAgreement says service account and agreement data lives in customer data, not URPX. A consumer aggregating NEM credits across a multi-meter premises would be wrong and nothing here says otherwise.",
 "The net measurement basis, Sections 2.a, 2.b and 3.a, sheet 20: \"Net Energy Metering means measuring the difference between the electricity supplied from the electric grid and the electricity generated on the Customer's premises\", accomplished \"by measuring the flow of electricity in two directions\", after which \"the customer shall be billed for the net energy supplied under the customer's currently applicable rate.\" The rider's central definition is not in the model. URPX names this case: urpx:net is defined \"Net energy flow - net of consumption and generation\", and urpx:flowDirection's skos:note reads \"forward (consumption/import), reverse (generation/export), net (net metering), or bidirectional. Critical for DER and net metering scenarios.\" This filing models a single MetricInput at flowDirection urpx:reverse, and the corpus census is 20 forward, 13 reverse, 0 net, 0 bidirectional. So a consumer reading this modifier learns there is an export input priced at zero and never learns that the base schedule's charges apply to a netted quantity rather than to gross consumption. Not cleanly buildable either: clj-urpx 0.25.0's import-energy-ledger? treats urpx:net as contributing to the import marginal and its own comment says a netted quantity in an import marginal is genuinely ambiguous and is the line to revisit. Vocabulary exists; consumer semantics are unsettled by the consumer's own author.",
 "Service Rider NEM Section 2.d Green Power election: the customer may elect to purchase Green Power under Service Rider REO for net energy supplied by the Department. Carried in description prose only, with no structural representation in this filing.",
]

# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "First LADWP RatePlanModifier filing. Pattern reference: us/ca/cpau/electricity/e-eec-1/versions/2025-09-01/ for the standalone-modifier filing structure with reverse-flowDirection MetricInput. Smallest modifier filing in the corpus to date — single Eligibility Rule (3-way AND for customer-generator + bidirectional meter + ≤1MW capacity), single MetricInput, single Ledger, single PriceDefinition, single Price. The Price is a placeholder (unitPrice='0') not because the reference to the base price is inexpressible but because we have found no way to scope a per-base-plan credit to the plan it mirrors across the rider's two bases (r-1a, r-1b) — tracked at urpx-org/urpx discussion #63. ~140K LADWP solar customers — highest-customer-count electrification-targeted modifier in the electrification effort."
