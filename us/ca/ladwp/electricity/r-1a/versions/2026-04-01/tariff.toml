# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "First LADWP filing in the corpus. Pattern reference: PG&E E-1 (also tiered, urpx:hasServiceTiers + serviceTierNumber on per-tier Price entries). 11 PriceDefinitions (1 high-season energy, 1 low-season energy, 1 power access charge, 7 quarterly adjustment factors, 1 minimum charge). 26 Prices total: 12 energy charge prices (2 seasons × 6 zone-tier combinations; values duplicate across zones since rates don't vary by zone, only breakpoints do) + 6 power access charge prices (per zone × tier; values duplicate $2.30/$7.90/$22.70 across zones) + 7 quarterly adjustment factor prices + 1 minimum charge. ServiceTiers: 6 — Z1T1, Z1T2, Z1T3, Z2T1, Z2T2, Z2T3 with zone-specific kWh breakpoints (Z1: 350/1050; Z2: 500/1500). Season encoded in PriceDefinition.hasApplicabilityRule.month rather than in tier identity (deviates from PG&E E-1 pattern, which uses 6 season-specific tiers). The Tier 3 collapse to Tier 2 rate in low season is encoded via duplicate $0.13001 values for tiers 3 and 6 in pd-energy-low-season."
