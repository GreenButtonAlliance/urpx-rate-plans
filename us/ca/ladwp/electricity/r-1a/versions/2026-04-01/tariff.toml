# Identity --------------------------------------------------------------------
utility = "ladwp"
schedule = "r-1a"
effective_date = "2026-04-01"

# Source ----------------------------------------------------------------------
[source]
url = "https://www.ladwp.com/sites/default/files/documents/Electric_Rate_Summary_effective_7_1_2019_with_factors_referenced_rev1.pdf"
sha256 = "1280dd0769f0912922d718fe64843545e6af4be7456fa76fb2bf99bf5bd8f625"
retrieved_on = "2026-04-30"
media_type = "application/pdf"
filing_type = "tariff-schedule"
landing_page = "https://www.ladwp.com/account/customer-service/electric-rates/residential-rates"

# Regulatory ------------------------------------------------------------------
[regulator]
authority = "city-council"
docket = "Final Incremental Electric Rate Ordinance (4-15-16) + Electric Rates Ordinance"

# Extraction ------------------------------------------------------------------
[extraction]
tool = "manual"
extracted_on = "2026-04-30"
notes = """
LADWP electric rates are governed by City of Los Angeles ordinances —
not CPUC. Two ordinances combine to define the published rates: the
base "Electric Rates Ordinance" and the "Final Incremental Electric
Rate Ordinance" (last amended April 15, 2016). The customer-facing
"Electric Rate Summary" PDF synthesizes both ordinances; we treat it
as the source-of-record per the user-defined "single snapshot per
filing" convention. The summary PDF has not been republished since
2019-07-01 — rate evolution since then is captured via quarterly
adjustment factor refreshes (see below), not by re-issuing the summary.

Per-tariff effective dates within the source PDF:
 Page 1 (Schedule R-1(A) Standard) — effective 2019-07-01

ADJUSTMENT FACTORS (quarterly pass-through):
The customer-facing all-in $/kWh = energy charge (modeled here from
the 2019-07-01 summary) + sum of seven adjustment factors, refreshed
quarterly by LADWP and published as a table on:

 https://www.ladwp.com/account/customer-service/electric-rates/residential-adjustment-billing-factors

Factor values for the Apr-Jun 2026 period (retrieved 2026-04-30,
captured inline in the JSON-LD):

 Factor Apr-Jun 2026
 ECA — Energy Cost Adjustment 0.05690
 ESA — Electric Subsidy Adjustment 0.00147
 RCA — Reliability Cost Adjustment 0.00300
 IRCA — Incremental Reliability Cost Adjustment 0.05505
 VEA — Variable Energy Adjustment 0.00503
 CRPSEA — Capped Renewable Portfolio Std. Energy Adj. 0.01779
 VRPSEA — Variable Renewable Portfolio Std. Energy Adj. 0.03296
 ───────────────────────────────────────────────────────────────
 Sum of pass-through factors 0.17220

For comparison, the prior period (2026 Q1, Jan-Mar 2026):
 ECA 0.05690, ESA 0.00147, RCA 0.00300, IRCA 0.05505, VEA 0.00781,
 CRPSEA 0.01889, VRPSEA 0.03317; sum 0.17629. Difference primarily
 in VEA (-0.00278) and CRPSEA (-0.00110). IRCA + RCA + ESA + ECA
 unchanged from prior period.

Each future quarterly refresh (Jul 1, 2026; Oct 1, 2026; ...) will
create a new RatePlanVersion with the updated factor values and a
new versions/<date>/ directory.

Modeling deferrals (filed as separate beads issues):
 - grid-coordination/urpx-rate-plans#16 (epic): A-1 large TOU residential, EZ-Save Lifeline,
 NEM Service Rider, REO Service Rider — secondary LADWP residentials.
 - The 2019-07-01 summary references "VEA / CRPSEA / VRPSEA / IRCA"
 rows in its "Elements Only in Incremental Ordinance" section
 without values — confirms these are quarterly-computed pass-throughs.
 Source-of-truth for the current values is the LADWP HTML page,
 not a separately-published PDF; capturing the HTML page as
 structured data + sha256 is deferred (no current convention for
 HTML sources in this corpus).

Zone assignment (Zone 1 coastal vs Zone 2 inland) is per service
address, determined by LADWP at account creation. Modeled as a
customer-profile attribute (downstream of the rate plan) rather
than a tariff-level filter — the rate plan exposes both zones'
tier breakpoints and the consumer (price-server) selects based on
customer zone.
"""

# Validation ------------------------------------------------------------------
[validation]
shacl_passed = true
validator = "pyshacl + clj-urpx (URPX v0.5.1)"
validated_on = "2026-09-20"

# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Zone 1 / Zone 2 selector absent. Page 1 of the source PDF prices two tier ladders at identical per-tier rates but different breakpoints (Zone 1: first 350 / next 700 / above 1050 kWh; Zone 2: first 500 / next 1000 / above 1500 kWh). The model folds zone into serviceTierNumber (tiers 1-3 Zone 1, tiers 4-6 Zone 2) inside one ServiceTiers container over one kWh MetricInput, so the brackets overlap and only the tier urpx:name strings say which ladder to walk. URPX v0.5.1 expresses this directly: PlanElements.hasProfileAlternatives with an AlternativeDimension.customDimensionProperty of 'serviceZone', plus ServiceBracket.referencesProfileAlternative on each bracket. The corpus already ships that shape for a geographic dimension in us/ca/pge/electricity/e-tou-c/versions/2026-03-01/rate-plan-modifier_pge_e-tou-c-baseline-tier_2026-03-01.jsonld (baseline territory P through Z). This is work, not a blocker. Trade to weigh first: clj-urpx 0.25.0 reads only the first ServiceBracket per ServiceTier (price.clj:456), so 3 tiers with 2 zone-keyed brackets each would leave the pinned consumer resolving bounds for one zone only.",
 "Minimum Charge composition not modeled. Page 1 prices a $10.00 per month Minimum Charge and footnotes it '(1) Plus ECA, ESA and RCA', so the floor is $10.00 plus the three capped-ordinance per-kWh adjustments on actual usage. The $10.00 is carried as ladwp:price-minimum-charge with chargeType urpx:minimumBill and intervalDuration P1M; the 'plus ECA, ESA and RCA' composition is not carried anywhere. Separately, no URPX construct enforces a 'greater of' floor, which is a standard-level gap recorded corpus-wide rather than per filing.",
 "Adjustment-factor provenance not cited. Page 1 prices VEA, CRPSEA, VRPSEA (computed quarterly) and IRCA (computed annually) by reference only: 'Refer to www.LADWP.com >About Us >Power Rates >Variable Energy Factors and Reliability Cost Adjustment Factor for current Quarterly Electric Adjustment Factors'. The model supplies Apr-Jun 2026 values for all four (VEA 0.00503, CRPSEA 0.01779, VRPSEA 0.03296, IRCA 0.05505) from LADWP's residential-adjustment-billing-factors page, but the document's only DataSourceReference is on the RatePlanVersion and cites the PDF at pageStart/pageEnd 1. v0.5.1 can cite the HTML page: urpx:textHtml is in the mediaType sh:in, DataSourceReference carries accessURL, dateRetrieved, dataSourceType and hasSelector, and Price.hasDataSourceReference is 0..N. No corpus filing uses textHtml yet, so the pattern is unattested but validates.",
 "No expiry on the quarterly factors. ladwp:r-1a-2026-04-01-ps-adjustment-factors-2026-q2 has startDate 2026-04-01 and no endDate, and the RatePlanVersion has no expirationDate, so the document asserts the Apr-Jun 2026 factor values apply indefinitely even though the sheet footnotes VEA, CRPSEA and VRPSEA as computed quarterly and IRCA as computed annually. PriceSet.endDate and RatePlanVersion.expirationDate both exist in v0.5.1 and are unused. The IRCA Price is also named and grouped as a Q2 quarterly value when the sheet makes it annual.",
]
applicable_modifiers = [
 "ez-save",
 "lifeline",
 "nem",
]

# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "First LADWP filing in the corpus. Pattern reference: PG&E E-1 (also tiered, urpx:hasServiceTiers + serviceTierNumber on per-tier Price entries). 11 PriceDefinitions (1 high-season energy, 1 low-season energy, 1 power access charge, 7 quarterly adjustment factors, 1 minimum charge). 26 Prices total: 12 energy charge prices (2 seasons × 6 zone-tier combinations; values duplicate across zones since rates don't vary by zone, only breakpoints do) + 6 power access charge prices (per zone × tier; values duplicate $2.30/$7.90/$22.70 across zones) + 7 quarterly adjustment factor prices + 1 minimum charge. ServiceTiers: 6 — Z1T1, Z1T2, Z1T3, Z2T1, Z2T2, Z2T3 with zone-specific kWh breakpoints (Z1: 350/1050; Z2: 500/1500). Season encoded in PriceDefinition.hasApplicabilityRule.month rather than in tier identity (deviates from PG&E E-1 pattern, which uses 6 season-specific tiers). The Tier 3 collapse to Tier 2 rate in low season is encoded via duplicate $0.13001 values for tiers 3 and 6 in pd-energy-low-season."
