# Extraction ------------------------------------------------------------------
[extraction]
tool = "manual"
extracted_on = "2026-10-07"
notes = """
Base rates are unchanged: the Electric Rate Summary effective 2019-07-01, page
1, fetched 2026-10-07 with the same sha256 as the copy in the 2026-04-01
version. This version moves the seven adjustment factors to the Oct-Dec 2026
values.

Factor sources. ECA, VEA, CRPSEA and VRPSEA: Board of Water and Power
Commissioners Resolution No. 027 035, adopted at the meeting held Sept 8,
2026, Attachment B page 11 (Factors Summary). RCA and IRCA: Resolution No. 026
243, adopted at the meeting held Jun 9, 2026, Appendix (page 8), for fiscal
year 2026-27. ESA: the capped-ordinance value on the 2019-07-01 summary. Each
factor Price cites its document and page. Both resolutions are listed on
https://www.ladwp.com/account/understanding-your-rates/approved-expenditures-water-and-power-pass-through-adjustment-factors.

Factors page. The same values are the 2026 table's "Oct - Dec" row on
https://www.ladwp.com/account/customer-service/electric-rates/residential-adjustment-billing-factors,
retrieved 2026-10-07, sha256
4ec12973af3cb9f764cad0fd7eef73b7c34a768bfc9afcd2f2221381b1bb8779 for the HTML
as served. The page is not vendored: this corpus vendors PDF source documents
only.

Factor values, $/kWh, against the 2026-07-01 version:
 ECA: 0.05690 -> 0.05690
 ESA: 0.00147 -> 0.00147
 RCA: 0.00300 -> 0.00300
 IRCA: 0.06934 -> 0.06934
 VEA: 0.01071 -> 0.01590
 CRPSEA: 0.01817 -> 0.01973
 VRPSEA: 0.03307 -> 0.03516
 Sum: 0.19266 -> 0.20150

Reconciliation. Base charge plus the factor sum equals the 2026 Total
Consumption Charge on https://www.ladwp.com/account/customer-service/electric-rates/residential-rates (retrieved 2026-10-07,
sha256 9757e61920d84ceab82d98d51e15463c3ddc5efe2d71137322334032ad6768ec):
 low-zone1-t1: 0.27292
 low-zone1-t2: 0.33151
 low-zone1-t3: 0.33151

Supersession. The 2026-07-01 version expires on this version's effective date.
This version carries no urpx:expirationDateTime: Resolution No. 027 035 states
the next quarterly factors update would be effective January 1, 2027, and
those factors were not published at retrieval.
"""

