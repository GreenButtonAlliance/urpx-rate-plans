# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Rate E strikes the ESA and the RCA along with the credit, and the model does not. Section 2.e (printed page 4) prices Rate E as \"Rate A less $ 17.71, ESA, and RCA\" and Section 3 Billing repeats it; General Provisions Section H (printed page 74) explains why, the ESA being what recovers the cost of Lifeline credits. A bill computed from ladwp:r-1a plus this modifier still charges ESA at $0.00147/kWh and RCA at $0.00300/kWh. Expressible under URPX v0.5.1 and validated on this filing: two Prices with multiplier -1 and basedOnPrice naming the base plan's ESA and RCA Prices, a form clj-urpx 0.31.0 resolves. Work, not a blocker.",
 "Special Condition 5.a.(4) (printed page 6) escalates the credit and the model carries only the base value: a customer eligible in two of the three Section 5.a criteria categories receives 150 percent of the Lifeline Credit, and one eligible in all three receives 175 percent. A multiply-qualifying customer's credit is therefore understated by half or by three-quarters again. Expressible under URPX v0.5.1 and validated on this filing: a ProfileAlternatives on PlanElements with one AlternativeDimension for the category count, three ProfileAlternatives, and three PriceDefinitions each carrying referencesProfileAlternative (which is allowed on PriceDefinition, not on Price) at -35.42, -53.13 and -61.985. Two modifiers in the corpus already carry hasProfileAlternatives, cpau:e-hra and pge:e-tou-c-baseline-tier, and clj-urpx 0.31.0 reads the selection layer. Work, not a blocker.",
 "Section 2.e sets a Minimum Charge of $2.00 specific to Rate E, overriding Rate A's own $10.00, and Section 3 makes it a floor: the bill is Rate A less the Lifeline Credits, ESA and RCA, \"but not less than the Minimum Charge\". Neither the amount nor the floor is modeled. The amount is expressible now as a Price with chargeType urpx:minimumBill, the way ladwp:r-1a already carries its $10.00, and that form validates here. The floor arithmetic is not expressible: URPX v0.5.1 has no greater-of construct on PriceShape, and minimumBill is a label that nothing in clj-urpx 0.31.0 enforces. Carry the datum; the arithmetic is a standard-level gap recorded once for the corpus, not per filing.",
 "Section 2.e prices the credit as a three-step schedule, $15.31 upon enactment, $16.51 effective 1 July 2008 and $17.71 effective 1 July 2009, and only one step is modeled. The Price carries startDate 2008-09-01 while the amount it carries, -$0.5817 per meter-day = $35.42 per two months = $17.71 per month, is the 1 July 2009 step; the ordinance figure in force on 2008-09-01 is $16.51 per month. Price startDate and endDate express the full schedule. Settle first whether this filing is meant to date at the ordinance baseline while carrying the currently published amount, which the extraction notes imply and which would make the mismatch deliberate rather than an error.",
 "The credit is denominated per meter per day (-$0.5817, intervalDuration P1D, a Ledger referencing a meterCount MetricInput) and the schedule denominates it neither way: Section 2.e states a flat monthly dollar amount against Rate A with no per-meter and no per-day basis. The conversion also loses about a cent per period, -0.5817 times 60.875 being 35.411 against a filed $35.42. intervalDuration \"P2M\" with intervalType urpx:customInterval validates against v0.5.1 and would carry -35.42 as filed. The trade is that clj-urpx 0.31.0 surfaces intervalDuration but neither prorates nor multiplies by it, so the per-day derivation moves to the consumer. The PriceDefinition's baseQuantity \"1\" is inert and can go at the same time.",
 "The eligibility rule is narrower than, and different from, the tariff's. Section 5.a enumerates three qualifying categories, none of them an income test: (1) a senior citizen or disabled individual eligible for exemption from the City Utility Users Tax, (2) a full-time resident who regularly requires an essential life-support device, and (3) a physician-certified allowance for a named set of conditions or a compromised immune system. The model collapses all three into one \"Program Enrollment = Lifeline\" predicate and describes eligibility as age or disability plus LADWP income guidelines, which the ordinance does not say. Eligibility is not itself a coverage question, but it is load-bearing here: the 5.a.(4) escalation is computed from the number of categories, so it cannot be modeled on top of a predicate that does not distinguish them.",
]

