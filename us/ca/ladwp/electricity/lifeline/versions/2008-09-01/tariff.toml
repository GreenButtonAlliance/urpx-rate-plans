[modeling]
complete  = false
deferrals = [
  "'Subsidy not to exceed bill' cap-on-credit constraint — URPX#24 territory; edge case for very-low-usage customers",
  "Per-bimonthly CalculationMethod precision — modeled as -$0.5817/day (=$35.42/60.875 days); URPX P2M intervalDuration would let us model exact bimonthly billing",
  "Senior-vs-Disability eligibility distinction — modeled as single 'Lifeline' predicate (both paths produce same modifier value, so distinction doesn't affect bill calc)",
  "Stacking exclusivity with EZ-Save — modeling-side both modifiers exist independently; consumer should select at most one per customer",
]

