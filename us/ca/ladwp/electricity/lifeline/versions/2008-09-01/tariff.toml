# Extraction ------------------------------------------------------------------
[extraction]
tool = "manual + script-derivation from ladwp:ez-save"
extracted_on = "2026-05-04"
notes = """
First filing of LADWP Lifeline (Senior Citizen / Disability Subsidy)
program in this corpus. Sister filing to 
EZ-Save — LADWP operates two parallel income-qualified subsidy
programs:

 Program Tier Subsidy Eligibility
 ─────── ──── ─────── ───────────
 Lifeline Higher $35.42 every 2 mo Senior (62+) OR
 Disability +
 income guidelines
 EZ-Save Lower $16.34 every 2 mo Income-only,
 no categorical
 shortcut

A customer qualifies for one but not both.

## Provenance approach

Same shared-PDF pattern as EZ-Save and us/ca/ladwp/electricity/nem/
(LADWP doesn't publish per-program tariff PDFs):
 - tariff.toml [source.url] = the multi-program LADWP Electric Rates
 Ordinance 180127 PDF (carries the regulatory framework + 'Rate E
 - Lifeline Service' provision in the residential rate schedule
 section)
 - tariff.toml [source.landing_page] = the LADWP residential rates
 HTML page (where the current $35.42/2-mo dollar value is
 published; provenance for the modeled credit value)

Per the LADWP convention (effective date matches ordinance baseline),
this filing is dated 2008-09-01 — Lifeline has been a long-standing
LADWP residential program; the ordinance Rate E - Lifeline Service
definition has been operative since the 2008 ordinance baseline.

## Modifier shape

JSON-LD script-derived from us/ca/ladwp/electricity/ez-save/.../jsonld with
substitutions: schedule slug ez-save → lifeline, modifierUnique-
Identifier EZ-SAVE → LIFELINE, eligibility description and dollar
value updated. Same single-PriceDefinition shape — flat per-meter-day
credit reflecting the bimonthly subsidy.

Lifeline customer benefit per LADWP residential rates HTML page:
 Up to $35.42 every two months on the customer's electric bill.
 The subsidy should not exceed the customer's electric bill.

Modeled as -$0.5817/day per-meter (= $35.42/60.875 days = average 2-
month period in days). Same per-day approximation deferral as
EZ-Save and SMUD MED/EAPR.

## Eligibility specifics

Per LADWP residential rates HTML page:
 Customer must be (a) Senior Citizen (typically 62+ years of age)
 OR (b) Disability-qualified, AND (c) meet LADWP's published income
 guidelines (revised periodically — eligibility broader than EZ-Save's
 income-only qualification).

Lifeline is the higher-tier subsidy versus EZ-Save's lower-tier
$16.34/2-mo. Customer qualifies for one but not both.

## What this modifier does NOT capture (deferred)

Same deferrals as EZ-Save:

 1. **'Subsidy not to exceed bill' cap** — cap-on-credit pattern
 (URPX#24 territory). Most customers won't hit the cap; edge
 case for very-low-usage customers.

 2. **Per-bimonthly CalculationMethod precision** — modeled as
 -$0.5817/day. Future URPX P2M intervalDuration would let us
 model exact bimonthly billing.

 3. **Senior-vs-Disability eligibility distinction** — modeled as
 a single 'Lifeline' enrollment predicate without distinguishing
 the two qualification paths. The modifier value is the same
 for both paths so this doesn't affect bill calculation.

 4. **Stacking exclusivity with EZ-Save** — customer qualifies for
 Lifeline OR EZ-Save but not both. This is enforced by LADWP's
 enrollment process; modeling-side, both modifiers exist
 independently and the consumer should select at most one for
 a given customer.

## Cross-utility consistency

LADWP's two-tier income/condition-qualified subsidy structure
(EZ-Save income-only + Lifeline senior/disability+income) parallels
the SCE/SDG&E/PG&E CARE+FERA two-tier structure (CARE deeper
discount for lower income, FERA shallower for moderate income).
The cross-utility naming differs — LADWP doesn't use the CPUC
'CARE' or 'FERA' brand names since LADWP is a municipal utility
governed by the LA City Council, independent of CPUC.

## applicableToRatePlan

Applies to LADWP residential base RatePlans (R-1A, R-1B currently
in corpus).
"""

