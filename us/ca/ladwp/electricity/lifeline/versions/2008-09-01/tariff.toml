notes = "first filing of LADWP Lifeline modifier. Single per-meter-day credit -$0.5817/day (=$35.42/60.875 days bimonthly). Sister to EZ-Save: Lifeline is higher-tier ($35.42/2-mo, Senior/Disability+income) vs EZ-Save lower-tier ($16.34/2-mo, income-only). Same shared-PDF source pattern as EZ-Save (multi-program ordinance + landing_page HTML). Eligibility predicate: 'Program Enrollment' = 'Lifeline'. applicableToRatePlan: 2 LADWP residential bases (r-1a, r-1b)."
