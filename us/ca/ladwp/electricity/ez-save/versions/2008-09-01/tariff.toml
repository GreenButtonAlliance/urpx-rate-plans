# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Rate D waives the Electric Subsidy Adjustment and the Reliability Cost Adjustment in addition to granting the credit, and the model carries only the credit. Schedule R-1 Section 2.d (printed page 4) prices Rate D as \"Rate A less $ 8.17, ESA, and RCA\" and Section 3 Billing repeats \"Rate D shall be Rate A less the Low-Income Credit, ESA, and RCA\"; General Provisions H.2(c) and L.2(f) corroborate by excluding Low-Income Residential sales from both adjustment denominators. Composing this modifier over ladwp:r-1a therefore leaves ESA at $0.00147/kWh and RCA at $0.00300/kWh in the bill, overstating an EZ-Save customer's charges by $0.00447 on every kWh. Expressible under v0.5.1 and unbuilt: two additional Prices, each with multiplier -1 and a multi-valued basedOnPrice naming the r-1a and r-1b ESA (resp. RCA) Price IRIs, following the sce:care idiom. That shape was validated with pyshacl against origin/v0.5.1-candidate (abdfb521) composed with both base plans and conforms.",
 "The credit is priced per month in the source and per day in the model. Schedule R-1 Section 2.d sets it at $8.17 per month effective July 1, 2009, which is the same amount LADWP publishes on its residential rates page as $16.34 every two months. The model carries -$0.2683 per meter-day, obtained by dividing $16.34 by a 60.875-day average bimonthly period; the exact quotient is 0.26842, so the modeled credit is short by about $0.007 per two-month period, and a customer on a non-average cycle receives a credit away from the published figure either way. urpx:intervalDuration is xsd:duration with no pattern or enumeration, so P1M at -8.17 or P2M at -16.34 both express it; P1M is preferable because it sources the number from the filed PDF rather than from an HTML page this repo does not hold. Note that intervalDuration is declarative at the pinned consumer, clj-urpx 0.31.0: its presence excludes the charge from the per-unit marginal but nothing prorates or multiplies it.",
 "The version is dated 2008-09-01 but carries the amount that its own sheet puts in force on 2009-07-01. Schedule R-1 Section 2.d enumerates three steps, $6.81 upon enactment, $7.49 effective July 1, 2008, and $8.17 effective July 1, 2009, and the sheet header reads \"Rate Effective July 1, 2009\"; the modeled -$0.2683 per meter-day derives from the third step. On 2008-09-01 the in-force amount was $7.49. Either the version date or the amount needs to move, or the three steps need separate RatePlanModifierVersions. This may be an accepted consequence of the documented LADWP convention of dating filings to the ordinance baseline, in which case say so here and close the item.",
 "urpx:applicableToRatePlan names ladwp:r-1b and the ordinance supports only ladwp:r-1a. Schedule R-1 Section 2.d defines Rate D solely as a variant of Rate A; Rate B, the time-of-use service in Section 2.b, has no Low Income form anywhere in Ordinance 180127. This is the model asserting a pairing the filed PDF does not price. It may be true of current LADWP practice, which this 2008 ordinance would not show; confirming it needs a current rate sheet.",
 "Whether Rate D waives the adjustments LADWP introduced after this ordinance cannot be answered from this PDF. Ordinance 180127 names only ESA and RCA, because IRCA, VEA, CRPSEA and VRPSEA postdate it, while the base plan ladwp:r-1a (sourced separately from the 2019 Electric Rate Summary) carries all four. This is a source gap rather than a vocabulary gap: resolving it needs a current LADWP residential rate sheet, which this corpus does not hold.",
 "Rate D and Rate E are alternative rates within Schedule R-1 Section 2, so a customer takes one or the other, but ladwp:ez-save and ladwp:lifeline are separate modifier documents and no property in v0.5.1 relates one RatePlanModifier to another. Consumers must select at most one per customer. The sister filing ladwp/lifeline records this and this one did not; recorded here to close the asymmetry. The shape itself is corpus-wide and lives in MODELING-GAPS.md; what is specific to this filing is that the two documents in question are these two.",
 "Whether Rate A's $10.00 Minimum Charge floors a Rate D bill is ambiguous in the source and is left unmodeled. Section 3's Rate A bullet reads 'the sum of parts (1) through (4), but not less than the Minimum Charge' and the Rate E bullet repeats the floor explicitly, while the Rate D bullet omits it yet still defines the bill as 'Rate A less ...'. Reading 'Rate A' as the already-floored Rate A bill and reading it as the bare sum of parts give different answers, and resolving that is this filing's work. The separate point, that v0.5.1 records a minimum as a datum (chargeType urpx:minimumBill, as ladwp:r-1a already does at $10.00) but expresses no greater-of arithmetic, is corpus-wide and lives in MODELING-GAPS.md.",
]

