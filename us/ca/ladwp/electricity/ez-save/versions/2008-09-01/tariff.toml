# Extraction ------------------------------------------------------------------
[extraction]
tool          = "manual"
extracted_on  = "2026-05-04"
notes         = """
First filing of LADWP EZ-Save program in this corpus (URPXT-qh2.1).

## Provenance approach (LADWP-specific quirk)

LADWP doesn't publish per-program tariff PDFs analogous to CPUC IOU
filings. The EZ-Save program lives across (1) LADWP residential rates
HTML page, (2) HTML eligibility page, (3) application-form PDF, and
(4) the multi-program 'Rules Governing Water & Electric Service'
Ordinance 180127 (as amended by 181181). The current dollar value
($16.34 every two months) is published on the residential rates HTML
page; the regulatory framework lives in the ordinance PDF.

Convention applied here (extending the LADWP NEM modifier pattern):
  - tariff.toml [source.url] = the multi-program ordinance PDF
    (regulatory framework + Lifeline Service / Rate E definitions
    that EZ-Save inherits structurally)
  - tariff.toml [source.landing_page] = the LADWP residential rates
    HTML page (where the current $16.34/2-mo dollar value is
    published; provenance for the modeled credit value)
  - JSON-LD urpx:hasDataSourceReference points at the ordinance PDF
    URL; description prose cites the HTML page for the dollar value

Per the LADWP convention (effective date matches ordinance baseline),
this filing is dated 2008-09-01 — the EZ-Save program was established
around that timeframe per LADWP's program history. Income thresholds
were revised 2025-07-01 but the credit dollar amount has not been
re-published with a separate effective date in the regulatory record.

## Modifier shape

Modeled as urpx:RatePlanModifier — LADWP's lower-tier income-qualified
discount (sister program to LADWP Lifeline which carries a higher
$35.42/2-mo subsidy; both administered separately). Eligibility
predicate: customer's "Program Enrollment" = "EZ-Save" (CustomOperand-
Node), matching the cross-utility naming.

EZ-Save customer benefit per LADWP residential rates HTML page:
  Up to $16.34 every two months on the customer's electric bill.
  The subsidy should not exceed the customer's electric bill.

Modeled as -$0.2683/day per-meter (= $16.34/60.875 days = average 2-
month period in days). Per-day approximation introduces ~3% per-month
error vs the actual per-2-month credit on customers with non-standard
billing cycles. Future URPX vocabulary supporting per-month or
per-bimonthly intervalDuration (P1M / P2M) would let us model the
exact credit cadence.

Constraint: 'subsidy should not exceed the customer's electric bill'
— this is a cap-on-credit semantic similar to SMUD EAPR's usage-cap
discount (URPX#24 territory). Not modeled — for the typical EZ-Save
customer with a non-trivial bill, the cap doesn't bind. Edge case:
customers with very low usage may have the credit truncated.

## Eligibility specifics

LADWP residential rates HTML page summary:
  Income-qualified residential customer, eligibility tied to
  household income guidelines (income-only — no categorical-program
  shortcut, distinct from CPUC CARE eligibility paths). Income
  thresholds revised 2025-07-01.

Lower-tier subsidy than LADWP's separate Lifeline program (which
provides up to $35.42/2-mo for senior citizens and disability-
qualified customers).

## What this modifier does NOT capture (deferred)

  1. **'Subsidy not to exceed bill' cap** — cap-on-credit pattern
     (URPX#24 territory). Most customers won't hit the cap; edge
     case for very-low-usage customers.

  2. **Per-bimonthly CalculationMethod precision** — modeled as
     -$0.2683/day. Future URPX P2M intervalDuration would let us
     model exact bimonthly billing.

  3. **Income-threshold details** — the application enforces
     specific income guidelines; modeled here as a generic
     'Program Enrollment = EZ-Save' eligibility predicate without
     enumerating income brackets.

## applicableToRatePlan

Applies to LADWP residential base RatePlans (R-1A, R-1B currently
in corpus; A-1 also residential-applicable per Service Rider notes
but A-1 is out-of-residential-scope per URPXT-qh2 epic notes).

## Sister program: Lifeline

LADWP also operates a separate Lifeline subsidy ($35.42/2-mo) for
Senior Citizen / Disability customers. The two programs are
administered separately and a customer may qualify for one but not
both. Lifeline modeling is implicit in the Ordinance's 'Rate E -
Lifeline Service' provision (Rate E = Rate A less the Lifeline
Credits ESA + RCA) and not a standalone modifier; could be modeled
as a separate RatePlanModifier following this same pattern if the
user wants leverage there.
"""

