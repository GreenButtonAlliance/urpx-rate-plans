[validation]
shacl_passed = true
validator = "pyshacl + clj-urpx (URPX v0.5.1)"
validated_on = "2026-09-20"

# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Sheet MED-1 Sec II prices one thing, a $15.00 per month discount on the electricity usage portion of the bill. The model carries it as unitPrice -0.4931 with CalculationMethod intervalDuration P1D, which is $15.00 divided by 365/12 days. SMUD's residential base schedules define a month as \"a single billing period of 27 to 34 days\" and MED-1 Sec V states no proration, so the modeled credit runs from $13.31 to $16.77 against a flat $15.00. This is unbuilt work, not a vocabulary gap: urpx:intervalDuration is xsd:duration on CalculationMethodShape at both v0.2.1 and v0.5.1, urpx:monthlyInterval is in IntervalTypeValueShape, the corpus already uses P1M 62 times, and the sibling smud/eapr models its $10.00 per month SIFC discount as unitPrice -10.00 with intervalDuration P1M. A candidate with unitPrice -15.00, intervalDuration P1M and intervalType urpx:monthlyInterval conforms under pyshacl against the v0.5.1 shapes. Trade to state when making the change: clj-urpx 0.25.0 surfaces intervalDuration but neither prorates nor multiplies by it, so this moves the per-day derivation to the consumer while making the record match the sheet.",
 "Sheet MED-1 Sec II places the $15.00 on \"the electricity usage portion of the bill per month\" and nowhere says per meter, but the model's Ledger references a MetricInput of urpx:meterCount and the PriceDefinition name asserts per meter. The per-meter framing came from smud/eapr, where it is sourced, because EAPR's $10.00 discount is against the System Infrastructure Fixed Charge that the SMUD base schedules state as \"per month per meter\". At clj-urpx 0.25.0 the MetricInput is descriptive only and is not used as a multiplier, so no number is wrong today, but the assertion is unsourced. PlanElementsShape requires hasMetricInput minCount 1, so it cannot be removed outright; pick the right MetricInput when the P1M denomination is fixed.",
 "Section III states a stacking rule over two modeled modifiers and is in no part of the model. Verbatim: \"Qualified residential customers on both the Energy Assistance Program Rate (EAPR) and the MED receive the EAPR discount as described in Rate Schedule EAPR and the MED discount.\" The assessment left it out as introducing no amount and flagged the call so it could be overruled; the corpus has no property declaring stacking or exclusivity between two RatePlanModifiers, so this is a blocked deferral rather than an omission.",
]

