# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "Second SMUD schedule. Pattern reference: us/ca/ladwp/electricity/r-1a/versions/2026-04-01/ for season-encoded-via-PriceDefinition.hasApplicabilityRule.month pattern (LADWP R-1A also uses this pattern, though LADWP has tiers and SMUD Fixed Rate doesn't). 3 PriceDefinitions, 3 Prices, no TOU schedule, no ServiceTiers. Distinctive among modern CA residential offerings — a true non-TOU non-tiered flat rate, available as a customer choice (most other CA utilities have eliminated equivalent flat rates as TOU mass migration progressed)."
