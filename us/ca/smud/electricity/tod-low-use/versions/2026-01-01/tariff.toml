# Extraction ------------------------------------------------------------------
[extraction]
tool = "manual + script-derivation from smud:tod-5-8pm"
extracted_on = "2026-05-04"
notes = """
first filing of SMUD's optional Time-of-Day (Low Use)
Rate (regulatory rate category RTL1). Sister rate to the default
Time-of-Day (5-8 p.m.) Rate (RT02 — see us/ca/smud/electricity/tod-5-8pm/) under
the shared Rate Schedule R-TOD umbrella.

## Source PDF (shared with sibling sub-rates)

Same source PDF (1-R-TOD.ashx, sha256 9be2f188...) and Board
Resolution (25-06-15 adopted June 19, 2025) as smud:tod-5-8pm. The
single multi-program PDF carries Section II.A (RT02), II.B (RTL1
Optional Time-of-Day Low Use), and II.C (RTC1 Optional CPP) — three
distinct rate categories under one Schedule R-TOD container.

This filing captures the January 1, 2026 column from the multi-year
rate trajectory. Sec II.B explicitly notes RTL1 'will be available
as of January 1, 2026' — there are no May 2025 prices in the source
PDF (n/a values, see source Sec II.B), so this filing's
initialEffectiveDate is January 1, 2026 (vs RT02's May 1, 2025).

## Rate values captured (Effective 2026-01-01)

System Infrastructure Fixed Charge: $17.00/meter/month
 (vs RT02 $27.00 — RTL1's lower fixed charge is the central design
 trade-off: low-usage customers benefit from spreading less of the
 bill across the kWh-independent fixed component.)

Electricity Usage Charges (regulatory rate category RTL1):
 Summer (Jun 1 - Sept 30):
 Peak $0.4154/kWh (vs RT02 $0.3765 — HIGHER per-kWh)
 Mid-Peak $0.2514/kWh (vs RT02 $0.2139 — HIGHER per-kWh)
 Off-Peak $0.1920/kWh (vs RT02 $0.1550 — HIGHER per-kWh)
 Non-Summer (Oct 1 - May 31):
 Peak $0.2148/kWh (vs RT02 $0.1776 — HIGHER per-kWh)
 Off-Peak $0.1654/kWh (vs RT02 $0.1285 — HIGHER per-kWh)
 NO Mid-Peak in non-summer (same TOU window structure as RT02).

## Fixed-vs-variable trade-off

Designed to advantage low-usage customers. Approximate break-even
point vs RT02 is around 270 kWh/month (annualized; varies by season
and time-of-day usage profile). Customers using significantly less
than ~270 kWh/month benefit from the lower fixed charge; customers
using significantly more pay more in total under RTL1 due to the
~10% higher per-kWh rates.

## Eligibility (Sec I.B)

Hard eligibility cap: customer's electrical service panel size must
be ≤ 125 amps. Combined with optional-rate election (RTL1 is opt-in,
default is RT02). The 'low usage' descriptor is intended (~270
kWh/month order-of-magnitude per the epic notes), but the
source PDF doesn't enumerate a specific kWh cap — eligibility is by
SMUD review of the customer's recent consumption history alongside
the panel-size verification.

## Modeling shape

Same TOU structure as smud:tod-5-8pm (RT02): 5 distinct TOUPeriods
(3 summer + 2 winter) under 3 TOUTiers (peak / mid-peak / off-peak,
with mid-peak only in summer). 5 PriceDefinitions for usage charges
keyed by touPeriodNumber 1-5 + 1 PriceDefinition for SIFC. 6 Prices
total.

## IRI suffixing convention (RTL1 vs RT02 cohabitation)

JSON-LD script-derived from smud:tod-5-8pm by substituting unitPrice
values, RatePlan @id (smud:tod-5-8pm → smud:tod-low-use), and
ratePlanUniqueIdentifier (RT02 → RTL1).

To avoid IRI-level collision in the federated SMUD graph
(graph triples like 'smud:pd-usage-summer-peak urpx:hasPrice ...'
must NOT carry conflicting unitPrice values from two RatePlans),
all RTL1-specific IRIs that would otherwise alias an RT02 IRI are
suffixed with '-rtl1':
 - smud:tou-tier-{peak,mid-peak,off-peak}-rtl1
 - smud:tou-period-*-rtl1
 - smud:time-bracket-*-rtl1
 - smud:pd-usage-*-rtl1
 - smud:pd-system-infrastructure-fixed-charge-rtl1
 - smud:price-*-rtl1
 - smud:ps-usage-rtl1

Shared concept IRIs (smud:season-{summer,non-summer},
smud:mi-{energy,meter-count}, smud:ms-energy,
smud:ledger-{energy,system-infrastructure}) intentionally re-use the
RT02 IRIs because their definitions are identical across both rates.
This matches the existing smud:fixed ↔ smud:tod-5-8pm pattern
(season + ledger + metric-input IRIs are shared; rate-specific PDs
and Prices are distinct).

## Holiday handling

Same as RT02: the eleven holidays of Sheet R-TOD-4 Sec V.A are carried
as a urpx:HolidayCalendar (smud:holidays-tod-low-use, with
'-rtl1'-suffixed Holiday IRIs per the convention above) on the plan
elements; the peak and mid-peak brackets set includeHolidays false and
includeNonHolidays true, and each off-peak period gains one
holiday-only weekday bracket over the hours they give up. No
urpx:observanceRule is modeled, the schedule stating none.

## Modeling deferrals

Deferred to grid-coordination/urpx-rate-plans#15 (SMUD secondary epic):
 - Plug-In Electric Vehicle Credit (-$0.0150/kWh, midnight-6am daily) —
 Sec II.D of source PDF. EV-owner overlay applying to RT02, RTL1,
 AND RTC1. Modeled as smud:pev-credit modifier — applicableToRatePlan
 will be extended to include smud:tod-low-use.
 - Energy Assistance Program Rate (EAPR) — Sec IV.A → smud:eapr modifier
 (existing) extended to RTL1.
 - Medical Equipment Discount Program (MED) — Sec IV.B → smud:med
 modifier (existing) extended to RTL1.
 - Standby Service charge ($8.855/kW for customers with on-site
 generation under 100 kW nameplate) — Sec IV.D.
 - Customer Energy Generation Options (NEM1, SSR) — Sec IV.E.
 - SMUD Renewable Energy Option — Sec IV.F.
 - Special Metering Charge — Sec IV.G.
 - Three-Phase Service Option ($57.95/month special facilities fee) —
 Sec IV.H.

Deferred to other future modeling (not scope):
 - Hydro Generation Adjustment (HGA) — Sec III.A references separate
 Rate Schedule HGA. Same gap as RT02.
 - Specific kWh usage-cap eligibility threshold — modeled prose-only
 in EligibilityRule description, not as a structural ConditionExpression
 operand (source PDF doesn't enumerate the threshold).

NEM1/SSR mandatory enrollment (Sec I.3): same applicability as RT02
— customers with NEM1/SSR generation approved on/after January 1,
2018 are mandated onto Rate Schedule R-TOD (which encompasses both
RT02 and RTL1, with the optional choice between them). Documented
in EligibilityRule description prose.
"""

