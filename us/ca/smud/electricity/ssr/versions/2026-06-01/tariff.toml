[extraction]
tool = "pdftotext"
tool_version = "26.09.0"
extracted_on = "2026-10-07"
notes = """
Source bytes. smud_ssr_2026-06-01.pdf is 01_SSR.ashx as served 2026-10-07 (Last-Modified 2026-06-24). Every sheet (SSR-1, SSR-2, SSR-3) reads "Resolution No. 21-09-07 adopted September 16, 2021 (as amended by Resolution No. 26-04-04 adopted April 16, 2026)" and "Effective: June 1, 2026". The May 21, 2026 Board information packet ([source.resolution], cited and not vendored) prints Resolution No. 26-04-04 on PDF page 145, approved April 16, 2026 on the Consent Calendar.

Change from the 2022-03-01 version. The pdftotext -layout text of the two sheets differs only in the sheet footers and in the first sentence of Section VI: "The Export Compensation Rate effective June 1, 2026 will be $0.0960 per kWh", where the 2022-03-01 sheet read "effective March 1, 2022 will be $0.0740 per kWh". Resolution No. 26-04-04, Section 1: "Effective June 1, 2026, the Solar and Storage Rate (SSR) export compensation rate is 9.6¢ per kWh." The new rate is 1.297 times the old one, inside the ± 30% bound of Section VI.

Price changes from the 2022-03-01 version:
 ssr-2026-06-01-price-export-compensation: -0.07400 -> -0.09600

Supersession. The 2022-03-01 version expires at 2026-06-01. The sheet footers name no resolution between 21-09-07 and 26-04-04, and Resolution No. 26-04-04 recites the 7.4 cent rate set by Resolution No. 21-09-07 as the rate it replaces, so no version lies between the two.
"""

