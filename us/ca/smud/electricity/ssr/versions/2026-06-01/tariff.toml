# Modeling --------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Export credit application scope (Sheet SSR-2, Section VII.B and VII.C). The schedule bounds where the credit may land: 'The export credit can only offset electricity usage charges', and VII.C requires the System Infrastructure Fixed Charge, demand charges, program fees, surcharges and taxes to be paid each monthly billing cycle regardless. The model carries the credit as an unbounded Price of -0.09600/kWh with no cap, so a consumer composing SSR onto R-TOD will let it erode the System Infrastructure Fixed Charge and produce a bill the tariff forbids. Not expressible under URPX v0.5.1: this is the 'credit bounded by the value of another price' shape. basedOnPrice plus multiplier on PriceShape compute a value but cannot bound its application; CalculationMethodShape is sh:closed with only a free-text calculationFormula; the ontology has no cap or limit vocabulary (urpx:maximum is an AggregationMethodValue; priceFloor/priceCeiling are dynamic-pricing clamps). A urpx:GeneralRule attached via referencesGeneralRule would record the provision as citable prose, but it needs generalRuleID plus at least one hasDataSourceReference and has zero uses anywhere in this corpus.",
 "Carryover of the unconsumed export credit (Sheet SSR-2, Section VII.B): 'Any remaining credit will carry over to subsequent billing periods.' Not modeled. LedgerShape permits settlementInterval and hasBillingCycle, and smud:ssr-2026-06-01-ledger-export-compensation sets neither, but settlementInterval denotes a finite accumulation period ending in a settlement (its skos:note cites P12M for the NBT 12-month true-up) whereas SSR's carryover is open-ended: the PDF states no true-up, cash-out, expiry or forfeiture. URPX v0.5.1 has no term for a balance that persists indefinitely: LedgerShape and BillingCycleShape are sh:closed, settlementInterval is the only property among them that concerns a balance, and a scan of every ontology literal for carry, rollover, balance, banked and unconsumed finds no other balance term.",
 "Generator standby charge waiver (Sheet SSR-1, Section III): SSR customers 'are exempt from generator standby charges on that portion of their load that is served by the eligible facility.' Not modeled, and blocked on two things, neither of them URPX vocabulary. First, there is no base Price to reference: R-TOD Sheet R-TOD-3 Section IV.D prices the Standby Service Charge at $8.855 per kW of Contract Capacity per month effective 2026-01-01, and both smud/tod-5-8pm and smud/tod-low-use already record 'Standby Service Charge' as their own deferral with a planned 'standby' modifier. Second, a full waiver is expressible as a Price with multiplier -1 plus basedOnPrice naming that charge (no filing in this corpus does this yet), but SSR's proportional wording is not, and R-TOD's own text reads as unconditional for SSR customers ('waived only for qualifying renewable generation under Rate Schedules NEM1 and SSR'). Settle that conflict and build this after the base plans model the charge.",
 "Billing-period definition (Sheet SSR-2, Section VII): 'For the purposes of this schedule a \"month\" is considered to be a single billing period of 27 to 34 days.' The model carries no CalculationMethod. Expressible now as intervalDuration 'P1M' plus intervalType urpx:monthlyInterval. The sole Price is per-kWh, so nothing prorates by the length of the period. Low consequence, and recorded because the provision is in the filed source and not in the model, which is the test LAYOUT 4.4 sets.",
 "Section IV.A states seven eligibility requirements and the model encodes three. The four unmodeled ones are verbatim: \"1. The facility must be located on the customer's premises; and 2. The facility must operate in parallel with SMUD's distribution facilities; and 3. The customer must meet all requirements of Rule and Regulation 21; and ... 5. The facilities and the electrical requirements are located at a single and same metering point\". They price nothing.",
 "Section IV.A.4's sizing constraint is a term of availability of this schedule and is unmodeled. Verbatim: \"The facility must be intended primarily to offset up to 110% of the customer's own electrical requirements\". The model records it only in urpx:description prose.",
 "Default versus elective enrollment (Sheet SSR-1, Section I). Customers whose renewable generation facility was approved for interconnection by SMUD on or after March 1, 2022, or who establish service at a premises with such a facility on or after that date, are placed on SSR (apart from the Section II transition period); customers whose facility was \"approved for interconnection on or before February 28, 2022\" \"may elect to enroll in Rate Schedule SSR on or after March 1, 2022.\" Not expressible per cohort under URPX v0.5.1: urpx:isDefault and urpx:customerChoice (whose values include urpx:mandatoryChoice) have rdfs:domain urpx:RatePlanVersion and mark a whole version, and neither is a path on the sh:closed RatePlanModifierVersionShape this filing's version is validated against.",
 "Section VI bounds the one price this filing models and nothing in the model states it: \"SMUD will update the Export Compensation Rate every four years, starting in 2026\" and the rate \"will not be changed more than ± 30% every four years\". The model carries a bare -0.09600 Price with no DynamicPricing, priceFloor, priceCeiling or updateFrequency.",
]

