[review]
status = "draft"
notes = "First SMUD RatePlanModifier filing. Pattern reference: us/ca/cpau/electricity/e-eec-1/versions/2025-09-01/ for the export-compensation-modifier shape (flat per-kWh credit with reverse-flow MetricInput); us/ca/ladwp/electricity/nem/versions/2008-09-01/ for the NEM-style customer-generation overlay structure. Three EligibilityRules: residential customer + 4-way OR over qualifying renewable DER types (solar / wind / storage / hydro + custom-other-renewable for biomass / geothermal / fuel cells / digester gas / municipal solid waste / landfill gas / ocean wave / ocean thermal / tidal current) + capacity ≤3,000 kW. Single PriceDefinition + Price (export compensation rate -$0.07400/kWh, sign convention matching CPAU E-EEC-1). HIGHEST-FIDELITY customer-generation modifier in the corpus to date — concrete flat rate, no vocab gap. ~60K SMUD residential solar/storage customers — second-highest customer count in the electrification effort."
