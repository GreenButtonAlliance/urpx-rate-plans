deferrals = [
 "Hydro Generation Adjustment (Sheet R-TOD-3, Section III.A): R-TOD imposes the HGA as an electricity usage surcharge on every bill under this schedule, with no eligibility qualifier, but states only \"Refer to Rate Schedule HGA\" and publishes no amount. Schedule HGA is not in this corpus, so this is a source gap rather than a URPX expressibility gap; once fetched it is an ordinary per-kWh adjustment. Until then the resolved marginal $/kWh is understated for every customer on this schedule.",
 "Standby Service Charge (Sheet R-TOD-3, Section IV.D): $9.121 per kW of Contract Capacity per month effective January 1, 2027, for customers whose on-site generation has a combined nameplate rating under 100 kW and is connected to SMUD's system, waived only for qualifying NEM1 and SSR renewable generation. Not modeled anywhere in the corpus. Expressible under v0.5.1: urpx:standbyCharge is absent at v0.2.1 and present from v0.3.0, and pairs with unitOfMeasure urpx:kW, measurementKind urpx:demand and intervalDuration P1M. This is work, not a blocker; it belongs in a smud/standby RatePlanModifier filing.",
 "Residential Three-Phase Service Option (Sheet R-TOD-4, Section IV.H): Special Facilities fee of $59.70 per month effective January 1, 2027, billed in addition to the System Infrastructure Fixed Charge, where three-phase service is available. Not modeled. Structurally identical to the SIFC this filing already carries (chargeType urpx:facilities, intervalDuration P1M) and was equally expressible at v0.2.1, so this is work rather than a blocker; it belongs in a smud/three-phase RatePlanModifier filing because Section IV.H makes the fee conditional.",
 "Proration of the System Infrastructure Fixed Charge (Sheet R-TOD-5, Section VI.A): the $27.80 monthly charge is prorated on the relationship between the billing period length and 30 days whenever the period is shorter than 27 days, and is determined by the billing period end date; the electricity usage charge is never prorated. The model carries the charge flat at intervalDuration P1M with no proration. urpx:prorationMethod exists as a free-text xsd:string, maxCount 1, on BillingModel, and has been there since v0.2.1 with zero corpus uses, so the sentence can be recorded but the arithmetic cannot be computed.",
 "Section I states this schedule's premises-type applicability and a compulsory-enrollment rule, and the EligibilityRule tests only hasCustomerKind = residentialKind. Verbatim: \"This Rate Schedule R-TOD applies to single- and three-phase service for the following types of residential premises: 1. Individual or dual metered residences with digital communicating meter installed, including single-family homes, duplexes, apartments, and condominiums; and 2. General farm service where the meter also serves the residence or additional meters on a farm where the electricity consumed is solely for domestic purposes. 3. Customers who have an eligible renewable electrical generation facility under Rate Schedules NEM1 or SSR that was approved for installation by SMUD on or after January 1, 2018, or who establish service at a premises that has an electrical generation facility that is fueled by a renewable fuel source on or after January 1, 2018 must be on this Rate Schedule R-TOD.\" And: \"Master-metered service to a qualifying multifamily accommodation or mobile home parks are not eligible for Time-of-Day rates under rate schedule R-TOD.\" The assessment records these as \"left in prose\"; they are a part of the source document that is not modeled.",
