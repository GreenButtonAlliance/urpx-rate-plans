 Sheet R-TOD-4 (Standby + Special Metering + Three-Phase + Time-of-Day
 Billing Periods + holidays)
 Sheet R-TOD-5 (Billing — proration rules)

The single Board resolution adopts a multi-year rate trajectory with
THREE forward effective-date columns:
 - Effective May 1, 2025 — superseded
 - Effective January 1, 2026 — CURRENT (this filing)
 - Effective January 1, 2027 — future (will be a new RatePlanVersion)

This filing captures the January 1, 2026 column. The same source PDF
is committed verbatim — bytes do not change as effective dates roll
forward; only the column we read changes. Future quarterly retrievals
should re-fetch and re-sha256 in case SMUD republishes the PDF for
another reason.

## Rate values captured (Effective 2026-01-01)

System Infrastructure Fixed Charge: $27.00/meter/month

Electricity Usage Charges (regulatory rate category RT02):
 Summer (Jun 1 - Sept 30):
 Peak $0.3765/kWh (5pm-8pm weekdays excluding holidays)
 Mid-Peak $0.2139/kWh (12pm-5pm + 8pm-12am weekdays excluding holidays)
 Off-Peak $0.1550/kWh (12am-12pm weekdays + all weekends/holidays)
 Non-Summer (Oct 1 - May 31):
 Peak $0.1776/kWh (5pm-8pm weekdays excluding holidays)
 Off-Peak $0.1285/kWh (all other hours including weekends/holidays)
 NO Mid-Peak in non-summer.

## Modeling structure

Asymmetric TOU period count by season (3 periods in summer; 2 periods
in winter — only Peak and Off-Peak, no Mid-Peak). Modeled as 5 distinct
TOUPeriods (3 summer + 2 winter) under 3 TOUTiers (peak / mid-peak /
off-peak). The Mid-Peak tier has only one period (summer). 5 PriceDefinitions
for usage charges keyed by touPeriodNumber 1-5 + 1 PriceDefinition for
SIFC. 6 Prices total.

Holiday handling: Sheet R-TOD-4 Sec V.A names eleven holidays that
take Off-Peak pricing. All eleven are carried as a
urpx:HolidayCalendar (smud:holidays-tod-5-8pm) on the plan elements.
The peak and mid-peak brackets set includeHolidays false and
includeNonHolidays true, and each off-peak period gains one weekday
bracket over exactly the hours they give up (summer noon to midnight,
non-summer 5pm to 8pm) with includeHolidays true and
includeNonHolidays false. A holiday falling on a weekday therefore
resolves to Off-Peak. The schedule gives each holiday's month and
date and no rule for one falling on a weekend, so no
urpx:observanceRule is modeled.

## Modeling deferrals

Deferred to grid-coordination/urpx-rate-plans#15 (SMUD secondary epic):
 - Plug-In Electric Vehicle Credit (-$0.0150/kWh, midnight-6am daily) —
 see Sec II.D of source PDF. EV-owner overlay; modeled as a
 RatePlanModifier in grid-coordination/urpx-rate-plans#15.
 - Energy Assistance Program Rate (EAPR) — Sec IV.A.
 - Medical Equipment Discount Program (MED) — Sec IV.B.
 - Standby Service charge ($8.855/kW for customers with on-site
 generation under 100 kW nameplate) — Sec IV.D.
 - Customer Energy Generation Options (NEM1, SSR) — Sec IV.E.
 - SMUD Renewable Energy Option (voluntary green-power program) —
 Sec IV.F.
 - Special Metering Charge — Sec IV.G.
 - Three-Phase Service Option ($57.95/month special facilities fee) —
 Sec IV.H.

Deferred to other future modeling (not grid-coordination/urpx-rate-plans#15 scope):
 - Hydro Generation Adjustment (HGA) — Sec III.A references separate
 Rate Schedule HGA. Likely an electricity-usage surcharge that
 fluctuates with hydro generation availability. Not yet modeled.

NEM1/SSR mandatory enrollment: Sec I.3 mandates customers with NEM1
or SSR generation facilities approved on/after January 1, 2018 to
take service on R-TOD. Documented in the EligibilityRule description
but not encoded as a separate rule (it's an inclusion rule, not an
exclusion).
"""

