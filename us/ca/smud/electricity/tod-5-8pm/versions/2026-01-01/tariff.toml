notes = "First SMUD schedule modeled in this corpus. Pattern reference: us/ca/sce/electricity/tou-d-4-9pm/versions/2025-11-15/ for non-tiered residential TOU structure. Differences: SMUD has asymmetric TOU period count by season (3 summer, 2 winter — no Mid-Peak in winter), 5pm-8pm peak window (vs SCE's 4pm-9pm), simpler bill structure (no PCIA/CCA split since SMUD is vertically integrated; just 1 usage ledger + 1 service-charge ledger). 6 PriceDefinitions, 6 Prices total. Source PDF is a multi-year rate trajectory adopted by single Board resolution (Resolution 25-06-15) with three forward effective dates (May 2025, Jan 2026, Jan 2027); this filing captures the Jan 2026 column."
