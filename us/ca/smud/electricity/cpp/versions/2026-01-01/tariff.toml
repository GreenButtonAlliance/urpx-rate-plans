# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Sheet R-TOD-3 Sec II.C.4 prices export: \"During CPP Events, energy exported to the grid will be compensated at the CPP Rate Event Price per kWh as shown on www.smud.org\" (the same $0.5000/kWh as the consumption adder at the 2026-05-04 retrieval). The model prices the consumption direction only. This is buildable under v0.5.1, not blocked: a second MetricInput whose MetricSpecification carries urpx:flowDirection urpx:reverse, its own Ledger, PriceDefinition and Price, exactly as smud:ssr already does for SSR export compensation (smud:ssr-ms-energy-export, with the unitPrice of the SSR version in force). A candidate built that way was checked in Sept 2026: it conforms to the v0.5.1 SHACL and leaves the consumption marginal unchanged at $0.1939 for a summer Mid-Peak hour, the export amount sitting on its own reverse-flow Ledger rather than in the per-kWh consumption sum. Open choice when building it: the corpus uses chargeType urpx:creditEnergy for SMUD exports, while urpx:exportCredit is the semantically exact member and has zero corpus uses.",
 "Sheet R-TOD-1 Sec I.C.3 and I.C.4 bound when the Event Price applies, and none of it is in the graph: events of one to four hours, not more than once per day, callable \"during any hour of the day during summer months, including holidays and weekends, up to 50 hours per summer\", announced a day in advance except that \"in the event of a system emergency, announcements may occur the same day\". v0.5.1 cannot state this structurally. urpx-shacl:DynamicPricingShape and urpx-shacl:PriceUpdateRuleShape are both sh:closed, the latter over name, description and priority only, so the trigger can only be prose; and the ontology has no event or event-calendar class (a SPARQL scan for \"event\" returns only urpx:OrganizationEvent, urpx:eventDrivenPricing and urpx:eventTriggeredUpdates). Consequence for a consumer: nothing distinguishes an Event hour from an ordinary summer hour, so SMUD's published event calendar has to be applied outside the model, and the model cannot bound a customer's annual event exposure. The month Jun-Sept ApplicabilityRule on the Event Charge Price is the only structural gate present.",
 "Sheet R-TOD-1 Section I.C.2 caps availability of this rate and the shipped deferral recording it should be kept. Verbatim: \"A maximum of 30,000 customers may be enrolled in this rate at any given time.\" The v0.5.1 ontology has no enrollment-cap property, so this is a blocked deferral. The assessment dropped it on the ground that it \"governs who may enroll, not what anyone is charged\", which is the reading LAYOUT.md section 4.4 does not support.",
 "Sheet R-TOD-1 Section I.C.1 states both the availability gate and a compulsory-enrollment rule, and the shipped deferral recording the second should be kept. Verbatim: \"The CPP rate is available for customers who are participating in a qualifying program. Customers that have accepted a storage incentive under certain Solar and Storage Rate incentive programs are required to enroll in this rate for a duration as determined by SMUD program rules posted on www.smud.org.\" The EligibilityRule carries residential customer kind AND Program Enrollment = CPP, so the qualifying-program predicate is a paraphrase and the storage-incentive mandate is absent.",
 "Sheet R-TOD-3 Section II.C.5 states the update cadence of the three amounts this filing models: the CPP Rate Event Price and discount \"will be updated annually at SMUD's discretion and posted on www.smud.org\". The DynamicPricing node and its single PriceUpdateRule carry no updateFrequency and no priceSource for it, and the filing's only DataSourceReference names the PDF, which publishes none of the three dollar values.",
]

# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "first filing of SMUD RTC1 (Optional Critical Peak Pricing Rate). Same source PDF + Board Resolution as RT02 + RTL1; modeled as RatePlanModifier (RTC1 has no own base rate trajectory per Sec II.C.1). 3 PriceDefinitions: Event Charge ($+0.5000/kWh, hasDynamicPricing with dynamicPricingType=criticalPeakPricing + updateFrequency=eventTriggeredUpdates + a PriceUpdateRule whose description carries the trigger semantics; complemented by ApplicabilityRule.month=Jun-Sept for structural seasonal gating); Mid-Peak Discount ($-0.0200/kWh, touPeriodNumber=2 matching RT02/RTL1 Summer Mid-Peak); Off-Peak Discount ($-0.0200/kWh, touPeriodNumber=3 matching RT02/RTL1 Summer Off-Peak). Refactored 2026-05-04 from CustomOperandNode 'Is CPP Event Today' to canonical hasDynamicPricing pattern after pulling urpx-org/urpx commit 55584e2 (which surfaced the PG&E B6-PDP example demonstrating the pattern). Source PDF carries regulatory framework only; Event Price + Discount values from SMUD residential rates HTML page (cited as landing_page): same shared-source split-page pattern as LADWP EZ-Save and Lifeline. applicableToRatePlan: 2 R-TOD bases (tod-5-8pm, tod-low-use). compose ✓ × 2 (smud:tod-5-8pm → 3 ledgers, marginal=0.3765 = base RT02 Summer Peak alone, recorded in dev/baseline/marginal-rates.edn); the $0.5000 Event Charge carries hasDynamicPricing for the event window rather than an hour-of-day gate, so it is not in that marginal; the two discounts sit on touPeriodNumber=2 and =3, which the base is not in at a Peak hour."
