# Extraction ------------------------------------------------------------------
[extraction]
tool = "manual"
extracted_on = "2026-05-04"
notes = """
first filing of SMUD's Optional Critical Peak Pricing Rate (regulatory rate category RTC1). Sister modifier to the default Time-of-Day (5-8 p.m.) Rate (RT02, smud:tod-5-8pm) and Time-of-Day Low Use Rate (RTL1, smud:tod-low-use) under the shared Rate Schedule R-TOD umbrella. Modeled as a urpx:RatePlanModifier (not a separate base RatePlan) because Sec II.C.1 explicitly states: 'The CPP Rate base prices per time-of-day period are the same as the prices per time-of-day period for TOD (5-8 p.m.).' RTC1 doesn't have its own base rate trajectory: it's an overlay (discount + Event Charge) on top of either RT02 or RTL1. Pattern reference: us/ca/sce/electricity/tou-d-prime-cpp/versions/2026-03-20/ (SCE PRIME-CPP, also modeled as a RatePlanModifier with per-Price ApplicabilityRule on 'Is CPP Event Today' CustomOperandNode). ## Source split: PDF vs HTML page The R-TOD source PDF (Sec II.C, III.C) carries the regulatory framework: eligibility (Sec I.C), enrollment cap (30,000), event window rules (1-4 hours, max 1/day, summer only, day-ahead announce, 50 hr/summer cap, system-emergency same-day exception), discount applicability (Mid-Peak + Off-Peak summer months only), and Event Charge applicability (energy charged + Event Price during Events; exports compensated at Event Price). The PDF does NOT carry the actual Event Price or Discount values: 'The CPP Rate Event Price and discount will be updated annually at SMUD's discretion and posted on www.smud.org' (Sec III.C.5). Current values (per SMUD residential rates HTML page, retrieved 2026-05-04): CPP Event Price: +$0.5000/kWh (during Events) Summer Mid-Peak Discount: -$0.0200/kWh ($0.2139 → $0.1939) Summer Off-Peak Discount: -$0.0200/kWh ($0.1550 → $0.1350) Summer Peak rate: unchanged at $0.3765/kWh Non-summer pricing: same as RT02 (no CPP modification) The HTML page is cited as the modifier's authoritative price source (landing_page in [source]); the PDF carries the regulatory framework but is not the dollar-value source. ## Modeling shape 3 PriceDefinitions on 3 separate Ledgers: 1. CPP Event Charge: chargeType=adjustmentPowerCost, $+0.5000/kWh - ApplicabilityRule.month = Jun-Sept (structural seasonal gate) - hasDynamicPricing: dynamicPricingType = urpx:criticalPeakPricing updateFrequency = urpx:eventTriggeredUpdates hasPriceUpdateRule = description prose carrying the trigger semantics (called by SMUD ops, day-ahead, max 1/day, 1-4hr each, 50hr/summer cap, system-emergency same-day exception, bidirectional event-window pricing) priceSource intentionally omitted: SMUD operates as its own Balancing Authority while participating in CAISO-operated markets (EIM, EDAM); none of the v0.2.0 PriceSourceValue enum members (algorithmicSource / capacityAuctionSource / demandForecastSource / gasIndexSource / manualOverrideSource / renewableForecastSource / wholesaleMarketSource) cleanly fits a SMUD-operations-discretion event-call model. Closest fits would be demandForecastSource or manualOverrideSource. Small upstream observation; not blocking. 2. Summer Mid-Peak Discount: chargeType=creditEnergy, $-0.0200/kWh touPeriodNumber=2 (matches base RT02 / RTL1 Summer Mid-Peak). No ApplicabilityRule on the Price (gating is via touPeriodNumber). 3. Summer Off-Peak Discount: chargeType=creditEnergy, $-0.0200/kWh touPeriodNumber=3 (matches base RT02 / RTL1 Summer Off-Peak). No ApplicabilityRule on the Price (gating is via touPeriodNumber). ## Pattern: hasDynamicPricing replaces CustomOperandNode Originally (commit f9abbb6) the Event Charge was modeled with an ApplicabilityRule carrying a CustomOperandNode 'Is CPP Event Today' = true gate, a self-invented predicate. The 2026-05-04 pull of urpx-org/urpx v0.2.0-candidate (commit 55584e2, which added 4 example instances under documentation/examples/) surfaced the canonical PG&E B6-PDP example (Peak Day Pricing). It demonstrates the urpx:hasDynamicPricing + urpx:DynamicPricing + urpx:PriceUpdateRule + urpx:DynamicPricingTypeValue (with criticalPeakPricing) machinery, vocabulary that has been in the v0.2.0 ontology + SHACL since the initial commit but which we missed. Refactored this filing to use that canonical pattern. The Event Charge Price now carries hasDynamicPricing for the event-driven semantics plus a complementary ApplicabilityRule.month for seasonal gating. CustomOperandNode 'Is CPP Event Today' removed. The Event Charge carries its event trigger on hasDynamicPricing and no structural hour-of-day gate, so at the 2026-07-15 17:00 PDT probe instant the recorded marginal is $0.3765, the base RT02 Summer Peak alone, with the discounts correctly excluded at Peak hour and the Event Charge not counted in it. An earlier note here recorded $0.8765; that figure is not reproducible, and dev/baseline/marginal-rates.edn, summer-weekday-peak carries the current one. The event-day amount is that marginal plus the $0.5000 Event Charge. The discount touPeriodNumbers are DELIBERATELY chosen to match the base RatePlan's Summer Mid-Peak and Off-Peak period numbers (RT02 and RTL1 share the same touPeriodNumber assignments since RTL1 was script-derived from RT02). This is the same cross-RatePlan touPeriodNumber convention used by smud:pev-credit (which uses touPeriodNumber=1 for the midnight-6am window, see pev-credit description for the convention discussion). ## Pricing at the validator probe instant The validator probes at 2026-07-15 17:00 PDT (Tuesday Summer Peak hour). With this modifier composed against smud:tod-5-8pm: marginal = $0.3765/kWh = $0.3765 (RT02 Summer Peak) alone. The $0.5000 CPP Event Charge sits on its own Ledger and carries hasDynamicPricing rather than an hour-of-day gate, so it is not part of that marginal. An event-day amount is that marginal plus $0.5000, and which summer hours are Event hours comes from SMUD's event calendar at billing time, not from the graph. The Summer Mid-Peak and Off-Peak Discounts (touPeriodNumber=2 and =3) correctly do NOT apply at 17:00 because the base RT02 is in period 1 (Summer Peak) at that time. They apply at Mid-Peak / Off-Peak hours during summer months. Nothing in the graph distinguishes an Event hour from an ordinary summer hour: the Event Charge Price carries only the Jun-Sept month gate, and the rest of the trigger is prose on the PriceUpdateRule, so a consumer applies the event calendar itself at billing time. ## What this modifier does NOT capture (deferred) 1. **CPP Event Charge applicability inside the Event window**: 'Is CPP Event Today' is a per-day flag; within an Event day the charge applies only during the called window (1-4 hours). Modeled here as month + day-flag; intra-day window not captured. Consumer must additionally filter to the actual event window. 2. **30,000-customer enrollment cap**: modeled in EligibilityRule description prose only. 3. **Storage-incentive mandatory-enrollment**: the SSR storage-incentive-recipient mandatory-CPP-enrollment chain (Sec I.C.1) is documented in description prose but not encoded as a structured cross-modifier dependency. 4. **Energy-export-during-Events compensation**: the +$0.5000/kWh applies bidirectionally (consumed energy charged, exported energy compensated at the same value during Events). Modeled here as a forward-only Energy charge; the export-compensation symmetry is documented in description prose but not encoded as a separate flowDirection-aware Price. 5. **Annual price update cadence**: the Event Price and Discount values 'will be updated annually at SMUD's discretion'. Each annual update should be a new RatePlanModifierVersion; captured here only for the 2026-01-01 baseline.
"""

