[modeling]
complete = false
deferrals = [
 "Section V.D export credit value, Sheet NEM1-2: \"If, in any regular billing month, the electricity supplied by SMUD is less than the electricity supplied to SMUD by the customer's eligible generation system, the customer will receive retail-valued electricity credits for the excess electricity supplied to SMUD.\" Built: this filing carries twelve credit Prices, each with urpx:multiplier -1 and a single urpx:basedOnPrice, and together they name smud:price-energy-summer and smud:price-energy-non-summer on smud:fixed, the five usage Prices of smud:tod-5-8pm and the five -rtl1 usage Prices of smud:tod-low-use. A single Price naming all twelve bases would leave the base a cell mirrors unidentified on a TOU base. The open questions are the credited quantity, the per-period attribution and the scope of 'retail-valued', each recorded in its own entry below.",
 "Section II generator standby charge waiver, Sheet NEM1-1: \"Customers who qualify for Net Energy Metering (NEM) are exempt from generator standby charges on that portion of their load that is served by the NEM eligible facility.\" The charge is $8.855 per kW of Contract Capacity per month effective 2026-01-01, published in Rate Schedule R-TOD Sheet R-TOD-3 Section IV.D and Rate Schedule R Sheet R-2 Section IV.E, and is unmodeled in all three SMUD base filings, whose own coverage claims name it. So the waiver has no Price to attach to: a corpus gap, not a vocabulary gap. urpx:standbyCharge exists as a ChargeTypeValue at v0.5.1 and a waiver Price using multiplier -1 with basedOnPrice validates once the base Price is present. Unsettled: NEM1 waives only for the NEM-served portion of load while the base schedules waive outright for qualifying renewable generation under NEM1 and SSR, and R-TOD IV.D adds that the charge reaches customers self-supplying \"as a microgrid service, where SMUD provides only backup electricity\". A proportional waiver is not a flat -1, and the two documents do not reconcile.",
 "Section VI.A annual net surplus payment, Sheet NEM1-3: SMUD buys net surplus generation at the end of each 12-month settlement period at a per-kWh value based on the most recently published SMUD budget, and Section VI.A.5 publishes the scalar on smud.org by December 20 before the year it applies. The schedule gives the method and no dollar figure, and this corpus does not hold the published value. A source gap, not a vocabulary gap. v0.5.1 can declare the charge and mark it externally sourced via urpx:hasPriceDefinitionReference with referenceInclusion urpx:retrievedElsewhere, which validates on this filing but records where the value is published rather than carrying the value itself.",
 "Section VI 12-month settlement period, Sheet NEM1-2 and NEM1-3: monthly credits carry forward within a 12-month settlement window and \"any unused accumulated monthly retail electricity credits may be zeroed out\" at its end. The duration is expressible now as urpx:settlementInterval \"P12M\" on smud:nem1-ledger-net-credit, the exact use the property's own skos:note gives as its example (\"Enables multi-period accumulation. Example: P12M for NBT 12-month true-up\"), and it validates on this filing. Two parts stay unmodeled: the customer-specific anchor date on which the period begins (move-in date for existing systems, first day of operations after grid-connection approval for new installations), which is per-customer state rather than a tariff datum, and the discretionary zeroing at period end.",
 "Sections VI.A.1 and VI.B settlement election, Sheet NEM1-3: at the end of the settlement period the customer elects a monetary payment for the net surplus, a roll-over of the surplus kWh into the next 12-month period, or an opt-out that forgoes all compensation and retains the renewable electricity credits. None of it is modeled. urpx:hasProfileAlternatives is the candidate shape and is consumer-read, but every corpus use of it is a choice among rate options at enrollment rather than an election at settlement, and it has not been tried here.",
 "Section V.D restriction, Sheet NEM1-2: \"Retail-valued electricity credits will only be credited against electricity usage charges.\" Not modeled, and not expressible at v0.5.1: no property scopes which charges a credit may offset. PriceShape, PriceDefinitionShape and LedgerShape are sh:closed; among their properties urpx:basedOnPrice is the only one that names another charge, and it computes a value rather than bounding where the credit lands, while urpx:billPortion labels the credit's own portion of the bill. The same shape recurs at smud:ssr Section VII.B and is one of the corpus's recurring cap-on-credit cases.",
 "Scope, not a gap: Sheet NEM1-1 Section I applies this schedule to residential, commercial/industrial and agricultural customers, and this filing models residential only via smud:er-nem1-residential. Recorded so the narrowing is visible. Section V.B's monthly-or-annual payment election and Section V's definition of a month as \"a single billing period of 27 to 34 days\" price nothing and are noted here rather than carried as separate entries.",
 "Section VII, Residential Rate Requirement, was read here as excluding smud:fixed from applicableToRatePlan, and that reading was wrong because it stopped one clause short. Schedule R Sheet R-1 Section I.A.3, verified in this corpus's own committed smud_fixed_2026-01-01.pdf: 'Customers who qualify for Rate Schedule NEM1 and have an eligible renewable electrical generation facility that was approved for installation prior to January 1, 2018 are eligible to enroll in the Fixed Rate and may remain on the Fixed Rate after December 31, 2022.' I.A.4 excludes only the on-or-after-2018 cohort, and the earlier reading cited I.A.4 alone. So smud:fixed belongs among the targets, for the pre-2018 cohort, and all three applicableToRatePlan entries stand",
 "Section I's closing and transition provisions bound the version's own reach and are unmodeled beyond the single pre-2022-03-01 interconnection test. Verbatim: \"This Rate Schedule NEM1 will be closed to new customers as of March 1, 2022, except for those customers that are subject to the transition period described under Section II. Transitional Conditions of Rate Schedule SSR.\" \"All NEM1 Customers will be transitioned to Rate Schedule SSR as early as January 1, 2031, as technically feasible.\" The model also carries no established-service test, although Section I requires customers to have \"established service at their premises prior to March 1, 2022\" in addition to the interconnection-approval date the model does encode.",
 "Section V.D export credit, BUILT IN FULL as of 2026-09-23. Twelve urpx:multiplier -1 Prices carry it, each naming exactly one urpx:basedOnPrice: ten for the R-TOD bases across five credit PriceDefinitions carrying urpx:touPeriodNumber 1 to 5, and two for smud:fixed across two credit PriceDefinitions carrying inline month ApplicabilityRules, 06-09 and 10-05, mirroring how smud:pd-energy-summer and smud:pd-energy-non-summer discriminate on the base. The placeholder Price with unitPrice 0 is gone; a unit price of 0 prices a zero credit rather than an absence. Measured after building, composed against smud:fixed: at 2026-07-15T17:00-07:00 the export ledger returns -0.2189 with the other eleven cells unvaluable, and at 2026-12-15T17:00-08:00 it returns -0.1371, so exactly one of the two seasonal cells applies per instant and the month gate is doing the work. Consumption marginals unchanged at 0.2189 and 0.1371.",
 "The credited QUANTITY is still wrong, and writing the rate did not fix it. Section V.D credits the monthly net excess, the amount by which electricity supplied to SMUD exceeds electricity supplied by SMUD over a billing month. This filing's smud:nem1-mi-energy-export declares gross reverse flow, which is Schedule SSR's quantity: SSR Sheet SSR-2 Section VI defines Export as 'all kWh registered on the customer bi-directional meter as delivered to SMUD' and NEM1 carries no such definition. Gross-in/gross-out equals netting only when the import and export rates are equal, which on a time-of-day base they are not. A reader seeing structured credits will reasonably conclude the NEM math is complete; it is not, and this is its own gap rather than part of the credit build.",
 "Attributing the credit to the time-of-day period the export occurred in is this filing's inference, not a transcription of the schedule. Section V.D names no period, season or tier, and the words 'time-of-day', 'season' and 'tier' do not occur in NEM1 at all. SMUD writes an explicit per-interval export price when it means one: R-TOD Sheet R-TOD-3 Section II.C.4 reads 'During CPP Events, energy exported to the grid will be compensated at the CPP Rate Event Price per kWh'. NEM1 has no counterpart. The ten cells are built on the reading that a retail-valued credit follows the retail rate in force when the export happened, which is the only reading that makes a per-period base selectable, but the schedule does not say it.",
 "The scope of 'retail-valued' is the narrower of two readings, stated here rather than left implicit. The twelve cells mirror the Electricity Usage Charge alone. Both R-TOD base schedules also carry a Hydro Generation Adjustment under a heading reading 'Electricity Usage Surcharges ... that apply to all kWh', and Schedule HGA is not committed to this corpus, so if 'retail-valued' reaches that surcharge the credits under-credit by an amount this corpus cannot currently measure.",
 "How to read the ten unvaluable entries a smud:fixed composition returns on the export ledger. They say 'this export credit is not defined at this instant for this composition', which is a true statement about the export side and inert for any import question: all twelve credit Prices here sit on smud:nem1-ledger-net-credit, whose only metric input is the reverse-flow smud:nem1-mi-energy-export, so none of them prices a consumed kWh. Treat them as signal when reading the export ledger: they are the only place the per-base self-scoping is visible, and they are how the ten cells here were verified.",
 "Checked against THIS corpus and clear here, which is the whole of the claim: zero modifier filings here carry a PriceSummary or PriceDefinition with urpx:appliesInSeason at all, so the season-gated modifier shape tracked on URPX-2a6 is absent from the data whoever reads it.",
]

# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "Second SMUD RatePlanModifier filing, after SSR. Eligibility per the schedule: residential service, an interconnection approval date before 2022-03-01 under the closed-to-new clause, a qualifying renewable generator (solar, wind or hydro, with biomass, geothermal, fuel cells, digester gas, municipal solid waste, landfill gas, ocean and tidal carried as a custom type; NEM1 does not cover storage-only customers, unlike SSR), capacity at or below 3,000 kW, and no storage incentive received under a qualifying SMUD program. The export credit mirrors each base schedule's own energy charge through urpx:basedOnPrice at urpx:multiplier -1, which is the shape upstream discussion #63 settled: a credit written against a base plan that is not in the call comes back an unresolved reference rather than a wrong number, so the cells self-scope across the three bases this rider applies to. Measured at 2026-07-15T17:00 Pacific, each composition's consumption marginal is unchanged, because the credit prices only the reverse-flow smud:nem1-mi-energy-export and never a consumed kWh. What the schedule does not settle is the scope of retail-valued, which is the subject of the first deferral. Source PDF: SMUD's older 1-NEM1.ashx URL serves the pre-revision Resolution 19-06-13 document effective 2021-01-01; the canonical current revision is at 01_NEM1.ashx, Resolution 21-09-07, effective 2021-09-17, which is this filing. See the dual-URL discussion in utility.toml."
