status = "draft"
notes = "Second SMUD RatePlanModifier filing (after SSR). Pattern reference: us/ca/ladwp/electricity/nem/versions/2008-09-01/ for the placeholder-Price + reverse-flow-MetricInput modifier shape (closest analog — both modifiers compensate at the customer's own base-plan rate and both ship a placeholder Price in place of it). Four EligibilityRules: residential customer + interconnection-approval-date <2022-03-01 (closed-to-new clause) + 4-way OR over qualifying renewable DER types (solar/wind/hydro + custom-other-renewable for biomass/geothermal/fuel cells/digester gas/MSW/landfill gas/ocean/tidal — NEM1 does not cover storage-only customers, unlike SSR) + capacity ≤3,000 kW. Single PriceDefinition with placeholder Price unitPrice='0'. Open question tracked at urpx-org/urpx discussion #63 (how a modifier scopes a credit priced at the customer's own base-plan rate when it applies to several base plans; LADWP NEM has the same shape over two bases, this one over three). NOTE on source PDF: SMUD's older `1-NEM1.ashx` URL serves the pre-revision Resolution 19-06-13 PDF (effective 2021-01-01); the canonical current revision is at `01_NEM1.ashx` (Resolution 21-09-07, effective 2021-09-17, this filing) — see utility.toml dual-URL discussion."
