[modeling]
complete = false
deferrals = [
 "Section V.D export credit value, Sheet NEM1-2: \"If, in any regular billing month, the electricity supplied by SMUD is less than the electricity supplied to SMUD by the customer's eligible generation system, the customer will receive retail-valued electricity credits for the excess electricity supplied to SMUD.\" The filing ships one Price with unitPrice \"0\", which clj-urpx 0.32.0 resolves as a zero credit rather than refusing (measured: the ledger returns unit-price 0M with no :unvaluable), so the placeholder asserts a wrong number instead of an absence. Expressible now as one Price per base cell using urpx:multiplier with a single urpx:basedOnPrice; all 12 candidate bases exist in this corpus (smud:price-energy-summer and smud:price-energy-non-summer on smud:fixed, the five usage prices on smud:tod-5-8pm, the five -rtl1 usage prices on smud:tod-low-use), and one Price naming all 12 would return :ambiguous-basis on a TOU base, so build the cells. Three corrections to the build. The multiplier must be -1: every export credit in this corpus is negative on a credit or discount PriceDefinition, so multiplier 1 would ship the credit with the wrong sign. The discriminator to mirror is urpx:touPeriodNumber, not urpx:appliesInSeason: R-TOD folds season into touPeriodNumber 1-5 on the PriceDefinition and smud:fixed discriminates its two seasonal energy prices with hasApplicabilityRule month lists, and driven through the pin touPeriodNumber selects the right cell across documents (-0.3765 at R-TOD summer peak, -0.1550 at summer off-peak, -0.1776 at winter peak, -0.4154 against Low Use summer peak, -0.2189 against Fixed in summer), with non-matching cells returning :unresolved-reference. But the ten TOU cells are the buildable part: on the modifier path clj-urpx 0.32.0 filters PriceDefinitions with pd-active-at-tou? only, so appliesInSeason and month rules are both inert there, and the two smud:fixed cells surface in July and again in January whichever property carries the season, which double-counts the credit on that ledger. Finally, \"retail-valued\" is nowhere defined in this schedule; reading it as the base energy charge is an inference, and Rate Schedule R Section III adds a second per-kWh component, the Hydro Generation Adjustment, whose rate lives in Rate Schedule HGA and is not in this corpus, so a build over energy charges alone encodes one reading and silently omits a surcharge.",
 "Section II generator standby charge waiver, Sheet NEM1-1: \"Customers who qualify for Net Energy Metering (NEM) are exempt from generator standby charges on that portion of their load that is served by the NEM eligible facility.\" The charge is $8.855 per kW of Contract Capacity per month effective 2026-01-01, published in Rate Schedule R-TOD Sheet R-TOD-3 Section IV.D and Rate Schedule R Sheet R-2 Section IV.E, and is unmodeled in all three SMUD base filings, whose own coverage claims name it. So the waiver has no Price to attach to: a corpus gap, not a vocabulary gap. urpx:standbyCharge exists as a ChargeTypeValue at v0.5.1 and a waiver Price using multiplier -1 with basedOnPrice validates once the base Price is present. Unsettled: NEM1 waives only for the NEM-served portion of load while the base schedules waive outright for qualifying renewable generation under NEM1 and SSR, and R-TOD IV.D adds that the charge reaches customers self-supplying \"as a microgrid service, where SMUD provides only backup electricity\". A proportional waiver is not a flat -1, and the two documents do not reconcile.",
 "Section VI.A annual net surplus payment, Sheet NEM1-3: SMUD buys net surplus generation at the end of each 12-month settlement period at a per-kWh value based on the most recently published SMUD budget, and Section VI.A.5 publishes the scalar on smud.org by December 20 before the year it applies. The schedule gives the method and no dollar figure, and this corpus does not hold the published value. A source gap, not a vocabulary gap. v0.5.1 can declare the charge and mark it externally sourced via urpx:hasPriceDefinitionReference with referenceInclusion urpx:retrievedElsewhere, which validates on this filing, but clj-urpx 0.32.0 reads none of that vocabulary, so it would be declarative only.",
 "Section VI 12-month settlement period, Sheet NEM1-2 and NEM1-3: monthly credits carry forward within a 12-month settlement window and \"any unused accumulated monthly retail electricity credits may be zeroed out\" at its end. The duration is expressible now as urpx:settlementInterval \"P12M\" on smud:nem1-ledger-net-credit, the exact use the property's own skos:note gives as its example (\"Enables multi-period accumulation. Example: P12M for NBT 12-month true-up\"), and it validates on this filing. Declarative only at the pin: settlementInterval has zero occurrences in clj-urpx 0.32.0. Two parts stay unmodeled: the customer-specific anchor date on which the period begins (move-in date for existing systems, first day of operations after grid-connection approval for new installations), which is per-customer state rather than a tariff datum, and the discretionary zeroing at period end.",
 "Sections VI.A.1 and VI.B settlement election, Sheet NEM1-3: at the end of the settlement period the customer elects a monetary payment for the net surplus, a roll-over of the surplus kWh into the next 12-month period, or an opt-out that forgoes all compensation and retains the renewable electricity credits. None of it is modeled. urpx:hasProfileAlternatives is the candidate shape and is consumer-read, but every corpus use of it is a choice among rate options at enrollment rather than an election at settlement, and it has not been tried here.",
 "Section V.D restriction, Sheet NEM1-2: \"Retail-valued electricity credits will only be credited against electricity usage charges.\" Not modeled. No property was found in the v0.5.1 shapes that scopes which charges a credit may offset, but the search was a failed search rather than a proof, so this is unsettled rather than established as a vocabulary gap. The same shape recurs at smud:ssr Section VII.B and is one of the corpus's recurring cap-on-credit cases.",
 "Scope, not a gap: Sheet NEM1-1 Section I applies this schedule to residential, commercial/industrial and agricultural customers, and this filing models residential only via smud:er-nem1-residential. Recorded so the narrowing is visible. Section V.B's monthly-or-annual payment election and Section V's definition of a month as \"a single billing period of 27 to 34 days\" price nothing and are noted here rather than carried as separate entries.",
 "Section VII, Residential Rate Requirement, was read here as excluding smud:fixed from applicableToRatePlan, and that reading was wrong because it stopped one clause short. Schedule R Sheet R-1 Section I.A.3, verified in this corpus's own committed smud_fixed_2026-01-01.pdf: 'Customers who qualify for Rate Schedule NEM1 and have an eligible renewable electrical generation facility that was approved for installation prior to January 1, 2018 are eligible to enroll in the Fixed Rate and may remain on the Fixed Rate after December 31, 2022.' I.A.4 excludes only the on-or-after-2018 cohort, and the earlier reading cited I.A.4 alone. So smud:fixed belongs among the targets, for the pre-2018 cohort, and all three applicableToRatePlan entries stand",
 "Section I's closing and transition provisions bound the version's own reach and are unmodeled beyond the single pre-2022-03-01 interconnection test. Verbatim: \"This Rate Schedule NEM1 will be closed to new customers as of March 1, 2022, except for those customers that are subject to the transition period described under Section II. Transitional Conditions of Rate Schedule SSR.\" \"All NEM1 Customers will be transitioned to Rate Schedule SSR as early as January 1, 2031, as technically feasible.\" The model also carries no established-service test, although Section I requires customers to have \"established service at their premises prior to March 1, 2022\" in addition to the interconnection-approval date the model does encode.",
 "Section V.D export credit, BUILT IN FULL as of 2026-09-23. Twelve urpx:multiplier -1 Prices carry it, each naming exactly one urpx:basedOnPrice: ten for the R-TOD bases across five credit PriceDefinitions carrying urpx:touPeriodNumber 1 to 5, and two for smud:fixed across two credit PriceDefinitions carrying inline month ApplicabilityRules, 06-09 and 10-05, mirroring how smud:pd-energy-summer and smud:pd-energy-non-summer discriminate on the base. The placeholder Price with unitPrice 0 is gone; it resolved as a zero credit rather than as an absence. The two smud:fixed cells were held until clj-urpx 0.32.0 because through 0.31.0 the modifier path filtered PriceDefinitions by TOU period alone, so month-gated credits were inert there and both would have surfaced at once. Measured after building, composed against smud:fixed: at 2026-07-15T17:00-07:00 the export ledger returns -0.2189 with the other eleven cells unvaluable, and at 2026-12-15T17:00-08:00 it returns -0.1371, so exactly one of the two seasonal cells applies per instant and the month gate is doing the work. Consumption marginals unchanged at 0.2189 and 0.1371.",
 "The credited QUANTITY is still wrong, and writing the rate did not fix it. Section V.D credits the monthly net excess, the amount by which electricity supplied to SMUD exceeds electricity supplied by SMUD over a billing month. This filing's smud:nem1-mi-energy-export declares gross reverse flow, which is Schedule SSR's quantity: SSR Sheet SSR-2 Section VI defines Export as 'all kWh registered on the customer bi-directional meter as delivered to SMUD' and NEM1 carries no such definition. Gross-in/gross-out equals netting only when the import and export rates are equal, which on a time-of-day base they are not. A reader seeing structured credits will reasonably conclude the NEM math is complete; it is not, and this is its own gap rather than part of the credit build.",
 "Attributing the credit to the time-of-day period the export occurred in is this filing's inference, not a transcription of the schedule. Section V.D names no period, season or tier, and the words 'time-of-day', 'season' and 'tier' do not occur in NEM1 at all. SMUD writes an explicit per-interval export price when it means one: R-TOD Sheet R-TOD-3 Section II.C.4 reads 'During CPP Events, energy exported to the grid will be compensated at the CPP Rate Event Price per kWh'. NEM1 has no counterpart. The ten cells are built on the reading that a retail-valued credit follows the retail rate in force when the export happened, which is the only reading that makes a per-period base selectable, but the schedule does not say it.",
 "The scope of 'retail-valued' is the narrower of two readings, stated here rather than left implicit. The twelve cells mirror the Electricity Usage Charge alone. Both R-TOD base schedules also carry a Hydro Generation Adjustment under a heading reading 'Electricity Usage Surcharges ... that apply to all kWh', and Schedule HGA is not committed to this corpus, so if 'retail-valued' reaches that surcharge the credits under-credit by an amount this corpus cannot currently measure.",
 "How to read the ten :urpx.resolved/unvaluable entries a smud:fixed composition now returns. They say 'this export credit is not defined at this instant for this composition', which is a true statement about the export side and inert for any import question. They cannot mislead an import calculation by construction rather than by luck: marginal-unit-rate filters to import ledgers before collecting tiers, so a reverse-flow ledger's tiers never reach the marginal and never reach its unvaluable check, and has-energy-ledger? applies the same filter, so they cannot make a plan look as though it prices nothing per kWh. Confirmed against clj-urpx 0.32.0 by the clj-urpx session. Treat them as signal when reading the export ledger: they are the only place the per-base self-scoping is visible, and they are how the ten cells here were verified.",
 "Checked against THIS corpus and clear here, which is the whole of the claim: the clj-urpx session found that standalone resolve-modifier-prices builds its summary-member gate with empty rule and season indexes, so a PriceDefinition carrying appliesInSeason is always inactive on that path, a silent drop rather than a silent inclusion and the opposite of URPX-2a6. The check that carries the weight is the data: zero modifier filings here carry a PriceSummary or PriceDefinition with appliesInSeason at all, so the triggering shape is absent whoever calls what. The second check is weaker than it first looked and is recorded as such. No code in this repository calls resolve-modifier-prices standalone, every caller going through resolve-prices-with-modifiers, but that is a fact about this repository and not about the library: the clj-urpx session corrected an earlier wording here by noting that resolve-modifier-prices is a documented public entry point of clj-urpx, exercised at 13 call sites across 8 of its own test namespaces, so the finding is live there and the standalone half stays in scope on URPX-2a6. Nothing here should be read as saying otherwise.",
]

# Review ----------------------------------------------------------------------
[review]
status = "draft"
notes = "Second SMUD RatePlanModifier filing, after SSR. Eligibility per the schedule: residential service, an interconnection approval date before 2022-03-01 under the closed-to-new clause, a qualifying renewable generator (solar, wind or hydro, with biomass, geothermal, fuel cells, digester gas, municipal solid waste, landfill gas, ocean and tidal carried as a custom type; NEM1 does not cover storage-only customers, unlike SSR), and capacity at or below 3,000 kW. The export credit mirrors each base schedule's own energy charge through urpx:basedOnPrice at urpx:multiplier -1, which is the shape upstream discussion #63 settled: a credit written against a base plan that is not in the call comes back an unresolved reference rather than a wrong number, so the cells self-scope across the three bases this rider applies to. Measured at 2026-07-15T17:00 Pacific, each composition's consumption marginal is unchanged, because clj-urpx excludes reverse-flow ledgers from a per-kWh import marginal. What the schedule does not settle is the scope of retail-valued, which is the subject of the first deferral. Source PDF: SMUD's older 1-NEM1.ashx URL serves the pre-revision Resolution 19-06-13 document effective 2021-01-01; the canonical current revision is at 01_NEM1.ashx, Resolution 21-09-07, effective 2021-09-17, which is this filing. See the dual-URL discussion in utility.toml."
