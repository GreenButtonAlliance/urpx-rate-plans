notes = "first filing of SMUD EAPR. Single per-meter-per-day credit for the $10/month BSC discount (modeled as -$0.3289/day = $10/30.4 days). Income-tier usage-cap discount deferred (URPX#24). For 150-200% FPL customers (where usage cap = $0), the BSC discount is the ENTIRE EAPR benefit; for 0-50% FPL customers, modeled BSC discount captures ~14% of benefit. Eligibility predicate: 'Program Enrollment' = 'Energy Assistance Program (EAPR)'. applicableToRatePlan: 2 SMUD residential bases (tod-5-8pm, fixed). Stacks additively with MED."
