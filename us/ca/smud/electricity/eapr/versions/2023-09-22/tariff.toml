# Modeling -------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
 "Section III.2, Sheet EAPR-1: a 100 percent reduction in electricity usage cost per kWh, capped at a maximum monthly discount that steps with federal poverty level ($60 at 0-50 percent, $32 above 50 to 100 percent, $10 above 100 to 150 percent, $0 above 150 to 200 percent). This is the larger of the two residential EAPR benefits and is not modeled. Blocked at v0.5.1 in two independent places. First, the dollar denomination of the cap cannot be stated: ServiceBracketShape is sh:closed with lowerBound and upperBound as xsd:decimal and no unit slot, and urpx:unitOfMeasure has rdfs:domain MetricSpecification only, with no currency among the 55 members of UnitOfMeasureValue, so a bound of 60 cannot be said to mean sixty dollars. Second, there is no way to bound a credit by the value of another price. Verified against urpx-org/urpx abdfb521.",
 "Section III.3, Sheet EAPR-1: the EAPR Rate Stabilization Fund additional monthly discount, $0 to $35 per month, available only at 0 to 50 percent of federal poverty level. Not modeled because this filing publishes only the band; the schedule says the Accountant determines the amount annually from available discretionary non-retail rate revenue and fixes it before the year it applies, and no year's figure appears in this PDF. A source gap, not a vocabulary gap. A declarative band via hasDynamicPricing priceFloor and priceCeiling would validate but is read by nothing at clj-urpx 0.25.0.",
 "Section V, Sheet EAPR-2: this schedule prices four discounts outside residential service and none is modeled. Nonprofit accounts on a residential rate receive the maximum residential discount (the schedule does not define that term). Eligible Commercial and Industrial customers receive 15 percent off the Electricity Usage Charge (kWh), Maximum Demand Charge (kW), Site Infrastructure Charge (kW) and Summer Peak Demand Charge (kW) each billing period. CI-TOD1's System Infrastructure Fixed Charge receives 35 percent, and CI-TOD2, CI-TOD3 and CI-TOD4's receive 15 percent. The percentages themselves are expressible (urpx:multiplier with urpx:basedOnPrice on PriceShape, the pattern that resolves for the CARE and FERA discounts), so nothing here is blocked by vocabulary. Whether they count against a residential-focused corpus is an open corpus-level scope ruling: LAYOUT 4.4 scopes complete to the source document, which argues they count, while no SMUD Commercial and Industrial base plan exists here for them to attach to. The ruling belongs in MODELING-GAPS.md and settles sce:da-crs, sce:cca-crs and sdge:care Section 2 at the same time. Section IV (nonprofit eligibility) and Section VI (a cross-reference to Schedule HGA) price nothing and are correctly out of scope.",
 "Section VIII, Sheet EAPR-3: the $10 per month System Infrastructure Fixed Charge discount that this filing does model is prorated for billing periods shorter than 27 days, on the relationship between the length of the billing period and 30 days, while the maximum electricity usage discount is expressly not prorated regardless of the number of days or of spanning seasons. Neither rule is carried. urpx:prorationMethod would state the first: it is xsd:string, 0..1, on BillingModelShape. It is free text, no filing in this corpus uses it, and clj-urpx 0.25.0 accepts it in schema.clj without reading it in price.clj, so recording it would be declarative only.",
 "Section VII, Conditions of Service, states application and verification terms on this schedule that are in no part of the model. Verbatim in part: \"To qualify for EAPR, the customer must complete a SMUD application and submit requested supporting documents. Applications are processed by SMUD or SMUD's designated agent.\" \"Upon request, applicants shall provide proof, satisfactory to SMUD or its designated agent, that they meet the eligibility requirements. Failure to provide proof as requested will be considered just cause for denial to enroll in EAPR.\" The EligibilityRule carries residential customer kind AND Program Enrollment = EAPR.",
 "Section VIII's enrollment and termination timing determines which billing periods the modeled $10 discount applies to and is unmodeled. Verbatim: \"The effective date of EAPR will be the beginning of the billing period in which the request is approved. If participation is terminated, the effective termination date will be the beginning of the billing period in which the request is received or the cancellation date.\" The verification named this explicitly and set it aside as enrollment mechanics.",
]

