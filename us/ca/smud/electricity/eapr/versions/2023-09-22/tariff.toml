 "ERSF Additional Monthly Discount ($0-$35/month for 0-50% FPL only, year-by-year formulaic) — not modeled",
  "Nonprofit Organization eligibility paths (Sec IV-VI) — residential-focus filing; nonprofit out of scope",
]

