# Extraction ------------------------------------------------------------------
[extraction]
tool = "pdftotext"
tool_version = "26.01.0"
extracted_on = "2026-10-17"
notes = """
FLAT-7 is three pages of prose and formulas with no rate table, read with
pdftotext -layout rather than MinerU.

Structure. The sheet prices no unit of service: each premises' FlatBill
Monthly Amount is computed from its own metered usage history, adjusted for
vacancy, normal weather and behavior, priced at Schedule R's charges with
ECCR, DSM-R, FCR and MFF, raised by a Risk Adder of at most 10 percent, and
levelized over the year. The JSON-LD carries that amount as one
usage-independent monthly PriceDefinition with no Price, and the formula and
its eight bill-determination steps in the version description.

Dating. The sheet, page 2.00, revision First, is effective "With Bills
Rendered for the Billing Month of May, 2024". The version begins 2024-05-01,
the billing-month reading IQD-1 uses. The schedule states no date of first
introduction, so urpx:initialEffectiveDate carries this version's date, as
gpc:r does.
"""

