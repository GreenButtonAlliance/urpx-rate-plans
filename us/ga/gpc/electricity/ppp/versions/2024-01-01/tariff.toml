tool_version = "4.0.12"
extracted_on = "2026-10-18"
notes = """
PPP-2 read with mineru-kit parse --tier standard; every value was checked
against the PDF text.

PPP-2, page 6.40, Fifth revision, is effective "January, 2024", read as
2024-01-01; the sheet does not say why it was revised, so urpx:changeReason is
urpx:changeReasonOther. urpx:applicableToRatePlan names RTP-DA and RTP-HA, the
Real Time Pricing schedules whose hourly prices it settles against.

The rider names no docket for this revision, so the base regulator entry names
none.
"""

