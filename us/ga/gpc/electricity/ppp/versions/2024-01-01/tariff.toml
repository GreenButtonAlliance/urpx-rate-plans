# Modeling --------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
  "Contract settlement. The settlement is the contracted quantity times the difference between the guaranteed price and the average of the hourly RTP prices offered over the contracted period, calculated at the period's end. No guaranteed price, quantity or period is published, so the JSON-LD defines the settlement as a PriceDefinition with no Price, and a modeled bill omits it.",
  "Products and eligibility. The sheet offers Standard and Limited Contracts for Differences, periodically, with minimum and maximum purchase amounts set from historical usage, on the customer's RTP-priced load. Eligibility is a custom condition, pricingContract, that a consumer supplies; the rest is in the descriptions.",
]

