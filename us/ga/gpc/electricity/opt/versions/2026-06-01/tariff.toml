# Extraction ------------------------------------------------------------------
[extraction]
tool = "mineru"
tool_version = "4.0.12"
extracted_on = "2026-10-18"
notes = """
OPT-8 read with mineru-kit parse --tier standard; every value was checked
against the PDF text.

OPT-8 was filed with Schedule R-31 in the same compliance filing in docket
44280 (PSC document 227071), replacing OPT-7, so the version begins 2026-06-01
on the reading fifteen Schedule R bills fixed for that filing (see Schedule
R's tariff.toml). Its charge is "added to Basic Service Charge of Current
Rate", carried as a monthly Price on the meter count.
urpx:applicableToRatePlan names every metered Georgia Power schedule in the
corpus; the unmetered and lighting schedules (UD, TC-U, EOL, OLG, OLNG, RLG,
TOU-EOL) are left out.

ECCR-15, DSM-R-16, DSM-C-15 and MFF-11 were read from the PDF text directly;
each takes its percentage of the $25.45 through a multiplier over its Price.
"""

