# Modeling --------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
  "Customer kind and the Demand Side Management schedule. The sheet applies \"the Company's effective Demand Side Management Residential or Commercial Schedule\". The JSON-LD takes DSM-R-16 (1.1969 percent) for a residential customer and DSM-C-15 (1.2676 percent) for any other, by a ProfileAlternatives dimension on urpx:hasCustomerKind; the sheet names no schedule for an Industrial Customer, which takes DSM-C-15 here.",
  "Municipal Franchise Fee base. MFF-11 applies to the total revenues of each bill, which include the ECCR-15 and DSM amounts on this charge. Its multiplier Price here is based on the $25.45 Price alone, so the franchise fee on those two amounts, about 0.44 percent of the charge inside city limits, is not carried.",
  "Term. The charge remains as long as the customer keeps the meter without radio frequency; when the meter requires replacement, or access to read, maintain or test it is denied, it is replaced with an AMI meter and the charge ends. Nothing is priced by it and it is not carried.",
]

