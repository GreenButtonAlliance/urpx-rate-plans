# Extraction ------------------------------------------------------------------
[extraction]
tool = "mineru"
tool_version = "4.0.12"
extracted_on = "2026-10-18"
notes = """
TOU-FD-15 read with mineru-kit parse --tier standard; every rate was checked
against the PDF text. TOU-FCR-TP-5, ECCR-15, DSM-C-15 and MFF-11 were read
from the PDF text directly.

Periods. The sheet and TOU-FCR-TP-5 define On-Peak and Off-Peak by calendar
month, "for the calendar months of June through September (Summer Months)", so
the Seasons here are calendar months and need no billing-month deferral,
unlike FCR-27's. On-Peak hours "on days in which the following holidays are
observed shall be considered Off-Peak: Independence Day and Labor Day"; the
sheet states no weekend rule, and us/ga/gpc/utility.toml records that Georgia
law adopts the federal one, 5 U.S.C. 6103(b), which
urpx:nearestWeekdayObservance states. The On-Peak energy PriceDefinition is
also gated on June through September, the only months it has hours in. TOU-
FD-15 adds a Super Off-Peak period, 11:00 p.m. to 7:00 a.m. every day, and its
Off-Peak hours are 7:00 a.m. to 11:00 p.m. outside On-Peak. TOU-FCR-TP-5's
Applicability names TOU-FD, so FD takes its three-part fuel rates.

Riders. TOU-FCR-TP-5, ECCR-15, DSM-C-15 and MFF-11 are Prices on the base, as
on Schedule R. TOU-FCR-TP-5's Secondary Distribution, Primary Distribution and
Transmission rates and MFF-11's inside and outside city limits rates are
crossed in one ProfileAlternatives set; its voltage dimension is
urpx:voltageLevel, whose values are urpx:secondaryVoltage, urpx:primaryVoltage
and urpx:transmissionVoltage. Each alternative's PriceSetAlternative carries
its own franchise fee energy subtotal, the base energy prices plus its voltage
level's fuel prices.

Eligibility is carried as urpx:nonResidentialKind; the sheet's availability
and applicability are in the rule's description.

Dating. Every sheet is effective "With Bills Rendered for the Billing Month of
June, 2026", except MFF-11 (January 2025). TOU-FD-15 was filed in the same
2026-06-30 compliance filing in docket 44280 (PSC document 227071) that
replaced R-30 with R-31, with a redline against the sheet it replaced, and the
version begins 2026-06-01 on the reading fifteen Schedule R bills fixed for
that filing (see Schedule R's tariff.toml). No TOU-FD bill was available to
check it.

The schedule states no date of first introduction, so
urpx:initialEffectiveDate carries this version's date, as gpc:r does.
"""

