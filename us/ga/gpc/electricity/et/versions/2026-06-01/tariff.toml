# Extraction ------------------------------------------------------------------
[extraction]
tool = "mineru"
tool_version = "4.0.12"
extracted_on = "2026-10-18"
notes = """
ET-23 read with mineru-kit parse --tier standard; every rate was checked
against the PDF text. FCR-27, ECCR-15 and MFF-11 were read from the PDF text
directly.

ET-23 prices all energy by six periods. Periods 2, 5 and 6 run past midnight
(8 p.m. to 1 a.m., 5 a.m. to 1 a.m.), and a TimeBracket covers one calendar
day, so the hour after midnight is carried on the next day, chosen by
urpx:customDays and urpx:daysOfWeek: Tuesday through Saturday's take Period 2
in summer and Period 6 in winter, Sunday and Monday's take Period 5. Periods 1
and 2 have the same price and are kept as two periods, as the sheet numbers
them. Period 4 is priced at 0.0000 cents. The sheet applies ECCR, Fuel Cost
Recovery and the Municipal Franchise Fee and names no Demand Side Management
schedule, so none is carried. Its Type of Service, three phase at 19,800 volts
or higher, is never FCR-27's Secondary Distribution, so the voltage dimension
has two values.

Riders. FCR-27, ECCR-15 and MFF-11 are Prices on the base, as on Schedule R.
FCR-27's Primary Distribution and Transmission rates and MFF-11's inside and
outside city limits rates are crossed in one ProfileAlternatives set; its
voltage dimension is urpx:voltageLevel, whose values are urpx:primaryVoltage
and urpx:transmissionVoltage. Each alternative's PriceSetAlternative carries
its own franchise fee energy subtotal, the base energy prices plus its voltage
level's fuel prices.

Eligibility is carried as urpx:nonResidentialKind; the sheet's availability
and applicability are in the rule's description.

Dating. Every sheet is effective "With Bills Rendered for the Billing Month of
June, 2026", except MFF-11 (January 2025). ET-23 was filed in the same
2026-06-30 compliance filing in docket 44280 (PSC document 227071) that
replaced R-30 with R-31, with a redline against the sheet it replaced, and the
version begins 2026-06-01 on the reading fifteen Schedule R bills fixed for
that filing (see Schedule R's tariff.toml). No ET bill was available to check
it.

The schedule states no date of first introduction, so
urpx:initialEffectiveDate carries this version's date, as gpc:r does.
"""

