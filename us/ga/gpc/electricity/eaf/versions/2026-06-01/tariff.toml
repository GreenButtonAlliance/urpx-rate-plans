# Extraction ------------------------------------------------------------------
[extraction]
tool = "mineru"
tool_version = "4.0.12"
extracted_on = "2026-10-18"
notes = """
EAF-13 read with mineru-kit parse --tier standard; every rate was checked
against the PDF text. ECCR-15 and MFF-11 were read from the PDF text directly.

EAF-13's On-Peak period is defined by calendar month, "for the calendar months
of June through September (Summer Months)", off on the observed Independence
Day and Labor Day, carried as a TOU schedule on the kWh with a holiday
calendar that observes Independence Day on the nearest weekday under 5 U.S.C.
6103(b). Neither energy rate is published: On-Peak kWh take the hourly RTP-DA
price and Off-Peak kWh a customer-specific rate, each a PriceDefinition with
no Price.

Riders. ECCR-15 and MFF-11 are Prices on the base, as on Schedule R: ECCR-15
at 65 percent of its rate, "ECCR shall apply to 65% of the base bill
calculations for bills rendered on the Fixed Pricing Alternative (FPA) and the
Electric Arc Furnace (EAF) tariffs", as a multiplier over each priced charge,
and MFF-11 chosen by an inside or outside city limits ProfileAlternative. No
fuel is priced, so the alternatives have no voltage dimension.

Eligibility is carried as urpx:nonResidentialKind; the sheet's availability
and applicability are in the rule's description.

Dating. Every sheet is effective "With Bills Rendered for the Billing Month of
June, 2026", except MFF-11 (January 2025). EAF-13 was filed in the same
2026-06-30 compliance filing in docket 44280 (PSC document 227071) that
replaced R-30 with R-31, with a redline against the sheet it replaced, and the
version begins 2026-06-01 on the reading fifteen Schedule R bills fixed for
that filing (see Schedule R's tariff.toml). No EAF bill was available to check
it.

The schedule states no date of first introduction, so
urpx:initialEffectiveDate carries this version's date, as gpc:r does.
"""

