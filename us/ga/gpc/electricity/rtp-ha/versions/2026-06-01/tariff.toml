RTP-HA-13 read with mineru-kit parse --tier standard; every value was checked
against the PDF text.

Administrative Charge. $850 per month for every customer.

Dating. The sheet is effective "With Bills Rendered for the Billing Month of
June, 2026", except MFF-11 (January 2025). RTP-HA-13 was filed in the same
2026-06-30 compliance filing in docket 44280 (PSC document 227071) that
replaced R-30 with R-31, with a redline against the sheet it replaced, and the
version begins 2026-06-01 on the reading fifteen Schedule R bills fixed for
that filing (see Schedule R's tariff.toml). The schedule states no date of
first introduction, so urpx:initialEffectiveDate carries this version's date,
as gpc:r does.

Eligibility is carried as urpx:nonResidentialKind; the sheet's availability
and applicability are in the rule's description.
"""

