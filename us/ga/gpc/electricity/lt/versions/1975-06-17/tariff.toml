LT-1 read with mineru-kit parse --tier standard; every value was checked
against the PDF text.

LT-1, page 10.70, Sixth revision, is effective "With Service Rendered on or
After June 17, 1975", so the version begins 1975-06-17; the sheet does not say
why it was revised, so urpx:changeReason is urpx:changeReasonOther.
urpx:applicableToRatePlan names every Georgia Power schedule in the corpus,
since it modifies "each filed rate of the Company".

The rider names no docket for this revision, so the base regulator entry names
none.
"""

