# Extraction ------------------------------------------------------------------
[extraction]
tool = "mineru"
tool_version = "4.0.12"
extracted_on = "2026-10-18"
notes = """
IOP-22 read with mineru-kit parse --tier standard; every rate was checked
against the PDF text. FCR-27, ECCR-15, DSM-C-15 and MFF-11 were read from the
PDF text directly.

IOP-22's Off-Peak and On-Peak periods matter to its Billing Demand and its On-
Peak surcharge, neither of which a TOU Price carries, so they are stated in
the Billing Demand's description and formula and in the surcharge deferral,
not as a TOU schedule.  Its observed holidays (Memorial Day, Independence Day
and Labor Day) are carried as a HolidayCalendar, Independence Day observed on
the nearest weekday under 5 U.S.C. 6103(b), which Georgia law adopts.

Hours-use bands. Each band of hours times the Billing Demand is a calculated
MetricInput of kWh on the measured kWh and the Billing Demand, with its
formula in its CalculationMethod; the first band's blocks of kWh are a
ServiceTiers ladder on that band's kWh, in the pattern of Jackson EMC's GS-26.
How a urpx:ServiceBracket bound could be a multiple of the Billing Demand is
https://github.com/urpx-org/urpx/issues/87.

Riders. FCR-27, ECCR-15, DSM-C-15 and MFF-11 are Prices on the base, as on
Schedule R. FCR-27's Secondary Distribution, Primary Distribution and
Transmission rates and MFF-11's inside and outside city limits rates are
crossed in one ProfileAlternatives set; its voltage dimension is
urpx:voltageLevel, whose values are urpx:secondaryVoltage, urpx:primaryVoltage
and urpx:transmissionVoltage. Each alternative's PriceSetAlternative carries
its own franchise fee energy subtotal, the base energy prices plus its voltage
level's fuel prices.

Eligibility is carried as urpx:nonResidentialKind; the sheet's availability
and applicability are in the rule's description.

Dating. Every sheet is effective "With Bills Rendered for the Billing Month of
June, 2026", except MFF-11 (January 2025). IOP-22 was filed in the same
2026-06-30 compliance filing in docket 44280 (PSC document 227071) that
replaced R-30 with R-31, with a redline against the sheet it replaced, and the
version begins 2026-06-01 on the reading fifteen Schedule R bills fixed for
that filing (see Schedule R's tariff.toml). No IOP bill was available to check
it.

The schedule states no date of first introduction, so
urpx:initialEffectiveDate carries this version's date, as gpc:r does.
"""

