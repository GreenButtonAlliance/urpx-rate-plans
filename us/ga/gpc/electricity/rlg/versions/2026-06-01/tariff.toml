# Extraction ------------------------------------------------------------------
[extraction]
tool = "mineru"
tool_version = "4.0.12"
extracted_on = "2026-10-18"
notes = """
RLG-9 read with mineru-kit parse --tier standard. The rate table was read from
MinerU's HTML table; every rate was checked against the PDF text. Fixture
Lumens is "a minimum lumen value for installation". ECCR-15, DSM-C-15 and
MFF-11 were read from the PDF text directly.

Riders. ECCR-15, DSM-C-15 and MFF-11 are Prices on the base, as on Schedule R.
ECCR-15, DSM-C-15 and MFF-11 each take their percentage of every light charge
through a multiplier over its Price, on one ledger per rider whose
PriceDefinitions each name their light's MetricInput. MFF-11's inside and
outside city limits rates are chosen by a ProfileAlternatives set, as on
Schedule R.

Eligibility is carried as urpx:endUse urpx:streetLightingEndUse; the sheet's
availability and applicability are in the rule's description.

Dating. Every sheet is effective "With Bills Rendered for the Billing Month of
June, 2026", except MFF-11 (January 2025). RLG-9 was filed in the same
2026-06-30 compliance filing in docket 44280 (PSC document 227071) that
replaced R-30 with R-31, with a redline against the sheet it replaced, and the
version begins 2026-06-01 on the reading fifteen Schedule R bills fixed for
that filing (see Schedule R's tariff.toml). No RLG bill was available to check
it.

The schedule states no date of first introduction, so
urpx:initialEffectiveDate carries this version's date, as gpc:r does.
"""

