# Modeling --------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
  "Modified Billing Demand. CIEV-1 prices nothing: it changes how the base schedule determines its Billing Demand. URPX v0.5.1 has no way for a modifier to replace a base schedule's calculated MetricInput, so the rider carries its Billing Demand as its own calculated MetricInput, its rule text in its CalculationMethod, and one PriceDefinition with no Price. Composing it with a base changes no price; a consumer has to compute the base schedule's hours-use bands and minimum bill on this Billing Demand instead of the base's.",
  "Rider history. The factor depends on how many bills the customer has had on the rider and on its rolling 12-month load factor, neither of which the JSON-LD records; both are in the formula text. The rider may not be used with RTP-DA or RTP-HA.",
  "Metering. The customer may be responsible for any additional cost of the equipment needed to meter or deliver the service. Nothing is priced by it and it is not carried.",
]

