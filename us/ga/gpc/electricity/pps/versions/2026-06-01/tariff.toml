# Extraction ------------------------------------------------------------------
[extraction]
tool = "mineru"
tool_version = "4.0.12"
extracted_on = "2026-10-17"
notes = """
PPS-11 read with mineru-kit parse --tier standard. It ran the rate lines
together as text rather than a table; every value was checked against the PDF
text. FCR-27 and the three other rider sheets are the ones Schedule R's filing
carries, read from the PDF text directly.

Seasons. PPS-11 sets its energy seasons by calendar month, "SUMMER – Calendar
Months of June through September" and "WINTER – Calendar Months of October
through May", unlike R-31's billing months, so the energy PriceDefinitions
gated on calendar months need no deferral. FCR-27 says only "June through
September" and "October through May", which Schedule R's bills read by billing
month; that is a deferral here.

Dating. Every sheet is effective "With Bills Rendered for the Billing Month of
June, 2026", except MFF-11 (January 2025). PPS-11 replaced PPS-10 in the same
2026-06-30 compliance filing in docket 44280 (PSC document 227071) that
replaced R-30 with R-31, and the version begins 2026-06-01 on the reading
fifteen Schedule R bills fixed for that filing (see Schedule R's tariff.toml).
No PPS bill was available to check it.

The schedule states no date of first introduction, so
urpx:initialEffectiveDate carries this version's date, as gpc:r does.
"""

