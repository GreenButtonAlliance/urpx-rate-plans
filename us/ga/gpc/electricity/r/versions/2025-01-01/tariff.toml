# Extraction ------------------------------------------------------------------
[extraction]
tool = "pdftotext"
tool_version = "26.01.0"
extracted_on = "2026-10-19"
notes = """
R-30 read with pdftotext -layout from the Internet Archive copy of the sheet
Georgia Power has removed; every value was checked against the PDF text and
against the redline of R-31 in PSC document 227071. ECCR-14 and DSM-R-15 are
Internet Archive copies too, read from the PDF text. FCR-26 survives only as
the redline against FCR-27 in PSC document 226753 (docket 56765), a ZIP whose
filing PDF carries it on pages 2 and 3; its Secondary Distribution rates,
4.5876 cents June through September and 4.2859 cents October through May, are
the struck-out values, read from the rendered pages. The ZIP is cited, not
committed.

Dating. R-30, ECCR-14, DSM-R-15 and MFF-11 are effective "With Bills Rendered
for the Billing Month of January, 2025" and FCR-26 for May 2024, so the
version begins 2025-01-01, on the billing-month reading Schedule R's later
filing uses. It ends at 2026-06-01, where R-31's version begins: an April 2026
Schedule R bill reproduces to the cent from R-30, FCR-26, ECCR-14 and
DSM-R-15, and the June 2026 bills split at June 1 (see R-31's tariff.toml).
FCR-26 applied through the May 2026 billing month.

urpx:initialEffectiveDate carries this version's date, the earliest the corpus
holds, on both of Schedule R's versions.
"""

