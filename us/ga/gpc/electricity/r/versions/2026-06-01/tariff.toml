# Extraction ------------------------------------------------------------------
[extraction]
tool = "mineru"
tool_version = "4.0.12"
extracted_on = "2026-10-17"
notes = """
R-31 read with mineru-kit parse --tier standard. It dropped the page-1 title
block and ran the rate lines together as text rather than a table; every value
was checked against the PDF text. The four rider sheets are one page of prose
each and were read from the PDF text directly.

Dating. Every sheet is effective "With Bills Rendered for the Billing Month of
June, 2026", except MFF-11 (January 2025), and the 2026-06-30 compliance filing
in docket 44280 (PSC document 227071) proposed implementing the base-rate
sheets from July 1, 2026. Fifteen 2026 residential bills from three customers
fix what that meant: every bill rendered in the June billing month split the
base rates, ECCR and DSM-R at June 1 by days (R-30 before, R-30 plus the 1.6554
percent Temporary Base Rate Adjustment Rider after, with ECCR-15 and DSM-R-16),
and every later bill was R-31 for its whole period. Nothing changes at July 1.
So the version begins 2026-06-01. FCR-27 applied to every kWh from the June
billing month on and FCR-26 to the May one, with no proration.

The same bills reproduce, to the cent on every rate line, from this filing's
prices once each part is rounded to the cent before the next is computed: the
Basic Service Charge and the energy charge separately, then fuel, DSM-R and
ECCR on the rounded base, then MFF on everything before it. One prorated June
bill is a cent off on its Residential line.

The schedule states no date of first introduction, so
urpx:initialEffectiveDate carries the date of the earliest version the corpus
holds, R-30's 2025-01-01.
"""

