[regulator]
authority = "puc"

# Extraction ------------------------------------------------------------------
[extraction]
tool = "pdftotext"
tool_version = "26.01.0"
extracted_on = "2026-10-17"
notes = """
PBD-1 is three pages of prose and formulas with no rate table, read with
pdftotext -layout rather than MinerU.

Structure. The sheet prices no unit of service: each premises' Pay by Day
Daily Price is computed from the customer's own metered usage history,
adjusted for normal weather and behavior, priced at Schedule PPS's charges
with ECCR, DSM-R, FCR, MFF and applicable taxes, raised by a Risk Adder of at
most 10 percent, and spread evenly over the days of the contract. The JSON-LD
carries that price as one usage-independent daily PriceDefinition with no
Price, and the formula in the version description.

Dating. The sheet, page 2.60, revision Third, is effective "With Bills
Rendered for the Billing Month of May, 2024". The version begins 2024-05-01,
the billing-month reading IQD-1 uses. PBD-1's First revision, effective "With
Bills Rendered for the Billing Month of January, 2020", is still linked from
the Pay by Day page (us/ga/gpc/utility.toml), so the schedule is older than
this version; its original date is not known, so urpx:initialEffectiveDate
carries this version's date, as gpc:r does.
"""

