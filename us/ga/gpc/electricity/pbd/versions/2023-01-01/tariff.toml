url = "https://web.archive.org/web/20230617021639id_/https://www.georgiapower.com/content/dam/georgia-power/pdfs/residential-pdfs/tariffs/2023/PBD-1.pdf"
sha256 = "44fc3c23e0ac76ffe1b1359d0984087aaac3631e172524af706feb7f045c4713"
retrieved_on = "2026-10-19"
