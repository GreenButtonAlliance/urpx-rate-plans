# Extraction ------------------------------------------------------------------
[extraction]
tool = "pdftotext"
tool_version = "26.01.0"
extracted_on = "2026-10-19"
notes = """
PBD-1's First revision is three pages of prose and formulas with no rate
table, read with pdftotext -layout rather than MinerU, and compared line by
line with the Third revision's text. The sheet is Georgia Power's own copy,
still linked from the Pay by Day page as .../pdfs/residential-pdfs/pay-by-day-
tariff.pdf; the Internet Archive's captures of 2021-04-14 and 2025-09-11 are
the same file.

Differences from the Third revision. The Usage Charges and the Basic Service
Charge include Nuclear Construction Cost Recovery (NCCR), and the daily amount
includes the NCCR schedule; and in place of the Income Qualified Discount,
certified customers receive a senior citizen discount under the heading Senior
Citizen - Low Income Assistance. Every other provision reads the same.

Dating. The sheet, revision First, is effective "With Bills Rendered for the
Billing Month of January, 2020", so this version begins 2020-01-01, the
billing-month reading IQD-1 uses. The Second revision, effective "With Bills
Rendered for the Billing Month of January, 2023", replaced it, so this version
ends at 2023-01-01. The sheet does not say why it was revised, so
urpx:changeReason is urpx:changeReasonOther.

urpx:initialEffectiveDate carries the date of the earliest version the corpus
holds, the First revision's 2020-01-01, on every version. A First revision
implies an earlier original sheet, whose date is not known.
"""

