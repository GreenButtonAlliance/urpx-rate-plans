# Modeling --------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
  "Each discount is a maximum. The sheet grants \"a monthly bill discount up to the amounts listed\" and states \"Monthly credits shall not result in a negative balance\", and the bills show the Fuel Discount equal to the month's fuel charge whenever that is under $9.50. The JSON-LD carries the Non-fuel Discount as a flat $24.00 credit and the Fuel Discount as a flat $9.50 credit, since no Price states the lesser of an amount and the charge it offsets. A modeled bill whose fuel charge is under $9.50 is credited the difference too much, and one whose charges are under the credits goes negative where the sheet stops at zero. Unused credits do not carry over, which a flat monthly credit already respects.",
  "Municipal Franchise Fee after the credits. MFF-11 is charged on the bill after both discounts. Schedule R's franchise fee multiplier Prices are based on its energy-and-fuel subtotal and its Basic Service Charge Price, which hold neither credit, so a modeled IQD customer's franchise fee is not reduced by them: it is high by 3.0843 percent of the credits inside city limits, up to $1.03 a month, and 1.1995 percent outside them, up to $0.40.",
  "Certification and qualifications. The sheet limits the discount to customers the Company certifies, at their primary residence, on an individually metered account in the customer's name, who are at least 65 with household income at or below 200 percent of the federal poverty level, or receive Social Security Disability Income or Supplemental Security Income, or participate in the HUD Section 8 Housing Choice Voucher Program. The EligibilityRule carries residential customer kind and enrollment in gpc:program-iqd; the qualifications are in its description only.",
  "Other schedules. The sheet makes the discount available on Schedules FLAT, TOU-REO, TOU-OA, TOU-RD, PPS and PBD as well as R. This corpus holds only Schedule R, so urpx:applicableToRatePlan names gpc:r alone.",
]

