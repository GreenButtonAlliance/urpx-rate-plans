# Extraction ------------------------------------------------------------------
[extraction]
tool = "pdftotext"
tool_version = "26.01.0"
extracted_on = "2026-10-17"
notes = """
IQD-1 is one page of prose with a two-line rate table, read with
pdftotext -layout rather than MinerU.

Dating. The sheet, page 10.35, revision Original, is effective "With Bills
Rendered for the Billing Month of May, 2024". The version begins 2024-05-01,
the same billing-month reading Schedule R's filing uses. As the original sheet
it is the rider's first introduction, so urpx:initialEffectiveDate is the same
date.

Seven 2026 bills of one IQD customer on Schedule R, February to September,
reconcile to the cent: the $24.00 Non-fuel Discount applied in full every
month; the Fuel Discount equalled the month's fuel charge when that was under
$9.50 ($5.36 to $8.34) and was $9.50 when the fuel charge exceeded it. ECCR
and DSM-R were computed on the base bill before the credits, and the
Municipal Franchise Fee on the bill after both, in the order the workbook in
PSC document 226753 (docket 44280) states.

Eligibility is carried as residential customer kind and enrollment in
gpc:program-iqd, a urpx:ProgramEnrollment this filing defines.
"""

