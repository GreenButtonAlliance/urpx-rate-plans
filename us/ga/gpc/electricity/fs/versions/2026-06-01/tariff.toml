# Extraction ------------------------------------------------------------------
[extraction]
tool = "mineru"
tool_version = "4.0.12"
extracted_on = "2026-10-18"
notes = """
FS-18 read with mineru-kit parse --tier standard; every rate was checked
against the PDF text. TOU-FCR-7, ECCR-15, DSM-C-15 and MFF-11 were read from
the PDF text directly.

FS-18 prices energy by On-Peak and Off-Peak in June through September and in
two blocks in October through May. Its On-Peak period is defined by calendar
month, "for the calendar months June through September (Summer Months)", and
the energy and TOU-FCR-7 fuel prices follow it, so the seasons here are
calendar months and need no billing-month deferral. TOU-FCR-7's Applicability
names Farm Service (FS), so FS takes its On-Peak and Off-Peak fuel rates
rather than FCR-27's; Off-Peak covers all of October through May.

Riders. TOU-FCR-7, ECCR-15, DSM-C-15 and MFF-11 are Prices on the base, as on
Schedule R. TOU-FCR-7's Secondary Distribution, Primary Distribution and
Transmission rates and MFF-11's inside and outside city limits rates are
crossed in one ProfileAlternatives set; its voltage dimension is
urpx:voltageLevel, whose values are urpx:secondaryVoltage, urpx:primaryVoltage
and urpx:transmissionVoltage. Each alternative's PriceSetAlternative carries
its own franchise fee energy subtotal, the base energy prices plus its voltage
level's fuel prices.

Eligibility is carried as urpx:nonResidentialKind; the sheet's availability
and applicability are in the rule's description.

Dating. Every sheet is effective "With Bills Rendered for the Billing Month of
June, 2026", except MFF-11 (January 2025). FS-18 was filed in the same
2026-06-30 compliance filing in docket 44280 (PSC document 227071) that
replaced R-30 with R-31, with a redline against the sheet it replaced, and the
version begins 2026-06-01 on the reading fifteen Schedule R bills fixed for
that filing (see Schedule R's tariff.toml). No FS bill was available to check
it.

The schedule states no date of first introduction, so
urpx:initialEffectiveDate carries this version's date, as gpc:r does.
"""

