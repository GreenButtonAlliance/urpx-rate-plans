# Extraction ------------------------------------------------------------------
[extraction]
tool = "mineru"
tool_version = "4.0.12"
extracted_on = "2026-10-17"
notes = """
TOU-RD-12 read with mineru-kit parse --tier standard. It ran the two energy
rate lines together as one line of text rather than a table; every value,
including the $12.44 per kW Demand Charge, was checked against the PDF text. TOU-FCR-7 and the three other rider sheets were
read from the PDF text directly.

Periods. The sheet and TOU-FCR-7 define On-Peak and Off-Peak by calendar
month, "for the calendar months of June through September (Summer Months)",
so the Seasons here are calendar months and need no billing-month deferral,
unlike Schedule R's energy seasons.

Holidays. On-Peak hours "on days in which the following holidays are
observed shall be considered Off-Peak: Independence Day and Labor Day". The
sheet states no weekend rule, and us/ga/gpc/utility.toml records that Georgia
law adopts the federal one, 5 U.S.C. 6103(b): Saturday observed on the Friday
before and Sunday on the Monday after, which urpx:nearestWeekdayObservance
states. Labor Day is always a Monday.

Demand. "Maximum kW shall be the highest 60-minute kW measurement during the
current month", at any hour, so the Demand Charge has no TOU period: a
maximum over the month of a 60-minute (PT1H) kW measurement. ECCR-15, DSM-R-16
and MFF-11 each take their percentage of it through a multiplier over its
Price, as they do of the Basic Service Charge.

Dating. Every sheet is effective "With Bills Rendered for the Billing Month of
June, 2026", except MFF-11 (January 2025). TOU-RD-12 replaced TOU-RD-11 in
the same 2026-06-30 compliance filing in docket 44280 (PSC document 227071)
that replaced R-30 with R-31, and the version begins 2026-06-01 on the reading
fifteen Schedule R bills fixed for that filing (see Schedule R's tariff.toml).
No TOU-RD bill was available to check it. TOU-FCR-7 replaced TOU-FCR-6 in
docket 56765 with FCR-27.

The schedule states no date of first introduction, so
urpx:initialEffectiveDate carries this version's date, as gpc:r does.
"""

