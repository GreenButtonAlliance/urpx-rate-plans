# Extraction ------------------------------------------------------------------
[extraction]
tool = "pdftotext"
tool_version = "26.01.0"
extracted_on = "2026-10-19"
notes = """
TOU-RD-11 read with pdftotext -layout from Georgia Power's copy of the
superseded sheet; every value, including the $12.21 per kW Demand Charge, was
checked against the PDF text. ECCR-14 and DSM-R-15 are Internet Archive
copies, read from the PDF text. TOU-FCR-6 survives only as the redline against
TOU-FCR-7 in PSC document 226753 (docket 56765), a ZIP whose filing PDF
carries it on pages 6 to 8; its Secondary Distribution rates, 6.6871 cents On-
Peak and 4.2398 cents Off-Peak, are the struck-out values, read from the
rendered pages. The ZIP is cited, not committed.

Dating. TOU-RD-11, ECCR-14, DSM-R-15 and MFF-11 are effective "With Bills
Rendered for the Billing Month of January, 2025" and TOU-FCR-6 for May 2024,
so the version begins 2025-01-01 and ends at 2026-06-01, where TOU-RD-12's
begins, on the reading Schedule R's bills fixed. No TOU-RD bill was available
to check it.

urpx:initialEffectiveDate carries this version's date, the earliest the corpus
holds, on both versions.
"""

