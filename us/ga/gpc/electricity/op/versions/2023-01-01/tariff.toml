# Modeling --------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
  "Modified Billing Demand. OP-5 prices nothing: it changes how the base schedule determines its Billing Demand. URPX v0.5.1 has no way for a modifier to replace a base schedule's calculated MetricInput, so the rider carries its Billing Demand as its own calculated MetricInput, its rule text in its CalculationMethod, and one PriceDefinition with no Price. Composing it with a base changes no price; a consumer has to compute the base schedule's hours-use bands and minimum bill on this Billing Demand instead of the base's.",
  "Off-peak periods and billing months. The rider's off-peak and on-peak demands are defined by billing months (October through May off-peak at all hours; June through September off-peak 10:00 p.m. to 7:00 a.m., weekends and the observed holidays), stated in the Billing Demand's description, not as a TOU schedule, since no Price is priced in them. The PLS, PLM and PLL sheets also measure their Limitation of Service \"based on the percentages as stated in the riders\" for OP customers, which is not carried.",
  "Metering and Term of Contract. The customer may be responsible for any additional cost of the equipment needed to meter or deliver the service, and the term is not less than one year on the selected schedule. Neither is priced on the sheet and neither is carried.",
]

