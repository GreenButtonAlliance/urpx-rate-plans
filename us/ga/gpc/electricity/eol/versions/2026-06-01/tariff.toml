# Extraction ------------------------------------------------------------------
[extraction]
tool = "mineru"
tool_version = "4.0.12"
extracted_on = "2026-10-18"
notes = """
EOL-19 read with mineru-kit parse --tier standard. Section A's table was read
from MinerU's Markdown table; all 46 rates were checked against the PDF text
and reproduce exactly from the sheet's formulas applied to the rounded Fixture
Monthly kWh: kWh = Fixture Input Wattage / 1000 x 360 (photo controlled) or
720 (continuous burn), rounded, times 7.5150 or 8.6122 cents. FCR-27, ECCR-15,
DSM-C-15 and MFF-11 were read from the PDF text directly.

Riders. FCR-27, ECCR-15, DSM-C-15 and MFF-11 are Prices on the base, as on
Schedule R. ECCR-15, DSM-C-15 and MFF-11 each take their percentage of every
fixture charge through a multiplier over its Price, on one ledger per rider
whose PriceDefinitions each name their fixture's MetricInput. FCR-27 is per
kWh at the Secondary Distribution rates, and MFF-11 takes its percentage of
the fuel through a subtotal of the two seasonal fuel Prices. MFF-11's inside
and outside city limits rates are chosen by a ProfileAlternatives set, as on
Schedule R.

Eligibility is carried as urpx:endUse urpx:lightingEndUse; the sheet's
availability and applicability are in the rule's description.

Dating. Every sheet is effective "With Bills Rendered for the Billing Month of
June, 2026", except MFF-11 (January 2025). EOL-19 was filed in the same
2026-06-30 compliance filing in docket 44280 (PSC document 227071) that
replaced R-30 with R-31, with a redline against the sheet it replaced, and the
version begins 2026-06-01 on the reading fifteen Schedule R bills fixed for
that filing (see Schedule R's tariff.toml). No EOL bill was available to check
it.

The schedule states no date of first introduction, so
urpx:initialEffectiveDate carries this version's date, as gpc:r does.
"""

