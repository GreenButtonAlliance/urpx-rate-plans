# Regulatory ------------------------------------------------------------------
# The Cooperative's board sets its rates; the Georgia Public Service Commission
# does not (us/ga/jemc/utility.toml). The sheet names no resolution.
[regulator]
authority = "board"

# Extraction ------------------------------------------------------------------
[extraction]
tool = "mineru"
tool_version = "4.0.12"
extracted_on = "2026-10-18"
notes = """
GSTOU-26 read with mineru-kit parse --tier standard; every rate was
checked against the PDF text. P-22 is the sheet A-26 carries, unchanged;
see Schedule A's tariff.toml for the Wholesale Power Cost Adjustment.

Demand. Non-Coincident Billing Demand and On-Peak Billing Demand are each a
calculated MetricInput on the 60-minute kW demand, with the sheet's ratchets
in their descriptions and formulas. The On-Peak period (4:00 to 8:00 p.m.
weekdays, June through September, excluding the observed Juneteenth,
Independence Day and Labor Day holidays) is carried as a TOU schedule on the
measured demand, with ATOU-26's holiday calendar; energy is one price at all
hours.

Service Charge. $53.00 for single-phase and $81.00 for three-phase customers,
chosen by a ProfileAlternatives dimension, servicePhase.

Eligibility is carried as urpx:nonResidentialKind; the sheet names no
customer kind, and it is listed on the Cooperative's commercial rates page.

Dating. The sheet is effective "January 1, 2026", a calendar date, so the
version begins 2026-01-01. It states no date of first introduction, so
urpx:initialEffectiveDate carries this version's date. A board's rate change
is not a formal rate case, so urpx:changeReason is urpx:changeReasonOther.
"""

# Validation ------------------------------------------------------------------
[validation]
shacl_passed = true
