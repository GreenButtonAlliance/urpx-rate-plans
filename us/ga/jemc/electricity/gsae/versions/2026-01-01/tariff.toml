# Regulatory ------------------------------------------------------------------
# The Cooperative's board sets its rates; the Georgia Public Service Commission
# does not (us/ga/jemc/utility.toml). The sheet names no resolution.
[regulator]
authority = "board"

# Extraction ------------------------------------------------------------------
[extraction]
tool = "mineru"
tool_version = "4.0.12"
extracted_on = "2026-10-18"
notes = """
GSAE-26 read with mineru-kit parse --tier standard; every rate was
checked against the PDF text. P-22 is the sheet A-26 carries, unchanged;
see Schedule A's tariff.toml for the Wholesale Power Cost Adjustment.

GSAE-26's rates are GS-26's; only its Billing Demand (85, 76 and 55 percent
ratchets and a 10 kW floor) and its eligibility differ. The hours-use bands,
Billing Demand and Service Charge are carried as GS-26 carries them; how a
bracket bound could be a multiple of the Billing Demand is
https://github.com/urpx-org/urpx/issues/87.

Eligibility is carried as urpx:nonResidentialKind; the qualifying-load
conditions are in the EligibilityRule's description.

Dating. The sheet is effective "January 1, 2026", a calendar date, so the
version begins 2026-01-01. It states no date of first introduction, so
urpx:initialEffectiveDate carries this version's date. A board's rate change
is not a formal rate case, so urpx:changeReason is urpx:changeReasonOther.
"""

