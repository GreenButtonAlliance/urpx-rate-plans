# Regulatory ------------------------------------------------------------------
# The Cooperative's board sets its rates; the Georgia Public Service Commission
# does not (us/ga/jemc/utility.toml). The sheet names no resolution.
[regulator]
authority = "board"

# Extraction ------------------------------------------------------------------
[extraction]
tool = "mineru"
tool_version = "4.0.12"
extracted_on = "2026-10-18"
notes = """
QF-22 read with mineru-kit parse --tier standard; every rate was
checked against the PDF text.

Structure. The monthly charge is an Energy Charge (EC) equal to total
wholesale power costs, a Facilities Charge (FC) and a Margin Cost
MC = (.045 x TC) + $50, where TC = EC + FC. EC and FC are not published, so
each is a PriceDefinition with no Price, as Georgia Power's FLAT-7 and PBD-1
carry their customer-specific charges. The Margin Cost's $50 is a monthly
Price; its 4.5 percent of TC is a PriceDefinition with no Price, since a
multiplier Price applies to Prices and EC and FC have none. The sheet does
not refer to Schedule P, so no Wholesale Power Cost Adjustment is carried.
clj-urpx refuses a marginal rate for the filing, :no-energy-ledger.

Eligibility is carried as urpx:nonResidentialKind; the sheet names no
customer kind, and it is listed on the Cooperative's commercial rates page.

Dating. The sheet is effective "January 1, 2022", a calendar date, so the
version begins 2022-01-01. It states no date of first introduction, so
urpx:initialEffectiveDate carries this version's date. A board's rate change
is not a formal rate case, so urpx:changeReason is urpx:changeReasonOther.
"""

