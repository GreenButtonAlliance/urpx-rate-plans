# Regulatory ------------------------------------------------------------------
# The Cooperative's board sets its rates; the Georgia Public Service Commission
# does not (us/ga/jemc/utility.toml). The sheet names no resolution.
[regulator]
authority = "board"

# Extraction ------------------------------------------------------------------
[extraction]
tool = "mineru"
tool_version = "4.0.12"
extracted_on = "2026-10-18"
notes = """
SLMS-26 read with mineru-kit parse --tier standard; every rate was
checked against the PDF text. P-22 is the sheet A-26 carries, unchanged;
see Schedule A's tariff.toml for the Wholesale Power Cost Adjustment.

Demand. The Non-Coincident Billing Demand is the current month's highest
60-minute kW, carried as a maximum over the month of the measured demand.
The Coincident Peak Billing Demand is a calculated MetricInput on the
60-minute kW demand, with the sheet's rule in its description and formula;
it depends on Georgia Transmission Corporation's 5 highest demands during
peak period notification hours, which neither sheet nor site publishes.

The sheet's On-Peak and Off-Peak periods define only its minimum monthly
charge, which is not carried, so no TOU schedule is carried.

Eligibility is carried as urpx:nonResidentialKind; URPX v0.5.1 has no
customer kind for a school, so the condition is in the EligibilityRule's
description.

Dating. The sheet is effective "January 1, 2026", a calendar date, so the
version begins 2026-01-01. It states no date of first introduction, so
urpx:initialEffectiveDate carries this version's date. A board's rate change
is not a formal rate case, so urpx:changeReason is urpx:changeReasonOther.
"""

# Validation ------------------------------------------------------------------
[validation]
