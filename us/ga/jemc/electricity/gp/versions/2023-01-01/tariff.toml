# Extraction ------------------------------------------------------------------
[extraction]
tool = "pdftotext"
tool_version = "26.01.0"
extracted_on = "2026-10-18"
notes = """
Rider GP is one page of prose, read from the PDF text.

Applicability. The rider applies to the Cooperative's residential and
commercial rate schedules. This corpus holds the six residential ones, which
urpx:applicableToRatePlan names; the commercial schedules are not modeled.

Premium. The customer nominates 25, 50, 75 or 100 percent of monthly energy
use as Green Power and pays $0.01 per kWh of Green Power purchased, the
nominated percentage of "the total energy usage for that month per
location". The JSON-LD carries that as a per-kWh price on all of the
month's use, $0.01 times the percentage, chosen by a ProfileAlternatives
dimension with one alternative per percentage. The result is exact for a
whole month's kWh; the rider states no rounding of the Green Power quantity.

Eligibility is carried as enrollment in jemc:program-gp, a
urpx:ProgramEnrollment this filing defines, with no customer kind, since the
rider covers residential and commercial customers alike.

Dating. The rider is effective "January 1, 2023", a calendar date. A
board's rate change is not a formal rate case, so urpx:changeReason is
urpx:changeReasonOther.
"""

