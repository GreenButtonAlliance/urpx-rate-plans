authority = "board"

# Extraction ------------------------------------------------------------------
[extraction]
tool = "pdftotext"
tool_version = "26.01.0"
extracted_on = "2026-10-18"
notes = """
Rider DR is one page of prose, read from the PDF text. Unlike the other
riders it is served outside the per-year rates folder.

Credit. Sync to Save participants with a connected smart thermostat receive
"a $25 credit on their November bill". The JSON-LD carries a $25.00 monthly
credit on a per-meter PriceDefinition whose ApplicabilityRule limits it to
November, so it applies once a year.

Eligibility is carried as residential customer kind and enrollment in
jemc:program-sync-to-save, a urpx:ProgramEnrollment this filing defines.

Dating. The rider is effective "June 1, 2025", a calendar date. It is
"experimental and will be evaluated on an annual basis"; it states no
expiration. A board's rate change is not a formal rate case, so
urpx:changeReason is urpx:changeReasonOther.
"""

# Validation ------------------------------------------------------------------
[validation]
