# Modeling --------------------------------------------------------------------
[modeling]
complete = false
deferrals = [
  "November bill. The rider grants the credit \"on their November bill\". The JSON-LD gates it on the calendar month of November; if the Cooperative grants it by billing month, the modeled credit falls on a different set of days than the bill that carries it.",
  "Enrollment window, account activity and tampering. The thermostat must be enrolled and connected by July 1, the account active July 1 through September 30 of the credit year, and the credit is forfeited if control or connection is disrupted by tampering; eligible devices are at the Cooperative's discretion. The EligibilityRule carries residential customer kind and enrollment in jemc:program-sync-to-save; these conditions are in its description only.",
]

