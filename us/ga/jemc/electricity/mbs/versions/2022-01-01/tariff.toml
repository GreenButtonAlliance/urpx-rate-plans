# Regulatory ------------------------------------------------------------------
# The Cooperative's board sets its rates; the Georgia Public Service Commission
# does not (us/ga/jemc/utility.toml). The sheet names no resolution.
[regulator]
authority = "board"

# Extraction ------------------------------------------------------------------
[extraction]
tool = "mineru"
tool_version = "4.0.12"
extracted_on = "2026-10-18"
notes = """
MBS-22 read with mineru-kit parse --tier standard; every rate was
checked against the PDF text.

Structure. The monthly charge is an Energy Charge (EC), a Facilities Charge
(FC) and a Margin Cost (MC) on their sum TC. EC's five components and FC's
eight are determined case by case or from the Cooperative's allocated costs
and are not published, so each is a PriceDefinition with no Price, as
Georgia Power's FLAT-7 and PBD-1 carry their customer-specific charges. The
Margin Cost is 3.0, 2.5 and 2.0 percent of TC in dollar blocks of $15,000
and $35,000; a percentage of charges that have no Price cannot be a Price,
so it is a PriceDefinition with no Price, its percentages in its name. The
sheet does not refer to Schedule P, so no Wholesale Power Cost Adjustment is
carried. clj-urpx refuses a marginal rate for the filing, :no-energy-ledger.

Eligibility is carried as urpx:nonResidentialKind; the 900 kW connected
demand threshold is in the EligibilityRule's description.

Dating. The sheet is effective "January 1, 2022", a calendar date, so the
version begins 2022-01-01. It states no date of first introduction, so
urpx:initialEffectiveDate carries this version's date. A board's rate change
is not a formal rate case, so urpx:changeReason is urpx:changeReasonOther.
"""

