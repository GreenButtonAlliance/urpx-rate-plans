# Identity --------------------------------------------------------------------
utility = "jemc"
schedule = "s"
effective_date = "2026-01-01"

# Source ----------------------------------------------------------------------
# One sub-table per committed PDF: the schedule and the Wholesale Power Cost
# Adjustment it applies.
[source]
landing_page = "https://www.jacksonemc.com/my-cooperative/rates/commercial-rates/outdoor-lighting-service"

  # The landing page links .../pdfs/Schedule-S-25-Outdoor-Lighting-Service.pdf,
  # which returned HTTP 404 on 2026-10-18; S-26 is in the 2026 rates folder.
  [source.base]
  url = "https://www.jacksonemc.com/assets/uploads/pdfs/rates/2026/S-26.pdf"
  sha256 = "7ab7c398721490b96081e3a7af2b9cd338074f1a0f0fe51e6292eba22f3543a2"
  retrieved_on = "2026-10-18"
  media_type = "application/pdf"
  filing_type = "tariff-schedule"
  filing_id = "S-26"

  [source.wpca]
  url = "https://www.jacksonemc.com/assets/uploads/pdfs/rates/2026/P-22.pdf"
  sha256 = "600af481283f7c2c83ef7bbfb3c5cb8079458651be43550ae382b5a1dd166ddc"
