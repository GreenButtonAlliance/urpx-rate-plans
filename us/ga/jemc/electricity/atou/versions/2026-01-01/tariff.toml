# Regulatory ------------------------------------------------------------------
# The Cooperative's board sets its rates; the Georgia Public Service Commission
# does not (us/ga/jemc/utility.toml). The sheets name no resolution.
[regulator]
authority = "board"

# Extraction ------------------------------------------------------------------
[extraction]
tool = "mineru"
tool_version = "4.0.12"
extracted_on = "2026-10-18"
notes = """
ATOU-26 read with mineru-kit parse --tier standard; every rate was checked against
the PDF text. P-22 is one page of prose and a formula, read from the PDF text
directly; see Schedule A's tariff.toml for the Wholesale Power Cost
Adjustment.

On-Peak season. The sheet's On-Peak runs "from June 1 through September 15".
A urpx:Season recurs by calendar month, so the JSON-LD's Summer is June
through September and On-Peak covers September 16 through 30 too; that is the
first deferral. Of the two whole-month choices, ending Summer with September
keeps the sheet's Labor Day exclusion in force (Labor Day always falls on
September 1 through 7) and errs toward a higher modeled bill, by 27.00 cents per
kWh used 3:00 to 8:00 p.m. on the eleven weekdays of September 16-30, 2026.
The same window, "June 1 through September 15", is on every earlier sheet the
Internet Archive holds: ATOU-20 (effective January 1, 2020), ATOU-22, ATOU-24
and ATOU-25, under
https://web.archive.org/web/<timestamp>id_/https://www.jacksonemc.com/assets/uploads/pdfs/
(atou-20_final.pdf 20211103172558, ATOU-22_revised.pdf 20230808105503,
ATOU-24.pdf 20241004234337,
Schedule-ATOU-25-Residential-Time-of-Us-Service.pdf 20251003043245); only the
Service Charge and, from ATOU-22, Juneteenth changed.
A date-based Season (urpx:startDate and urpx:endDate with
urpx:yearlyRecurrence true) would state the window exactly; the questions it
raises are https://github.com/urpx-org/urpx/issues/85 and
https://github.com/grid-coordination/clj-urpx/issues/10.

Holidays. On-Peak excludes "the observed Juneteenth, Independence Day and
Labor Day holidays". The sheet states no weekend rule; the holiday calendar
uses the federal one, 5 U.S.C. 6103(b) (Saturday observed on the Friday before,
Sunday on the Monday after), as urpx:nearestWeekdayObservance. Labor Day is
always a Monday.

Dating. The sheet is effective "January 1, 2026", so the version begins
2026-01-01. The schedule states no date of first introduction, so
urpx:initialEffectiveDate carries this version's date. A board's annual rate
change is not a formal rate case, so urpx:changeReason is
urpx:changeReasonOther.
"""

