scrape_notes = """
## Regulatory

SCL is a department of the City of Seattle. Its rates are set by Seattle City
Council ordinance and codified in Seattle Municipal Code chapter 21.49. The
Washington Utilities and Transportation Commission "regulates private,
investor-owned electric and natural gas utilities"
(https://www.utc.wa.gov/regulated-industries/utilities/energy, retrieved
2026-10-05). tariff.toml [regulator] uses authority = "city-council" and
filing_type = "ordinance" (precedent: us/ca/ladwp/).

Municode's rendering of SMC 21.49.030 (retrieved 2026-10-05) reads "Amended by
Ordinance No. 127473":
 https://clerk.seattle.gov/~archives/Ordinances/Ord_127473.pdf
Ordinance PDFs follow the pattern
https://clerk.seattle.gov/~archives/Ordinances/Ord_<number>.pdf.

## Fetching

Municode is a JavaScript application: curl returns a page shell with none of
the code text. Render it in a browser (spel) to read the consolidated code.
The ordinance PDFs carry legislative markup; see bead URPXT-zw5 for the
column-to-year binding hazard when extracting rate tables from them.

## Holidays

SMC 21.49.030 prices Peak as "5 p.m. to 9 p.m. Mondays through Saturdays,
excluding holidays" (Municode rendering, retrieved 2026-10-05). SCL's
residential Time of Use page states which holidays and how they are observed
(https://www.seattle.gov/city-light/residential-services/billing-information/time-of-use,
retrieved 2026-10-05):

 "City light observes holidays defined by the North American Electric
 Reliability Corporation (NERC)." New Year's Day, Memorial Day,
 Independence Day, Labor Day, Thanksgiving Day, Christmas Day. "If any of
 these fall on a Sunday, the NERC holiday is observed on the following
 Monday. If they fall on a Saturday, the holiday remains on that Saturday."

Per LAYOUT.md §4.4 a rule the utility states wins over the state statute, so
this rule, not RCW 1.16.050(5), governs SCL's calendar. Expressing it needs
urpx:mondayIfSundayObservance (urpx-org/urpx#77); until then each
Sunday-observed Monday is a dated urpx:Holiday.
"""
